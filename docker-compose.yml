services:
  mongo:
    image: mongo:7
    container_name: syrabit-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      # Keep local credentials in the untracked .env file (or Replit Secrets).
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - syrabit-net

  redis:
    image: redis:7-alpine
    container_name: syrabit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks:
      - syrabit-net

  redis-rest:
    image: hiett/serverless-redis-http:latest
    container_name: syrabit-redis-rest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_REST_TOKEN:?Set REDIS_REST_TOKEN in .env}
      SRH_CONNECTION_STRING: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
    ports:
      - "8079:80"
    depends_on:
      - redis
    networks:
      - syrabit-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: syrabit-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}@mongo:27017/syrabit?authSource=admin
      - UPSTASH_REDIS_REST_URL=http://redis-rest:80
      - UPSTASH_REDIS_REST_TOKEN=${REDIS_REST_TOKEN:?Set REDIS_REST_TOKEN in .env}
      - DEBUG=True
      - APP_ENV=development
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis-rest
    networks:
      - syrabit-net
    volumes:
      - ./apps/backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  syrabit-net:
    driver: bridge

volumes:
  mongo_data:
