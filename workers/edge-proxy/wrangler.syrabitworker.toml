# ---------------------------------------------------------------------------
# wrangler.syrabitworker.toml — Task #472 follow-up (2026-05-06)
#
# Temporary config used to deploy the edge-proxy source code AS the new
# worker `syrabitworker`, matching the EXACT 13-binding shape currently
# live on `syrabit-edge` (no R2 / Analytics Engine / Durable Objects /
# mTLS drift — those wrangler.toml blocks are intentionally omitted to
# avoid auto-provisioning resources on the production CF account).
#
# The 3 secret bindings (BACKEND_ORIGIN_SECRET, D1_SYNC_SECRET,
# EDGE_AI_FALLBACK_SECRET) are NOT declared here and must be set via the
# Cloudflare dashboard AFTER first deploy:
#   Workers & Pages → syrabitworker → Settings → Variables and Secrets
#
# Deploy:
#   cd workers/edge-proxy
#   wrangler deploy -c wrangler.syrabitworker.toml
#
# Routes are NOT declared here — they are managed via direct CF API
# calls during the cutover (see Task #472 follow-up handoff doc).
# ---------------------------------------------------------------------------

name = "syrabitworker"
main = "src/index.ts"
account_id = "d66e40eac539fff1db270fddf384a5ec"
compatibility_date = "2026-05-01"
compatibility_flags = [
  "nodejs_compat_v2",
]

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
BACKEND_URL = "https://api.syrabit.ai"
D1_WARM_ON_STARTUP = "true"
PAGES_ORIGIN = "https://syrabitfrontend.pages.dev"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "BOT_HTML_CACHE"
id = "a92591899d544ddb8ac61c54d2b40180"

[[kv_namespaces]]
binding = "CONTENT_CACHE"
id = "981e939bcca445c481d4be818ebefee7"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "3ee723af8e82480eb6d4855b0ca09f69"

[[d1_databases]]
binding       = "CONTENT_DB"
database_name = "syrabit-content"
database_id   = "da5b5b9d-a8f9-43dd-bd23-a938f5c0cf69"

[[vectorize]]
binding    = "SYLLABUS_INDEX"
index_name = "syllabus-index-v2"

[[vectorize]]
binding    = "SYLLABUS_INDEX_LEGACY"
index_name = "syllabus-index"
