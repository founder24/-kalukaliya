name = "syrabit-edge"
main = "src/index.ts"
account_id = "d66e40eac539fff1db270fddf384a5ec"
compatibility_date = "2026-05-01"
compatibility_flags = [
  "nodejs_compat_v2",
]

# ---------------------------------------------------------------------------
# Enterprise zone / Workers Standard settings
# ---------------------------------------------------------------------------
# NOTE: usage_model="unbound" and [limits] cpu_ms require Workers Enterprise
# Unbound subscription (separate from the syrabit.ai Enterprise Website zone
# plan). When that subscription is activated on the account, uncomment:
#   usage_model = "unbound"
#   [limits]
#   cpu_ms = 30000
# Until then the Standard Workers model applies (10ms CPU / 128MB RAM).

# Smart Placement — Cloudflare automatically routes each isolate invocation
# to the data-centre closest to the Azure Container Apps origin (eastus2),
# not to the user. This cuts origin RTT on API proxying. Available on
# Workers Standard Paid.
[placement]
mode = "smart"

# Workers Logpush — streams structured request/response metadata to the
# Logpush pipeline configured in the dashboard (Cloudflare → Analytics →
# Logpush → Workers Trace Events). Available on Workers Standard Paid.
logpush = true

# Workers Observability — enables per-request sampling in the CF dashboard
# (Workers → Observability). head_sampling_rate = 0.1 → sample 10 % of
# requests so the flame-graph / tail-latency views are populated without
# burning the full per-request cost on high-traffic paths.
[observability]
enabled = true
head_sampling_rate = 0.1

routes = [
  { pattern = "api.syrabit.ai/*", zone_name = "syrabit.ai" },
  { pattern = "syrabit.ai/*", zone_name = "syrabit.ai" },
  { pattern = "www.syrabit.ai/*", zone_name = "syrabit.ai" },
]

[vars]
# ---------------------------------------------------------------------------
# BACKEND_URL — the production backend origin the edge worker proxies to.
#
# V4 cutover — the live backend origin is the Azure Container Apps
# service `syrabit-backend` in region eastus2. The ACA default-ingress
# hostname (`syrabit-backend.lemonstone-ce3c87e1.eastus.azurecontainerapps.io`)
# is wrapped behind the public custom domain `api.syrabit.ai` so any
# future ACA revision that mints a new default-ingress URL needs no
# `wrangler deploy` from this repo.
#
# Verified state (post-cutover):
#   - Live worker has BACKEND_URL set ONLY as a plaintext binding (this
#     value); there is no encrypted secret override on the dashboard.
#   - `wrangler deploy` from this repo round-trips the same value back
#     into production — safe to redeploy at any time.
#   - `curl https://api.syrabit.ai/api/health` returns
#     `{"status":"ok","service":"Syrabit.ai API"}` from the ACA origin.
#
# How to change the backend URL:
#   1. Update this line and `wrangler deploy`. The new value is what
#      production will use; there is nothing to also edit in the dashboard.
#   2. If you want the new value to be a *secret* instead of plaintext,
#      first delete this `BACKEND_URL = "..."` line, then run
#      `wrangler secret put BACKEND_URL` and enter the value. Wrangler
#      secrets ARE preserved across deploys, but only when the same name
#      is not also declared as a plaintext var here (a plaintext var with
#      the same name overwrites the secret on every deploy).
#   3. For local `wrangler dev`, create workers/edge-proxy/.dev.vars
#      (gitignored):
#        BACKEND_URL=https://syrabit-backend-staging.eastus.azurecontainerapps.io
#
# Rollback during cutover soak: temporarily set this back to the prior
# revision URL — see docs/DEPLOYMENT.md §Rollback.
# ---------------------------------------------------------------------------
BACKEND_URL = "https://api.syrabit.ai"

# Task #306 / #307 — WORKERS_AI_GATEWAY_ID: route every env.AI.run(...)
# through the named AI Gateway so (a) Workers AI invoice line items are
# tagged with metadata.tag = "workers-ai-fallback:<cap>" / "workers-ai-
# edge-vector-search" (the monthly cost review groups on this), and (b)
# repeat embed / classification / chat prompts are served from the
# gateway's response cache without re-billing the $5k Cloudflare-for-
# Startups credit pool. See docs/cloudflare-cost-map.md.
#
# DO NOT uncomment the line below. Set WORKERS_AI_GATEWAY_ID as a
# Wrangler **secret** instead:
#
#   echo "syrabit-ai-gw" | wrangler secret put WORKERS_AI_GATEWAY_ID --name syrabit-edge
#
# Reason: a plaintext var with the same name overwrites the secret on
# every deploy, so anyone who deploys from a checkout without the value
# would silently clear the gateway routing. The secret-only path keeps
# the value pinned in Cloudflare regardless of who deploys.
#
# Activation runbook (provision the gateway, set the secret, verify
# tagging end-to-end): docs/ops/ai-gateway-activation.md
# Provisioning script (idempotent — safe to re-run any time the cache
# policy changes): workers/edge-proxy/scripts/provision-ai-gateway.mjs
#
# WORKERS_AI_GATEWAY_ID is NOT declared here on purpose. The worker
# treats an unset value as "send calls direct, no tagging" so there is
# no failure mode if the secret has not been set yet — it is purely an
# opt-in for cost attribution + caching. See aiGatewayOpts() in
# workers/edge-proxy/src/index.ts.

# D1_WARM_ON_STARTUP — Enable cache warming on worker startup to eliminate
# cold-start latency (~10-50ms → ~0ms). When true, runs D1 sync immediately
# when the worker boots before any user traffic arrives.
D1_WARM_ON_STARTUP = "true"
# Pages origin used by the worker to serve non-API GETs (the SPA).
# MUST be the *.pages.dev hostname, not syrabit.ai/www.syrabit.ai —
# routing through the custom domain would re-enter this same worker
# (it is bound to syrabit.ai/* and www.syrabit.ai/*) and recurse.
PAGES_ORIGIN = "https://syrabit-zip-convert.pages.dev"
# D1_SYNC_SECRET must be set via Wrangler secret (not committed to source control):
#   wrangler secret put D1_SYNC_SECRET
#
# BACKEND_ORIGIN_SECRET: shared secret the worker injects on every
# backend fetch as `X-Origin-Auth`. Required because the Azure Container
# Apps `syrabit-backend` app rejects requests without it via
# OriginSharedSecretMiddleware. Set via:
#   wrangler secret put BACKEND_ORIGIN_SECRET
# The same value MUST be set as ORIGIN_SHARED_SECRET on the ACA app
# (`az containerapp update -n syrabit-backend -g <rg> --set-env-vars ORIGIN_SHARED_SECRET=…`
# — see docs/DEPLOYMENT.md).

# Task #636 — Workers AI binding for the auto-fallback fan-out at
# /api/ai/fallback/{chat,embed,tts,stt}. The backend hits these routes
# only when the primary provider (Vertex/Gemini for chat & embed,
# Sarvam for TTS/STT) times out, returns 5xx/429, or hits a quota.
# Models used:
#   chat  → @cf/meta/llama-3.1-8b-instruct
#   embed → @cf/baai/bge-base-en-v1.5
#   stt   → @cf/openai/whisper
#   tts   → @cf/myshell-ai/melotts
# Workers AI billing is per-account; no extra secret needed because the
# binding is implicit.
[ai]
binding = "AI"

# Shared secret the FastAPI backend sends as `X-Edge-AI-Secret` on every
# /api/ai/fallback/* call. Without it the routes reject with 401 — this
# stops randoms from burning Workers AI quota by hitting api.syrabit.ai
# directly. Set via `wrangler secret put EDGE_AI_FALLBACK_SECRET` and the
# *same* value as WORKERS_AI_FALLBACK_SECRET on the Azure Container Apps
# backend (see providers/workers_ai.py).

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "3ee723af8e82480eb6d4855b0ca09f69"
preview_id = "c7d531ef4b9a4cd980134251f5739556"

# Create KV namespace before deploying:
#   wrangler kv namespace create BOT_HTML_CACHE
#   wrangler kv namespace create BOT_HTML_CACHE --preview
# Then replace the IDs below with the output values.
# Task #513 §K.2 — deterministic AI response cache. The FastAPI
# backend writes 30-day TTL entries here via `ai_input_cache.py`
# (Redis is the primary tier; this KV is the cross-region replica
# read by the edge worker on cache-eligible AI proxy paths).
# Create with:  wrangler kv namespace create AI_RESPONSE_CACHE
#               wrangler kv namespace create AI_RESPONSE_CACHE --preview
# Then paste the IDs below. Until provisioned the worker treats the
# binding as absent and falls back to direct origin calls.
# NOTE: AI_RESPONSE_CACHE binding is INTENTIONALLY commented out at
# the top-level (default-env) scope so `wrangler deploy` from this
# repo cannot ship placeholder IDs into production. Operators must
# (a) provision the namespace with `wrangler kv namespace create
# AI_RESPONSE_CACHE` (and `--preview`), then (b) uncomment + paste
# the real IDs below before deploying. Until then the worker treats
# `env.AI_RESPONSE_CACHE` as undefined and the §K.2 cache silently
# degrades to the backend Redis tier (correct fail-open behaviour).
# [[kv_namespaces]]
# binding = "AI_RESPONSE_CACHE"
# id = "REPLACE_WITH_AI_RESPONSE_CACHE_KV_ID"
# preview_id = "REPLACE_WITH_AI_RESPONSE_CACHE_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "BOT_HTML_CACHE"
id = "a92591899d544ddb8ac61c54d2b40180"
preview_id = "2c67fcc51dbf430391602e11d7a5e9fe"

[[kv_namespaces]]
binding = "CONTENT_CACHE"
id = "981e939bcca445c481d4be818ebefee7"
# ⚠ MISCONFIGURATION: preview_id is identical to production id. This means
# `wrangler dev --remote` reads/writes the live production KV namespace,
# which can silently corrupt cached content. Fix:
#   wrangler kv namespace create CONTENT_CACHE --preview
# Then replace this preview_id with the output ID.
preview_id = "981e939bcca445c481d4be818ebefee7"

[[d1_databases]]
binding = "CONTENT_DB"
database_name = "syrabit-content"
database_id = "da5b5b9d-a8f9-43dd-bd23-a938f5c0cf69"
migrations_dir = "migrations"

# Task #108 — Phase 4: R2 student asset storage.
# Serves AHSEC/SEBA past-year question papers, syllabi, and study PDFs.
# Admins upload via POST /admin/assets/upload (protected by Zero Trust from Phase 3).
# Files are served at https://assets.syrabit.ai/<key> via the R2 custom domain.
#
# To create the bucket and custom domain before deploying:
#   node artifacts/syrabit/scripts/cloudflare-phase4-apply.js
[[r2_buckets]]
binding     = "ASSETS"
bucket_name = "syrabit-assets"
# preview_bucket_name omitted — `wrangler dev` will error with a clear message
# if you try to use ASSETS locally without it. Add a test bucket when needed:
#   wrangler r2 bucket create syrabit-assets-dev

# Task #314 — R2 binding for the syrabit-media bucket. The monthly
# R2 cold-storage watchdog (workers/edge-proxy/src/r2-storage-class-alert.ts)
# uses this to walk the `logpush/` prefix and sum object sizes — the
# Cloudflare GraphQL Analytics API does not expose a per-prefix
# storage dimension, so the prefix-cap signal needs a direct binding.
# The binding is otherwise unused by the request path; if a future
# route serves media directly from the worker, point it at this same
# binding rather than introducing a second one.
[[r2_buckets]]
binding     = "R2_MEDIA"
bucket_name = "syrabit-media"

# Vectorize binding — currently OFF by design.
#
# Embedding generation, upserts, and queries all happen in the Railway
# backend (see artifacts/syrabit-backend/vectorize_client.py). The backend
# talks to Vectorize over the Cloudflare REST API using CLOUDFLARE_API_TOKEN
# and writes to the index named in the VECTORIZE_INDEX_NAME env var
# (defaults to `syllabus-index-v2`, 1024 dim, cosine — Gemini
# gemini-embedding-001 at 1024d). The legacy 768-dim `syllabus-index`
# rollback target was retired and deleted in Task #308.
#
# Re-enable this binding only if/when the edge worker itself needs to do
# semantic search at the edge (lower latency, no backend round-trip).
# In that case, first create the index from your local machine:
#
#   pnpm dlx wrangler vectorize create syllabus-index-v2 \
#       --dimensions=1024 --metric=cosine
#   pnpm dlx wrangler vectorize create-metadata-index \
#       syllabus-index-v2 --property-name=subject_id --type=string
#   pnpm dlx wrangler vectorize create-metadata-index \
#       syllabus-index-v2 --property-name=chapter_id --type=string
#   pnpm dlx wrangler vectorize create-metadata-index \
#       syllabus-index-v2 --property-name=level      --type=string
#   pnpm dlx wrangler vectorize create-metadata-index \
#       syllabus-index-v2 --property-name=board      --type=string
#
# Then uncomment:
# [[vectorize]]
# binding   = "SYLLABUS_INDEX"
# index_name = "syllabus-index-v2"

# ---------------------------------------------------------------------------
# Vectorize bindings — ENABLED for enterprise edge semantic search.
#
# Enterprise Vectorize limits (2025):
#   - Up to 5 000 000 vectors per index
#   - Up to 1 536 dimensions per vector
#   - Metadata filtering across 10 metadata indexes per index
#   - Low-latency direct binding (no HTTP round-trip, no CLOUDFLARE_API_TOKEN)
#
# SYLLABUS_INDEX   → syllabus-index-v2, 1024-dim cosine (Gemini embeddings)
#                    Sole live index used for semantic chapter/topic search.
#
# The legacy `syllabus-index` (768-dim BGE) binding `SYLLABUS_INDEX_LEGACY`
# was retired in Task #308 after a 60-day window with v2 as the sole live
# index and zero rollback events. The Vectorize index itself was deleted
# via `wrangler vectorize delete syllabus-index` to stop the recurring
# stored-vector credit drain on the $5k Cloudflare credit pool.
# ---------------------------------------------------------------------------
[[vectorize]]
binding    = "SYLLABUS_INDEX"
index_name = "syllabus-index-v2"

# ---------------------------------------------------------------------------
# Phase 5 (Task #109) — Workers Analytics Engine: custom edge metrics dataset.
#
# ANALYTICS is writable from the edge worker via env.ANALYTICS.writeDataPoint().
# The dataset is created automatically on first write; no API call needed.
# Query the dataset via the Analytics Engine SQL API or the /api/edge/analytics
# worker route (requires CF_ANALYTICS_TOKEN secret with Analytics Read scope).
#
# Set the CF Analytics token as a Worker secret before deploying:
#   wrangler secret put CF_ANALYTICS_TOKEN
# ---------------------------------------------------------------------------
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "syrabit-edge-metrics"

# ---------------------------------------------------------------------------
# Phase 5 (Task #109) — Durable Object rate limiter.
#
# RateLimiter provides strongly-consistent, per-key sliding-window rate limits.
# The edge worker uses it instead of the KV-based checkRateLimit() for all
# API and AI rate-limit checks. KV remains as a fallback when the DO namespace
# is not yet bound (e.g. local dev without wrangler.toml migration applied).
#
# Deploy steps:
#   1. wrangler deploy   ← runs the [[migrations]] below, creating the namespace
#   2. The DO namespace ID is auto-assigned and pinned on the CF dashboard.
#      It is NOT stored in wrangler.toml — wrangler resolves it by class name.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name       = "RATE_LIMITER_DO"
class_name = "RateLimiter"

# Task #575 — SeasonCacheDO owns the authoritative `/api/health/season`
# snapshot for the entire region. A single instance per region
# (`idFromName("global")`) enforces the 60s shared refresh contract so
# the FastAPI origin sees one call per minute regardless of isolate count.
[[durable_objects.bindings]]
name       = "SEASON_CACHE_DO"
class_name = "SeasonCacheDO"

[[migrations]]
tag         = "v1"
new_classes = ["RateLimiter"]

[[migrations]]
tag         = "v2"
new_classes = ["SeasonCacheDO"]

[triggers]
# Two crons fan out from the same `scheduled` handler in src/index.ts —
# the dispatch arm reads `event.cron` and runs the right job:
#
#   "* * * * *"   → Task #708 synthetic probe of /api/admin/diagnostics.
#                   Hits the endpoint every 60s with a CF Access service
#                   token + admin JWT so the break-glass / Access-degraded
#                   paging rule (Task #706) actually fires during an
#                   outage where no admin happens to be browsing.
#                   Required secrets/vars (set via `wrangler secret put`
#                   or the dashboard — see docs/CLOUDFLARE_ZERO_TRUST.md
#                   §7.1 for the rotation procedure):
#                     SYNTHETIC_PROBE_CF_ACCESS_CLIENT_ID
#                     SYNTHETIC_PROBE_CF_ACCESS_CLIENT_SECRET
#                     SYNTHETIC_PROBE_ADMIN_JWT
#                     SYNTHETIC_PROBE_WATCHDOG_WEBHOOK_URL  ← REQUIRED for
#                       paging; without it the watchdog only logs to the
#                       Workers console and no human gets woken up. The
#                       absence of this secret was the root cause of the
#                       Task #877 silent-outage incident — set it before
#                       relying on this probe. Slack incoming-webhook URL
#                       or PagerDuty Events v2 endpoint both accepted.
#                   Optional: SYNTHETIC_PROBE_TARGET_URL (defaults to
#                   ${BACKEND_URL}/api/admin/diagnostics — note the
#                   `/api` prefix; the FastAPI router is mounted at
#                   `/api`, hitting bare `/admin/diagnostics` returns
#                   404 — Task #877),
#                   SYNTHETIC_PROBE_WATCHDOG_THRESHOLD_MIN (default 5),
#                   SYNTHETIC_PROBE_DISABLED=true to pause without
#                   redeploying.
#
#                   ALSO runs Task #898 bot-cache hit-rate / fallback
#                   watchdog. NOTE the data source: although the task
#                   description (and the admin dashboard) reference
#                   `/api/edge/kv-usage` → `bot_cache.hit_rate`, the
#                   watchdog deliberately reads the same underlying
#                   `bot_cache:count:*` counters DIRECTLY from
#                   RATE_LIMIT KV inside the same isolate. Skipping
#                   the HTTP round-trip removes an auth dependency and
#                   keeps the watchdog alive in the failure mode where
#                   the admin endpoint itself is degraded. The numbers
#                   the watchdog evaluates are therefore exactly the
#                   numbers `/api/edge/kv-usage` would report.
#                   Pages on:
#                     - hit-rate drop ≥30pp over the last 15m vs the
#                       prior 15m (cache-key regression),
#                     - fallback rate ≥10% over the last 15m
#                       (degraded prerender pipeline).
#                   Re-uses SYNTHETIC_PROBE_WATCHDOG_WEBHOOK_URL but
#                   tags payloads with alert_type=
#                   bot_cache_hit_rate_drop / bot_cache_fallback_elevated.
#                   Optional knobs: BOT_CACHE_ALERT_DROP_PCT (default 30),
#                   BOT_CACHE_ALERT_FALLBACK_PCT (default 10),
#                   BOT_CACHE_ALERT_MIN_SAMPLE (default 20),
#                   BOT_CACHE_ALERT_WINDOW_BUCKETS (default 3 → 15m),
#                   BOT_CACHE_ALERT_DISABLED=true to pause.
#
#                   ALSO runs Task #311 AI Gateway 24h embed cache-hit
#                   -rate watchdog, but ONLY on minutes where
#                   `getUTCMinutes() % 15 === 0` (i.e. 4 times per
#                   hour). Each iteration costs one GraphQL query
#                   against the Cloudflare AI Gateway analytics
#                   dataset, and the 24h window moves slowly enough
#                   that 15-minute granularity is more than adequate.
#                   Pages on:
#                     - 24h `cached_requests / total_requests` for
#                       metadata.tag = "workers-ai-fallback:embed"
#                       falls below the documented floor (default
#                       50% — matches docs/ops/ai-gateway-activation.md).
#                   Re-uses SYNTHETIC_PROBE_WATCHDOG_WEBHOOK_URL but
#                   tags payloads with alert_type=
#                   ai_gateway_cache_hit_rate_low, and includes a link
#                   to the rollback runbook
#                   docs/ops/ai-gateway-activation.md in the payload.
#                   Required secrets:
#                     WORKERS_AI_GATEWAY_ID — already required by
#                       Task #307; absent ⇒ watchdog skips silently
#                       because no embed-tagged rows exist.
#                     AI_GATEWAY_ANALYTICS_TOKEN — Cloudflare API
#                       token with `AI Gateway: Read` scope on the
#                       account. Distinct from CF_ANALYTICS_TOKEN
#                       (Workers Analytics scope) so each can be
#                       rotated independently. Set via
#                       `wrangler secret put AI_GATEWAY_ANALYTICS_TOKEN
#                       --name syrabit-edge`. Absent ⇒ watchdog skips
#                       with a console warning.
#                   Optional knobs: AI_GATEWAY_CACHE_HIT_RATE_FLOOR_PCT
#                   (default 50), AI_GATEWAY_CACHE_ALERT_MIN_SAMPLE
#                   (default 50), AI_GATEWAY_CACHE_ALERT_EMBED_TAG
#                   (default "workers-ai-fallback:embed"),
#                   AI_GATEWAY_CACHE_ALERT_QUERY_FAIL_THRESHOLD
#                   (default 6 — N consecutive GraphQL failures before
#                   the secondary alert_type=
#                   ai_gateway_cache_watchdog_blind page fires; closes
#                   the observability gap where a token rotation or
#                   schema rename silently disables the primary alert),
#                   AI_GATEWAY_CACHE_ALERT_DISABLED=true to pause.
#
#                   ALSO runs Task #314 monthly R2 cold-storage /
#                   Logpush-cap watchdog, but ONLY on day 1 of each
#                   calendar month at 00:00 UTC (one evaluation per
#                   month — see shouldRunMonthlyR2Check() in
#                   src/r2-storage-class-alert.ts). The cost-review
#                   checklist runs on the first business day, so the
#                   alert lands in inbox before the human reviewer
#                   sits down. Each iteration costs one GraphQL query
#                   against `r2StorageAdaptiveGroups` plus a
#                   paginated R2 list against the
#                   `syrabit-media/logpush/` prefix.
#                   Pages on:
#                     - 24h IA share across syrabit-assets +
#                       syrabit-media is 0% AND the lifecycle rules
#                       have been live ≥30 days (rules-stuck signal —
#                       backstop for Step 5 of
#                       docs/cloudflare-monthly-cost-review.md), and
#                     - sum of `syrabit-media/logpush/*` object sizes
#                       exceeds R2_STORAGE_ALERT_LOGPUSH_CAP_GB
#                       (default 5 GB — matches the cap row in
#                       docs/cloudflare-cost-map.md).
#                   Re-uses SYNTHETIC_PROBE_WATCHDOG_WEBHOOK_URL but
#                   tags payloads with alert_type=
#                   r2_ia_share_zero / r2_logpush_storage_high.
#                   Required:
#                     R2_STORAGE_ANALYTICS_TOKEN — Cloudflare API
#                       token with `Account Analytics: Read` scope on
#                       the account. Distinct from CF_ANALYTICS_TOKEN
#                       and AI_GATEWAY_ANALYTICS_TOKEN so each scope
#                       can be rotated independently. Set via
#                       `wrangler secret put R2_STORAGE_ANALYTICS_TOKEN
#                       --name syrabit-edge`. Absent ⇒ watchdog skips
#                       with a console warning.
#                     R2_LIFECYCLE_RULES_APPLIED_AT — ISO date of when
#                       the lifecycle rules were last applied (set as
#                       a plaintext var in this file or via
#                       `wrangler secret put` after running
#                       ./infra/r2-lifecycle/apply.sh). The IA-share
#                       alert is suppressed until ≥30 days have
#                       elapsed; without this var the alert never
#                       fires (the Logpush-cap signal still does).
#                     R2_MEDIA — R2 binding declared above for
#                       syrabit-media. Required for the Logpush-cap
#                       signal; the IA-share signal does not need it.
#                   Optional knobs: R2_STORAGE_ALERT_LOGPUSH_CAP_GB
#                   (default 5), R2_STORAGE_ALERT_BUCKETS (default
#                   "syrabit-assets,syrabit-media"),
#                   R2_STORAGE_ALERT_DISABLED=true to pause.
#
#   "0 */6 * * *" → 6-hourly D1 content sync from the Railway backend.
crons = ["* * * * *", "0 */6 * * *"]

# ---------------------------------------------------------------------------
# Phase 6 (Task #110) — mTLS client certificate for Railway origin hardening.
#
# The `MTLS_CERT` binding presents a Cloudflare-issued client certificate on
# every outbound TLS connection to the Railway backend.  Railway's mTLS policy
# (configured separately) rejects connections that do not present this cert,
# closing the bypass risk where a leaked BACKEND_ORIGIN_SECRET could be used
# to hit the backend directly.  BACKEND_ORIGIN_SECRET is kept as belt-and-
# suspenders; the cert is the primary enforcement mechanism.
#
# DEPLOYMENT GATE: The CI pre-deploy step in edge-proxy-deploy.yml calls
# `node workers/edge-proxy/scripts/inject-mtls-cert-id.js` which reads
# CF_MTLS_CERT_ID from the CI environment and rewrites the sentinel value
# "PENDING_CERT_PROVISIONING" below with the real UUID before wrangler runs.
# If CF_MTLS_CERT_ID is absent, the script exits 1 and the deploy is aborted.
# This means the binding is ALWAYS present in deployable config, but the worker
# silently falls back to plain fetch (MTLS_REQUIRED gate) until the cert UUID
# is supplied. Never commit a real cert UUID to source — store it as a secret.
#
# HOW TO PROVISION (one-time, ~10-year lifecycle):
#   1. Issue the cert:
#        CLOUDFLARE_API_TOKEN=<tok> \
#          node artifacts/syrabit/scripts/cloudflare-phase6-apply.js
#      Prints the certificate_id UUID and the certificate PEM.
#   2. Store the private key as a wrangler secret:
#        echo "<pem>" | wrangler secret put MTLS_PRIVATE_KEY --name syrabit-edge
#   3. Add CF_MTLS_CERT_ID to GitHub repo secrets (Settings → Secrets → Actions):
#        CF_MTLS_CERT_ID = <uuid-from-step-1>
#      The next push to master/main triggers edge-proxy-deploy.yml which injects
#      the UUID into this block and calls wrangler deploy — binding goes live.
#      The worker now presents the cert on every TLS handshake with Railway, AND
#      injects X-Cf-Mtls-Active: HMAC-SHA256("mtls-active", BACKEND_ORIGIN_SECRET)
#      on every request so the Railway MtlsClientCertMiddleware can validate it.
#   4. Enable application-layer mTLS enforcement on the Railway backend:
#        Railway service → Variables → add ENFORCE_MTLS=true
#      The MtlsClientCertMiddleware rejects requests missing the HMAC proof
#      (non-spoofable: requires BACKEND_ORIGIN_SECRET to forge).
#   5. Configure Railway to require the CF client cert at the TLS level:
#        Railway dashboard → Service → Settings → mTLS → require Cloudflare cert.
#      With TLS-level enforcement, connections without the cert are rejected
#      BEFORE HTTP is reached — the gold-standard protection that makes the
#      nightly-smoke.js 6a-iv bypass probe pass with a network/TLS error.
#   6. Flip the fail-closed gate AFTER Railway requires the cert:
#        wrangler secret put MTLS_REQUIRED --name syrabit-edge  (value: true)
#      MTLS_REQUIRED=true makes proxyToBackend() return 503 if MTLS_CERT is
#      absent, preventing any insecure plain-fetch bypass.
# ---------------------------------------------------------------------------

# Step-by-step activation instructions (commands, expected output, verification):
#   docs/ops/mtls-activation.md
[[mtls_certificates]]
binding        = "MTLS_CERT"
certificate_id = "PENDING_CERT_PROVISIONING"
