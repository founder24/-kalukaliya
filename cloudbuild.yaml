steps:
  # ── Step 0: Pre-flight — validate all pinned versions exist on PyPI ───────
  # Runs BEFORE the Docker build to catch version-not-found errors fast
  # (seconds) instead of failing 5+ minutes into the Docker layer cache.
  #
  # Strategy: strips hash lines from requirements.txt (same as Dockerfile),
  # then runs `pip install --dry-run --no-deps` which resolves each pinned
  # version against PyPI without downloading anything.
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Pre-flight: validating requirements.txt versions ==="
        cd apps/backend

        # Strip multiline continuations and hash lines — same transform as Dockerfile
        sed 's/ *\\$//' requirements.txt \
          | grep -v '^\s*--hash' \
          | grep -v '^\s*#' \
          | grep -v '^\s*$' \
          > /tmp/requirements-nohash.txt

        echo "Checking $(wc -l < /tmp/requirements-nohash.txt) package lines..."

        # --dry-run resolves versions against PyPI without downloading
        # --no-deps skips transitive resolution (we only validate what is pinned)
        # --quiet suppresses download progress bars
        pip install --dry-run --no-deps --quiet -r /tmp/requirements-nohash.txt

        echo "=== Pre-flight PASSED — all versions found on PyPI ==="

  # ── Step 1: Build the backend Docker image ────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '-f'
      - 'apps/backend/Dockerfile'
      - 'apps/backend'

  # ── Step 2: Push image to Artifact Registry ───────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'

  # ── Step 3: Deploy to Cloud Run (public — edge HMAC provides app-layer security) ──
  # The service allows unauthenticated invocations so the Cloudflare edge worker
  # can call it without a GOOGLE_SA_KEY OIDC token. Security is enforced at the
  # application layer via X-Edge-Signature HMAC (EDGE_SHARED_SECRET env var).
  # All public internet traffic still passes through api.syrabit.ai (Cloudflare
  # Worker) which rate-limits, validates JWT, and signs requests before forwarding.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'syrabit-backend'
      - '--image=asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--port=8000'
      - '--allow-unauthenticated'
      - '--service-account=syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com'
      - '--set-env-vars=APP_ENV=production,JWT_ALGORITHM=HS256'
      # NOTE: Sensitive env vars (MONGODB_URI, JWT_SECRET, REDIS_URL, EDGE_SHARED_SECRET,
      # GEMINI_API_KEY, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RESEND_API_KEY,
      # SENTRY_DSN, POSTHOG_API_KEY) must be configured once in Cloud Run via:
      #   gcloud run services update syrabit-backend --region=asia-south1 \
      #     --update-secrets=MONGODB_URI=syrabit-mongodb-uri:latest,...
      # They are preserved across deploys and NOT overwritten by --set-env-vars.

images:
  - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
