steps:
  # ── Step 0: Pre-flight — validate all pinned versions exist on PyPI ───────
  # Runs BEFORE the Docker build to catch version-not-found errors fast
  # (seconds) instead of failing 5+ minutes into the Docker layer cache.
  #
  # Strategy: strips hash lines from requirements.txt (same as Dockerfile),
  # then runs `pip install --dry-run --no-deps` which resolves each pinned
  # version against PyPI without downloading anything.
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Pre-flight: validating requirements.txt versions ==="
        cd apps/backend

        # Strip multiline continuations and hash lines — same transform as Dockerfile
        sed 's/ *\\$//' requirements.txt \
          | grep -v '^\s*--hash' \
          | grep -v '^\s*#' \
          | grep -v '^\s*$' \
          > /tmp/requirements-nohash.txt

        echo "Checking $(wc -l < /tmp/requirements-nohash.txt) package lines..."

        # --dry-run resolves versions against PyPI without downloading
        # --no-deps skips transitive resolution (we only validate what is pinned)
        # --quiet suppresses download progress bars
        pip install --dry-run --no-deps --quiet -r /tmp/requirements-nohash.txt

        echo "=== Pre-flight PASSED — all versions found on PyPI ==="

  # ── Step 1: Build the backend Docker image ────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '-f'
      - 'apps/backend/Dockerfile'
      - 'apps/backend'

  # ── Step 2: Push image to Artifact Registry ───────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'

  # ── Step 3: Deploy to Cloud Run (core secrets only) ───────────────────────
  # IMPORTANT: `gcloud run deploy` does NOT preserve Secret Manager references
  # across deploys — they must be explicitly passed every time via --update-secrets.
  # Plain env vars set here (--update-env-vars) are additive and safe.
  # Security: traffic reaches Cloud Run only through api.syrabit.ai (Cloudflare
  # Worker) which validates JWT and signs requests with EDGE_SHARED_SECRET HMAC.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'syrabit-backend'
      - '--image=asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--port=8000'
      - '--allow-unauthenticated'
      - '--min-instances=1'
      - '--service-account=syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com'
      - >-
        --update-env-vars=APP_ENV=production,JWT_ALGORITHM=HS256,VERTEX_PROJECT_ID=blissful-acumen-495019-t6,VERTEX_LOCATION=us-central1,VERTEX_SEARCH_DATASTORE_ID=syrabit-edu-datastore,VERTEX_SEARCH_LOCATION=global,VERTEX_SEARCH_SERVING_CONFIG=default_search,SARVAM_MODEL=sarvam-m1
      - >-
        --update-secrets=MONGODB_URI=MONGODB_URI:latest,JWT_SECRET=jwt-secret:latest,EDGE_SHARED_SECRET=edge-shared-secret:latest,ADMIN_JWT_SECRET=ADMIN_JWT_SECRET:latest,GOOGLE_APPLICATION_CREDENTIALS_JSON=GOOGLE_APPLICATION_CREDENTIALS_JSON:latest,SARVAM_API_KEY=SARVAM_API_KEY:latest,UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest,GEMINI_API_KEY=gemini-api-key:latest,RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest,RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest,RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RESET_TOKEN_SECRET=RESET_TOKEN_SECRET:latest,JWT_PRIVATE_KEY=jwt-private-key:latest,JWT_PUBLIC_KEY=jwt-public-key:latest,TRANSLATE_CRON_SECRET=TRANSLATE_CRON_SECRET:latest,INDEXNOW_API_KEY=INDEXNOW_API_KEY:latest,INDEXNOW_INTERNAL_SECRET=INDEXNOW_INTERNAL_SECRET:latest,POSTHOG_API_KEY=POSTHOG_API_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest,CF_PAGES_DEPLOY_HOOK=cf-pages-deploy-hook:latest

  # ── Step 4: Attach optional content-pipeline secrets (CF KV + GCS) ────────
  # These secrets may not exist yet in Secret Manager. This step probes for
  # each one before attaching so the deploy never hard-fails on a missing secret.
  # Once you create them (see commands below), they are picked up next deploy.
  #
  # Create commands (run in Cloud Shell):
  #   echo -n 'YOUR_CF_ACCOUNT_ID'   | gcloud secrets create CF_ACCOUNT_ID      --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  #   echo -n 'YOUR_KV_TOKEN'        | gcloud secrets create CF_KV_API_TOKEN     --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  #   echo -n 'YOUR_NAMESPACE_ID'    | gcloud secrets create CF_KV_NAMESPACE_ID  --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  #   echo -n 'YOUR_BUCKET_NAME'     | gcloud secrets create GCS_CONTENT_BUCKET  --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        PROJECT="blissful-acumen-495019-t6"
        REGION="asia-south1"
        UPDATES=""

        # CF_ACCOUNT_ID → two env vars: CF_ACCOUNT_ID (Workers AI) + CLOUDFLARE_ACCOUNT_ID (KV pipeline)
        if gcloud secrets describe CF_ACCOUNT_ID --project="$PROJECT" >/dev/null 2>&1; then
          UPDATES="${UPDATES:+$UPDATES,}CF_ACCOUNT_ID=CF_ACCOUNT_ID:latest,CLOUDFLARE_ACCOUNT_ID=CF_ACCOUNT_ID:latest"
          echo "  ✓ CF_ACCOUNT_ID"
        else
          echo "  ⚠ CF_ACCOUNT_ID not in SM — Cloudflare Workers AI and KV pipeline disabled"
        fi

        # CF_KV_API_TOKEN → CLOUDFLARE_KV_API_TOKEN (KV bulk write for HTML seeding)
        if gcloud secrets describe CF_KV_API_TOKEN --project="$PROJECT" >/dev/null 2>&1; then
          UPDATES="${UPDATES:+$UPDATES,}CLOUDFLARE_KV_API_TOKEN=CF_KV_API_TOKEN:latest"
          echo "  ✓ CF_KV_API_TOKEN"
        else
          echo "  ⚠ CF_KV_API_TOKEN not in SM — KV HTML seeding disabled"
        fi

        # CF_KV_NAMESPACE_ID → CLOUDFLARE_KV_NAMESPACE_ID
        if gcloud secrets describe CF_KV_NAMESPACE_ID --project="$PROJECT" >/dev/null 2>&1; then
          UPDATES="${UPDATES:+$UPDATES,}CLOUDFLARE_KV_NAMESPACE_ID=CF_KV_NAMESPACE_ID:latest"
          echo "  ✓ CF_KV_NAMESPACE_ID"
        else
          echo "  ⚠ CF_KV_NAMESPACE_ID not in SM — KV namespace target unknown"
        fi

        # GCS_CONTENT_BUCKET → GCS_CONTENT_BUCKET (educational content store)
        if gcloud secrets describe GCS_CONTENT_BUCKET --project="$PROJECT" >/dev/null 2>&1; then
          UPDATES="${UPDATES:+$UPDATES,}GCS_CONTENT_BUCKET=GCS_CONTENT_BUCKET:latest"
          echo "  ✓ GCS_CONTENT_BUCKET"
        else
          echo "  ⚠ GCS_CONTENT_BUCKET not in SM — GCS chapter storage disabled"
        fi

        if [ -n "$UPDATES" ]; then
          gcloud run services update syrabit-backend \
            --region="$REGION" --project="$PROJECT" \
            --update-secrets="$UPDATES"
          echo "Content-pipeline secrets attached: $UPDATES"
        else
          echo "No optional content-pipeline secrets found yet. See comments above for create commands."
        fi

images:
  - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
