steps:
  # ── Step 0 (SSH setup): Configure SSH deploy key for GitHub ──────────────
  # Uses a read-only deploy key stored in Secret Manager.
  # This step is OPTIONAL — it gracefully skips if the secret does not exist yet.
  #
  # ONE-TIME SETUP (run once in Cloud Shell, then add the public key to GitHub):
  #   bash infra/scripts/setup-github-deploy-key.sh
  #   # → Go to GitHub: founder24/-kalukaliya → Settings → Deploy keys → Add deploy key
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        echo "=== SSH setup: checking for deploy key ==="
        DEPLOY_KEY=$(gcloud secrets versions access latest \
          --secret=GITHUB_DEPLOY_SSH_KEY \
          --project=blissful-acumen-495019-t6 2>/dev/null || echo "")
        if [ -z "$$DEPLOY_KEY" ]; then
          echo "  ⚠ GITHUB_DEPLOY_SSH_KEY not found in Secret Manager — skipping SSH setup"
          echo "    Run: bash infra/scripts/setup-github-deploy-key.sh"
          echo "=== SSH setup skipped (non-fatal) ==="
          exit 0
        fi
        mkdir -p /root/.ssh
        echo "$$DEPLOY_KEY" > /root/.ssh/id_rsa
        chmod 600 /root/.ssh/id_rsa
        ssh-keyscan github.com >> /root/.ssh/known_hosts 2>/dev/null
        chmod 644 /root/.ssh/known_hosts
        ssh -T git@github.com -o StrictHostKeyChecking=yes 2>&1 | grep -q "successfully authenticated" \
          && echo "  ✓ GitHub SSH connectivity verified" \
          || echo "  ⚠ GitHub SSH test returned non-zero (expected for read-only deploy keys)"
        echo "=== SSH setup complete ==="

  # ── Step 1: Pre-flight — validate all pinned versions exist on PyPI ───────
  # Runs BEFORE the Docker build to catch version-not-found errors fast
  # (seconds) instead of failing 5+ minutes into the Docker layer cache.
  #
  # Strategy: strips hash lines from requirements.txt (same as Dockerfile),
  # then runs `pip install --dry-run --no-deps` which resolves each pinned
  # version against PyPI without downloading anything.
  - name: 'python:3.12-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "=== Pre-flight: validating requirements.txt versions ==="
        cd apps/backend

        # Strip multiline continuations and hash lines — same transform as Dockerfile
        sed 's/ *\\$//' requirements.txt \
          | grep -v '^\s*--hash' \
          | grep -v '^\s*#' \
          | grep -v '^\s*$' \
          > /tmp/requirements-nohash.txt

        echo "Checking $(wc -l < /tmp/requirements-nohash.txt) package lines..."

        # --dry-run resolves versions against PyPI without downloading
        # --no-deps skips transitive resolution (we only validate what is pinned)
        # --quiet suppresses download progress bars
        pip install --dry-run --no-deps --quiet -r /tmp/requirements-nohash.txt

        echo "=== Pre-flight PASSED — all versions found on PyPI ==="

  # ── Step 2: Build the backend Docker image ────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '-f'
      - 'apps/backend/Dockerfile'
      - 'apps/backend'

  # ── Step 3: Push image to Artifact Registry ───────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'

  # ── Step 4: Validate Workers AI RAG credentials ───────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        PROJECT="blissful-acumen-495019-t6"
        RUNTIME_SA="serviceAccount:syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com"
        for secret in CF_ACCOUNT_ID cf-worker-ai-token CF_ANALYTICS_TOKEN CF_ZONE_ID; do
          gcloud secrets describe "$$secret" --project="$$PROJECT" --quiet >/dev/null
          gcloud secrets add-iam-policy-binding "$$secret" \
            --project="$$PROJECT" \
            --member="$$RUNTIME_SA" \
            --role="roles/secretmanager.secretAccessor" \
            --quiet
        done

  # ── Step 5: Deploy to Cloud Run (core secrets only) ───────────────────────
  # IMPORTANT: `gcloud run deploy` does NOT preserve Secret Manager references
  # across deploys — they must be explicitly passed every time via --update-secrets.
  # Plain env vars set here (--update-env-vars) are additive and safe.
  # Security: traffic reaches Cloud Run only through api.syrabit.ai (Cloudflare
  # Worker) which validates JWT and signs requests with EDGE_SHARED_SECRET HMAC.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'syrabit-backend'
      - '--image=asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--port=8000'
      - '--allow-unauthenticated'
      - '--min-instances=1'
      - '--service-account=syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com'
      - >-
        --update-env-vars=APP_ENV=production,JWT_ALGORITHM=HS256,TRUST_EDGE_AUTH=true,PYTHONFAULTHANDLER=1,WORKERS_AI_INTERNAL_URL=https://syrabit-api-prod.axomxplain.workers.dev,CF_AI_MODEL=@cf/zai-org/glm-4.7-flash,CF_AI_MODEL_FALLBACK=@cf/qwen/qwen3-30b-a3b-fp8
      - >-
        --remove-env-vars=VERTEX_PROJECT_ID,VERTEX_LOCATION,VERTEX_GEMINI_MODEL,VERTEX_SEARCH_DATASTORE_ID,VERTEX_SEARCH_LOCATION,VERTEX_SEARCH_SERVING_CONFIG,SARVAM_MODEL
      - >-
        --remove-secrets=VERTEX_SEARCH_DATASTORE_ID,VERTEX_SEARCH_LOCATION,VERTEX_SEARCH_SERVING_CONFIG,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,POSTHOG_API_KEY,INDEXNOW_API_KEY,INDEXNOW_INTERNAL_SECRET,SARVAM_API_KEY,GEMINI_API_KEY
      - >-
        --update-secrets=MONGODB_URI=mongodb-uri:latest,JWT_SECRET=jwt-secret:latest,EDGE_SHARED_SECRET=edge-shared-secret:latest,CF_ACCOUNT_ID=CF_ACCOUNT_ID:latest,CF_WORKER_AI_TOKEN=cf-worker-ai-token:latest,CF_ANALYTICS_TOKEN=CF_ANALYTICS_TOKEN:latest,CF_ZONE_ID=CF_ZONE_ID:latest,ADMIN_JWT_SECRET=admin-jwt-secret:latest,GOOGLE_APPLICATION_CREDENTIALS_JSON=GOOGLE_APPLICATION_CREDENTIALS_JSON:latest,RAZORPAY_KEY_ID=razorpay-key-id:latest,RAZORPAY_KEY_SECRET=razorpay-key-secret:latest,RAZORPAY_WEBHOOK_SECRET=razorpay-webhook-secret:latest,RESEND_API_KEY=resend-api-key:latest,RESET_TOKEN_SECRET=reset-token-secret:latest,JWT_PRIVATE_KEY=jwt-private-key:latest,JWT_PUBLIC_KEY=jwt-public-key:latest,TRANSLATE_CRON_SECRET=translate-cron-secret:latest

  # ── Step 6: Attach optional secrets (CF KV + GCS + CF Pages) ─────────────
  # These secrets may not exist yet in Secret Manager. This step probes for
  # each one before attaching so the deploy never hard-fails on a missing secret.
  # Once you create them (see commands below), they are picked up next deploy.
  #
  # Create commands (run in Cloud Shell):
  #   echo -n 'YOUR_CF_ACCOUNT_ID'   | gcloud secrets create CF_ACCOUNT_ID       --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  #   echo -n 'YOUR_WORKERS_AI_TOKEN' | gcloud secrets create cf-worker-ai-token --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  #   echo -n 'YOUR_KV_TOKEN'        | gcloud secrets create CF_KV_API_TOKEN     --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  #   echo -n 'YOUR_NAMESPACE_ID'    | gcloud secrets create CF_KV_NAMESPACE_ID  --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  #   echo -n 'YOUR_BUCKET_NAME'     | gcloud secrets create GCS_CONTENT_BUCKET  --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  #   echo -n 'YOUR_DEPLOY_HOOK_URL' | gcloud secrets create CF_PAGES_DEPLOY_HOOK --replication-policy=automatic --data-file=- --project=blissful-acumen-495019-t6
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        # Use $$ so Cloud Build passes these as literal $ to bash (not substitution vars)
        PROJECT="blissful-acumen-495019-t6"
        REGION="asia-south1"
        UPDATES=""

        # CF_KV_API_TOKEN → CLOUDFLARE_KV_API_TOKEN (KV bulk write for HTML seeding)
        if gcloud secrets describe CF_KV_API_TOKEN --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}CLOUDFLARE_KV_API_TOKEN=CF_KV_API_TOKEN:latest"
          echo "  ✓ CF_KV_API_TOKEN"
        else
          echo "  ⚠ CF_KV_API_TOKEN not in SM — KV HTML seeding disabled"
        fi

        # CF_KV_NAMESPACE_ID → CLOUDFLARE_KV_NAMESPACE_ID
        if gcloud secrets describe CF_KV_NAMESPACE_ID --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}CLOUDFLARE_KV_NAMESPACE_ID=CF_KV_NAMESPACE_ID:latest"
          echo "  ✓ CF_KV_NAMESPACE_ID"
        else
          echo "  ⚠ CF_KV_NAMESPACE_ID not in SM — KV namespace target unknown"
        fi

        # GCS_CONTENT_BUCKET → GCS_CONTENT_BUCKET (educational content store)
        if gcloud secrets describe GCS_CONTENT_BUCKET --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}GCS_CONTENT_BUCKET=GCS_CONTENT_BUCKET:latest"
          echo "  ✓ GCS_CONTENT_BUCKET"
        else
          echo "  ⚠ GCS_CONTENT_BUCKET not in SM — GCS chapter storage disabled"
        fi

        # CF_PAGES_DEPLOY_HOOK → CF_PAGES_DEPLOY_HOOK (Cloudflare Pages deploy trigger)
        if gcloud secrets describe CF_PAGES_DEPLOY_HOOK --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}CF_PAGES_DEPLOY_HOOK=CF_PAGES_DEPLOY_HOOK:latest"
          echo "  ✓ CF_PAGES_DEPLOY_HOOK"
        else
          echo "  ⚠ CF_PAGES_DEPLOY_HOOK not in SM — Cloudflare Pages deploy hook disabled"
        fi

        # ADMIN_EMAIL / ADMIN_PASSWORD → admin bootstrap (idempotent on every start)
        if gcloud secrets describe ADMIN_EMAIL --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}ADMIN_EMAIL=ADMIN_EMAIL:latest"
          echo "  ✓ ADMIN_EMAIL"
        else
          echo "  ⚠ ADMIN_EMAIL not in SM — admin auto-bootstrap disabled"
        fi
        if gcloud secrets describe ADMIN_PASSWORD --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}ADMIN_PASSWORD=ADMIN_PASSWORD:latest"
          echo "  ✓ ADMIN_PASSWORD"
        else
          echo "  ⚠ ADMIN_PASSWORD not in SM — admin auto-bootstrap disabled"
        fi

        # SENTRY_DSN — error tracking (SM name: SENTRY_DSN)
        if gcloud secrets describe SENTRY_DSN --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}SENTRY_DSN=SENTRY_DSN:latest"
          echo "  ✓ SENTRY_DSN"
        else
          echo "  ⚠ SENTRY_DSN not in SM — Sentry error tracking disabled"
        fi

        # UPSTASH_REDIS_REST_URL + UPSTASH_REDIS_REST_TOKEN — fleet-wide email flood cap
        # Without these, each Cloud Run pod enforces its own 10 emails/min counter, so the
        # effective cap scales with pod count (3 pods → 30 emails/min).  With Redis, the cap
        # is shared across the entire fleet.  The app falls back to in-memory gracefully.
        # Verify Redis is active in production: GET /health → "email_rate_limiter": "redis"
        #
        # ONE-TIME SETUP (run in Cloud Shell once your Upstash account is ready):
        #   echo -n 'https://YOUR_INSTANCE.upstash.io' | \
        #     gcloud secrets create upstash-redis-rest-url \
        #       --replication-policy=automatic --data-file=- \
        #       --project=blissful-acumen-495019-t6
        #   echo -n 'YOUR_UPSTASH_TOKEN' | \
        #     gcloud secrets create upstash-redis-rest-token \
        #       --replication-policy=automatic --data-file=- \
        #       --project=blissful-acumen-495019-t6
        #   # Grant the backend SA access:
        #   gcloud secrets add-iam-policy-binding upstash-redis-rest-url \
        #     --project=blissful-acumen-495019-t6 \
        #     --member=serviceAccount:syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com \
        #     --role=roles/secretmanager.secretAccessor
        #   gcloud secrets add-iam-policy-binding upstash-redis-rest-token \
        #     --project=blissful-acumen-495019-t6 \
        #     --member=serviceAccount:syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com \
        #     --role=roles/secretmanager.secretAccessor
        if gcloud secrets describe upstash-redis-rest-url --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}UPSTASH_REDIS_REST_URL=upstash-redis-rest-url:latest"
          echo "  ✓ upstash-redis-rest-url (fleet-wide email flood cap: ACTIVE)"
        else
          echo "  ⚠ upstash-redis-rest-url not in SM — email flood cap is per-pod only (see setup instructions above)"
        fi

        # UPSTASH_REDIS_REST_TOKEN — required alongside UPSTASH_REDIS_REST_URL
        if gcloud secrets describe upstash-redis-rest-token --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}UPSTASH_REDIS_REST_TOKEN=upstash-redis-rest-token:latest"
          echo "  ✓ upstash-redis-rest-token"
        else
          echo "  ⚠ upstash-redis-rest-token not in SM — email flood cap is per-pod only"
        fi

        # POSTHOG_API_KEY — product analytics (optional)
        if gcloud secrets describe posthog-api-key --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}POSTHOG_API_KEY=posthog-api-key:latest"
          echo "  ✓ posthog-api-key"
        else
          echo "  ⚠ posthog-api-key not in SM — PostHog analytics disabled"
        fi

        # INDEXNOW_API_KEY — IndexNow SEO pinging (optional)
        if gcloud secrets describe indexnow-api-key --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}INDEXNOW_API_KEY=indexnow-api-key:latest"
          echo "  ✓ indexnow-api-key"
        else
          echo "  ⚠ indexnow-api-key not in SM — IndexNow SEO pinging disabled"
        fi

        # INDEXNOW_INTERNAL_SECRET — internal cron auth for IndexNow (optional)
        if gcloud secrets describe indexnow-internal-secret --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}INDEXNOW_INTERNAL_SECRET=indexnow-internal-secret:latest"
          echo "  ✓ indexnow-internal-secret"
        else
          echo "  ⚠ indexnow-internal-secret not in SM — IndexNow cron auth disabled"
        fi

        # CF_R2_PUBLIC_URL — public base URL for R2 objects so PYQ files load without auth.
        # Must be the r2.dev subdomain or a custom domain with public access enabled.
        #
        # ONE-TIME SETUP (Cloudflare dashboard):
        #   1. Go to R2 → syrabit-assets → Settings → Public Access
        #   2. Enable "R2.dev subdomain" (gives https://pub-<hash>.r2.dev) OR
        #      add a custom domain (e.g. https://assets.syrabit.ai) and set that.
        #   3. Then store that base URL in Secret Manager:
        #      echo -n 'https://pub-XXXXXXXXXXXX.r2.dev' | \
        #        gcloud secrets create CF_R2_PUBLIC_URL \
        #          --replication-policy=automatic --data-file=- \
        #          --project=blissful-acumen-495019-t6
        #   Or update an existing secret:
        #      echo -n 'https://pub-XXXXXXXXXXXX.r2.dev' | \
        #        gcloud secrets versions add CF_R2_PUBLIC_URL --data-file=- \
        #          --project=blissful-acumen-495019-t6
        if gcloud secrets describe CF_R2_PUBLIC_URL --project="$$PROJECT" >/dev/null 2>&1; then
          UPDATES="$${UPDATES:+$$UPDATES,}CF_R2_PUBLIC_URL=CF_R2_PUBLIC_URL:latest"
          echo "  ✓ CF_R2_PUBLIC_URL"
        else
          echo "  ⚠ CF_R2_PUBLIC_URL not in SM — PYQ uploads will return unauthenticated CF API URLs (broken for students)"
        fi

        if [ -n "$$UPDATES" ]; then
          gcloud run services update syrabit-backend \
            --region="$$REGION" --project="$$PROJECT" \
            --update-secrets="$$UPDATES"
          echo "Optional secrets attached: $$UPDATES"
        else
          echo "No optional secrets found yet. See comments above for create commands."
        fi

  # ── Step 7: Smoke-test the production RAG embedding path ─────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        PROJECT="blissful-acumen-495019-t6"
        REGION="asia-south1"
        SERVICE_URL=$$(gcloud run services describe syrabit-backend \
          --project="$$PROJECT" --region="$$REGION" \
          --format='value(status.url)')
        INVOKER=$$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)
        test -n "$$INVOKER"
        gcloud run services add-iam-policy-binding syrabit-backend \
          --project="$$PROJECT" --region="$$REGION" \
          --member="serviceAccount:$$INVOKER" \
          --role="roles/run.invoker" --quiet
        ID_TOKEN=$$(gcloud auth print-identity-token --audiences="$$SERVICE_URL")
        HTTP=$$(curl -sS -o /workspace/deep-health.json -w '%{http_code}' \
          -H "Authorization: Bearer $$ID_TOKEN" \
          "$$SERVICE_URL/api/v1/health/deep" --max-time 60)
        echo "Deep health HTTP: $$HTTP"
        cat /workspace/deep-health.json
        test "$$HTTP" = "200"
        python3 - <<'PY'
        import json
        payload = json.load(open("/workspace/deep-health.json"))
        embedding = payload["checks"]["workers_ai_embedding"]
        assert embedding["status"] == "healthy", embedding
        assert embedding["dimensions"] == 1024, embedding
        PY
        echo "Cloud Run RAG embedding path is healthy"

images:
  - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
