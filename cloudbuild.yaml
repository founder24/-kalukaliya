logsBucket: 'gs://blissful-acumen-495019-t6_cloudbuild_logs'

steps:
  # ── Step 1: Build the backend Docker image ────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '-f'
      - 'apps/backend/Dockerfile'
      - 'apps/backend'

  # ── Step 2: Push image to Artifact Registry ───────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'

  # ── Step 3: Deploy to Cloud Run (public — edge HMAC provides app-layer security) ──
  # The service allows unauthenticated invocations so the Cloudflare edge worker
  # can call it without a GOOGLE_SA_KEY OIDC token. Security is enforced at the
  # application layer via X-Edge-Signature HMAC (EDGE_SHARED_SECRET env var).
  # All public internet traffic still passes through api.syrabit.ai (Cloudflare
  # Worker) which rate-limits, validates JWT, and signs requests before forwarding.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'syrabit-backend'
      - '--image=asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--port=8000'
      - '--allow-unauthenticated'
      - '--service-account=syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com'
      - '--set-env-vars=APP_ENV=production,JWT_ALGORITHM=HS256'
      # NOTE: Sensitive env vars (MONGODB_URI, JWT_SECRET, REDIS_URL, EDGE_SHARED_SECRET,
      # GEMINI_API_KEY, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RESEND_API_KEY,
      # SENTRY_DSN, POSTHOG_API_KEY) must be configured once in Cloud Run via:
      #   gcloud run services update syrabit-backend --region=asia-south1 \
      #     --update-secrets=MONGODB_URI=syrabit-mongodb-uri:latest,...
      # They are preserved across deploys and NOT overwritten by --set-env-vars.

images:
  - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
