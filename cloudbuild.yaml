logsBucket: 'gs://blissful-acumen-495019-t6_cloudbuild_logs'

steps:
  # ── Step 1: Build the backend Docker image ────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '-f'
      - 'apps/backend/Dockerfile'
      - 'apps/backend'

  # ── Step 2: Push image to Artifact Registry ───────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'

  # ── Step 3: Deploy to Cloud Run (private — no unauthenticated access) ─────
  # Cloudflare edge worker authenticates via OIDC using cloudflare-edge-invoker SA.
  # Do NOT add --allow-unauthenticated here. Access is granted in Step 4.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'syrabit-backend'
      - '--image=asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--port=8000'
      - '--no-allow-unauthenticated'
      - '--service-account=syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com'

  # ── Step 4: Re-grant Cloudflare edge invoker access ───────────────────────
  # Cloud Run IAM bindings are NOT preserved across deployments when the
  # service is re-created. This step ensures the Cloudflare edge worker SA
  # always has run.invoker after every deploy.
  #
  # Prerequisite: Cloud Build SA (851687450401@cloudbuild.gserviceaccount.com)
  # must have roles/run.admin on this project. Grant once with:
  #   gcloud projects add-iam-policy-binding blissful-acumen-495019-t6 \
  #     --member="serviceAccount:851687450401@cloudbuild.gserviceaccount.com" \
  #     --role="roles/run.admin"
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - 'syrabit-backend'
      - '--region=asia-south1'
      - '--member=serviceAccount:cloudflare-edge-invoker@blissful-acumen-495019-t6.iam.gserviceaccount.com'
      - '--role=roles/run.invoker'

images:
  - 'asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:$COMMIT_SHA'
