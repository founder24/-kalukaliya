# .do/app.yaml — Digital Ocean App Platform spec for syrabit-backend
#
# Task #336 — canonical FastAPI origin on DO App Platform (region blr1),
# replacing the legacy Railway hosting. The richer per-service template
# with full secret inventory lives at
# `artifacts/syrabit/infra/do/app-syrabit-backend.yaml`; this file is the
# minimal root-of-repo spec that `doctl apps create --spec .do/app.yaml`
# and the `scripts/digitalocean.sh` helper consume directly.
#
# Image is published via the GitHub workflow
# `.github/workflows/digitalocean-deploy.yml`, which builds
# `artifacts/syrabit-backend/Dockerfile`, pushes to DOCR
# (`registry.digitalocean.com/syrabit/syrabit-backend:sha-<short-sha>`),
# rewrites `image.tag` in this spec, and runs `doctl apps update --wait`.
#
# Secrets: every `type: SECRET` entry must be populated out-of-band via
#   scripts/digitalocean.sh import-env syrabit-backend do-backend-vars.env
# never via this committed YAML. The `value: PLACEHOLDER_SET_VIA_doctl`
# string is intentional so a fresh `doctl apps create` against this spec
# fails fast if the import step was skipped, instead of starting the
# container with empty credentials.

name: syrabit-backend
region: blr1

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: CPU_UTILIZATION
    value: 80
    operator: GREATER_THAN
    window: FIVE_MINUTES
  - rule: MEM_UTILIZATION
    value: 80
    operator: GREATER_THAN
    window: FIVE_MINUTES
  - rule: RESTART_COUNT
    value: 3
    operator: GREATER_THAN
    window: TEN_MINUTES

services:
  - name: api
    instance_size_slug: basic-s
    instance_count: 1
    autoscaling:
      min_instance_count: 1
      max_instance_count: 4
      metrics:
        cpu:
          percent: 70
    http_port: 8080
    image:
      registry_type: DOCR
      repository: syrabit-backend
      tag: bootstrap
      deploy_on_push:
        enabled: false
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    deployment_strategy:
      type: ROLLING
      max_surge: 1
      max_unavailable: 0
    envs:
      - { key: PORT,                     value: "8080",            scope: RUN_AND_BUILD_TIME }
      - { key: ENV,                      value: "production",      scope: RUN_TIME }
      - { key: PYTHONUNBUFFERED,         value: "1",               scope: RUN_TIME }
      - { key: GUNICORN_WORKERS,         value: "4",               scope: RUN_TIME }
      - { key: GUNICORN_TIMEOUT,         value: "120",             scope: RUN_TIME }

      # Rust core dialled over the DO VPC private network. The Droplet
      # runbook at backend/rust-core/deploy/digitalocean/ exposes gRPC on
      # the same private hostname; for the App-Platform-only deployment
      # the Rust core app uses the App Platform internal DNS name
      # `rust-core-core.private`.
      - { key: RUST_CORE_GRPC_HOST,      value: "rust-core-core.private", scope: RUN_TIME }
      - { key: RUST_CORE_GRPC_PORT,      value: "50051",           scope: RUN_TIME }

      # Cache + rate-limits + 429 burst counter
      - { key: UPSTASH_REDIS_REST_URL,   value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: UPSTASH_REDIS_REST_TOKEN, value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }

      # Auth + DB
      - { key: SUPABASE_URL,             value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: SUPABASE_ANON_KEY,        value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: SUPABASE_SERVICE_ROLE_KEY, value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: MONGO_URL,                value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: DB_NAME,                  value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: JWT_SECRET,               value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }

      # Vector
      - { key: PINECONE_API_KEY,         value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: PINECONE_INDEX,           value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }

      # Cloudflare (R2 + D1 + AI Gateway) + edge-proxy origin secret
      - { key: CF_ACCOUNT_ID,            value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: CF_API_TOKEN,             value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: CF_R2_ACCESS_KEY_ID,      value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: CF_R2_SECRET_ACCESS_KEY,  value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: CF_R2_BUCKET,             value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: CF_AI_GATEWAY_URL,        value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: ORIGIN_SHARED_SECRET,     value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: CF_MTLS_CERT_SHA256,      value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: ENFORCE_MTLS,             value: "true",            scope: RUN_TIME }

      # Vertex / Vision / STT / TTS / Discovery Engine
      - { key: GCP_PROJECT_ID,           value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: GCP_SERVICE_ACCOUNT_JSON, value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: VERTEX_LOCATION,          value: "asia-south1",     scope: RUN_TIME }
      - { key: DISCOVERY_ENGINE_LOCATION, value: "global",         scope: RUN_TIME }

      # Payments
      - { key: STRIPE_SECRET_KEY,        value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: STRIPE_WEBHOOK_SECRET,    value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: RAZORPAY_KEY_ID,          value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: RAZORPAY_KEY_SECRET,      value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }

      # Email + AI providers
      - { key: RESEND_API_KEY,           value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: SARVAM_API_KEY,           value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: COHERE_API_KEY,           value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: VOYAGE_API_KEY,           value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: EXA_API_KEY,              value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: TAVILY_API_KEY,           value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: ELEVENLABS_API_KEY,       value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: DEEPGRAM_API_KEY,         value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: ASSEMBLYAI_API_KEY,       value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }

      # Observability
      - { key: SENTRY_DSN,               value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: POSTHOG_API_KEY,          value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: AXIOM_API_TOKEN,          value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: AXIOM_TOKEN,              value: "PLACEHOLDER_SET_VIA_doctl", type: SECRET, scope: RUN_TIME }
      - { key: AXIOM_DATASET,            value: "syrabit-backend-do", scope: RUN_TIME }

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: api
