[package]
name = "syrabit-rust-core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust/gRPC core for Syrabit.ai Education Platform"

[dependencies]
# Web framework — Task #192: axum 0.7 → 0.8
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# gRPC — Task #192: tonic 0.11 → 0.12, prost 0.12 → 0.13
tonic = "0.12"
tonic-web = "0.12"  # gRPC-Web support for Cloudflare Workers compatibility
tonic-reflection = "0.12"  # Server reflection on :50051 for grpcurl/probe tooling
prost = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database — Task #192: sqlx 0.7 → 0.8 (rustls feature, replaces native-tls)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }

# Pin transitive `time` to a version compatible with rustc 1.82 (Docker
# image MSRV). Newer time/time-macros require rustc 1.88+. This is a
# direct-dep pin so the resolver respects it across all transitive paths
# (notably jsonwebtoken → simple_asn1 → time).
time = "=0.3.36"

# Async utilities
futures = "0.3"
async-stream = "0.3"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# JWT authentication
jsonwebtoken = "9.3"

# HTTP client for external APIs — Task #192: reqwest 0.11 → 0.12 (rustls)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Vector search / embeddings
ndarray = "0.16"

# Random number generation
rand = "0.8"

# Async stream utilities
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
# Task #192: tonic-build 0.11 → 0.12 to match tonic 0.12 / prost 0.13
tonic-build = "0.12"

[[bin]]
name = "rust-core"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
