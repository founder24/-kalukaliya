version: 1
# Task #9 — Canonical bot registry.
#
# Single source of truth for crawler classification across:
#   * artifacts/syrabit-backend/utils.py        → _SEARCH_BOT_UA_RE / _TRAINING_SCRAPER_UA_RE / _ABUSIVE_SCRAPER_UA_RE
#   * artifacts/syrabit/vite.config.js          → BOT_UA
#   * artifacts/syrabit/public/_worker.js       → SEARCH_BOT_UA
#   * workers/edge-proxy/src/index.ts           → SEARCH_BOT_UA / AI_BOT_UA / CITATION_AI_BOT_UA
#
# CI guard `scripts/check_bot_rules_drift.py` parses each source and
# fails the build if any token below is missing from the file that
# claims to mirror the corresponding bucket. Adding a bot here without
# updating the four sources is exactly the drift the checker catches.
#
# Buckets (mirrors the worker's three rate-limit + block buckets):
#
# 1. verified_search     — Allowed. Get the high-RPM bucket
#                          (≥60 000 RPM) at the edge after Cloudflare's
#                          cf.verifiedBot flag (or KV-cached rDNS)
#                          confirms identity. Indexes Syrabit and drives
#                          referral search traffic.
#
# 2. citation_ai         — Allowed. Same high-RPM bucket as
#                          verified_search. Answer engines that cite
#                          their sources and drive referral traffic.
#                          Explicitly NOT in the AI training block.
#
# 3. training_ai         — 403 at the edge + Disallow in robots.txt.
#                          Pure training scrapers with no referral
#                          benefit. cf.verifiedBot does NOT bypass the
#                          block — verification only proves identity,
#                          not consent.
#
# 4. abusive             — Standard 120 RPM ceiling + reputation log.
#                          Generic scrapers and SEO crawlers we do not
#                          want consuming origin budget.

verified_search:
  # Each entry: token (case-insensitive substring match) + canonical
  # name + optional rdns_suffixes for the worker's KV-cached rDNS path.
  # Empty rdns_suffixes => verification relies on cf.verifiedBot only
  # (no stable PTR set published by the operator).
  - token: googlebot
    canonical: Googlebot
    rdns_suffixes: [".googlebot.com", ".google.com"]
  - token: google-extended
    canonical: Google-Extended
    rdns_suffixes: [".googlebot.com", ".google.com"]
    note: "Google-Extended is technically AI-training opt-out; left in this bucket because the same Google fleet serves both."
  - token: googleother
    canonical: GoogleOther
    rdns_suffixes: [".googlebot.com", ".google.com"]
  - token: google-inspectiontool
    canonical: Google-InspectionTool
    rdns_suffixes: [".googlebot.com", ".google.com"]
  - token: bingbot
    canonical: Bingbot
    rdns_suffixes: [".search.msn.com"]
  - token: duckduckbot
    canonical: DuckDuckBot
    rdns_suffixes: [".duckduckgo.com"]
  - token: applebot
    canonical: Applebot
    rdns_suffixes: [".applebot.apple.com"]
  - token: yandexbot
    canonical: YandexBot
    rdns_suffixes: [".yandex.ru", ".yandex.net", ".yandex.com"]
    # NOTE: bare `yandex` token deliberately removed (round-7 review).
    # Yandex's actual UA is `YandexBot/3.0`; the standalone `yandex`
    # token would only be redundant inside the runtime regex
    # (`yandexbot` already matches it) and the round-6 boundary fix
    # surfaced it as forward drift.
  - token: baiduspider
    canonical: Baiduspider
    rdns_suffixes: [".baidu.com", ".baidu.jp"]
  - token: petalbot
    canonical: PetalBot
    rdns_suffixes: [".petalsearch.com", ".aspiegel.com"]
  - token: yeti
    canonical: Yeti
    rdns_suffixes: [".naver.com"]
  - token: mojeekbot
    canonical: MojeekBot
    # Mojeek's published crawler PTRs end in `.mojeek.com`
    # (https://www.mojeek.com/about/crawler.html). Adding the suffix
    # gives Mojeek the FCrDNS fast-path promotion route alongside
    # cf.verifiedBot, addressing round-9 review comment about
    # cf.verifiedBot-only gating.
    rdns_suffixes: [".mojeek.com"]
  - token: seznambot
    canonical: SeznamBot
    rdns_suffixes: [".seznam.cz"]
  - token: youbot
    canonical: YouBot
    rdns_suffixes: [".you.com", ".youbot.you.com"]
    # Bucket placement note: YouBot is the You.com search/answer engine.
    # Although it is LLM-powered like Perplexity, we classify it under
    # `verified_search` (NOT `citation_ai`) because:
    #   1. It identifies as a search crawler (no `*-User` interactive
    #      variant), behaving like Bingbot/Googlebot operationally.
    #   2. It cites sources and drives referral traffic — same SEO
    #      benefit as a traditional search engine.
    #   3. cf.verifiedBot recognizes it under the search-engine family.
    # Functionally it gets the same 60K RPM verified fast path either
    # way; the bucket label only affects the admin observability tile.
    note: "You.com search/answer engine — cites sources, drives referral traffic."
  - token: slurp
    canonical: Slurp
    rdns_suffixes: [".crawl.yahoo.net"]
  - token: msnbot
    canonical: MSNBot
    rdns_suffixes: [".search.msn.com"]

citation_ai:
  # Citation-AI: answer engines that ground replies in fetched HTML and
  # link back. Same high-RPM bucket as verified_search, NOT blocked.
  - token: perplexitybot
    canonical: PerplexityBot
    rdns_suffixes: [".perplexity.ai"]
  - token: perplexity-user
    canonical: Perplexity-User
    rdns_suffixes: [".perplexity.ai"]
  - token: oai-searchbot
    canonical: OAI-SearchBot
    rdns_suffixes: [".openai.com"]
  - token: chatgpt-user
    canonical: ChatGPT-User
    rdns_suffixes: [".openai.com"]

training_ai:
  # Training-only crawlers: 403 at the edge + Disallow in robots.txt.
  # Mirrors `_AI_BOT_NAMES` in cf_bot_report.py (minus the citation-AI
  # set above) so robots.txt, the worker hard block, the python
  # classifier, and the admin dashboard's "AI Crawler" tile all agree.
  - token: gptbot
    canonical: GPTBot
  - token: claudebot
    canonical: ClaudeBot
  - token: claude-web
    canonical: Claude-Web
  - token: anthropic-ai
    canonical: anthropic-ai
  - token: google-extended
    canonical: Google-Extended
    note: "Listed in BOTH verified_search (because the Google fleet serves it) and training_ai (because Disallow in robots.txt + counted in the AI tile)."
  - token: applebot-extended
    canonical: Applebot-Extended
    note: "Listed in BOTH verified_search (same Apple fleet as Applebot) and training_ai (Disallow + AI tile)."
  - token: ccbot
    canonical: CCBot
  - token: cohere-ai
    canonical: Cohere-AI
  - token: bytespider
    canonical: Bytespider
  - token: amazonbot
    canonical: Amazonbot
  - token: diffbot
    canonical: Diffbot
  - token: meta-externalagent
    canonical: Meta-ExternalAgent

abusive:
  # Generic scrapers / SEO crawlers — standard 120 RPM ceiling, no
  # 403, no special bucket. Keeping them explicit so the per-UA report
  # in cf_bot_report.py classifies them rather than dumping them into
  # "Other".
  - token: scrapy
    canonical: scrapy
  - token: wget
    canonical: wget
  - token: curl
    canonical: curl
  - token: python-requests
    canonical: python-requests
  - token: go-http-client
    canonical: go-http-client
  - token: java/
    canonical: java
  - token: okhttp
    canonical: okhttp
  - token: ahrefsbot
    canonical: AhrefsBot
  - token: semrushbot
    canonical: SemrushBot
  - token: nmap
    canonical: nmap
  - token: masscan
    canonical: masscan
  - token: zgrab
    canonical: zgrab
  - token: heritrix
    canonical: heritrix
  - token: dotbot
    canonical: DotBot
  - token: mj12bot
    canonical: MJ12bot
