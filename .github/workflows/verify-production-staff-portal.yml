name: Verify Production Staff Portal

on:
  workflow_dispatch:
    inputs:
      rehearse_chat_latency_failure:
        description: 'Run the independent release-check rehearsal and force chat latency to fail'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  confirm-production:
    name: Confirm deployed API and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production endpoints are live
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://api.syrabit.ai/health)" = "200"
          test "$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 https://syrabit.ai)" = "200"

  chat-performance:
    name: Rehearse failed chat first-token latency
    runs-on: ubuntu-latest
    needs: confirm-production
    if: ${{ inputs.rehearse_chat_latency_failure }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the production-safe chat latency check
        env:
          CHAT_API_ORIGIN: https://syrabit-api-prod.axomxplain.workers.dev
          CHAT_FIRST_TOKEN_TARGET_MS: '3000'
          CHAT_PERFORMANCE_SAMPLES: '3'
          CHAT_PERFORMANCE_REPORT_PATH: chat-performance-report.json
        run: node scripts/test-worker-chat-performance.mjs

      - name: Force the chat latency result to fail
        if: ${{ always() }}
        run: |
          echo "::error::Manual rehearsal forced the chat latency result to fail; production traffic behavior was not modified."
          exit 1

  staff-portal:
    name: Lease staff account and verify every portal section
    runs-on: ubuntu-latest
    needs: confirm-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PUBLIC_SITE_URL: https://syrabit.ai
      PUBLIC_EDGE_URL: https://api.syrabit.ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @workspace/syrabit run playwright:install:chromium

      - name: Test staff portal diagnostic privacy
        run: node --test scripts/staff-portal-diagnostics.test.mjs

      - name: Verify the deployed staff portal read-only
        run: bash scripts/run-disposable-staff-portal-check.sh

      - name: Upload failed staff portal browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: staff-portal-playwright-diagnostics-${{ github.run_attempt }}
          path: staff-portal-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Always remove an interrupted staff portal fixture
        if: ${{ always() }}
        run: bash scripts/cleanup-disposable-staff-portal.sh "$RUNNER_TEMP/release-staff-portal-fixture.env"

  rehearsal-summary:
    name: Summarize independent rehearsal checks
    runs-on: ubuntu-latest
    needs: [chat-performance, staff-portal]
    if: ${{ always() && inputs.rehearse_chat_latency_failure }}
    steps:
      - name: Report chat latency and staff access separately
        env:
          CHAT_PERFORMANCE_RESULT: ${{ needs.chat-performance.result }}
          STAFF_ACCESS_RESULT: ${{ needs.staff-portal.result }}
        run: |
          {
            echo "## Independent release-check rehearsal"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Chat first-token latency | ${CHAT_PERFORMANCE_RESULT} |"
            echo "| Disposable staff access | ${STAFF_ACCESS_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice::Chat first-token latency result: ${CHAT_PERFORMANCE_RESULT}"
          echo "::notice::Disposable staff access result: ${STAFF_ACCESS_RESULT}"
          [[ "$CHAT_PERFORMANCE_RESULT" == "failure" ]]
          [[ "$STAFF_ACCESS_RESULT" == "success" ]]