name: glacier-restore-acceptance-nightly

#
# Supply-chain hardening: every `uses:` reference in this file is pinned to a
# full 40-char commit SHA (with a trailing `# vX.Y.Z` tag comment for
# readability). Float tags like `actions/checkout@v4` are forbidden because a
# compromise of the upstream tag — as happened with tj-actions/changed-files in
# 2025 — would let an attacker silently exfiltrate this repo's secrets on the
# next push. See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
#
# Task #562 — nightly end-to-end acceptance probe for the S3 Glacier Deep
# Archive restore path against the *staging* environment.
#
# What this runs
# --------------
# `tests/integration/test_glacier_restore_acceptance.py` (gated on
# GLACIER_ACCEPTANCE=1) — uploads a small file with --storage-class
# DEEP_ARCHIVE, calls POST /api/admin/archive/restore against staging
# with the staging admin JWT, polls s3:HeadObject until
# ongoing-request="false", downloads, asserts byte equality, cleans up.
#
# A passing run proves: lifecycle policy live, admin endpoint authorised
# + scoped to the allowlist, Standard-tier restore SLA met, byte-for-byte
# restore round-trip works, audit log row written.
#
# Why a separate workflow
# -----------------------
# A Terraform change that breaks the lifecycle policy or the admin
# endpoint contract would otherwise go unnoticed until the first real
# audit-restore request 12 hours after someone actually needs the data.
#
# Required repo secrets
# ---------------------
#   GLACIER_ACCEPTANCE_AWS_ACCESS_KEY_ID      Staging AWS creds with
#   GLACIER_ACCEPTANCE_AWS_SECRET_ACCESS_KEY  PutObject / RestoreObject /
#                                             HeadObject / GetObject /
#                                             DeleteObject on the target
#                                             bucket.
#   GLACIER_ACCEPTANCE_ADMIN_JWT              Admin JWT scoped to the
#                                             staging admin team.
#   GLACIER_ACCEPTANCE_OPS_SLACK_WEBHOOK      #syrabit-oncall webhook URL.
#                                             When unset, the job still
#                                             fails (so the GitHub
#                                             failed-workflow email
#                                             goes out) but no Slack
#                                             post is made.
#
# Required repo variables
# -----------------------
#   GLACIER_ACCEPTANCE_API_BASE   Staging API base URL, e.g.
#                                 https://staging-api.syrabit.ai
#   GLACIER_ACCEPTANCE_BUCKET     (optional) defaults to
#                                 syrabit-content-snapshots-prod —
#                                 must be in the runbook allowlist.
#   GLACIER_ACCEPTANCE_REGION     (optional) defaults to ap-south-1.

on:
  schedule:
    # 02:47 UTC daily — well clear of the cf-waf-drift (04:47),
    # grounded-recall (04:30), trustpilot-aggregate-refresh (04:30),
    # and edge-cache-live (03:17) crons so a Slack burst from one
    # workflow doesn't bury this one. Also runs *before* the typical
    # business-hours window so on-call has a fresh signal at the start
    # of the day.
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "max wait for restore to complete (default 13h = SLA + 1h slack)"
        required: false
        default: "46800"
      tier:
        description: "Glacier restore tier (Standard or Bulk)"
        required: false
        default: "Standard"

# Read-only token: this job calls staging AWS + the staging admin
# endpoint + a Slack webhook with their own secrets. It does not push
# back to the repo, so least-privilege denies write scopes.
permissions:
  contents: read

jobs:
  glacier-restore-probe:
    name: Glacier Deep Archive end-to-end restore (staging)
    runs-on: ubuntu-latest
    # The Standard tier SLA is 12h; we add 1h of slack to absorb AWS
    # variability, and another 30 min for env setup + cleanup. GitHub's
    # hard 6h job ceiling forbids actually waiting the full 13h here,
    # so the test itself short-circuits at GLACIER_ACCEPTANCE_TIMEOUT_S
    # well before the runner kills us. The mismatch is intentional:
    # the workflow is a probe, not an SLA enforcer — if the test times
    # out at 5h45m the alert fires and on-call investigates whether
    # the restore eventually succeeded.
    timeout-minutes: 350

    defaults:
      run:
        working-directory: artifacts/syrabit-backend

    env:
      GLACIER_ACCEPTANCE: "1"
      GLACIER_ACCEPTANCE_API_BASE: ${{ vars.GLACIER_ACCEPTANCE_API_BASE }}
      GLACIER_ACCEPTANCE_ADMIN_JWT: ${{ secrets.GLACIER_ACCEPTANCE_ADMIN_JWT }}
      GLACIER_ACCEPTANCE_BUCKET: ${{ vars.GLACIER_ACCEPTANCE_BUCKET || 'syrabit-content-snapshots-prod' }}
      GLACIER_ACCEPTANCE_TIMEOUT_S: ${{ github.event.inputs.timeout_seconds || '20400' }}  # 5h40m default — under runner ceiling
      GLACIER_ACCEPTANCE_TIER: ${{ github.event.inputs.tier || 'Standard' }}
      GLACIER_ACCEPTANCE_POLL_S: "300"  # 5 min — slightly tighter than the runbook for Actions cadence
      AWS_ACCESS_KEY_ID: ${{ secrets.GLACIER_ACCEPTANCE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GLACIER_ACCEPTANCE_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.GLACIER_ACCEPTANCE_REGION || 'ap-south-1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Task #906 — strip GITHUB_TOKEN from .git/config after checkout.
          # This job hits AWS + staging + Slack with their own secrets;
          # persisting credentials would only widen the blast radius.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Guard required secrets
        # Fail fast with a clear message if the cron rolled out before
        # the operator added the secrets, instead of an opaque AWS or
        # HTTP error 30 lines deeper.
        run: |
          set -e
          missing=""
          if [ -z "${GLACIER_ACCEPTANCE_API_BASE:-}" ]; then
            missing="$missing GLACIER_ACCEPTANCE_API_BASE(var)"
          fi
          if [ -z "${GLACIER_ACCEPTANCE_ADMIN_JWT:-}" ]; then
            missing="$missing GLACIER_ACCEPTANCE_ADMIN_JWT"
          fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            missing="$missing GLACIER_ACCEPTANCE_AWS_ACCESS_KEY_ID"
          fi
          if [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            missing="$missing GLACIER_ACCEPTANCE_AWS_SECRET_ACCESS_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Required secrets/vars not configured:$missing"
            echo "Add them in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Install probe deps
        run: |
          python -m pip install --upgrade pip
          # Pinned floor versions — these are stable interfaces (boto3 S3
          # restore_object + requests POST/GET) so a minor bump is safe.
          python -m pip install 'boto3>=1.34' 'requests>=2.31' 'pytest>=8'

      - name: Run acceptance probe
        id: probe
        run: |
          set +e
          python -m pytest -q \
            tests/integration/test_glacier_restore_acceptance.py \
            2>&1 | tee /tmp/glacier_probe.out
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" != "0" ]; then
            echo "::error title=Glacier acceptance failed::see Slack alert + log tail"
          else
            echo "::notice title=Glacier acceptance OK::end-to-end restore round-trip succeeded"
          fi
          exit 0

      - name: Post Slack alert to #syrabit-oncall on failure
        if: ${{ steps.probe.outputs.rc != '0' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.GLACIER_ACCEPTANCE_OPS_SLACK_WEBHOOK }}
          PROBE_RC: ${{ steps.probe.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning title=Slack alert skipped::GLACIER_ACCEPTANCE_OPS_SLACK_WEBHOOK not configured. Job will still fail in the final step so the GitHub failed-workflow email goes out, but configure the webhook to surface this in #syrabit-oncall."
            exit 0
          fi
          probe_tail=$(tail -c 2500 /tmp/glacier_probe.out 2>/dev/null || echo "(no output captured)")
          payload=$(jq -n \
            --arg rc "$PROBE_RC" \
            --arg run "$RUN_URL" \
            --arg tail "$probe_tail" \
            '{
              text: ":rotating_light: Glacier Deep Archive acceptance probe FAILED (Task #562 nightly)",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: (":rotating_light: *Glacier Deep Archive acceptance probe FAILED*\n"
                      + "`pytest` rc=`" + $rc + "`\n"
                      + "<" + $run + "|GitHub Actions run>\n"
                      + "Runbook: `artifacts/syrabit/docs/infra/glacier-restore-runbook.md` §5\n"
                      + "Endpoint: `routes/admin_archive.py` (POST /api/admin/archive/restore)")
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*probe output (last 2500 chars)*\n```\n" + $tail + "\n```")
                  }
                }
              ]
            }')
          http_code=$(curl -sS -o /tmp/slack_body -w '%{http_code}' \
            -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --max-time 15 --retry 2 --retry-delay 5 \
            -d "$payload")
          echo "[slack] http=$http_code body=$(cat /tmp/slack_body 2>/dev/null | head -c 200)"
          if [ "$http_code" != "200" ]; then
            echo "::warning title=Slack alert failed::Slack webhook returned HTTP $http_code (job will still fail at the final step so the GitHub email goes out)"
          fi
          exit 0

      - name: Fail job on probe failure
        if: ${{ steps.probe.outputs.rc != '0' }}
        env:
          PROBE_RC: ${{ steps.probe.outputs.rc }}
        run: |
          echo "probe rc=${PROBE_RC} (expected 0)"
          exit 1
