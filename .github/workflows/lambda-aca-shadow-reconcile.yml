name: lambda-aca-shadow-reconcile

#
# Task #560 — Daily Lambda↔ACA shadow reconciliation gate.
#
# Runs `artifacts/syrabit-backend/scripts/lambda_aca_shadow_reconcile.py`
# once a day during the 7-day shadow window declared in
# `infra/aws/lambda/manifest.json` (`shadow_start` … `shadow_end`).
# The script:
#   • compares per-job 24h outcomes between the Lambda + ACA-loop drivers
#   • emits `Syrabit/BatchJobs ShadowMatchRate{Job=<name>}` to CloudWatch
#   • posts a #syrabit-oncall summary
#   • exits non-zero when any job is below MATCH_RATE_TARGET (default 0.99)
#
# After 7 consecutive green days, ops sets `ACA_JOB_BATCHES_DISABLED=1`
# on the ACA env (Bicep) and flips `cutover_status` to `live` in the
# manifest. Rollback = unset the env var.
#
# Supply-chain hardening: every `uses:` is pinned to a 40-char SHA.
#

on:
  schedule:
    - cron: "30 5 * * *"   # daily 05:30 UTC — 30m after the comprehend cron
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip Slack + CloudWatch writes (still computes match-rate)."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read
  id-token: write   # OIDC -> aws_iam_role.github_deploy (CloudWatch put)

concurrency:
  group: lambda-aca-shadow-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Lambda vs ACA loops
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install runtime deps (motor + boto3 only)
        # Quote every spec — unquoted `boto3>=1.35.0` would be parsed
        # by bash as an output redirect to a file literally named
        # `=1.35.0` and silently install an unconstrained boto3.
        run: pip install "motor==3.7.1" "boto3>=1.35.0" "pymongo==4.17.0"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run reconciliation
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SLACK_ONCALL_WEBHOOK_URL: ${{ secrets.SLACK_ONCALL_WEBHOOK_URL }}
          MATCH_RATE_TARGET: "0.99"
          RECONCILE_LOOKBACK_HOURS: "24"
          RECONCILE_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        working-directory: artifacts/syrabit-backend
        run: python scripts/lambda_aca_shadow_reconcile.py
