name: rust-core-tests

#
# Supply-chain hardening: every `uses:` reference in this file is pinned to a
# full 40-char commit SHA (with a trailing `# vX.Y.Z` tag comment for
# readability). Float tags like `actions/checkout@v4` are forbidden — see
# .github/workflows/backend-tests.yml for the rationale.
#
# Task #192 — CI gate for the backend/rust-core crate. Runs on every push and
# PR that touches the crate, and validates:
#   * `cargo fmt --check`
#   * `cargo check --locked` (warnings-as-errors via RUSTFLAGS)
#   * `cargo clippy --locked -- -D warnings`
#   * `cargo build --release --locked` (catches release-only regressions
#     pre-merge instead of waiting for the Railway Docker build)
#   * `cargo test --locked`
#   * `cargo audit` (advisory DB scan)
# The lockfile is checked in (Cargo.lock), so all steps use --locked to
# enforce reproducible builds.
#

on:
  push:
    branches: [Replit-agent, master]
    paths:
      - 'backend/rust-core/**'
      - '.github/workflows/rust-core-tests.yml'
  pull_request:
    branches: [Replit-agent, master]
    paths:
      - 'backend/rust-core/**'
      - '.github/workflows/rust-core-tests.yml'

permissions:
  contents: read

jobs:
  rust:
    name: cargo check / test / audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend/rust-core

    env:
      CARGO_TERM_COLOR: always
      # Warnings-as-errors so the crate stays clean (Task #192 acceptance bar)
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install Rust toolchain (1.82, matches Dockerfile MSRV)
        run: |
          rustup toolchain install 1.82.0 --profile minimal --component rustfmt,clippy
          rustup default 1.82.0
          rustc --version
          cargo --version

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/rust-core/target
          key: ${{ runner.os }}-cargo-rust-core-${{ hashFiles('backend/rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-core-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check --locked
        run: cargo check --locked --all-targets

      - name: cargo clippy --locked -- -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo build --release --locked
        # Catches release-only regressions (codegen, optimizer-triggered
        # `unused`/overflow checks, feature-resolver differences) pre-merge
        # so we no longer rely on the post-merge Railway Docker build as
        # the sole release-build signal. See task #301.
        run: cargo build --release --locked

      - name: cargo test --locked
        run: cargo test --locked --all-targets

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.21

      - name: cargo audit (enforcing)
        # Fail the build on any unresolved RUSTSEC advisory affecting this
        # crate's dependency graph. New advisories must either be fixed
        # (preferred) or explicitly waived by adding a `[[advisories.ignore]]`
        # entry to backend/rust-core/.cargo/audit.toml with a justification
        # comment and a follow-up issue link.
        run: cargo audit --deny warnings
