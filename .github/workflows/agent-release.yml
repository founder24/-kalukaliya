name: "Agent: Release & Version Bump"

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      pre_release:
        description: 'Create as pre-release'
        required: false
        type: boolean
        default: false
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'release')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && 'main' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.version_bump }}" >> "$GITHUB_OUTPUT"
          else
            # Scan conventional commits since last tag
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%s %b")
            else
              COMMITS=$(git log --pretty=format:"%s %b")
            fi

            if echo "$COMMITS" | grep -qi "BREAKING CHANGE"; then
              echo "type=major" >> "$GITHUB_OUTPUT"
            elif echo "$COMMITS" | grep -qi "^feat"; then
              echo "type=minor" >> "$GITHUB_OUTPUT"
            else
              echo "type=patch" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Get current version
        id: current
        run: |
          CURRENT=$(node -e "console.log(require('./package.json').version)")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          BUMP="${{ steps.bump.outputs.type }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Update version in package.json files
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const files = [
              'package.json',
              'apps/edge/package.json',
              'apps/frontend/package.json'
            ];
            for (const file of files) {
              try {
                const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
                pkg.version = '${NEW_VERSION}';
                fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
                console.log('Updated ' + file + ' to ' + '${NEW_VERSION}');
              } catch (e) {
                console.warn('Skipping ' + file + ': ' + e.message);
              }
            }
          "

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s (%h)")
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)")
          fi

          # Write changelog to file for use in release body
          echo "$CHANGELOG" > /tmp/changelog.md
          echo "Generated changelog with $(echo "$CHANGELOG" | wc -l) entries"

      - name: Commit version bump
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git add package.json apps/edge/package.json apps/frontend/package.json
          git commit -m "chore(release): v${NEW_VERSION}"

      - name: Create annotated tag
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"

      - name: Push commits and tag
        run: |
          git push origin HEAD
          git push origin "v${{ steps.new_version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          PRE_RELEASE_FLAG=""
          if [ "${{ inputs.pre_release }}" = "true" ]; then
            PRE_RELEASE_FLAG="--prerelease"
          fi

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file /tmp/changelog.md \
            $PRE_RELEASE_FLAG
