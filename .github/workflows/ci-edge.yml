name: CI Edge — Lint, Test & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/edge/**'
      - '.github/workflows/ci-edge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/edge/**'
      - '.github/workflows/ci-edge.yml'
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type Check
        run: pnpm --filter syrabit-edge exec tsc --noEmit

      - name: Lint
        run: pnpm --filter syrabit-edge exec eslint src/
        continue-on-error: true

  test:
    name: Run Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Tests
        run: pnpm --filter syrabit-edge test
        continue-on-error: true

  deploy:
    name: Deploy to Cloudflare
    needs: lint-and-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Deploy Worker
        run: pnpm --filter syrabit-edge exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
