name: CI Edge — Lint & Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/edge/**'
      - 'scripts/test-worker-chat-performance.mjs'
      - 'scripts/worker-chat-performance-gate.mjs'
      - 'scripts/worker-chat-performance-gate.test.mjs'
      - 'scripts/check-required-status-contexts.py'
      - 'scripts/test-required-status-contexts.py'
      - '.github/workflows/ci-edge.yml'
      - '.github/workflows/required-status-contexts.yml'
  push:
    branches: [main]
    paths:
      - 'apps/edge/**'
      - 'scripts/test-worker-chat-performance.mjs'
      - 'scripts/worker-chat-performance-gate.mjs'
      - 'scripts/worker-chat-performance-gate.test.mjs'
      - 'scripts/check-required-status-contexts.py'
      - 'scripts/test-required-status-contexts.py'
      - '.github/workflows/ci-edge.yml'
      - '.github/workflows/required-status-contexts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-performance-gate:
    name: Chat Performance Gate Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Run worker chat performance gate regression tests
        run: node --test scripts/worker-chat-performance-gate.test.mjs

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm --filter syrabit-edge exec tsc --noEmit

  test:
    name: Run Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm --filter syrabit-edge test:ci
