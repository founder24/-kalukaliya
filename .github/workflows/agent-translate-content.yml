name: Daily Content Translation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      board:
        description: 'Filter by board (e.g., AHSEC, SEBA)'
        required: false
        type: string
      subject:
        description: 'Filter by subject (e.g., physics, chemistry)'
        required: false
        type: string
      limit:
        description: 'Max objects to translate'
        required: false
        type: number
        default: 100

permissions: {}

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Trigger bulk translation
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN || 'https://api.syrabit.ai' }}
          TRANSLATE_SECRET: ${{ secrets.TRANSLATE_CRON_SECRET }}
          INPUT_BOARD: ${{ inputs.board }}
          INPUT_SUBJECT: ${{ inputs.subject }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail

          BODY='{}'
          if [ -n "$INPUT_BOARD" ]; then
            BODY=$(echo "$BODY" | jq --arg b "$INPUT_BOARD" '. + {board: $b}')
          fi
          if [ -n "$INPUT_SUBJECT" ]; then
            BODY=$(echo "$BODY" | jq --arg s "$INPUT_SUBJECT" '. + {subject: $s}')
          fi
          LIMIT="${INPUT_LIMIT:-100}"
          BODY=$(echo "$BODY" | jq --argjson l "$LIMIT" '. + {limit: $l}')

          echo "Request body: $BODY"
          echo "Calling native seed route: ${API_ORIGIN}/api/v1/admin/cron/translate"

          # Use -s (silent) without -f so HTTP errors don't abort the script.
          # Capture both the response body and the HTTP status code separately.
          # Native Workers dispatch the bounded seed run asynchronously and
          # return a run_id immediately. No Cloud Run URL or OIDC token is used.
          HTTP_STATUS=$(curl -s -o /tmp/translate_response.json \
            -w "%{http_code}" --max-time 60 \
            -X POST "${API_ORIGIN}/api/v1/admin/cron/translate" \
            -H "Authorization: Bearer ${TRANSLATE_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "HTTP status: $HTTP_STATUS"
          RESPONSE=$(cat /tmp/translate_response.json 2>/dev/null || echo '{}')
          echo "Response: $RESPONSE"

          echo "HTTP status: $HTTP_STATUS"

          if [[ "$HTTP_STATUS" -ge 200 && "$HTTP_STATUS" -lt 300 ]]; then
            JOB=$(echo "$RESPONSE" | jq -r '.job // "unknown"')
            RUN_ID=$(echo "$RESPONSE" | jq -r '.run_id // "none"')
            echo "::notice::Native Assamese seed dispatch: $JOB (run: $RUN_ID)"
          elif [[ "$HTTP_STATUS" == "401" || "$HTTP_STATUS" == "403" ]]; then
            echo "::error::Authentication failed (HTTP ${HTTP_STATUS}) — check TRANSLATE_CRON_SECRET."
            exit 1
          else
            echo "::error::Unexpected HTTP ${HTTP_STATUS} from translation endpoint — potential backend error."
            echo "Response: $RESPONSE"
            exit 1
          fi
