name: ACA — rollback ORIGIN_SHARED_SECRET (one-shot, V0 restore)

# Task #103 partial-execution rollback. The Worker `BACKEND_ORIGIN_SECRET`
# was rotated to V2 but the new ACA revision came up Unhealthy and ACA
# fell back to the previous revision (which has the original V0 secret
# baked in). To restore service:
#   1. Read the prior version of `ORIGIN-SHARED-SECRET` from
#      `syrabit-prod-kv` — that's V0, the value the running container
#      is comparing against.
#   2. Write V0 back to both Cloudflare workers
#      (`syrabitworker`, `syrabit-edge`) so OriginGate matches.
#   3. Re-set V0 as the latest KV version so the next routine
#      revision-roll picks the value the running container expects
#      (instead of V2, which no live revision was successfully built
#      against).
# Does NOT roll a new ACA revision — the running revision is the one
# we want serving.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  VAULT: syrabit-prod-kv

jobs:
  rollback:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify required ephemeral secrets are present
        env:
          CFT: ${{ secrets.CF_API_TOKEN_TMP }}
          CFA: ${{ secrets.CF_ACCOUNT_ID_TMP }}
        run: |
          set -euo pipefail
          [ -n "$CFT" ] || { echo "::error::missing CF_API_TOKEN_TMP"; exit 1; }
          [ -n "$CFA" ] || { echo "::error::missing CF_ACCOUNT_ID_TMP"; exit 1; }
          echo "✓ ephemeral CF creds present"

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Identify and fetch V0 (the prior KV version of ORIGIN-SHARED-SECRET)
        id: getv0
        run: |
          set -euo pipefail
          # List versions sorted by created desc — index [0] is current
          # (V2, the rotated one), index [1] is the prior (V0, what the
          # running revision uses).
          VERSIONS=$(az keyvault secret list-versions \
            --vault-name "$VAULT" --name "ORIGIN-SHARED-SECRET" \
            --query "sort_by(@,&attributes.created)[*].{id:id,created:attributes.created}" \
            -o json)
          COUNT=$(echo "$VERSIONS" | jq 'length')
          echo "found $COUNT versions in KV"
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::need at least 2 versions to roll back; only $COUNT present"
            exit 1
          fi
          # Last entry is newest (V2); second-to-last is V0
          V2_ID=$(echo "$VERSIONS" | jq -r '.[-1].id')
          V0_ID=$(echo "$VERSIONS" | jq -r '.[-2].id')
          V2_T=$(echo "$VERSIONS" | jq -r '.[-1].created')
          V0_T=$(echo "$VERSIONS" | jq -r '.[-2].created')
          echo "V2 (current, will be replaced): $V2_T"
          echo "V0 (target rollback value):     $V0_T"
          # Fetch V0 value, mask it before any later step can echo it
          V0_VALUE=$(az keyvault secret show --id "$V0_ID" --query value -o tsv)
          echo "::add-mask::$V0_VALUE"
          # Stash to a step-local file so subsequent steps can read it
          # without putting it in step outputs (which can leak via
          # workflow_run events / summaries).
          echo "$V0_VALUE" > /tmp/v0
          chmod 600 /tmp/v0
          echo "✓ V0 fetched (length=$(echo -n "$V0_VALUE" | wc -c))"

      - name: Push V0 to Cloudflare workers (syrabitworker + syrabit-edge)
        env:
          CFT: ${{ secrets.CF_API_TOKEN_TMP }}
          CFA: ${{ secrets.CF_ACCOUNT_ID_TMP }}
        run: |
          set -euo pipefail
          V0=$(cat /tmp/v0)
          echo "::add-mask::$V0"
          for w in syrabitworker syrabit-edge; do
            BODY=$(python3 -c "import json,os;print(json.dumps({'name':'BACKEND_ORIGIN_SECRET','text':open('/tmp/v0').read().rstrip(chr(10)),'type':'secret_text'}))")
            R=$(curl -sS -X PUT \
              -H "Authorization: Bearer $CFT" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CFA/workers/scripts/${w}/secrets" \
              -d "$BODY")
            OK=$(echo "$R" | jq -r '.success')
            if [ "$OK" != "true" ]; then
              echo "::error::CF worker $w secret update failed"
              echo "$R" | jq '.errors // .'
              exit 1
            fi
            echo "✓ $w BACKEND_ORIGIN_SECRET set to V0"
          done

      - name: Re-set V0 as the latest KV version
        run: |
          set -euo pipefail
          az keyvault secret set --vault-name "$VAULT" --name "ORIGIN-SHARED-SECRET" \
            --file /tmp/v0 --output none
          echo "✓ KV ORIGIN-SHARED-SECRET latest version is now V0"
          shred -u /tmp/v0 2>/dev/null || rm -f /tmp/v0

      - name: Verify OriginGate now accepts the worker-injected header (e2e via syrabit.ai)
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            CODE=$(curl -sS -o /tmp/body -w "%{http_code}" \
              -X POST "https://syrabit.ai/api/ai/chat" \
              -H "Origin: https://syrabit.ai" -H "Referer: https://syrabit.ai/chat" \
              -H "Content-Type: application/json" \
              -d '{"message":"ping","mode":"english"}')
            DENIED=$(grep -c "Direct origin access denied" /tmp/body 2>/dev/null || echo 0)
            echo "[$i] HTTP $CODE OriginGate-denied=$DENIED"
            if [ "$DENIED" = "0" ]; then
              echo "✓ chat path is past OriginGate (HTTP $CODE — anonymous request, downstream auth/cap may still 401/422 which is expected)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::OriginGate still denying after rollback. Worker propagation can take ~30s; retry verify manually."
          exit 1
