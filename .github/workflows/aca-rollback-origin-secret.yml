name: ACA — restore original ORIGIN_SHARED_SECRET (V_orig, 2026-05-06)

# Task #103 final restore. The probe workflow showed the running ACA
# revision authenticates with the OLDEST KV version (created
# 2026-05-06T13:00:33+00:00, length 62 chars) — i.e. the ORIGINAL prod
# secret that pre-dates the agent's V1/V2 rotation attempts. Two newer
# 43-char versions exist in KV from those failed rotations. This
# workflow:
#   1. Reads the OLDEST enabled KV version of ORIGIN-SHARED-SECRET
#      (V_orig).
#   2. Pushes V_orig to both Cloudflare workers
#      (`syrabitworker`, `syrabit-edge`).
#   3. Re-sets V_orig as the latest KV version so the next routine
#      revision-roll picks the value the running container expects.
# Does NOT roll a new ACA revision — the running revision is the one
# we want serving.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  VAULT: syrabit-prod-kv

jobs:
  restore:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify ephemeral CF creds present
        env:
          CFT: ${{ secrets.CF_API_TOKEN_TMP }}
          CFA: ${{ secrets.CF_ACCOUNT_ID_TMP }}
        run: |
          set -euo pipefail
          [ -n "$CFT" ] || { echo "::error::missing CF_API_TOKEN_TMP"; exit 1; }
          [ -n "$CFA" ] || { echo "::error::missing CF_ACCOUNT_ID_TMP"; exit 1; }

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch V_orig (OLDEST enabled KV version of ORIGIN-SHARED-SECRET)
        run: |
          set -euo pipefail
          # Sort ascending by created — first enabled entry is V_orig
          ORIG_ID=$(az keyvault secret list-versions \
            --vault-name "$VAULT" --name "ORIGIN-SHARED-SECRET" \
            --query "sort_by([?attributes.enabled],&attributes.created)[0].id" -o tsv)
          if [ -z "$ORIG_ID" ] || [ "$ORIG_ID" = "None" ]; then
            echo "::error::could not find any enabled KV version"
            exit 1
          fi
          echo "V_orig id: $ORIG_ID"
          VAL=$(az keyvault secret show --id "$ORIG_ID" --query value -o tsv)
          echo "::add-mask::$VAL"
          # Sanity: must be the 62-char one identified by the probe
          if [ "${#VAL}" != "62" ]; then
            echo "::warning::expected length 62 from probe, got ${#VAL} — proceeding anyway since we picked the oldest enabled version"
          fi
          echo -n "$VAL" > /tmp/orig
          chmod 600 /tmp/orig
          echo "✓ V_orig fetched (length=${#VAL})"

      - name: Push V_orig to both Cloudflare workers
        env:
          CFT: ${{ secrets.CF_API_TOKEN_TMP }}
          CFA: ${{ secrets.CF_ACCOUNT_ID_TMP }}
        run: |
          set -euo pipefail
          for w in syrabitworker syrabit-edge; do
            BODY=$(python3 -c "import json;print(json.dumps({'name':'BACKEND_ORIGIN_SECRET','text':open('/tmp/orig').read(),'type':'secret_text'}))")
            R=$(curl -sS -X PUT \
              -H "Authorization: Bearer $CFT" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CFA/workers/scripts/${w}/secrets" \
              -d "$BODY")
            OK=$(echo "$R" | jq -r '.success')
            if [ "$OK" != "true" ]; then
              echo "::error::CF worker $w secret update failed"
              echo "$R" | jq '.errors // .'
              exit 1
            fi
            echo "✓ $w BACKEND_ORIGIN_SECRET set to V_orig"
          done

      - name: Re-set V_orig as the LATEST KV version
        run: |
          set -euo pipefail
          az keyvault secret set --vault-name "$VAULT" --name "ORIGIN-SHARED-SECRET" \
            --file /tmp/orig --output none
          echo "✓ KV ORIGIN-SHARED-SECRET latest version is now V_orig"
          shred -u /tmp/orig 2>/dev/null || rm -f /tmp/orig

      - name: Verify e2e via syrabit.ai (allow 30s for CF propagation)
        run: |
          set -euo pipefail
          echo "waiting 30s for Cloudflare worker secret propagation..."
          sleep 30
          for i in $(seq 1 8); do
            CODE=$(curl -sS -o /tmp/body -w "%{http_code}" \
              -X POST "https://syrabit.ai/api/ai/chat" \
              -H "Origin: https://syrabit.ai" -H "Referer: https://syrabit.ai/chat" \
              -H "Content-Type: application/json" \
              -d '{"message":"ping","mode":"english"}')
            # Use exact-string check, robust against grep -c trailing newlines
            if grep -qF "Direct origin access denied" /tmp/body 2>/dev/null; then
              echo "[$i] HTTP $CODE — STILL OriginGate-denied"
              sleep 6
              continue
            fi
            echo "[$i] HTTP $CODE — past OriginGate ✓"
            echo "  body snippet: $(head -c 160 /tmp/body)"
            exit 0
          done
          echo "::error::OriginGate still denying after restore. Manual check needed."
          exit 1
