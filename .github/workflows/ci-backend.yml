name: CI Backend — Lint & Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sed 's/ *\\$//' apps/backend/requirements.txt | grep -v '^\s*--hash' > /tmp/requirements-nohash.txt
          pip install -r /tmp/requirements-nohash.txt || {
            echo "::warning::pip strict install failed — retrying without version constraints for test packages"
            grep -v -E '^\s*(pytest|pytest-asyncio|pytest-cov)==' /tmp/requirements-nohash.txt > /tmp/requirements-relaxed.txt
            pip install -r /tmp/requirements-relaxed.txt
            pip install pytest "pytest-asyncio>=0.21" pytest-cov
          }
          pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check apps/backend/app/

      - name: Run MyPy type checker
        run: mypy apps/backend/app/ --ignore-missing-imports

  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sed 's/ *\\$//' apps/backend/requirements.txt | grep -v '^\s*--hash' > /tmp/requirements-nohash.txt
          pip install -r /tmp/requirements-nohash.txt || {
            echo "::warning::pip strict install failed — retrying without version constraints for test packages"
            grep -v -E '^\s*(pytest|pytest-asyncio|pytest-cov)==' /tmp/requirements-nohash.txt > /tmp/requirements-relaxed.txt
            pip install -r /tmp/requirements-relaxed.txt
            pip install pytest "pytest-asyncio>=0.21" pytest-cov
          }

      - name: Run tests
        working-directory: apps/backend
        env:
          MONGODB_URI: mongodb://test:test@localhost:27017
          APP_ENV: test
          JWT_SECRET: test-secret-at-least-32-characters-long
        run: pytest
