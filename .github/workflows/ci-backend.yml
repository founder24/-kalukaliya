name: CI Backend — Lint & Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sed 's/ *\\$//' apps/backend/requirements.txt | grep -v '^\s*--hash' > /tmp/requirements-nohash.txt
          pip install -r /tmp/requirements-nohash.txt
          pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check apps/backend/app/

      - name: Run Bandit security scanner
        run: |
          pip install bandit
          bandit -c .bandit -r apps/backend/app/ -ll

      - name: Run MyPy type checker
        run: mypy apps/backend/app/ --ignore-missing-imports

  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sed 's/ *\\$//' apps/backend/requirements.txt | grep -v '^\s*--hash' > /tmp/requirements-nohash.txt
          pip install -r /tmp/requirements-nohash.txt

      - name: Run tests
        working-directory: apps/backend
        env:
          MONGODB_URI: mongodb://test:test@localhost:27017
          APP_ENV: test
          JWT_SECRET: test-secret-at-least-32-characters-long
        run: pytest --tb=short -q --cov=apps/backend/app --cov-report=term-missing --cov-fail-under=40
