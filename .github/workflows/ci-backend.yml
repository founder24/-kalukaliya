name: CI Backend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & Push to ACR
        run: |
          az acr build \
            --registry syrabitacr \
            --resource-group syrabit-prod \
            --image syrabit/backend:${{ github.sha }} \
            --image syrabit/backend:latest \
            --file apps/backend/Dockerfile \
            apps/backend/

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --image syrabitacr.azurecr.io/syrabit/backend:${{ github.sha }}

      - name: Health check
        run: |
          sleep 90
          FQDN=$(az containerapp show \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          curl -sf "https://${FQDN}/health" \
            && echo "Deployed and healthy at https://${FQDN}" \
            || echo "Health check failed - check logs"
