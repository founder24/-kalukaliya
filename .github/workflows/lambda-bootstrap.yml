name: lambda-bootstrap

# One-shot workflow that creates all Lambda functions, EventBridge schedules,
# and SQS event-source mappings that have never been deployed (tfstate shows
# 0 aws_lambda_function resources despite 158 other resources being live).
#
# Steps:
#   1. Build + push four ECR images (arm64) from the single sqs_consumers
#      Dockerfile — Terraform uses image_config.command to set the handler.
#   2. terraform apply targeting every Lambda resource group.
#      Local tfstate (checked into git) is the backend — no S3 needed.
#   3. Commit updated tfstate back to main.
#   4. Test Bedrock cohere.embed-multilingual-v3 (us-east-1).
#   5. If Bedrock passes: remove the EMBED_INDIC_PROVIDER kill-switch from
#      the ACA deploy workflow and push (triggers automatic ACA redeploy).
#
# Prerequisites — two one-time AWS console steps BEFORE triggering this:
#
#   STEP 1 — Fix the OIDC trust policy on the syrabit-github-deploy role:
#     Console: IAM → Roles → syrabit-github-deploy → Trust relationships
#     → Edit trust policy → replace the StringLike sub condition with:
#       "repo:founder24/-kalukaliya:ref:refs/heads/master",
#       "repo:founder24/-kalukaliya:ref:refs/heads/main",
#       "repo:founder24/-kalukaliya:ref:refs/heads/release/*",
#       "repo:founder24/-kalukaliya:environment:prod",
#       "repo:founder24/-kalukaliya:environment:staging"
#
#   STEP 2 — Add create permissions to the deploy-perms inline policy:
#     Console: IAM → Roles → syrabit-github-deploy → Permissions
#     → deploy-perms → Edit → add the JSON block from
#     infra/aws/iam-github-oidc.tf (LambdaDeploy, LambdaESM, SchedulerDeploy,
#     LogGroupCreate statements).  Full JSON in docs/infra/iam-bootstrap.md.
#
# Uses existing GitHub secret: AWS_GITHUB_DEPLOY_ROLE_ARN
# Supply-chain: every `uses:` is pinned to a 40-char SHA.

on:
  workflow_dispatch:
    inputs:
      skip_ecr_build:
        description: "Skip ECR build (images already in ECR)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Plan only — do not apply, commit, or push"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: lambda-bootstrap
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC
  contents: write   # required to commit updated tfstate

env:
  PRIMARY_REGION: ap-south-1
  SECONDARY_REGION: us-east-1
  ACCOUNT_ID: "271740379017"
  ECR_PRI: "271740379017.dkr.ecr.ap-south-1.amazonaws.com"
  ECR_SEC: "271740379017.dkr.ecr.us-east-1.amazonaws.com"
  TF_DIR: artifacts/syrabit/infra/aws
  TF_VERSION: "1.8.5"

jobs:
  bootstrap:
    name: Deploy Lambdas + verify Bedrock
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (includes local tfstate)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure AWS credentials via OIDC (ap-south-1)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          role-duration-seconds: 3600

      - name: Set up QEMU (arm64 emulation)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to ECR (ap-south-1)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ env.ACCOUNT_ID }}

      - name: Login to ECR (us-east-1)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        run: |
          aws ecr get-login-password --region "$SECONDARY_REGION" | \
            docker login --username AWS --password-stdin "$ECR_SEC"

      # ── PRE-BUILD: create bedrock-proxy ECR repo in us-east-1 ─────────────
      #
      # The bedrock-proxy Lambda runs in us-east-1 (where cohere.embed-
      # multilingual-v3 is available). Lambda can only pull from same-region
      # ECR, so the repo must exist before we push the image.
      #
      # Strategy (two-role bootstrap):
      #
      #   Phase A — update syrabit-github-deploy's IAM policy via Terraform
      #             running as github-deploy (which may have iam:PutRolePolicy).
      #             This adds ecr:CreateRepository to syrabit-github-deploy.
      #
      #   Phase B — assume syrabit-github-deploy (trusted for this repo via
      #             OIDC tfvars github_owner=founder24, github_repo=-kalukaliya)
      #             and create the ECR repo via terraform apply -target.
      #
      #   Phase C — restore github-deploy credentials for the Docker push
      #             (github-deploy has ECRPowerUser → can push to existing repos).

      - name: Install Terraform ${{ env.TF_VERSION }} (pre-build ECR bootstrap)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        run: |
          TF_ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sLo /tmp/tf.zip \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_${TF_ARCH}.zip"
          unzip -oq /tmp/tf.zip -d /tmp/tf-bin/
          sudo mv /tmp/tf-bin/terraform /usr/local/bin/terraform
          terraform version

      - name: Terraform init (pre-build)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      # Phase A: try to update syrabit-github-deploy's inline policy so it
      # gains ecr:CreateRepository.  We use continue-on-error here because
      # github-deploy may lack iam:PutRolePolicy; if this fails we still
      # attempt Phase B (it will fail there if permissions never got updated,
      # but the error will be clearly identified).
      #
      # -refresh=false skips the Terraform state-refresh phase which would
      # call iam:GetOpenIDConnectProvider on the OIDC provider in state.
      # github-deploy has ECRPowerUser + LambdaFullAccess but NOT
      # iam:GetOpenIDConnectProvider, so without -refresh=false the plan
      # step fails before we can even attempt the IAM apply.
      # The OIDC provider hasn't changed so stale state is safe here.
      - name: "Phase A: update syrabit-github-deploy IAM policy (github-deploy)"
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true
        run: |
          terraform apply -auto-approve -input=false -refresh=false \
            -target=aws_iam_role_policy.github_deploy
          echo "IAM policy update applied"

      # Phase B: switch to syrabit-github-deploy (trusted for founder24/-kalukaliya
      # via OIDC tfvars) and create the bedrock-proxy ECR repo in us-east-1.
      - name: "Phase B: assume syrabit-github-deploy via OIDC"
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/syrabit-github-deploy
          aws-region: ${{ env.PRIMARY_REGION }}
          role-duration-seconds: 3600

      - name: "Phase B: ensure bedrock-proxy ECR repo exists in us-east-1 (CLI, idempotent)"
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        run: |
          # Use CLI directly — avoids Terraform data-source resolution errors
          # (e.g. aws_secretsmanager_secret) that fire during plan/import and
          # have nothing to do with ECR.  The repo was created manually on
          # 2026-05-14; this step is purely idempotent from here on.
          aws ecr describe-repositories             --region "$SECONDARY_REGION"             --repository-names syrabit/bedrock-proxy             --query 'repositories[0].repositoryArn'             --output text 2>/dev/null           && echo "Repo already exists — skipping create"           || aws ecr create-repository                --region "$SECONDARY_REGION"                --repository-name syrabit/bedrock-proxy                --image-tag-mutability MUTABLE                --image-scanning-configuration scanOnPush=true                --encryption-configuration encryptionType=AES256

          # Lifecycle policy: keep last 5 images per repo.
          aws ecr put-lifecycle-policy             --region "$SECONDARY_REGION"             --repository-name syrabit/bedrock-proxy             --lifecycle-policy-text               '{"rules":[{"rulePriority":1,"description":"keep-last-5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'           || echo "Lifecycle policy skipped (ecr:PutLifecyclePolicy not yet granted — non-fatal)"

          echo "ECR syrabit/bedrock-proxy ready in $SECONDARY_REGION"

      # Login to us-east-1 ECR while we're running as syrabit-github-deploy
      # (ECR token is stored in Docker config for 12 h; the github-deploy
      # restore below does not invalidate it).
      - name: "Phase B: Login to ECR us-east-1 (syrabit-github-deploy)"
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        run: |
          aws ecr get-login-password --region "$SECONDARY_REGION" | \
            docker login --username AWS --password-stdin "$ECR_SEC"

      # Phase C: restore github-deploy for the Docker push (ECRPowerUser lets
      # it push to already-existing repos in both regions).
      - name: "Phase C: restore github-deploy credentials"
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.PRIMARY_REGION }}
          role-duration-seconds: 3600

      # Pre-download arm64 wheels on the NATIVE x86_64 runner (no QEMU).
      # When pip runs inside QEMU-emulated arm64, it fails to identify the
      # container as manylinux-compatible and falls back to source tarballs,
      # which then fail to compile because the minimal Lambda base image has
      # no gcc.  Running pip download here with explicit --platform flags
      # fetches the correct manylinux_2_17_aarch64 wheels natively; they
      # are injected into the Docker build context at .build/arm64-wheels/
      # so the Dockerfile can install them with --find-links (no compilation).
      - name: Pre-download arm64 Python wheels (native, no QEMU)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        run: |
          mkdir -p .build/arm64-wheels
          REQS="artifacts/syrabit-backend/requirements.txt"

          # Use requirements-lambda.txt (= requirements.txt minus pywebpush +
          # py-vapid).  Those two packages transitively require http-ece which
          # has no binary wheel for Python 3.11, causing --only-binary=:all:
          # to fail.  Lambda functions never send web-push notifications so
          # excluding them is safe.
          # --only-binary=:all: is required by pip when --platform is set and
          # --no-deps is not set; all remaining packages have manylinux arm64
          # binary wheels so this succeeds.
          REQS="artifacts/syrabit-backend/requirements-lambda.txt"

          echo "=== Downloading arm64 binary wheels ==="
          pip3 download \
            --platform manylinux_2_17_aarch64 \
            --platform manylinux_2_28_aarch64 \
            --python-version 311 \
            --implementation cp \
            --only-binary=:all: \
            -r "$REQS" \
            --dest .build/arm64-wheels/

          echo "=== Cache: $(ls .build/arm64-wheels/ | wc -l) files, $(du -sh .build/arm64-wheels/ | cut -f1) ==="

      - name: Build + push ECR images (arm64, all four targets)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: artifacts/syrabit/services/backend/sqs_consumers/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_PRI }}/syrabit/queue-fanout:sqs-consumers-latest
            ${{ env.ECR_PRI }}/syrabit/email-worker:latest
            ${{ env.ECR_PRI }}/syrabit/health-prober:latest
            ${{ env.ECR_SEC }}/syrabit/bedrock-proxy:latest
          cache-from: type=gha,scope=sqs-consumers
          cache-to: type=gha,scope=sqs-consumers,mode=max

      - name: Install Terraform ${{ env.TF_VERSION }} (skip if pre-build already installed)
        run: |
          if command -v terraform &>/dev/null && terraform version | grep -q "${TF_VERSION}"; then
            echo "Terraform ${TF_VERSION} already installed — skipping"
          else
            TF_ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
            curl -sLo /tmp/tf.zip \
              "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_${TF_ARCH}.zip"
            unzip -oq /tmp/tf.zip -d /tmp/tf-bin/
            sudo mv /tmp/tf-bin/terraform /usr/local/bin/terraform
          fi
          terraform version

      - name: Terraform init (idempotent — skips if pre-build already ran)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false


      - name: Import existing CloudWatch log groups into state (idempotent)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          # These log groups were auto-created by Lambda on first invocation.
          # Terraform would fail with ResourceAlreadyExistsException without import.
          for LG in "materialize-chapter-faqs" "seo-baseline" "prewarm-seo-routes"; do
            terraform import -input=false               "aws_cloudwatch_log_group.batch_job[\"${LG}\"]"               "/aws/lambda/syrabit-${LG}" 2>&1               | grep -v "already managed\|No changes" || true
          done

      - name: Terraform plan (Lambda + EventBridge + event-source mappings)
        working-directory: ${{ env.TF_DIR }}
        run: |
          # -refresh=false: github-deploy lacks the read permissions needed
          # to refresh every data source in state (secretsmanager:DescribeSecret,
          # sqs:GetQueueAttributes, bedrock:GetGuardrail, ses:DescribeConfigurationSet,
          # ec2:DescribeVpcAttribute).  These data sources belong to resources NOT
          # being targeted here; skipping refresh is safe for a targeted create-only
          # bootstrap run.
          terraform plan -input=false -refresh=false \
            -target=aws_lambda_function.batch_job \
            -target=aws_lambda_function.sqs_consumer \
            -target=aws_lambda_function.s3_to_r2_sync \
            -target=aws_lambda_function.reembed_consumer \
            -target=aws_lambda_function.bedrock_proxy \
            -target=aws_lambda_function.email_worker \
            -target=aws_lambda_function.explore_credit_hello \
            -target=aws_scheduler_schedule.batch_job \
            -target=aws_scheduler_schedule.s3_to_r2_nightly \
            -target=aws_lambda_event_source_mapping.sqs_consumer \
            -target=aws_lambda_event_source_mapping.ses_retry_queue \
            -target=aws_lambda_event_source_mapping.reembed \
            -target=aws_cloudwatch_log_group.batch_job \
            -target=aws_iam_role.explore_credit_hello \
            -out=/tmp/lambda-plan.out

      - name: Terraform apply
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve /tmp/lambda-plan.out

      - name: Commit updated tfstate to main
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/syrabit/infra/aws/terraform.tfstate \
            artifacts/syrabit/infra/aws/terraform.tfstate.backup
          if git diff --cached --quiet; then
            echo "tfstate unchanged — nothing to commit"
          else
            git commit -m "chore(infra): tfstate after Lambda bootstrap [skip ci] run=${{ github.run_id }}"
            git push
          fi

      - name: Verify Lambda functions created
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "=== ap-south-1 ==="
          aws lambda list-functions --region ap-south-1 \
            --query 'Functions[?starts_with(FunctionName,`syrabit-`)].[FunctionName,State]' \
            --output table

          echo "=== us-east-1 (bedrock-proxy) ==="
          aws lambda list-functions --region us-east-1 \
            --query 'Functions[?starts_with(FunctionName,`syrabit-`)].[FunctionName,State]' \
            --output table

          echo "=== EventBridge schedules ==="
          aws scheduler list-schedules --region ap-south-1 \
            --name-prefix syrabit \
            --query 'Schedules[*].[Name,State]' \
            --output table 2>/dev/null || echo "(none found)"

      - name: Test Bedrock cohere.embed-multilingual-v3 (us-east-1)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: bedrock
        run: |
          BODY=$(python3 -c "
          import json, base64
          p = {'texts': ['তোমার নাম কি?'], 'input_type': 'search_document', 'truncate': 'NONE'}
          print(base64.b64encode(json.dumps(p).encode()).decode())
          ")
          if aws bedrock-runtime invoke-model \
               --region us-east-1 \
               --model-id cohere.embed-multilingual-v3 \
               --content-type application/json \
               --accept application/json \
               --body "$BODY" \
               /tmp/bedrock-out.json 2>/tmp/bedrock-err.txt; then
            DIMS=$(python3 -c "
          import json
          d = json.load(open('/tmp/bedrock-out.json'))
          print(len(d.get('embeddings', [[]])[0]))
          " 2>/dev/null || echo "?")
            echo "bedrock_ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Bedrock Cohere ACTIVE — vector dims=${DIMS} (expected 1024)"
          else
            ERR=$(cat /tmp/bedrock-err.txt 2>/dev/null | head -2)
            echo "bedrock_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bedrock not accessible: ${ERR}"
            echo "::warning::Visit https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/model-access and enable Cohere Embed Multilingual, then re-run"
          fi

      - name: Revert EMBED_INDIC_PROVIDER kill-switch (Bedrock confirmed)
        if: >-
          ${{ steps.bedrock.outputs.bedrock_ok == 'true' &&
              github.event.inputs.dry_run != 'true' }}
        run: |
          WF="$GITHUB_WORKSPACE/.github/workflows/azure-container-apps-deploy.yml"
          if grep -q 'EMBED_INDIC_PROVIDER' "$WF"; then
            grep -v '"EMBED_INDIC_PROVIDER"' "$WF" > /tmp/wf-updated.yml
            mv /tmp/wf-updated.yml "$WF"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$WF"
            git commit -m "fix(embed): revert EMBED_INDIC_PROVIDER kill-switch — Bedrock confirmed run=${{ github.run_id }}"
            git push
            echo "::notice::Kill-switch removed — ACA redeploy triggered automatically"
          else
            echo "Kill-switch already absent — nothing to revert"
          fi
