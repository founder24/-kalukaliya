name: lambda-bootstrap

# One-shot workflow that creates all Lambda functions, EventBridge schedules,
# and SQS event-source mappings that have never been deployed (tfstate shows
# 0 aws_lambda_function resources despite 158 other resources being live).
#
# Steps:
#   1. Build + push four ECR images (arm64) from the single sqs_consumers
#      Dockerfile — Terraform uses image_config.command to set the handler.
#   2. terraform apply targeting every Lambda resource group.
#      Local tfstate (checked into git) is the backend — no S3 needed.
#   3. Commit updated tfstate back to main.
#   4. Test Bedrock cohere.embed-multilingual-v3 (us-east-1).
#   5. If Bedrock passes: remove the EMBED_INDIC_PROVIDER kill-switch from
#      the ACA deploy workflow and push (triggers automatic ACA redeploy).
#
# Uses existing repo secrets: AWS_OPS_ACCESS_KEY_ID, AWS_OPS_SECRET_ACCESS_KEY
# (AWS_ACCESS_KEY_ID belongs to BedrockAPIKey-cgjb which has no ECR/Lambda perms)
# Supply-chain: every `uses:` is pinned to a 40-char SHA.

on:
  workflow_dispatch:
    inputs:
      skip_ecr_build:
        description: "Skip ECR build (images already in ECR)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Plan only — do not apply, commit, or push"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: lambda-bootstrap
  cancel-in-progress: false

permissions:
  contents: write

env:
  PRIMARY_REGION: ap-south-1
  SECONDARY_REGION: us-east-1
  ACCOUNT_ID: "271740379017"
  ECR_PRI: "271740379017.dkr.ecr.ap-south-1.amazonaws.com"
  ECR_SEC: "271740379017.dkr.ecr.us-east-1.amazonaws.com"
  TF_DIR: artifacts/syrabit/infra/aws
  TF_VERSION: "1.8.5"

jobs:
  bootstrap:
    name: Deploy Lambdas + verify Bedrock
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (includes local tfstate)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure AWS credentials (ap-south-1)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_OPS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_OPS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.PRIMARY_REGION }}

      - name: Set up QEMU (arm64 emulation)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to ECR (ap-south-1)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ env.ACCOUNT_ID }}

      - name: Login to ECR (us-east-1)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        run: |
          aws ecr get-login-password --region "$SECONDARY_REGION" | \
            docker login --username AWS --password-stdin "$ECR_SEC"

      - name: Build + push ECR images (arm64, all four targets)
        if: ${{ github.event.inputs.skip_ecr_build != 'true' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: artifacts/syrabit/services/backend/sqs_consumers/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_PRI }}/syrabit/queue-fanout:sqs-consumers-latest
            ${{ env.ECR_PRI }}/syrabit/email-worker:latest
            ${{ env.ECR_PRI }}/syrabit/health-prober:latest
            ${{ env.ECR_SEC }}/syrabit/bedrock-proxy:latest
          cache-from: type=gha,scope=sqs-consumers
          cache-to: type=gha,scope=sqs-consumers,mode=max

      - name: Install Terraform ${{ env.TF_VERSION }}
        run: |
          TF_ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sLo /tmp/tf.zip \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_${TF_ARCH}.zip"
          unzip -oq /tmp/tf.zip -d /tmp/tf-bin/
          sudo mv /tmp/tf-bin/terraform /usr/local/bin/terraform
          terraform version

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform plan (Lambda + EventBridge + event-source mappings)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false \
            -target=aws_lambda_function.batch_job \
            -target=aws_lambda_function.sqs_consumer \
            -target=aws_lambda_function.s3_to_r2_sync \
            -target=aws_lambda_function.reembed_consumer \
            -target=aws_lambda_function.bedrock_proxy \
            -target=aws_lambda_function.email_worker \
            -target=aws_lambda_function.explore_credit_hello \
            -target=aws_scheduler_schedule.batch_job \
            -target=aws_scheduler_schedule.s3_to_r2_nightly \
            -target=aws_lambda_event_source_mapping.sqs_consumer \
            -target=aws_lambda_event_source_mapping.ses_retry_queue \
            -target=aws_lambda_event_source_mapping.reembed \
            -out=/tmp/lambda-plan.out

      - name: Terraform apply
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve /tmp/lambda-plan.out

      - name: Commit updated tfstate to main
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/syrabit/infra/aws/terraform.tfstate \
            artifacts/syrabit/infra/aws/terraform.tfstate.backup
          if git diff --cached --quiet; then
            echo "tfstate unchanged — nothing to commit"
          else
            MSG="chore(infra): tfstate after Lambda bootstrap apply [skip ci] run=${{ github.run_id }}"
            git commit -m "$MSG"
            git push
          fi

      - name: Verify Lambda functions created
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "=== ap-south-1 ==="
          aws lambda list-functions --region ap-south-1 \
            --query 'Functions[?starts_with(FunctionName,`syrabit-`)].[FunctionName,State]' \
            --output table

          echo "=== us-east-1 (bedrock-proxy) ==="
          aws lambda list-functions --region us-east-1 \
            --query 'Functions[?starts_with(FunctionName,`syrabit-`)].[FunctionName,State]' \
            --output table

          echo "=== EventBridge schedules ==="
          aws scheduler list-schedules --region ap-south-1 \
            --name-prefix syrabit \
            --query 'Schedules[*].[Name,State]' \
            --output table 2>/dev/null || echo "(no schedules or not yet active)"

      - name: Test Bedrock cohere.embed-multilingual-v3 (us-east-1)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: bedrock
        run: |
          BODY=$(python3 -c "
          import json, base64
          p = {'texts': ['তোমার নাম কি?'], 'input_type': 'search_document', 'truncate': 'NONE'}
          print(base64.b64encode(json.dumps(p).encode()).decode())
          ")
          if aws bedrock-runtime invoke-model \
               --region us-east-1 \
               --model-id cohere.embed-multilingual-v3 \
               --content-type application/json \
               --accept application/json \
               --body "$BODY" \
               /tmp/bedrock-out.json 2>/tmp/bedrock-err.txt; then
            DIMS=$(python3 -c "
          import json
          d = json.load(open('/tmp/bedrock-out.json'))
          print(len(d.get('embeddings', [[]])[0]))
          " 2>/dev/null || echo "?")
            echo "bedrock_ok=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Bedrock Cohere ACTIVE — vector dims=${DIMS} (expected 1024)"
          else
            ERR=$(cat /tmp/bedrock-err.txt 2>/dev/null | head -2)
            echo "bedrock_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bedrock not accessible: ${ERR}"
            echo "::warning::Visit https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/model-access → Manage model access → enable Cohere Embed Multilingual → Submit, then re-run"
          fi

      - name: Revert EMBED_INDIC_PROVIDER kill-switch (Bedrock confirmed)
        if: >-
          ${{ steps.bedrock.outputs.bedrock_ok == 'true' &&
              github.event.inputs.dry_run != 'true' }}
        run: |
          WF="$GITHUB_WORKSPACE/.github/workflows/azure-container-apps-deploy.yml"
          if grep -q 'EMBED_INDIC_PROVIDER' "$WF"; then
            grep -v '"EMBED_INDIC_PROVIDER"' "$WF" > /tmp/wf-updated.yml
            mv /tmp/wf-updated.yml "$WF"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$WF"
            MSG="fix(embed): revert EMBED_INDIC_PROVIDER kill-switch — Bedrock confirmed run=${{ github.run_id }}"
            git commit -m "$MSG"
            git push
            echo "::notice::Kill-switch removed — ACA redeploy triggered automatically"
          else
            echo "Kill-switch already absent — nothing to revert"
          fi
