name: PR Lockfile Refresh + Frontend Build Verification

# This workflow runs on PRs that touch package manifests or the lockfile.
# It regenerates pnpm-lock.yaml against the latest registry data, builds the
# frontend to verify the upgrade is clean, and pushes the refreshed lockfile
# back to the PR branch when it changes.
#
# NOTE: GitHub's Actions tab may show "Failure" entries for this workflow on
# push-to-main commits. Those are cosmetic — the workflow only actually
# executes on pull_request events. The "failures" are GitHub evaluating the
# workflow file and finding the event doesn't match (no actual job runs).

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'apps/**/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pr-lockfile-refresh.yml'

permissions:
  contents: write
  pull-requests: write

env:
  # Opt into Node.js 24 early to avoid deprecation warnings (Node 20 EOL: Sep 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh-and-build:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.26.1 --activate

      - name: pnpm version
        run: pnpm --version

      - name: Install (regenerate lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Show resolved versions for vite / esbuild / ws
        run: |
          echo "::group::vite"
          pnpm --filter syrabit-frontend why vite || true
          echo "::endgroup::"
          echo "::group::esbuild"
          pnpm why -r esbuild || true
          echo "::endgroup::"
          echo "::group::ws"
          pnpm why -r ws || true
          echo "::endgroup::"

      - name: Build frontend
        run: pnpm --filter syrabit-frontend run build

      - name: Commit refreshed lockfile if changed
        run: |
          if [[ -n "$(git status --porcelain pnpm-lock.yaml)" ]]; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add pnpm-lock.yaml
            git commit -m "chore: regenerate pnpm-lock.yaml after security upgrades

          Auto-committed by pr-lockfile-refresh workflow against the registry
          versions resolved on this CI run."
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "pnpm-lock.yaml is already up to date with the new constraints."
          fi
