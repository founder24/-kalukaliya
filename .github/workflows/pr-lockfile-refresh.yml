name: PR Lockfile Refresh + Frontend Build Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'apps/**/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pr-lockfile-refresh.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-and-build:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@10.26.1 --activate

      - name: pnpm version
        run: pnpm --version

      - name: Install (regenerate lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Show resolved versions for vite / esbuild / ws
        run: |
          echo "::group::vite"
          pnpm --filter @workspace/syrabit why vite || true
          echo "::endgroup::"
          echo "::group::esbuild"
          pnpm why -r esbuild || true
          echo "::endgroup::"
          echo "::group::ws"
          pnpm why -r ws || true
          echo "::endgroup::"

      - name: Build frontend
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: https://api.syrabit.ai
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Commit refreshed lockfile if changed
        run: |
          if [[ -n "$(git status --porcelain pnpm-lock.yaml)" ]]; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add pnpm-lock.yaml
            git commit -m "chore: regenerate pnpm-lock.yaml"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "pnpm-lock.yaml is already up to date with the new constraints."
          fi
