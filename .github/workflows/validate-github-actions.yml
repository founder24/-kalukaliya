name: Validate GitHub Actions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-github-actions.sh'
      - 'scripts/check-edge-workflow-triggers.py'
      - 'scripts/test-edge-workflow-triggers.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-github-actions.sh'
      - 'scripts/check-edge-workflow-triggers.py'
      - 'scripts/test-edge-workflow-triggers.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Check workflow syntax and semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow files
        run: bash scripts/check-github-actions.sh