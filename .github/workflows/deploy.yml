name: Deploy — Backend + Edge + Frontend

# =============================================================================
# Triggers
# =============================================================================
on:
  push:
    branches: [main]
    tags:
      - 'release/*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      skip_dep_check:
        description: 'Skip dependency sync check (emergency deploy only)'
        required: false
        default: 'false'
        type: boolean
      backend_only:
        description: 'Deploy backend only (skip edge + frontend)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dep-check:
    name: Dependency Gate
    if: ${{ github.event.inputs.skip_dep_check != 'true' }}
    uses: ./.github/workflows/ci-deps.yml

  deploy-backend:
    name: Deploy Backend (Docker → Artifact Registry → Cloud Run)
    runs-on: ubuntu-latest
    needs: [dep-check]
    if: always() && (needs.dep-check.result == 'success' || needs.dep-check.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    outputs:
      service_url: ${{ steps.get-url.outputs.service_url }}
    env:
      IMAGE: asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:${{ github.sha }}
      PROJECT: blissful-acumen-495019-t6
      REGION: asia-south1
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Service Account Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE" \
            -f apps/backend/Dockerfile \
            apps/backend

      - name: Push to Artifact Registry
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy syrabit-backend \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT" \
            --port=8000 \
            --allow-unauthenticated \
            --min-instances=1 \
            --service-account=syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com \
            --update-env-vars=APP_ENV=production,JWT_ALGORITHM=HS256,SARVAM_MODEL=sarvam-30b,VERTEX_PROJECT_ID=blissful-acumen-495019-t6,VERTEX_LOCATION=asia-south1,TRUST_EDGE_AUTH=true \
            --remove-env-vars=VERTEX_SEARCH_DATASTORE_ID,VERTEX_SEARCH_LOCATION,VERTEX_SEARCH_SERVING_CONFIG \
            --update-secrets=MONGODB_URI=mongodb-uri:latest,JWT_SECRET=jwt-secret:latest,EDGE_SHARED_SECRET=edge-shared-secret:latest,ADMIN_JWT_SECRET=admin-jwt-secret:latest,GOOGLE_APPLICATION_CREDENTIALS_JSON=GOOGLE_APPLICATION_CREDENTIALS_JSON:latest,SARVAM_API_KEY=sarvam-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,RAZORPAY_KEY_ID=razorpay-key-id:latest,RAZORPAY_KEY_SECRET=razorpay-key-secret:latest,RAZORPAY_WEBHOOK_SECRET=razorpay-webhook-secret:latest,RESEND_API_KEY=resend-api-key:latest,RESET_TOKEN_SECRET=reset-token-secret:latest,JWT_PRIVATE_KEY=jwt-private-key:latest,JWT_PUBLIC_KEY=jwt-public-key:latest,TRANSLATE_CRON_SECRET=translate-cron-secret:latest\
            --remove-secrets=CF_PAGES_DEPLOY_HOOK,CF_ACCOUNT_ID,CLOUDFLARE_ACCOUNT_ID,CLOUDFLARE_KV_API_TOKEN,CLOUDFLARE_KV_NAMESPACE_ID,GCS_CONTENT_BUCKET,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN

      - name: Attach optional secrets (guarded — skips if secret missing in SM)
        run: |
          _check() {
            local env_var="$1"
            local secret_name="$2"
            if gcloud secrets describe "$secret_name" \
                --project="$PROJECT" --quiet 2>/dev/null; then
              UPDATES="${UPDATES:+${UPDATES},}${env_var}=${secret_name}:latest"
            else
              echo "  ⚠ $secret_name not found in Secret Manager — will remove ref if present"
              REMOVALS="${REMOVALS:+${REMOVALS},}${env_var}"
            fi
          }

          UPDATES=""
          REMOVALS=""

          _check POSTHOG_API_KEY             posthog-api-key
          _check INDEXNOW_API_KEY            indexnow-api-key
          _check INDEXNOW_INTERNAL_SECRET    indexnow-internal-secret
          _check VERTEX_SEARCH_DATASTORE_ID  VERTEX_SEARCH_DATASTORE_ID
          _check SENTRY_DSN                  SENTRY_DSN
          _check CF_ACCOUNT_ID               CF_ACCOUNT_ID
          _check CLOUDFLARE_ACCOUNT_ID        CF_ACCOUNT_ID
          _check CLOUDFLARE_KV_API_TOKEN      CF_KV_API_TOKEN
          _check CLOUDFLARE_KV_NAMESPACE_ID   CF_KV_NAMESPACE_ID
          _check GCS_CONTENT_BUCKET           GCS_CONTENT_BUCKET
          _check CF_PAGES_DEPLOY_HOOK         CF_PAGES_DEPLOY_HOOK
          _check ADMIN_EMAIL                  ADMIN_EMAIL
          _check ADMIN_PASSWORD               ADMIN_PASSWORD

          if [[ -n "$UPDATES" ]]; then
            echo "Attaching optional secrets: $UPDATES"
            gcloud run services update syrabit-backend \
              --region="$REGION" \
              --project="$PROJECT" \
              --update-secrets="$UPDATES"
          fi

          if [[ -n "$REMOVALS" ]]; then
            echo "Removing stale optional secret refs: $REMOVALS"
            gcloud run services update syrabit-backend \
              --region="$REGION" \
              --project="$PROJECT" \
              --remove-secrets="$REMOVALS" || true
          fi

      - name: Get Cloud Run service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe syrabit-backend \
            --region "$REGION" \
            --project "$PROJECT" \
            --format "value(status.url)")
          echo "service_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Cloud Run URL: ${URL}"

      - name: Wait for healthy revision (up to 3 min)
        run: |
          SERVICE_URL="${{ steps.get-url.outputs.service_url }}"
          echo "Polling ${SERVICE_URL}/api/v1/health ..."
          for i in $(seq 1 36); do
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" \
              "${SERVICE_URL}/api/v1/health" --max-time 8 2>/dev/null || echo "000")
            if [[ "$HTTP" == "200" ]]; then
              echo "✔ Backend healthy after $((i * 5))s (HTTP 200)"
              exit 0
            fi
            echo "  Attempt ${i}/36 — HTTP ${HTTP}, retrying in 5s..."
            sleep 5
          done
          echo "✘ Backend failed health check after 180s"
          exit 1

      - name: Prewarm CONTENT_KV (non-blocking)
        run: |
          SERVICE_URL="${{ steps.get-url.outputs.service_url }}"
          SECRET=$(gcloud secrets versions access latest \
            --secret="translate-cron-secret" \
            --project="$PROJECT" 2>/dev/null || echo "")
          if [[ -z "$SECRET" ]]; then
            echo "⚠ translate-cron-secret not found in SM — skipping KV prewarm"
            exit 0
          fi
          echo "Starting CONTENT_KV prewarm (batch push rendered HTML)..."
          HTTP=$(curl -sf -o /tmp/kv_prewarm.json -w "%{http_code}" \
            -X POST "${SERVICE_URL}/api/v1/admin/content/kv-prewarm" \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 300 2>/dev/null || echo "000")
          echo "KV prewarm HTTP: ${HTTP}"
          if [[ -f /tmp/kv_prewarm.json ]]; then
            cat /tmp/kv_prewarm.json
          fi
          if [[ "$HTTP" == "200" ]]; then
            echo "✔ CONTENT_KV prewarm complete"
          else
            echo "⚠ KV prewarm returned HTTP ${HTTP} — non-blocking, continuing deploy"
          fi

  deploy-edge:
    name: Deploy Edge (Cloudflare Worker)
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: |
      always() &&
      github.event.inputs.backend_only != 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Guard — reject sentinel KV namespace IDs
        run: |
          if grep -v '^\s*#' apps/edge/wrangler.toml | grep -qi 'REPLACE_ME'; then
            echo "::error::wrangler.toml still contains REPLACE_ME KV namespace IDs."
            echo "Run: npx wrangler kv:namespace create ISR_CACHE_KV"
            exit 1
          fi
          echo "KV namespace IDs look configured."

      - name: Deploy Worker
        run: pnpm --filter syrabit-edge exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Sync secrets → CF Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BACKEND_SERVICE_URL: ${{ needs.deploy-backend.outputs.service_url }}
        run: |
          PROJECT=blissful-acumen-495019-t6
          WORKER_NAME=syrabitworker-prod
          CF_API=https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/workers/scripts/${WORKER_NAME}/secrets

          # Helper: sync a GCP Secret Manager secret → CF Worker secret
          sync_gcp_secret() {
            local GCP_NAME="$1"
            local CF_VAR="$2"
            local VAL
            VAL=$(gcloud secrets versions access latest \
              --secret="$GCP_NAME" --project="$PROJECT" 2>/dev/null) || {
              echo "⚠  GCP secret '$GCP_NAME' not found — skipping $CF_VAR"
              return 0
            }
            printf '%s' "$VAL" | \
              pnpm --filter syrabit-edge exec wrangler secret put "$CF_VAR" --env production
            echo "✅ $CF_VAR synced from GCP Secret Manager"
          }

          # Helper: set a CF Worker secret directly from a value
          set_cf_secret() {
            local CF_VAR="$1"
            local VAL="$2"
            curl -sf -X PUT "$CF_API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${CF_VAR}\",\"text\":\"${VAL}\",\"type\":\"secret_text\"}" \
              | grep -q '"success":true' && echo "✅ $CF_VAR set on CF Worker" \
              || echo "✘ Failed to set $CF_VAR"
          }

          # Sync auth secrets from GCP Secret Manager
          sync_gcp_secret "jwt-secret"                        "JWT_SECRET"
          sync_gcp_secret "edge-shared-secret"                "EDGE_SHARED_SECRET"
          # Sync SA key so the edge worker can obtain OIDC tokens for /health/full
          sync_gcp_secret "GOOGLE_APPLICATION_CREDENTIALS_JSON" "GOOGLE_SA_KEY"

          # Auto-sync BACKEND_URL from Cloud Run output (keeps CF Worker always current)
          if [[ -n "$BACKEND_SERVICE_URL" ]]; then
            set_cf_secret "BACKEND_URL" "$BACKEND_SERVICE_URL"
          else
            # Fallback: read live URL from gcloud in case job output unavailable
            FALLBACK_URL=$(gcloud run services describe syrabit-backend \
              --region=asia-south1 --project="$PROJECT" \
              --format="value(status.url)" 2>/dev/null)
            if [[ -n "$FALLBACK_URL" ]]; then
              set_cf_secret "BACKEND_URL" "$FALLBACK_URL"
            else
              echo "⚠  Could not determine Cloud Run URL — BACKEND_URL not updated"
            fi
          fi

  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    if: github.event.inputs.backend_only != 'true'
    env:
      INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://api.syrabit.ai' }}

      - name: Deploy to Cloudflare Pages
        run: |
          cd apps/edge
          pnpm exec wrangler pages deploy ../frontend/dist --project-name=syrabitfrontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Submit URLs to IndexNow
        if: ${{ env.INDEXNOW_SECRET != '' }}
        run: node apps/frontend/scripts/indexnow-submit.mjs
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-edge, deploy-frontend]
    if: |
      always() &&
      needs.deploy-backend.result == 'success' &&
      (needs.deploy-edge.result == 'success' || needs.deploy-edge.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    steps:
      - name: Edge health + backend reachability (api.syrabit.ai)
        run: |
          REACHABLE="false"
          HTTP="000"
          for attempt in 1 2 3 4 5; do
            HTTP=$(curl -s -o /tmp/edge-health.json -w "%{http_code}" \
              "https://api.syrabit.ai/health" --max-time 15 2>/dev/null || echo "000")
            REACHABLE=$(python3 -c "import json,sys;d=json.load(open('/tmp/edge-health.json'));print(str(d.get('backend_reachable',False)).lower())" 2>/dev/null || echo "false")
            echo "  Attempt ${attempt}/5 — HTTP ${HTTP}, backend_reachable=${REACHABLE}"
            if [[ "$HTTP" == "200" && "$REACHABLE" == "true" ]]; then
              echo "✔ Edge healthy, backend reachable"
              exit 0
            fi
            [[ "$attempt" -lt 5 ]] && sleep 15
          done
          echo "✘ Edge health check failed after 5 attempts"
          if [[ "$HTTP" == "200" && "$REACHABLE" != "true" ]]; then
            echo "::error title=Backend unreachable via edge::Edge is up but backend_reachable=false. BACKEND_URL may be stale."
          fi
          exit 1
