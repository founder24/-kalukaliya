name: Deploy — Cloudflare Native

# This is the only push/tag production entrypoint. The complete release
# implementation lives in deploy-cloudflare.yml and is called below so manual
# and automatic releases cannot drift. Cloud Run, Azure Container Apps, and
# apps/backend are local/offline tooling only and cannot be deployed here.
on:
  push:
    branches: [main]
    tags:
      - 'release/*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      skip_dep_check:
        description: 'Skip dependency sync check (emergency deploy only)'
        required: false
        default: false
        type: boolean
      validate_authenticated:
        description: 'Require disposable authenticated API checks after deployment'
        required: false
        default: false
        type: boolean
      validate_reset_delivery:
        description: 'Require a fresh disposable password-reset email proof after deployment'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dep-check:
    name: Dependency Gate
    if: ${{ inputs.skip_dep_check != true }}
    uses: ./.github/workflows/ci-deps.yml

  cloudflare-release:
    name: Cloudflare Native Release
    needs: dep-check
    # Reusable-workflow jobs can fail to materialize when push events pass the
    # absent workflow_dispatch inputs through as empty strings. Coerce both
    # values to real booleans and run after either a completed or intentionally
    # skipped dependency gate.
    if: ${{ !cancelled() && (needs.dep-check.result == 'success' || needs.dep-check.result == 'skipped') }}
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      validate_authenticated: ${{ inputs.validate_authenticated == true }}
      validate_reset_delivery: ${{ inputs.validate_reset_delivery == true }}
    secrets: inherit