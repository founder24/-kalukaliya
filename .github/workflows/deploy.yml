name: Deploy — Backend + Edge + Frontend

# =============================================================================
# Triggers
# =============================================================================
# • push to main        — every merged PR deploys automatically
# • release/* tags      — e.g. `git tag release/1.2.3 && git push --tags`
# • v* tags             — e.g. `git tag v1.2.3 && git push --tags`
# • workflow_dispatch   — manual trigger from GitHub Actions UI
# =============================================================================
on:
  push:
    branches: [main]
    tags:
      - 'release/*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      skip_dep_check:
        description: 'Skip dependency sync check (emergency deploy only)'
        required: false
        default: 'false'
        type: boolean
      backend_only:
        description: 'Deploy backend only (skip edge + frontend)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only one deploy at a time per ref. Never cancel in progress — let it finish.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# =============================================================================
# JOB 0: Dependency gate — must pass before any deployment starts
# =============================================================================
jobs:
  dep-check:
    name: Dependency Gate
    if: ${{ github.event.inputs.skip_dep_check != 'true' }}
    uses: ./.github/workflows/ci-deps.yml

  # =============================================================================
  # JOB 1: Backend — Cloud Build (pre-flight → docker build → push → Cloud Run)
  # =============================================================================
  deploy-backend:
    name: Deploy Backend (Docker → Artifact Registry → Cloud Run)
    runs-on: ubuntu-latest
    needs: [dep-check]
    # Run even when dep-check is skipped (skip_dep_check=true bypasses the job,
    # which makes needs[] treat it as "skipped" — always() lets us continue)
    if: always() && (needs.dep-check.result == 'success' || needs.dep-check.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    outputs:
      service_url: ${{ steps.get-url.outputs.service_url }}
    env:
      IMAGE: asia-south1-docker.pkg.dev/blissful-acumen-495019-t6/syrabit/backend:${{ github.sha }}
      PROJECT: blissful-acumen-495019-t6
      REGION: asia-south1
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Service Account Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE" \
            -f apps/backend/Dockerfile \
            apps/backend

      - name: Push to Artifact Registry
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy syrabit-backend \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT" \
            --port=8000 \
            --allow-unauthenticated \
            --min-instances=1 \
            --service-account=syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com \
            --update-env-vars=APP_ENV=production,JWT_ALGORITHM=HS256,VERTEX_PROJECT_ID=blissful-acumen-495019-t6,VERTEX_LOCATION=us-central1,VERTEX_SEARCH_DATASTORE_ID=syrabit-edu-datastore,VERTEX_SEARCH_LOCATION=global,VERTEX_SEARCH_SERVING_CONFIG=default_search,SARVAM_MODEL=sarvam-m1 \
            --update-secrets=MONGODB_URI=mongodb-uri:latest,JWT_SECRET=jwt-secret:latest,EDGE_SHARED_SECRET=edge-shared-secret:latest,ADMIN_JWT_SECRET=ADMIN_JWT_SECRET:latest,GOOGLE_APPLICATION_CREDENTIALS_JSON=GOOGLE_APPLICATION_CREDENTIALS_JSON:latest,SARVAM_API_KEY=SARVAM_API_KEY:latest,UPSTASH_REDIS_REST_URL=UPSTASH_REDIS_REST_URL:latest,UPSTASH_REDIS_REST_TOKEN=UPSTASH_REDIS_REST_TOKEN:latest,GEMINI_API_KEY=gemini-api-key:latest,RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest,RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest,RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RESET_TOKEN_SECRET=RESET_TOKEN_SECRET:latest,JWT_PRIVATE_KEY=jwt-private-key:latest,JWT_PUBLIC_KEY=jwt-public-key:latest,TRANSLATE_CRON_SECRET=TRANSLATE_CRON_SECRET:latest,INDEXNOW_API_KEY=INDEXNOW_API_KEY:latest,INDEXNOW_INTERNAL_SECRET=INDEXNOW_INTERNAL_SECRET:latest,POSTHOG_API_KEY=POSTHOG_API_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest \
            --remove-secrets=CF_PAGES_DEPLOY_HOOK,CF_ACCOUNT_ID,CLOUDFLARE_ACCOUNT_ID,CLOUDFLARE_KV_API_TOKEN,CLOUDFLARE_KV_NAMESPACE_ID,GCS_CONTENT_BUCKET

      - name: Attach optional content-pipeline secrets (CF Pages + CF KV + GCS)
        run: |
          # These secrets are optional — the deploy must not fail if they don't exist yet.
          # KEY RULE: if a secret is MISSING from GCP Secret Manager, we --remove-secrets it
          # from the Cloud Run service so it doesn't block future deploys.
          UPDATES=""
          REMOVALS=""

          _check() {
            local SECRET_NAME="$1"   # GCP secret name
            local ENV_VARS="$2"      # comma-separated Cloud Run env var names to set/remove
            if gcloud secrets describe "$SECRET_NAME" --project="$PROJECT" >/dev/null 2>&1; then
              for EV in ${ENV_VARS//,/ }; do
                UPDATES="${UPDATES:+$UPDATES,}${EV}=${SECRET_NAME}:latest"
              done
              echo "  ✓ $SECRET_NAME found → $ENV_VARS"
            else
              for EV in ${ENV_VARS//,/ }; do
                REMOVALS="${REMOVALS:+$REMOVALS,}${EV}"
              done
              echo "  ⚠ $SECRET_NAME missing → removing $ENV_VARS from service spec"
              echo "    Create: echo -n 'VALUE' | gcloud secrets create $SECRET_NAME --replication-policy=automatic --data-file=- --project=$PROJECT"
            fi
          }

          # CF Pages deploy hook — triggers a Pages rebuild when content changes
          _check "cf-pages-deploy-hook"  "CF_PAGES_DEPLOY_HOOK"
          # CF Workers AI / KV pipeline secrets
          _check "CF_ACCOUNT_ID"         "CF_ACCOUNT_ID,CLOUDFLARE_ACCOUNT_ID"
          _check "CF_KV_API_TOKEN"        "CLOUDFLARE_KV_API_TOKEN"
          _check "CF_KV_NAMESPACE_ID"     "CLOUDFLARE_KV_NAMESPACE_ID"
          # GCS content pipeline
          _check "GCS_CONTENT_BUCKET"    "GCS_CONTENT_BUCKET"

          # Apply updates (secrets that DO exist)
          if [ -n "$UPDATES" ]; then
            gcloud run services update syrabit-backend \
              --region="$REGION" --project="$PROJECT" \
              --update-secrets="$UPDATES"
            echo "  Attached: $UPDATES"
          fi

          # Remove stale references (secrets that DON'T exist but may be in service spec)
          if [ -n "$REMOVALS" ]; then
            gcloud run services update syrabit-backend \
              --region="$REGION" --project="$PROJECT" \
              --remove-secrets="$REMOVALS" 2>/dev/null || true
            echo "  Removed stale refs: $REMOVALS"
          fi

          if [ -z "$UPDATES" ] && [ -z "$REMOVALS" ]; then
            echo "  No optional secrets to update."
          fi

      - name: Get Cloud Run service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe syrabit-backend \
            --region "$REGION" \
            --project "$PROJECT" \
            --format "value(status.url)")
          echo "service_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Cloud Run URL: ${URL}"

      - name: Wait for healthy revision (up to 3 min)
        run: |
          SERVICE_URL="${{ steps.get-url.outputs.service_url }}"
          echo "Polling ${SERVICE_URL}/health ..."
          for i in $(seq 1 36); do
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" \
              "${SERVICE_URL}/health" --max-time 8 2>/dev/null || echo "000")
            if [[ "$HTTP" == "200" ]]; then
              echo "✔ Backend healthy after $((i * 5))s (HTTP 200)"
              exit 0
            fi
            echo "  Attempt ${i}/36 — HTTP ${HTTP}, retrying in 5s..."
            sleep 5
          done
          echo "✘ Backend failed health check after 180s"
          exit 1

  # =============================================================================
  # JOB 2: Edge — Cloudflare Worker (runs independently of Python dep-check)
  # =============================================================================
  deploy-edge:
    name: Deploy Edge (Cloudflare Worker)
    runs-on: ubuntu-latest
    if: github.event.inputs.backend_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard — reject sentinel KV namespace IDs
        run: |
          if grep -v '^\s*#' apps/edge/wrangler.toml | grep -qi 'REPLACE_ME'; then
            echo "::error::wrangler.toml still contains REPLACE_ME KV namespace IDs."
            echo "Run: npx wrangler kv:namespace create ISR_CACHE_KV"
            exit 1
          fi
          echo "KV namespace IDs look configured."

      - name: Deploy Worker
        run: pnpm --filter syrabit-edge exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # =============================================================================
  # JOB 3: Frontend — Cloudflare Pages (runs independently of Python dep-check)
  # =============================================================================
  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    if: github.event.inputs.backend_only != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=syrabitfrontend

      - name: Submit URLs to IndexNow
        run: node apps/frontend/scripts/indexnow-submit.mjs
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}

  # =============================================================================
  # JOB 4: Smoke tests — run after all three deploys succeed
  # =============================================================================
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-edge, deploy-frontend]
    if: |
      always() &&
      needs.deploy-backend.result == 'success' &&
      (needs.deploy-edge.result == 'success' || needs.deploy-edge.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    steps:
      - name: Edge health + backend reachability (api.syrabit.ai)
        run: |
          # Retries up to 75 s total — enough for the edge KV health cache (30 s TTL)
          # to refresh after a fresh backend deploy.
          REACHABLE="false"
          HTTP="000"
          for attempt in 1 2 3 4 5; do
            HTTP=$(curl -s -o /tmp/edge-health.json -w "%{http_code}" \
              "https://api.syrabit.ai/health" --max-time 15 2>/dev/null || echo "000")
            REACHABLE=$(python3 -c "import json,sys;d=json.load(open('/tmp/edge-health.json'));print(str(d.get('backend_reachable',False)).lower())" 2>/dev/null || echo "false")
            echo "  Attempt ${attempt}/5 — HTTP ${HTTP}, backend_reachable=${REACHABLE}"
            if [[ "$HTTP" == "200" && "$REACHABLE" == "true" ]]; then
              echo "✔ Edge healthy, backend reachable"
              exit 0
            fi
            [[ "$attempt" -lt 5 ]] && sleep 15
          done
          echo "✘ Edge health check failed after 5 attempts"
          if [[ "$HTTP" == "200" && "$REACHABLE" != "true" ]]; then
            echo "::error title=Backend unreachable via edge::Edge is up but backend_reachable=false."
            echo "  Likely cause: BACKEND_URL Wrangler secret is stale or missing."
            echo "  Fix:  npx wrangler secret put BACKEND_URL --env production"
            echo "  Value: $(gcloud run services describe syrabit-backend \
                   --region ${{ secrets.GCP_REGION }} \
                   --project ${{ secrets.GCP_PROJECT_ID }} \
                   --format 'value(status.url)' 2>/dev/null || echo '<run gcloud locally>')"
          fi
          exit 1

      - name: Chat endpoint — English (stream)
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.syrabit.ai/api/v1/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"hello","lang":"en"}' \
            --max-time 20 2>/dev/null || echo "000")
          echo "Chat EN → HTTP ${HTTP}"
          # 404 = edge proxy broken (backend unreachable). 5xx = server error.
          # 401/403/429 = endpoint alive, auth/rate-limit working — all acceptable.
          if [[ "$HTTP" -eq 404 ]]; then
            echo "::error title=Broken proxy::Chat EN returned 404 — edge cannot reach backend."
            exit 1
          fi
          if [[ "$HTTP" -ge 500 ]]; then
            echo "✘ Chat EN server error (HTTP ${HTTP})"
            exit 1
          fi
          echo "✔ Chat EN endpoint alive (HTTP ${HTTP})"

      - name: Chat endpoint — Assamese (stream)
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.syrabit.ai/api/v1/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"নমস্কাৰ","lang":"as"}' \
            --max-time 20 2>/dev/null || echo "000")
          echo "Chat AS → HTTP ${HTTP}"
          if [[ "$HTTP" -eq 404 ]]; then
            echo "::error title=Broken proxy::Chat AS returned 404 — edge cannot reach backend."
            exit 1
          fi
          if [[ "$HTTP" -ge 500 ]]; then
            echo "✘ Chat AS server error (HTTP ${HTTP})"
            exit 1
          fi
          echo "✔ Chat AS endpoint alive (HTTP ${HTTP})"

      - name: Frontend reachable (syrabit.ai)
        if: ${{ github.event.inputs.backend_only != 'true' }}
        run: |
          for attempt in 1 2 3; do
            # Follow redirects (-L): syrabit.ai → 301 → /library/ → 200
            HTTP=$(curl -sfL -o /dev/null -w "%{http_code}" \
              "https://syrabit.ai" --max-time 15 2>/dev/null || echo "000")
            if [[ "$HTTP" == "200" ]]; then
              echo "✔ Frontend live (attempt ${attempt})"
              exit 0
            fi
            echo "  Attempt ${attempt}/3 — HTTP ${HTTP}, retrying in 10s..."
            sleep 10
          done
          echo "✘ Frontend unreachable after 3 attempts"
          exit 1

      - name: Summary
        run: |
          echo ""
          echo "✔ All smoke tests passed"
          echo "  Commit: ${{ github.sha }}"
          echo "  Ref:    ${{ github.ref }}"
          echo ""

  # =============================================================================
  # JOB 5: Rollback — fires only when smoke tests or deploy fails
  # =============================================================================
  rollback:
    name: Rollback Backend on Failure
    runs-on: ubuntu-latest
    needs: [deploy-backend, smoke-test]
    if: |
      always() &&
      needs.deploy-backend.result == 'success' &&
      needs.smoke-test.result == 'failure'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Authenticate to GCP (Service Account Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Route traffic back to previous revision
        run: |
          echo "Smoke tests failed — rolling back syrabit-backend..."
          REVISIONS=$(gcloud run revisions list \
            --service syrabit-backend \
            --region "${{ secrets.GCP_REGION }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --sort-by "~creationTimestamp" \
            --format "value(REVISION)" \
            --limit 2)
          CURRENT=$(echo "$REVISIONS" | head -1)
          PREVIOUS=$(echo "$REVISIONS" | tail -1)
          if [[ -n "$PREVIOUS" && "$PREVIOUS" != "$CURRENT" ]]; then
            echo "Rolling back: $CURRENT → $PREVIOUS"
            gcloud run services update-traffic syrabit-backend \
              --region "${{ secrets.GCP_REGION }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --to-revisions "${PREVIOUS}=100"
            echo "✔ Rollback complete — ${PREVIOUS} now serving 100% of traffic"
          else
            echo "⚠ No previous revision found to roll back to"
            exit 1
          fi

      - name: Annotate failure
        if: always()
        run: |
          echo "::error title=Deploy rolled back::Smoke tests failed after deploying ${{ github.sha }}. Traffic routed back to previous revision."
