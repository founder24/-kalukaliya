name: Deploy — Cloudflare Native

# This is the only push/tag production entrypoint. The complete release
# implementation lives in deploy-cloudflare.yml and is called below so manual
# and automatic releases cannot drift. Cloud Run, Azure Container Apps, and
# apps/backend are local/offline tooling only and cannot be deployed here.
on:
  push:
    branches: [main]
    tags:
      - 'release/*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      validate_authenticated:
        description: 'Require disposable authenticated API checks after deployment'
        required: false
        default: false
        type: boolean
      validate_reset_delivery:
        description: 'Require a fresh disposable password-reset email proof after deployment'
        required: false
        default: false
        type: boolean
      validate_live_chat:
        description: 'Send anonymous production chat prompts for latency and contract checks'
        required: false
        default: false
        type: boolean
      validate_staff_auth:
        description: 'Create and sign in with temporary production staff/admin fixtures'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloudflare-release:
    name: Cloudflare Native Release
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      validate_authenticated: ${{ inputs.validate_authenticated == true }}
      validate_reset_delivery: ${{ inputs.validate_reset_delivery == true }}
      validate_live_chat: ${{ inputs.validate_live_chat == true }}
      validate_staff_auth: ${{ inputs.validate_staff_auth == true }}
    secrets:
      CUTOVER_STUDENT_TOKEN: ${{ secrets.CUTOVER_STUDENT_TOKEN }}
      CUTOVER_STAFF_TOKEN: ${{ secrets.CUTOVER_STAFF_TOKEN }}
      CUTOVER_ADMIN_SESSION_TOKEN: ${{ secrets.CUTOVER_ADMIN_SESSION_TOKEN }}
      TRANSLATE_CRON_SECRET: ${{ secrets.TRANSLATE_CRON_SECRET }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      RATE_LIMIT_CLEANUP_ALERT_WEBHOOK_URL: ${{ secrets.RATE_LIMIT_CLEANUP_ALERT_WEBHOOK_URL }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}