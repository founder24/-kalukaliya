name: four-cloud-delegation-drift

#
# Task #489 — mechanical enforcement of the four-cloud delegation matrix
# at infra/four-cloud-delegation.md.
#
# This gate blocks PRs that re-introduce any of the responsibilities
# listed in the matrix's "must NOT" block per provider:
#
#   * GCP hosting / cron / CI / queueing Terraform
#     (google_cloud_run_*, google_cloud_tasks_*, google_cloud_scheduler_*,
#      google_compute_*, google_container_cluster, google_cloudbuild_*,
#      google_cloudfunctions_*, google_artifact_registry_*).
#   * AWS FastAPI hosting Terraform
#     (aws_apprunner_*, aws_elastic_beanstalk_*, or any aws_ecs_service
#      whose name matches syrabit-backend|syrabit-api|fastapi).
#   * Re-introduction of the deleted GCP queue/scheduler client modules
#     (cloud_tasks_client, cloud_scheduler_client) anywhere in
#     artifacts/syrabit-backend/**/*.py.
#   * Retired AI providers in code (Vertex chat outside the
#     content-formatter module, Vertex multilingual embedding, Vertex
#     Vector Search, Cohere, Voyage AI, Cerebras outside the AI Gateway
#     BYOK shim).
#
# Scope: TF under infra/, artifacts/syrabit/infra/, plus Python under
# artifacts/syrabit-backend/, plus TS under workers/. Markdown docs are
# deliberately excluded (they need to discuss what's forbidden).
#
# This file is itself SHA-pinned per pinned-actions-check.yml.

on:
  pull_request:
    branches: [Replit-agent, master, main]
  push:
    branches: [Replit-agent, master, main]

permissions:
  contents: read

jobs:
  drift:
    name: Verify four-cloud delegation matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run drift guard
        run: |
          set -euo pipefail
          bash .github/scripts/four_cloud_delegation_drift.sh
