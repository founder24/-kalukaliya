name: ACA — set ORIGIN_SHARED_SECRET (one-shot, KV-first)

# One-shot workflow that rotates the ORIGIN_SHARED_SECRET used by the
# syrabit-backend Container App. KV-first design: it updates the value
# in Azure Key Vault `syrabit-prod-kv` (the Bicep template wires
# `secretRef:'origin-shared-secret'` from `keyVaultUrl: .../ORIGIN-SHARED-SECRET`
# via system identity), then rolls a new ACA revision so the secret-ref
# refetches the new value at revision-creation time. Triggered manually
# from the Actions tab.
#
# Auth: re-uses the existing federated OIDC trust on the deploy app
# registration (same secrets/vars as azure-container-apps-deploy.yml).
# No client secret is created or stored.
#
# After a successful run that returns non-403 from the verify step,
# delete this file so the workflow cannot be re-triggered casually.
# Task #103 follow-up — replaces the previous variant which used
# `az containerapp secret set` and silently broke the Bicep keyVaultUrl
# wiring.

on:
  workflow_dispatch:
    inputs:
      new_secret:
        description: "New ORIGIN_SHARED_SECRET value (treated as sensitive; masked in logs)."
        required: true
        type: string
      vault:
        description: "Azure Key Vault name."
        required: true
        default: "syrabit-prod-kv"
        type: string
      health_url:
        description: "Container App FQDN (no trailing slash)."
        required: true
        default: "https://syrabit-backend.lemonstone-ce3c87e1.eastus.azurecontainerapps.io"
        type: string

concurrency:
  group: aca-set-origin-secret
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for the OIDC azure/login federation

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  APP_NAME: syrabit-backend

jobs:
  rotate:
    runs-on: ubuntu-latest
    # Pinning to the `prod` environment makes the OIDC `sub` claim resolve to
    # `repo:<owner>/<repo>:environment:prod`, which matches the federated
    # credential declared in `artifacts/syrabit/infra/azure/iam-github-oidc.tf`.
    environment: prod
    steps:
      - name: Mask the supplied secret in logs
        env:
          NEW_SECRET: ${{ inputs.new_secret }}
        run: |
          printf '::add-mask::%s\n' "$NEW_SECRET"

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update ORIGIN-SHARED-SECRET in Key Vault
        env:
          NEW_SECRET: ${{ inputs.new_secret }}
          VAULT: ${{ inputs.vault }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          printf '%s' "$NEW_SECRET" > "$tmp"
          az keyvault secret set \
            --vault-name "$VAULT" \
            --name "ORIGIN-SHARED-SECRET" \
            --file "$tmp" \
            --output none
          rm -f "$tmp"
          echo "✓ ORIGIN-SHARED-SECRET updated in $VAULT (new version created)"

      - name: Roll new ACA revision so secretRef refetches from Key Vault
        run: |
          set -euo pipefail
          SUFFIX="rotate-$(date -u +%Y%m%d%H%M%S)"
          # The container-app `origin-shared-secret` entry is wired with
          # `keyVaultUrl: .../ORIGIN-SHARED-SECRET` + system identity in
          # the Bicep template. Creating a new revision causes ACA to
          # refetch the latest KV secret version via the managed identity.
          az containerapp update \
            -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --revision-suffix "$SUFFIX" >/dev/null
          echo "Provisioned new revision suffix: $SUFFIX"

      - name: Wait for new revision to become Healthy + 100% traffic
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            LATEST=$(az containerapp revision list \
              -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
              --query "sort_by(@,&properties.createdTime)[-1].{name:name,health:properties.healthState,active:properties.active,traffic:properties.trafficWeight}" \
              -o json)
            echo "[$i] $LATEST"
            HEALTH=$(echo "$LATEST" | jq -r '.health')
            ACTIVE=$(echo "$LATEST" | jq -r '.active')
            TRAFFIC=$(echo "$LATEST" | jq -r '.traffic')
            if [ "$HEALTH" = "Healthy" ] && [ "$ACTIVE" = "true" ] && [ "$TRAFFIC" = "100" ]; then
              echo "Latest revision is Healthy, active, and serving 100% traffic."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for the new revision to go Healthy + 100% traffic." >&2
          exit 1

      - name: Verify guarded path accepts the new value
        env:
          NEW_SECRET: ${{ inputs.new_secret }}
          BASE: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          # POST a chat-shaped payload directly at the ACA hostname with
          # the new shared secret as the X-Origin-Auth header. We expect
          # anything OTHER than 403 — if the OriginGate middleware still
          # 403s, the rotation didn't take effect (KV update or revision
          # roll silently failed). 401/422/etc. are all "fine" for the
          # purposes of this check — they prove the gate let us past.
          CODE=$(curl -s -o /tmp/body -w "%{http_code}" \
            -X POST "${BASE}/api/ai/chat" \
            -H "Content-Type: application/json" \
            -H "X-Origin-Auth: ${NEW_SECRET}" \
            -d '{"message":"ping","response_lang":"en"}')
          echo "HTTP $CODE"
          echo "Body (first 300 chars):"
          head -c 300 /tmp/body || true
          echo
          if [ "$CODE" = "403" ] && grep -q "Direct origin access denied" /tmp/body 2>/dev/null; then
            echo "OriginGate STILL rejected the value — secret rotation did not take effect." >&2
            exit 1
          fi
          echo "OriginGate accepted the new value (HTTP $CODE)."
