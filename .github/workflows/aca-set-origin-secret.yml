name: ACA — set ORIGIN_SHARED_SECRET (one-shot, KV-first, secrets-from-env)

# One-shot rotation workflow for the ORIGIN_SHARED_SECRET that the
# `OriginSharedSecretMiddleware` in `artifacts/syrabit-backend/middleware.py`
# enforces on every non-allowlisted request, and that the syrabitworker
# edge proxy injects via `buildProxyHeaders` (`X-Origin-Auth`).
#
# KV-first design:
#   1. Update `ORIGIN-SHARED-SECRET` in Azure Key Vault `syrabit-prod-kv`.
#      The Bicep template `infra/azure/aca-syrabit-backend.bicep` wires
#      the container-app secret `origin-shared-secret` from
#      `keyVaultUrl: .../ORIGIN-SHARED-SECRET` via system identity, so
#      updating the KV value is the durable rotation point — direct
#      `az containerapp secret set` would silently overwrite the
#      keyVaultUrl with a literal and the next bicep deploy would
#      revert it.
#   2. Best-effort seed two unrelated KV secrets that ACA reconciliation
#      requires the system-identity to be able to fetch when creating a
#      new revision (`SENTRY-DSN`, `WEB-PUSH-VAPID-PRIVATE-KEY`).
#      Without these, `az containerapp update --revision-suffix` fails
#      with `Unable to get value using Managed identity system for
#      secret <name>`. They are read from repo secrets, NOT inputs.
#   3. Roll a new ACA revision (`--revision-suffix rotate-<ts>`) so the
#      secretRefs refetch the latest KV versions at revision creation.
#   4. Verify the OriginGate accepts the new value via a curl against
#      the ACA hostname.
#
# Secret values:
#   * The new ORIGIN_SHARED_SECRET value lives ONLY in
#     `secrets.ORIGIN_SHARED_SECRET_NEW` (a GitHub repo secret pushed
#     via libsodium-encrypted PUT). It is NEVER passed as a workflow
#     input — `workflow_dispatch.inputs.*` values are echoed in the
#     job-step env block before any `::add-mask::` directive runs and
#     would leak to public logs.
#
# OIDC trust:
#   * No `environment:` keyword. The live Azure AD federated identity
#     credential trusts `repo:founder24/-kalukaliya:ref:refs/heads/main`
#     (verified from `azure-container-apps-deploy.yml` run on
#     2026-05-11 14:38 UTC). Adding `environment: prod` switches the
#     subject claim and Azure rejects the assertion with AADSTS700213.
#
# Cleanup: delete this file and the two KV-seed repo secrets after a
# successful run (Task #103).

on:
  workflow_dispatch:
    inputs:
      vault:
        description: "Azure Key Vault name."
        required: true
        default: "syrabit-prod-kv"
        type: string
      health_url:
        description: "Container App FQDN (no trailing slash)."
        required: true
        default: "https://syrabit-backend.lemonstone-ce3c87e1.eastus.azurecontainerapps.io"
        type: string

concurrency:
  group: aca-set-origin-secret
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for OIDC azure/login federation

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  APP_NAME: syrabit-backend

jobs:
  rotate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify required repo secrets are present (mask-first)
        env:
          ORIGIN_NEW:    ${{ secrets.ORIGIN_SHARED_SECRET_NEW }}
          KV_SENTRY:     ${{ secrets.KV_SEED_SENTRY_DSN }}
          KV_WEB_PUSH:   ${{ secrets.KV_SEED_WEB_PUSH_VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # ::add-mask:: is redundant for `secrets.*` (GitHub already
          # masks them automatically) but explicit here for clarity.
          missing=()
          [ -z "$ORIGIN_NEW" ]  && missing+=("ORIGIN_SHARED_SECRET_NEW")
          [ -z "$KV_SENTRY" ]   && missing+=("KV_SEED_SENTRY_DSN")
          [ -z "$KV_WEB_PUSH" ] && missing+=("KV_SEED_WEB_PUSH_VAPID_PRIVATE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets: ${missing[*]}"
            exit 1
          fi
          echo "All 3 repo secrets present (lengths: ORIGIN=${#ORIGIN_NEW}, SENTRY=${#KV_SENTRY}, WEB_PUSH=${#KV_WEB_PUSH})"

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Seed all 3 secrets into Key Vault
        env:
          ORIGIN_NEW:    ${{ secrets.ORIGIN_SHARED_SECRET_NEW }}
          KV_SENTRY:     ${{ secrets.KV_SEED_SENTRY_DSN }}
          KV_WEB_PUSH:   ${{ secrets.KV_SEED_WEB_PUSH_VAPID_PRIVATE_KEY }}
          VAULT:         ${{ inputs.vault }}
        run: |
          set -euo pipefail
          set_kv() {
            local name="$1"; local value="$2"; local tmp
            tmp="$(mktemp)"
            printf '%s' "$value" > "$tmp"
            az keyvault secret set --vault-name "$VAULT" --name "$name" --file "$tmp" --output none
            rm -f "$tmp"
            echo "  ✓ $name set in $VAULT (new version)"
          }
          set_kv "ORIGIN-SHARED-SECRET"        "$ORIGIN_NEW"
          set_kv "SENTRY-DSN"                  "$KV_SENTRY"
          set_kv "WEB-PUSH-VAPID-PRIVATE-KEY"  "$KV_WEB_PUSH"

      - name: Roll new ACA revision (secretRefs refetch from KV)
        run: |
          set -euo pipefail
          SUFFIX="rotate-$(date -u +%Y%m%d%H%M%S)"
          az containerapp update \
            -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --revision-suffix "$SUFFIX" >/dev/null
          echo "Provisioned new revision: ${APP_NAME}--${SUFFIX}"

      - name: Wait for new revision Healthy + 100% traffic
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            LATEST=$(az containerapp revision list \
              -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
              --query "sort_by(@,&properties.createdTime)[-1].{name:name,health:properties.healthState,active:properties.active,traffic:properties.trafficWeight}" \
              -o json)
            HEALTH=$(echo "$LATEST" | jq -r '.health')
            ACTIVE=$(echo "$LATEST" | jq -r '.active')
            TRAFFIC=$(echo "$LATEST" | jq -r '.traffic')
            NAME=$(echo "$LATEST" | jq -r '.name')
            echo "[$i] $NAME health=$HEALTH active=$ACTIVE traffic=$TRAFFIC"
            if [ "$HEALTH" = "Healthy" ] && [ "$ACTIVE" = "true" ] && [ "$TRAFFIC" = "100" ]; then
              echo "✓ Latest revision is Healthy, active, and serving 100% traffic."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for revision Healthy + 100% traffic"
          exit 1

      - name: Verify OriginGate accepts the new value
        env:
          ORIGIN_NEW: ${{ secrets.ORIGIN_SHARED_SECRET_NEW }}
          BASE:       ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          # We expect anything OTHER than 403 with the OriginGate body.
          # Anonymous chat returns 401/422 etc — all are "fine", they
          # prove the gate let us past.
          CODE=$(curl -s -o /tmp/body -w "%{http_code}" \
            -X POST "${BASE}/api/ai/chat" \
            -H "Content-Type: application/json" \
            -H "X-Origin-Auth: ${ORIGIN_NEW}" \
            -d '{"message":"ping","mode":"english"}')
          echo "HTTP $CODE"
          # Don't echo the body raw — could contain the new secret in an
          # error message. Just check the gate-rejection signature.
          if [ "$CODE" = "403" ] && grep -q "Direct origin access denied" /tmp/body 2>/dev/null; then
            echo "::error::OriginGate STILL rejected the value — rotation didn't take effect."
            exit 1
          fi
          echo "✓ OriginGate accepted the new value (HTTP $CODE)."
