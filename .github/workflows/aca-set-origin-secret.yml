name: ACA — set ORIGIN_SHARED_SECRET (one-shot, KV-first, hardened)

# One-shot rotation workflow for the ORIGIN_SHARED_SECRET that the
# `OriginSharedSecretMiddleware` in `artifacts/syrabit-backend/middleware.py`
# enforces on every non-allowlisted request, and that the syrabitworker
# edge proxy injects via `buildProxyHeaders` (`X-Origin-Auth`).
#
# KV-first design:
#   1. PREFLIGHT: assert that the live ACA `origin-shared-secret` entry
#      is still wired via `keyVaultUrl` (not a literal). If a previous
#      `az containerapp secret set` ever drifted it to a literal, KV
#      updates won't propagate to the running revision and we must stop
#      to avoid silent failure.
#   2. Update `ORIGIN-SHARED-SECRET` in Azure Key Vault `syrabit-prod-kv`.
#   3. Optionally seed `SENTRY-DSN` / `WEB-PUSH-VAPID-PRIVATE-KEY` from
#      repo secrets — gated behind `seed_unrelated_kv` because the bicep
#      lists them as required keyVaultUrl refs and a missing-or-stale
#      value blocks revision provisioning. Off by default (Task #103
#      review): blindly overwriting them with whatever's in the repo
#      secrets can break startup if the repo copies are stale.
#   4. Roll a new ACA revision (`--revision-suffix rotate-<ts>`) so the
#      secretRefs refetch the latest KV versions at revision creation.
#   5. Wait for the *named* new revision (not "latest globally") to be
#      Healthy + 100 % traffic.
#   6. Verify the OriginGate accepts the new value via curl.
#
# Secret values:
#   * The new ORIGIN_SHARED_SECRET value lives ONLY in
#     `secrets.ORIGIN_SHARED_SECRET_NEW` (a GitHub repo secret pushed
#     via libsodium-encrypted PUT). It is NEVER a `workflow_dispatch`
#     input — input values are echoed in the env block of the first
#     step before any `::add-mask::` directive runs and would leak to
#     public-repo job logs.
#
# OIDC trust:
#   * No `environment:` keyword. The live Azure AD federated identity
#     credential trusts `repo:founder24/-kalukaliya:ref:refs/heads/main`
#     (verified from `azure-container-apps-deploy.yml` run on
#     2026-05-11 14:38 UTC). Adding `environment: prod` switches the
#     subject claim and Azure rejects the assertion with AADSTS700213.
#
# Verify-step exfiltration guard:
#   * `health_url` is gated against an explicit allowlist before being
#     used in the curl that carries `X-Origin-Auth: <new secret>`. A
#     malicious or mistyped URL would otherwise let an attacker harvest
#     the freshly rotated secret from a public-repo dispatch.
#
# Cleanup: delete this file and the optional KV-seed repo secrets after
# a successful run (Task #103).

on:
  workflow_dispatch:
    inputs:
      vault:
        description: "Azure Key Vault name."
        required: true
        default: "syrabit-prod-kv"
        type: string
      health_url:
        description: "Container App FQDN. Must match the allowlist below."
        required: true
        default: "https://syrabit-backend.lemonstone-ce3c87e1.eastus.azurecontainerapps.io"
        type: string
      seed_unrelated_kv:
        description: "Also seed SENTRY-DSN and WEB-PUSH-VAPID-PRIVATE-KEY from repo secrets (only enable if you have just refreshed those repo secrets)."
        required: false
        default: false
        type: boolean

concurrency:
  group: aca-set-origin-secret
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for OIDC azure/login federation

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  APP_NAME: syrabit-backend

jobs:
  rotate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate inputs (no header exfiltration via health_url)
        env:
          BASE: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          # Allowlist: only the known ACA prod hostname is permitted as a
          # target for the verify-step curl (which sends X-Origin-Auth).
          # Any other URL is rejected — `BASE` is forwarded to a curl that
          # carries the freshly rotated secret in a header, so a malicious
          # dispatch could otherwise harvest the secret to attacker-owned
          # infrastructure.
          case "$BASE" in
            "https://syrabit-backend.lemonstone-ce3c87e1.eastus.azurecontainerapps.io")
              echo "✓ health_url accepted"
              ;;
            *)
              echo "::error::health_url not in allowlist: $BASE"
              exit 1
              ;;
          esac

      - name: Verify required repo secrets are present
        env:
          ORIGIN_NEW:    ${{ secrets.ORIGIN_SHARED_SECRET_NEW }}
          SEED_OPT_IN:   ${{ inputs.seed_unrelated_kv }}
          KV_SENTRY:     ${{ secrets.KV_SEED_SENTRY_DSN }}
          KV_WEB_PUSH:   ${{ secrets.KV_SEED_WEB_PUSH_VAPID_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ORIGIN_NEW" ]; then
            echo "::error::Missing repo secret ORIGIN_SHARED_SECRET_NEW"
            exit 1
          fi
          if [ "$SEED_OPT_IN" = "true" ]; then
            missing=()
            [ -z "$KV_SENTRY" ]   && missing+=("KV_SEED_SENTRY_DSN")
            [ -z "$KV_WEB_PUSH" ] && missing+=("KV_SEED_WEB_PUSH_VAPID_PRIVATE_KEY")
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::seed_unrelated_kv=true but missing repo secrets: ${missing[*]}"
              exit 1
            fi
          fi
          echo "✓ Required repo secrets present (origin len=${#ORIGIN_NEW}, seed_opt_in=$SEED_OPT_IN)"

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight — assert origin-shared-secret is still a Key Vault ref
        run: |
          set -euo pipefail
          # If a prior `az containerapp secret set --secrets origin-shared-secret=...`
          # ever drifted the secret to a literal, our KV update + revision-roll
          # will have NO EFFECT on the running container's secret value. Fail
          # loud here rather than silently rotate a value the app never reads.
          KV_URL=$(az containerapp secret list \
            -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='origin-shared-secret'].keyVaultUrl | [0]" -o tsv 2>/dev/null || echo "")
          if [ -z "$KV_URL" ] || [ "$KV_URL" = "None" ]; then
            echo "::error::origin-shared-secret is no longer a Key Vault reference (drifted to literal). Re-deploy via azure-container-apps-deploy.yml first to restore the keyVaultUrl wiring before rotating."
            exit 1
          fi
          echo "✓ origin-shared-secret keyVaultUrl: $KV_URL"

      - name: Update ORIGIN-SHARED-SECRET in Key Vault
        env:
          ORIGIN_NEW: ${{ secrets.ORIGIN_SHARED_SECRET_NEW }}
          VAULT:      ${{ inputs.vault }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          printf '%s' "$ORIGIN_NEW" > "$tmp"
          az keyvault secret set --vault-name "$VAULT" --name "ORIGIN-SHARED-SECRET" --file "$tmp" --output none
          rm -f "$tmp"
          echo "✓ ORIGIN-SHARED-SECRET updated in $VAULT (new version)"

      - name: (opt-in) Seed unrelated KV secrets
        if: ${{ inputs.seed_unrelated_kv == true }}
        env:
          KV_SENTRY:    ${{ secrets.KV_SEED_SENTRY_DSN }}
          KV_WEB_PUSH:  ${{ secrets.KV_SEED_WEB_PUSH_VAPID_PRIVATE_KEY }}
          VAULT:        ${{ inputs.vault }}
        run: |
          set -euo pipefail
          set_kv() {
            local name="$1"; local value="$2"; local tmp
            tmp="$(mktemp)"; printf '%s' "$value" > "$tmp"
            az keyvault secret set --vault-name "$VAULT" --name "$name" --file "$tmp" --output none
            rm -f "$tmp"
            echo "  ✓ $name set in $VAULT (new version)"
          }
          set_kv "SENTRY-DSN"                 "$KV_SENTRY"
          set_kv "WEB-PUSH-VAPID-PRIVATE-KEY" "$KV_WEB_PUSH"

      - name: Roll new ACA revision (secretRefs refetch from KV)
        id: roll
        run: |
          set -euo pipefail
          SUFFIX="rotate-$(date -u +%Y%m%d%H%M%S)"
          REV_NAME="${APP_NAME}--${SUFFIX}"
          az containerapp update \
            -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --revision-suffix "$SUFFIX" >/dev/null
          echo "rev_name=$REV_NAME" >> "$GITHUB_OUTPUT"
          echo "✓ Provisioned new revision: $REV_NAME"

      - name: Wait for the EXACT new revision Healthy + 100% traffic
        env:
          REV_NAME: ${{ steps.roll.outputs.rev_name }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            REV=$(az containerapp revision show \
              -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
              --revision "$REV_NAME" \
              --query "{health:properties.healthState,active:properties.active,traffic:properties.trafficWeight}" \
              -o json 2>/dev/null || echo '{}')
            HEALTH=$(echo "$REV" | jq -r '.health // "missing"')
            ACTIVE=$(echo "$REV" | jq -r '.active // "missing"')
            TRAFFIC=$(echo "$REV" | jq -r '.traffic // "missing"')
            echo "[$i] $REV_NAME health=$HEALTH active=$ACTIVE traffic=$TRAFFIC"
            if [ "$HEALTH" = "Healthy" ] && [ "$ACTIVE" = "true" ] && [ "$TRAFFIC" = "100" ]; then
              echo "✓ $REV_NAME is Healthy, active, serving 100% traffic."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for $REV_NAME Healthy + 100% traffic. Inspect with: az containerapp logs show -n $APP_NAME -g $AZURE_RESOURCE_GROUP --revision $REV_NAME --follow"
          exit 1

      - name: Verify OriginGate accepts the new value
        env:
          ORIGIN_NEW: ${{ secrets.ORIGIN_SHARED_SECRET_NEW }}
          BASE:       ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          # Anonymous chat returns 401/422 etc — all are "fine"; they
          # prove the OriginGate let us past. Don't raw-echo body
          # (could contain the new secret in an error message).
          CODE=$(curl -s -o /tmp/body -w "%{http_code}" \
            -X POST "${BASE}/api/ai/chat" \
            -H "Content-Type: application/json" \
            -H "X-Origin-Auth: ${ORIGIN_NEW}" \
            -d '{"message":"ping","mode":"english"}')
          echo "HTTP $CODE"
          if [ "$CODE" = "403" ] && grep -q "Direct origin access denied" /tmp/body 2>/dev/null; then
            echo "::error::OriginGate STILL rejected the value — rotation didn't take effect."
            exit 1
          fi
          echo "✓ OriginGate accepted the new value (HTTP $CODE)."
