name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['apps/frontend/**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        # --no-frozen-lockfile: PR #39 added frontend deps without regenerating
        # pnpm-lock.yaml. Until the lockfile is regenerated locally and
        # committed, allow CI to resolve missing entries on the fly.
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter syrabit-frontend run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=syrabitfrontend
