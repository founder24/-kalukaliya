name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['apps/frontend/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        # --no-frozen-lockfile: PR #39 added frontend deps without regenerating
        # pnpm-lock.yaml. Until the lockfile is regenerated locally and
        # committed, allow CI to resolve missing entries on the fly.
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=syrabitfrontend
