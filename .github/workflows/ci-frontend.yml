name: CI Frontend — Lint & Test

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/ci-frontend.yml'
      - 'scripts/check-edge-workflow-triggers.py'
      - 'scripts/check-staff-chunk-release-gate.py'
      - 'scripts/test-staff-chunk-release-gate.py'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/ci-frontend.yml'
      - 'scripts/check-edge-workflow-triggers.py'
      - 'scripts/check-staff-chunk-release-gate.py'
      - 'scripts/test-staff-chunk-release-gate.py'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Validation
        run: pnpm --filter @workspace/syrabit run validate

  test:
    name: Run Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm --filter @workspace/syrabit test

  production-staff-chunks:
    name: Verify Production Staff Chunks
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install workflow contract checker dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Test staff chunk release gate contract
        run: python3 scripts/test-staff-chunk-release-gate.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/frontend/node_modules/playwright/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm --filter @workspace/syrabit exec playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @workspace/syrabit run playwright:install:chromium

      - name: Build Production Frontend Bundle
        run: pnpm --filter @workspace/syrabit run build:client

      - name: Load Staff Dashboard and Health Chunks
        run: pnpm --filter @workspace/syrabit run check:staff-chunks
