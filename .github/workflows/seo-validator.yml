name: seo-validator

on:
  pull_request:
    paths:
      - "artifacts/syrabit-backend/routes/seo_pages.py"
      - "artifacts/syrabit-backend/templates/seo/**"
      - "artifacts/syrabit-backend/seo_engine.py"
      - "artifacts/syrabit-backend/tests/test_seo_pages_structured_data.py"
      - ".github/workflows/seo-validator.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/syrabit-backend/routes/seo_pages.py"
      - "artifacts/syrabit-backend/templates/seo/**"
      - "artifacts/syrabit-backend/seo_engine.py"
  workflow_dispatch:

jobs:
  seo-validator:
    name: Structured-data linter (5 sample chapter pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: artifacts/syrabit-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps
        # Task #53 — `fastapi.testclient` requires `httpx`; `auth_deps`
        # imports `jwt` from `pyjwt`. Both are runtime imports that the
        # structured-data linter pulls in transitively when it imports
        # `routes.bot_discovery` (touches `auth_deps`) and any FastAPI
        # TestClient assertion. Without them the suite fails at import
        # time before a single linter rule runs.
        run: |
          pip install jinja2 fastapi pytest pytest-asyncio httpx pyjwt
      - name: Run structured-data linter on 5 sampled chapter pages
        # The linter lives inside tests/test_seo_pages_structured_data.py
        # and walks all 7 page-types per fixture chapter — that's already
        # ≥ 5 sample pages per run. The job FAILS on any JSON-LD shape
        # error, missing meta, or hreflang/canonical regression so a bad
        # spec change can never reach production.
        run: |
          python -m pytest tests/test_seo_pages_structured_data.py -v --tb=short
