name: Bump Safe Dependencies

on:
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Bump Python deps
        working-directory: apps/backend
        run: |
          pip install pip-tools
          pip-compile --upgrade --generate-hashes --output-file=requirements.txt --strip-extras requirements.in

      - name: Bump Node deps
        run: |
          pnpm --filter @workspace/syrabit add -D postcss@8.5.15
          pnpm install --no-frozen-lockfile

      - name: Create PR with bumped deps
        run: |
          BRANCH="chore/bump-deps-$(date +%Y%m%d)-${{ github.run_id }}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No dependency changes detected."
            exit 0
          fi
          git commit -m "chore: bump safe dependencies"
          git push origin "$BRANCH"
          gh pr create --title "chore: bump safe dependencies" --body "Automated dependency bump via workflow_dispatch." --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
