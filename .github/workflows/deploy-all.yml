name: Deploy Full Stack (Dual-LLM RAG)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════
  # 1. Deploy Backend (Azure Container Apps)
  # ═══════════════════════════════════════════════════
  deploy-backend:
    name: Deploy Backend → Azure
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & Push to ACR
        run: |
          az acr build \
            --registry syrabitacr \
            --resource-group syrabit-prod \
            --image syrabit/backend:${{ github.sha }} \
            --image syrabit/backend:latest \
            --file apps/backend/Dockerfile \
            apps/backend/

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --image syrabitacr.azurecr.io/syrabit/backend:${{ github.sha }}

      - name: Wait for healthy revision
        run: |
          echo "Waiting 90s for new revision to stabilize..."
          sleep 90
          FQDN=$(az containerapp show \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          curl -sf "https://${FQDN}/health" && echo "Backend healthy" || echo "Backend health check failed"

  # ═══════════════════════════════════════════════════
  # 2. Deploy Edge Worker (Cloudflare)
  # ═══════════════════════════════════════════════════
  deploy-edge:
    name: Deploy Edge → Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Deploy Worker
        run: pnpm --filter syrabit-edge exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ═══════════════════════════════════════════════════
  # 3. Deploy Frontend (Cloudflare Pages)
  # ═══════════════════════════════════════════════════
  deploy-frontend:
    name: Deploy Frontend → CF Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=syrabitfrontend

  # ═══════════════════════════════════════════════════
  # 4. Post-Deploy Smoke Tests
  # ═══════════════════════════════════════════════════
  smoke-test:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-edge, deploy-frontend]
    steps:
      - name: Edge Health
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.syrabit.ai/health" \
            --max-time 15)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Edge health failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Edge: healthy"

      - name: Chat endpoint (English)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.syrabit.ai/api/ai/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"hello","lang":"en"}' \
            --max-time 30)
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "Chat endpoint error (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Chat EN: HTTP $HTTP_STATUS"

      - name: Chat endpoint (Assamese/Sarvam)
        run: |
          RESPONSE=$(curl -s -X POST "https://api.syrabit.ai/api/ai/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"নমস্কাৰ","lang":"as"}' \
            --max-time 30)
          if echo "$RESPONSE" | grep -q "provider.*sarvam"; then
            echo "Sarvam AI: active"
          else
            echo "Sarvam AI: falling back to Vertex (check API key)"
          fi

      - name: Frontend reachable
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://syrabit.ai" \
            --max-time 15)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Frontend unreachable (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Frontend: live"

      - name: Summary
        run: echo "All smoke tests passed - deployment complete!"
