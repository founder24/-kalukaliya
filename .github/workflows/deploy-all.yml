name: Deploy Full Stack (Dual-LLM RAG)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-checks:
    name: Quality Gates
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          sed 's/ *\\$//' apps/backend/requirements.txt | grep -v '^\s*--hash' > /tmp/requirements-nohash.txt
          pip install -r /tmp/requirements-nohash.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Lint Edge
        run: pnpm --filter syrabit-edge exec tsc --noEmit

      - name: Lint Frontend
        run: pnpm --filter @workspace/syrabit exec tsc --noEmit

      - name: Lint Backend
        run: |
          pip install ruff
          ruff check apps/backend/app/

      - name: Test Backend
        run: pytest apps/backend/ --tb=short -q --cov=apps/backend/app --cov-report=term-missing --cov-fail-under=40
        env:
          APP_ENV: test
          JWT_SECRET: test-secret-at-least-32-characters-long-for-ci
          MONGODB_URI: mongodb://test:test@localhost:27017

      - name: Test Edge
        run: pnpm --filter syrabit-edge test

      - name: Test Frontend
        run: pnpm --filter @workspace/syrabit test

  canary-deploy:
    name: Canary Deploy
    needs: [ci-checks]
    uses: ./.github/workflows/agent-canary-deploy.yml
    secrets: inherit

  deploy-backend:
    name: Deploy Backend
    needs: [ci-checks, canary-deploy]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # NOTE: Secrets are currently fetched from KeyVault and passed as CLI env vars.
      # RECOMMENDED IMPROVEMENT (CICD-05): Migrate to Azure Container Apps native
      # secret references that point directly to KeyVault. This eliminates secrets
      # from CLI arguments and prevents potential exposure in error logs/activity logs.
      # See: https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets
      # Implementation: Use `az containerapp secret set --name syrabit-backend \
      #   --resource-group syrabit-prod --secrets "jwt-secret=keyvaultref:..."` 
      # then reference them in env vars as secretref:<secret-name>.
      - name: Fetch secrets from Azure KeyVault
        run: |
          set -euo pipefail
          JWT_SECRET=$(az keyvault secret show --vault-name syrabit-kv --name jwt-secret --query value -o tsv)
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          MONGODB_URI=$(az keyvault secret show --vault-name syrabit-kv --name mongodb-uri --query value -o tsv)
          echo "::add-mask::$MONGODB_URI"
          echo "MONGODB_URI=$MONGODB_URI" >> "$GITHUB_ENV"
          UPSTASH_REDIS_URL=$(az keyvault secret show --vault-name syrabit-kv --name upstash-redis-url --query value -o tsv)
          echo "::add-mask::$UPSTASH_REDIS_URL"
          echo "UPSTASH_REDIS_URL=$UPSTASH_REDIS_URL" >> "$GITHUB_ENV"
          AZURE_SEARCH_KEY=$(az keyvault secret show --vault-name syrabit-kv --name azure-search-key --query value -o tsv)
          echo "::add-mask::$AZURE_SEARCH_KEY"
          echo "AZURE_SEARCH_KEY=$AZURE_SEARCH_KEY" >> "$GITHUB_ENV"
          AZURE_SEARCH_ENDPOINT=$(az keyvault secret show --vault-name syrabit-kv --name azure-search-endpoint --query value -o tsv)
          echo "::add-mask::$AZURE_SEARCH_ENDPOINT"
          echo "AZURE_SEARCH_ENDPOINT=$AZURE_SEARCH_ENDPOINT" >> "$GITHUB_ENV"
          VERTEX_AI_KEY=$(az keyvault secret show --vault-name syrabit-kv --name vertex-ai-key --query value -o tsv)
          echo "::add-mask::$VERTEX_AI_KEY"
          echo "VERTEX_AI_KEY=$VERTEX_AI_KEY" >> "$GITHUB_ENV"
          SARVAM_API_KEY=$(az keyvault secret show --vault-name syrabit-kv --name sarvam-api-key --query value -o tsv)
          echo "::add-mask::$SARVAM_API_KEY"
          echo "SARVAM_API_KEY=$SARVAM_API_KEY" >> "$GITHUB_ENV"
          RAZORPAY_KEY_ID=$(az keyvault secret show --vault-name syrabit-kv --name razorpay-key-id --query value -o tsv)
          echo "::add-mask::$RAZORPAY_KEY_ID"
          echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" >> "$GITHUB_ENV"
          RAZORPAY_KEY_SECRET=$(az keyvault secret show --vault-name syrabit-kv --name razorpay-key-secret --query value -o tsv)
          echo "::add-mask::$RAZORPAY_KEY_SECRET"
          echo "RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET" >> "$GITHUB_ENV"
          RESEND_API_KEY=$(az keyvault secret show --vault-name syrabit-kv --name resend-api-key --query value -o tsv)
          echo "::add-mask::$RESEND_API_KEY"
          echo "RESEND_API_KEY=$RESEND_API_KEY" >> "$GITHUB_ENV"
          POSTHOG_API_KEY=$(az keyvault secret show --vault-name syrabit-kv --name posthog-api-key --query value -o tsv)
          echo "::add-mask::$POSTHOG_API_KEY"
          echo "POSTHOG_API_KEY=$POSTHOG_API_KEY" >> "$GITHUB_ENV"

      - name: Build & Push to ACR
        run: |
          az acr build \
            --registry syrabitacr \
            --resource-group syrabit-prod \
            --image syrabit/backend:${{ github.sha }} \
            --image syrabit/backend:latest \
            --file apps/backend/Dockerfile \
            apps/backend/

      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'syrabitacr.azurecr.io/syrabit/backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --image syrabitacr.azurecr.io/syrabit/backend:${{ github.sha }} \
            --set-env-vars \
              "JWT_SECRET=${{ env.JWT_SECRET }}" \
              "MONGODB_URI=${{ env.MONGODB_URI }}" \
              "UPSTASH_REDIS_URL=${{ env.UPSTASH_REDIS_URL }}" \
              "AZURE_SEARCH_KEY=${{ env.AZURE_SEARCH_KEY }}" \
              "AZURE_SEARCH_ENDPOINT=${{ env.AZURE_SEARCH_ENDPOINT }}" \
              "VERTEX_AI_KEY=${{ env.VERTEX_AI_KEY }}" \
              "SARVAM_API_KEY=${{ env.SARVAM_API_KEY }}" \
              "RAZORPAY_KEY_ID=${{ env.RAZORPAY_KEY_ID }}" \
              "RAZORPAY_KEY_SECRET=${{ env.RAZORPAY_KEY_SECRET }}" \
              "RESEND_API_KEY=${{ env.RESEND_API_KEY }}" \
              "POSTHOG_API_KEY=${{ env.POSTHOG_API_KEY }}"

      - name: Wait for healthy revision
        run: |
          FQDN=$(az containerapp show \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Polling https://${FQDN}/health for up to 150 seconds..."
          for i in $(seq 1 30); do
            if curl -sf "https://${FQDN}/health" --max-time 5; then
              echo ""
              echo "Backend healthy after $((i * 5)) seconds"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 5s..."
            sleep 5
          done
          echo "Backend failed to become healthy within 150 seconds"
          exit 1

  deploy-edge:
    name: Deploy Edge
    needs: [ci-checks, canary-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        run: pnpm --filter syrabit-edge exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend
    needs: [ci-checks, canary-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=syrabitfrontend

      - name: Submit URLs to IndexNow
        run: node apps/frontend/scripts/indexnow-submit.mjs
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-edge, deploy-frontend]
    steps:
      - name: Edge Health
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.syrabit.ai/health" --max-time 15)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Edge health failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Edge: healthy"

      - name: Chat endpoint (English)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.syrabit.ai/api/ai/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"hello","lang":"en"}' \
            --max-time 30)
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "Chat endpoint error (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Chat EN: HTTP $HTTP_STATUS"

      - name: Frontend reachable
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://syrabit.ai" --max-time 15)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Frontend unreachable (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Frontend: live"

      - name: Summary
        run: echo "All smoke tests passed - deployment complete!"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: failure()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rollback to previous revision
        run: |
          echo "Smoke tests failed - initiating rollback..."
          # Get revisions sorted by creation time (newest first)
          CURRENT=$(az containerapp revision list \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query "sort_by([?properties.active], &properties.createdTime) | [-1].name" -o tsv)
          PREVIOUS=$(az containerapp revision list \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query "sort_by([?properties.active], &properties.createdTime) | [-2].name" -o tsv)
          
          if [ -n "$PREVIOUS" ] && [ -n "$CURRENT" ] && [ "$PREVIOUS" != "$CURRENT" ]; then
            echo "Rolling back: deactivating $CURRENT, activating $PREVIOUS"
            az containerapp revision deactivate \
              --name syrabit-backend \
              --resource-group syrabit-prod \
              --revision "$CURRENT" || true
            az containerapp ingress traffic set \
              --name syrabit-backend \
              --resource-group syrabit-prod \
              --revision-weight "$PREVIOUS=100"
            echo "Rollback complete"
          else
            echo "WARNING: Could not determine previous revision for rollback"
            exit 1
          fi
