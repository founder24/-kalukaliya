name: Deploy Full Stack (Dual-LLM RAG)

on:
  # Automatic deploys are now handled by deploy.yml (Cloud Build backed).
  # This workflow is kept as a manual fallback for full-stack redeploys.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-checks:
    name: Quality Gates
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          sed 's/ *\\$//' apps/backend/requirements.txt | grep -v '^\s*--hash' > /tmp/requirements-nohash.txt
          pip install -r /tmp/requirements-nohash.txt
          pip install pytest pytest-asyncio pytest-cov email-validator pytest-env

      - name: Lint Edge
        run: pnpm --filter syrabit-edge exec tsc --noEmit

      - name: Lint Frontend
        run: pnpm --filter @workspace/syrabit exec tsc --noEmit

      - name: Lint Backend
        run: |
          pip install ruff
          ruff check apps/backend/app/

      - name: Test Backend
        run: |
          pytest apps/backend/ --tb=short -q --cov=apps/backend/app --cov-report=term-missing 2>&1 | tee /tmp/pytest-output.txt
          PYTEST_EXIT=$?
          # Parse results
          FAILED=$(grep -oP '\d+ failed' /tmp/pytest-output.txt | grep -oP '\d+' || echo "0")
          PASSED=$(grep -oP '\d+ passed' /tmp/pytest-output.txt | grep -oP '\d+' || echo "0")
          echo "Results: $PASSED passed, $FAILED failed (exit code: $PYTEST_EXIT)"
          # Allow up to 2 known failures (Redis/Upstash unavailable in CI)
          if [ "$FAILED" -gt 2 ]; then
            echo "Test failures detected ($FAILED > 2). Failing CI."
            exit 1
          fi
          if [ "$PASSED" -eq 0 ] && [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "No tests passed and pytest exited with error. Failing CI."
            exit 1
          fi
          echo "Tests passed ($FAILED failures within threshold of 2)."
        env:
          APP_ENV: test
          JWT_SECRET: test-secret-at-least-32-characters-long-for-ci
          MONGODB_URI: mongodb://test:test@localhost:27017

      - name: Test Edge
        run: pnpm --filter syrabit-edge test

      - name: Test Frontend
        run: pnpm --filter @workspace/syrabit test

  deploy-backend:
    name: Deploy Backend
    needs: [ci-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Service Account Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Validate Workers AI RAG credentials
        run: |
          set -euo pipefail
          RUNTIME_SA="serviceAccount:syrabit-backend-sa@blissful-acumen-495019-t6.iam.gserviceaccount.com"
          for secret in CF_ACCOUNT_ID cf-worker-ai-token CF_ANALYTICS_TOKEN CF_ZONE_ID; do
            gcloud secrets describe "$secret" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --quiet >/dev/null
            gcloud secrets add-iam-policy-binding "$secret" \
              --project="${{ secrets.GCP_PROJECT_ID }}" \
              --member="$RUNTIME_SA" \
              --role="roles/secretmanager.secretAccessor" \
              --quiet
          done

      - name: Build & Push to Artifact Registry
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/syrabit/backend:${{ github.sha }}"
          IMAGE_LATEST="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/syrabit/backend:latest"
          docker build -t "$IMAGE" -t "$IMAGE_LATEST" -f apps/backend/Dockerfile apps/backend/
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy syrabit-backend \
            --image "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/syrabit/backend:${{ github.sha }}" \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --port 8000 \
            --min-instances 1 \
            --max-instances 10 \
            --memory 1Gi \
            --cpu 1 \
            --set-env-vars "APP_ENV=production,WORKERS_AI_INTERNAL_URL=https://syrabit-api-prod.axomxplain.workers.dev,CF_AI_MODEL=@cf/zai-org/glm-4.7-flash,CF_AI_MODEL_FALLBACK=@cf/qwen/qwen3-30b-a3b-fp8" \
            --set-secrets "JWT_SECRET=jwt-secret:latest,MONGODB_URI=mongodb-uri:latest,CF_ACCOUNT_ID=CF_ACCOUNT_ID:latest,CF_WORKER_AI_TOKEN=cf-worker-ai-token:latest,CF_ANALYTICS_TOKEN=CF_ANALYTICS_TOKEN:latest,CF_ZONE_ID=CF_ZONE_ID:latest,GOOGLE_APPLICATION_CREDENTIALS_JSON=GOOGLE_APPLICATION_CREDENTIALS_JSON:latest,RAZORPAY_KEY_ID=razorpay-key-id:latest,RAZORPAY_KEY_SECRET=razorpay-key-secret:latest,RAZORPAY_WEBHOOK_SECRET=razorpay-webhook-secret:latest,RESEND_API_KEY=resend-api-key:latest,ADMIN_JWT_SECRET=admin-jwt-secret:latest,RESET_TOKEN_SECRET=reset-token-secret:latest,TRANSLATE_CRON_SECRET=translate-cron-secret:latest,EDGE_SHARED_SECRET=edge-shared-secret:latest,JWT_PRIVATE_KEY=jwt-private-key:latest,JWT_PUBLIC_KEY=jwt-public-key:latest"

      - name: Wait for healthy revision
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe syrabit-backend \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)')
          INVOKER=$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)
          test -n "$INVOKER"
          gcloud run services add-iam-policy-binding syrabit-backend \
            --region ${{ secrets.GCP_REGION }} \
            --member="serviceAccount:${INVOKER}" \
            --role="roles/run.invoker" \
            --quiet
          ID_TOKEN=$(gcloud auth print-identity-token --audiences="${SERVICE_URL}")
          echo "Polling ${SERVICE_URL}/health for up to 150 seconds..."
          for i in $(seq 1 30); do
            if curl -sf -H "Authorization: Bearer ${ID_TOKEN}" \
              "${SERVICE_URL}/api/v1/health" --max-time 5; then
              echo ""
              echo "Backend healthy after $((i * 5)) seconds"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 5s..."
            sleep 5
          done
          echo "Backend failed to become healthy within 150 seconds"
          exit 1

      - name: Verify Cloud Run RAG embedding
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe syrabit-backend \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)')
          ID_TOKEN=$(gcloud auth print-identity-token --audiences="${SERVICE_URL}")
          HTTP=$(curl -sS -o /tmp/deep-health.json -w "%{http_code}" \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${SERVICE_URL}/api/v1/health/deep" --max-time 60)
          echo "Deep health HTTP: ${HTTP}"
          cat /tmp/deep-health.json
          test "$HTTP" = "200"
          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/deep-health.json"))
          embedding = payload["checks"]["workers_ai_embedding"]
          assert embedding["status"] == "healthy", embedding
          assert embedding["dimensions"] == 1024, embedding
          PY
          echo "✔ Cloud Run RAG embedding path is healthy"

  deploy-edge:
    name: Deploy Edge
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Guard: check for KV sentinel IDs"
        run: |
          if grep -v '^\s*#' apps/edge/wrangler.toml | grep -qi 'REPLACE_ME'; then
            echo "ERROR: wrangler.toml still contains sentinel KV namespace IDs."
            echo "You MUST replace ISR_CACHE_KV REPLACE_ME IDs before deploying."
            echo "Run: npx wrangler kv:namespace create ISR_CACHE_KV"
            exit 1
          fi
          echo "All KV namespace IDs are properly configured."

      - name: Deploy Worker
        run: pnpm --filter syrabit-edge exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=syrabitfrontend

      - name: Submit URLs to IndexNow
        run: node apps/frontend/scripts/indexnow-submit.mjs
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-edge, deploy-frontend]
    steps:
      - name: Edge health + backend reachability
        run: |
          # Retry up to 75 s — allows edge KV health cache (30 s TTL) to refresh
          # after a fresh backend deploy before we declare the proxy broken.
          REACHABLE="false"
          HTTP="000"
          for attempt in 1 2 3 4 5; do
            HTTP=$(curl -s -o /tmp/edge-health.json -w "%{http_code}" \
              "https://api.syrabit.ai/health" --max-time 15 2>/dev/null || echo "000")
            REACHABLE=$(python3 -c "import json,sys;d=json.load(open('/tmp/edge-health.json'));print(str(d.get('backend_reachable',False)).lower())" 2>/dev/null || echo "false")
            echo "  Attempt ${attempt}/5 — HTTP ${HTTP}, backend_reachable=${REACHABLE}"
            if [ "$HTTP" = "200" ] && [ "$REACHABLE" = "true" ]; then
              echo "✔ Edge healthy, backend reachable"
              exit 0
            fi
            [ "$attempt" -lt 5 ] && sleep 15
          done
          echo "✘ Edge health check failed after 5 attempts"
          if [ "$HTTP" = "200" ] && [ "$REACHABLE" != "true" ]; then
            echo "::error title=Backend unreachable via edge::Edge is up but backend_reachable=false."
            echo "  Likely cause: BACKEND_URL Wrangler secret is stale or missing."
            echo "  Fix:  npx wrangler secret put BACKEND_URL --env production"
          fi
          exit 1

      - name: Chat endpoint (English)
        run: |
          START_TIME=$(date +%s%N)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.syrabit.ai/api/v1/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"hello","lang":"en"}' \
            --max-time 30)
          END_TIME=$(date +%s%N)
          ELAPSED_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          echo "Chat EN: HTTP $HTTP_STATUS (${ELAPSED_MS}ms)"
          # Accept 200/401/403/429 as valid (endpoint alive, auth/rate-limit working)
          # Reject 404 (broken proxy — edge can't reach backend) and 5xx (server errors)
          if [ "$HTTP_STATUS" -eq 404 ]; then
            echo "ERROR: Chat endpoint returned 404 — edge proxy is broken (backend unreachable)"
            exit 1
          fi
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "Chat endpoint server error (HTTP $HTTP_STATUS)"
            exit 1
          fi
          if [ "$ELAPSED_MS" -gt 5000 ]; then
            echo "WARNING: Response took ${ELAPSED_MS}ms (> 5000ms latency threshold)"
          fi

      - name: Chat endpoint (Assamese - Sarvam AI routing)
        run: |
          START_TIME=$(date +%s%N)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.syrabit.ai/api/v1/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"নমস্কাৰ","lang":"as"}' \
            --max-time 30)
          END_TIME=$(date +%s%N)
          ELAPSED_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          echo "Chat AS (Assamese/Sarvam): HTTP $HTTP_STATUS (${ELAPSED_MS}ms)"
          # Accept 200/401/403/429 as valid (endpoint alive, auth/rate-limit working)
          # Reject 404 (broken proxy — edge can't reach backend) and 5xx (server errors)
          if [ "$HTTP_STATUS" -eq 404 ]; then
            echo "ERROR: Assamese chat endpoint returned 404 — edge proxy is broken (backend unreachable)"
            exit 1
          fi
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "Assamese chat endpoint server error (HTTP $HTTP_STATUS)"
            exit 1
          fi
          if [ "$ELAPSED_MS" -gt 5000 ]; then
            echo "WARNING: Assamese response took ${ELAPSED_MS}ms (> 5000ms latency threshold)"
          fi

      - name: Frontend reachable
        run: |
          for attempt in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://syrabit.ai" --max-time 15)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Frontend: live (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt/3 failed (HTTP $HTTP_STATUS), retrying in 10s..."
            sleep 10
          done
          echo "Frontend unreachable after 3 attempts"
          exit 1

      - name: Summary
        run: echo "All smoke tests passed - deployment complete!"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-edge, deploy-frontend, smoke-test]
    if: always() && (needs.smoke-test.result == 'failure' || needs.deploy-backend.result == 'failure' || needs.deploy-edge.result == 'failure' || needs.deploy-frontend.result == 'failure')
    permissions:
      contents: read
    steps:
      - name: Authenticate to GCP (Service Account Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Rollback backend to previous revision
        run: |
          echo "Smoke tests failed - initiating backend rollback..."
          # List revisions sorted by creation time (newest first)
          REVISIONS=$(gcloud run revisions list \
            --service syrabit-backend \
            --region ${{ secrets.GCP_REGION }} \
            --sort-by ~creationTimestamp \
            --format 'value(REVISION)' \
            --limit 2)
          CURRENT=$(echo "$REVISIONS" | head -1)
          PREVIOUS=$(echo "$REVISIONS" | tail -1)

          if [ -n "$PREVIOUS" ] && [ -n "$CURRENT" ] && [ "$PREVIOUS" != "$CURRENT" ]; then
            echo "Rolling back: routing traffic from $CURRENT to $PREVIOUS"
            gcloud run services update-traffic syrabit-backend \
              --region ${{ secrets.GCP_REGION }} \
              --to-revisions "$PREVIOUS=100"
            echo "Backend rollback complete"
          else
            echo "WARNING: Could not determine previous revision for rollback"
            exit 1
          fi

      # NOTE: Edge (Cloudflare Workers) and Frontend (Cloudflare Pages) use
      # Cloudflare's automatic rollback mechanism. Previous deployments are
      # retained and can be rolled back via the Cloudflare dashboard or API.
      # No automated rollback step is needed here for edge/frontend.
