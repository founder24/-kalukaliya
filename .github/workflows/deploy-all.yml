name: Deploy Full Stack (Dual-LLM RAG)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-checks:
    name: Quality Gates
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Python dependencies
        run: |
          sed 's/ *\\$//' apps/backend/requirements.txt | grep -v '^\s*--hash' > /tmp/requirements-nohash.txt
          pip install -r /tmp/requirements-nohash.txt

      - name: Lint Edge
        run: pnpm --filter syrabit-edge exec tsc --noEmit

      - name: Lint Frontend
        run: pnpm --filter @workspace/syrabit exec tsc --noEmit

      - name: Lint Backend
        run: |
          pip install ruff
          ruff check apps/backend/app/

      - name: Test Backend
        run: pytest apps/backend/ --tb=short -q
        env:
          APP_ENV: test
          JWT_SECRET: test-secret-at-least-32-characters-long-for-ci
          MONGODB_URI: mongodb://test:test@localhost:27017

      - name: Test Edge
        run: pnpm --filter syrabit-edge test

      - name: Test Frontend
        run: pnpm --filter @workspace/syrabit test

  canary-deploy:
    name: Canary Validation
    needs: [ci-checks]
    uses: ./.github/workflows/agent-canary-deploy.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  deploy-backend:
    name: Deploy Backend
    needs: [canary-deploy]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch secrets from KeyVault
        id: keyvault
        run: |
          set -euo pipefail
          echo "Fetching runtime secrets from Azure KeyVault..."
          MONGODB_URI=$(az keyvault secret show --vault-name syrabit-kv --name MONGODB-URI --query value -o tsv)
          JWT_SECRET=$(az keyvault secret show --vault-name syrabit-kv --name JWT-SECRET --query value -o tsv)
          RAZORPAY_WEBHOOK_SECRET=$(az keyvault secret show --vault-name syrabit-kv --name RAZORPAY-WEBHOOK-SECRET --query value -o tsv)
          RESEND_API_KEY=$(az keyvault secret show --vault-name syrabit-kv --name RESEND-API-KEY --query value -o tsv)
          SARVAM_API_KEY=$(az keyvault secret show --vault-name syrabit-kv --name SARVAM-API-KEY --query value -o tsv)
          POSTHOG_API_KEY=$(az keyvault secret show --vault-name syrabit-kv --name POSTHOG-API-KEY --query value -o tsv)
          SENTRY_DSN=$(az keyvault secret show --vault-name syrabit-kv --name SENTRY-DSN --query value -o tsv)
          UPSTASH_REDIS_REST_URL=$(az keyvault secret show --vault-name syrabit-kv --name UPSTASH-REDIS-REST-URL --query value -o tsv)
          UPSTASH_REDIS_REST_TOKEN=$(az keyvault secret show --vault-name syrabit-kv --name UPSTASH-REDIS-REST-TOKEN --query value -o tsv)
          GOOGLE_APPLICATION_CREDENTIALS_JSON=$(az keyvault secret show --vault-name syrabit-kv --name GOOGLE-APPLICATION-CREDENTIALS-JSON --query value -o tsv)
          AZURE_SEARCH_ADMIN_KEY=$(az keyvault secret show --vault-name syrabit-kv --name AZURE-SEARCH-ADMIN-KEY --query value -o tsv)
          AZURE_SEARCH_QUERY_KEY=$(az keyvault secret show --vault-name syrabit-kv --name AZURE-SEARCH-QUERY-KEY --query value -o tsv)
          
          # Mask secrets in logs
          echo "::add-mask::$MONGODB_URI"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$RAZORPAY_WEBHOOK_SECRET"
          echo "::add-mask::$RESEND_API_KEY"
          echo "::add-mask::$SARVAM_API_KEY"
          echo "::add-mask::$POSTHOG_API_KEY"
          echo "::add-mask::$SENTRY_DSN"
          echo "::add-mask::$UPSTASH_REDIS_REST_URL"
          echo "::add-mask::$UPSTASH_REDIS_REST_TOKEN"
          echo "::add-mask::$GOOGLE_APPLICATION_CREDENTIALS_JSON"
          echo "::add-mask::$AZURE_SEARCH_ADMIN_KEY"
          echo "::add-mask::$AZURE_SEARCH_QUERY_KEY"
          
          # Export for subsequent steps
          echo "MONGODB_URI=$MONGODB_URI" >> "$GITHUB_OUTPUT"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_OUTPUT"
          echo "RAZORPAY_WEBHOOK_SECRET=$RAZORPAY_WEBHOOK_SECRET" >> "$GITHUB_OUTPUT"
          echo "RESEND_API_KEY=$RESEND_API_KEY" >> "$GITHUB_OUTPUT"
          echo "SARVAM_API_KEY=$SARVAM_API_KEY" >> "$GITHUB_OUTPUT"
          echo "POSTHOG_API_KEY=$POSTHOG_API_KEY" >> "$GITHUB_OUTPUT"
          echo "SENTRY_DSN=$SENTRY_DSN" >> "$GITHUB_OUTPUT"
          echo "UPSTASH_REDIS_REST_URL=$UPSTASH_REDIS_REST_URL" >> "$GITHUB_OUTPUT"
          echo "UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN" >> "$GITHUB_OUTPUT"
          echo "GOOGLE_APPLICATION_CREDENTIALS_JSON=$GOOGLE_APPLICATION_CREDENTIALS_JSON" >> "$GITHUB_OUTPUT"
          echo "AZURE_SEARCH_ADMIN_KEY=$AZURE_SEARCH_ADMIN_KEY" >> "$GITHUB_OUTPUT"
          echo "AZURE_SEARCH_QUERY_KEY=$AZURE_SEARCH_QUERY_KEY" >> "$GITHUB_OUTPUT"

      - name: Build & Push to ACR
        run: |
          az acr build \
            --registry syrabitacr \
            --resource-group syrabit-prod \
            --image syrabit/backend:${{ github.sha }} \
            --image syrabit/backend:latest \
            --file apps/backend/Dockerfile \
            apps/backend/

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --image syrabitacr.azurecr.io/syrabit/backend:${{ github.sha }} \
            --set-env-vars \
              "MONGODB_URI=${{ steps.keyvault.outputs.MONGODB_URI }}" \
              "JWT_SECRET=${{ steps.keyvault.outputs.JWT_SECRET }}" \
              "RAZORPAY_WEBHOOK_SECRET=${{ steps.keyvault.outputs.RAZORPAY_WEBHOOK_SECRET }}" \
              "RESEND_API_KEY=${{ steps.keyvault.outputs.RESEND_API_KEY }}" \
              "SARVAM_API_KEY=${{ steps.keyvault.outputs.SARVAM_API_KEY }}" \
              "POSTHOG_API_KEY=${{ steps.keyvault.outputs.POSTHOG_API_KEY }}" \
              "SENTRY_DSN=${{ steps.keyvault.outputs.SENTRY_DSN }}" \
              "UPSTASH_REDIS_REST_URL=${{ steps.keyvault.outputs.UPSTASH_REDIS_REST_URL }}" \
              "UPSTASH_REDIS_REST_TOKEN=${{ steps.keyvault.outputs.UPSTASH_REDIS_REST_TOKEN }}" \
              "GOOGLE_APPLICATION_CREDENTIALS_JSON=${{ steps.keyvault.outputs.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" \
              "AZURE_SEARCH_ADMIN_KEY=${{ steps.keyvault.outputs.AZURE_SEARCH_ADMIN_KEY }}" \
              "AZURE_SEARCH_QUERY_KEY=${{ steps.keyvault.outputs.AZURE_SEARCH_QUERY_KEY }}"

      - name: Wait for healthy revision
        run: |
          FQDN=$(az containerapp show \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Polling https://${FQDN}/health for up to 150 seconds..."
          for i in $(seq 1 30); do
            if curl -sf "https://${FQDN}/health" --max-time 5; then
              echo ""
              echo "Backend healthy after $((i * 5)) seconds"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 5s..."
            sleep 5
          done
          echo "Backend failed to become healthy within 150 seconds"
          exit 1

  deploy-edge:
    name: Deploy Edge
    needs: [canary-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Deploy Worker
        run: pnpm --filter syrabit-edge exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend
    needs: [canary-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=syrabitfrontend

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-edge, deploy-frontend]
    steps:
      - name: Edge Health
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.syrabit.ai/health" --max-time 15)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Edge health failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Edge: healthy"

      - name: Chat endpoint (English)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.syrabit.ai/api/ai/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"hello","lang":"en"}' \
            --max-time 30)
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "Chat endpoint error (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Chat EN: HTTP $HTTP_STATUS"

      - name: Frontend reachable
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://syrabit.ai" --max-time 15)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Frontend unreachable (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Frontend: live"

      - name: Summary
        run: echo "All smoke tests passed - deployment complete!"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: failure()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rollback to previous revision
        run: |
          echo "Smoke tests failed - initiating rollback..."
          # Get revisions sorted by creation time (newest first)
          CURRENT=$(az containerapp revision list \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query "sort_by([?properties.active], &properties.createdTime) | [-1].name" -o tsv)
          PREVIOUS=$(az containerapp revision list \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query "sort_by([?properties.active], &properties.createdTime) | [-2].name" -o tsv)
          
          if [ -n "$PREVIOUS" ] && [ -n "$CURRENT" ] && [ "$PREVIOUS" != "$CURRENT" ]; then
            echo "Rolling back: deactivating $CURRENT, activating $PREVIOUS"
            az containerapp revision deactivate \
              --name syrabit-backend \
              --resource-group syrabit-prod \
              --revision "$CURRENT" || true
            az containerapp ingress traffic set \
              --name syrabit-backend \
              --resource-group syrabit-prod \
              --revision-weight "$PREVIOUS=100"
            echo "Rollback complete"
          else
            echo "WARNING: Could not determine previous revision for rollback"
            exit 1
          fi
