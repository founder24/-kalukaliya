name: Deploy Full Stack (Dual-LLM RAG)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-checks:
    name: Quality Gates
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          sed 's/ *\\$//' apps/backend/requirements.txt | grep -v '^\s*--hash' > /tmp/requirements-nohash.txt
          pip install -r /tmp/requirements-nohash.txt
          pip install pytest pytest-asyncio pytest-cov email-validator pytest-env

      - name: Lint Edge
        run: pnpm --filter syrabit-edge exec tsc --noEmit

      - name: Lint Frontend
        run: pnpm --filter @workspace/syrabit exec tsc --noEmit

      - name: Lint Backend
        run: |
          pip install ruff
          ruff check apps/backend/app/

      - name: Test Backend
        run: |
          pytest apps/backend/ --tb=short -q --cov=apps/backend/app --cov-report=term-missing 2>&1 | tee /tmp/pytest-output.txt
          PYTEST_EXIT=$?
          # Parse results
          FAILED=$(grep -oP '\d+ failed' /tmp/pytest-output.txt | grep -oP '\d+' || echo "0")
          PASSED=$(grep -oP '\d+ passed' /tmp/pytest-output.txt | grep -oP '\d+' || echo "0")
          echo "Results: $PASSED passed, $FAILED failed (exit code: $PYTEST_EXIT)"
          # Allow up to 20 known failures (Redis/Upstash unavailable in CI)
          if [ "$FAILED" -gt 0 ]; then
            echo "Test failures detected ($FAILED > 0). Failing CI."
            exit 1
          fi
          if [ "$PASSED" -eq 0 ] && [ "$PYTEST_EXIT" -ne 0 ]; then
            echo "No tests passed and pytest exited with error. Failing CI."
            exit 1
          fi
          echo "All tests passed ($FAILED failures within threshold)."
        env:
          APP_ENV: test
          JWT_SECRET: test-secret-at-least-32-characters-long-for-ci
          MONGODB_URI: mongodb://test:test@localhost:27017

      - name: Test Edge
        run: pnpm --filter syrabit-edge test

      - name: Test Frontend
        run: pnpm --filter @workspace/syrabit test

  deploy-backend:
    name: Deploy Backend
    needs: [ci-checks]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch secrets from Azure KeyVault
        run: |
          set -euo pipefail
          JWT_SECRET=$(az keyvault secret show --vault-name syrabit-prod-kv --name JWT-SECRET --query value -o tsv)
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          MONGODB_URI=$(az keyvault secret show --vault-name syrabit-prod-kv --name MONGO-URI --query value -o tsv)
          echo "::add-mask::$MONGODB_URI"
          echo "MONGODB_URI=$MONGODB_URI" >> "$GITHUB_ENV"
          UPSTASH_REDIS_REST_URL=$(az keyvault secret show --vault-name syrabit-prod-kv --name UPSTASH-REDIS-REST-URL --query value -o tsv)
          echo "::add-mask::$UPSTASH_REDIS_REST_URL"
          echo "UPSTASH_REDIS_REST_URL=$UPSTASH_REDIS_REST_URL" >> "$GITHUB_ENV"
          UPSTASH_REDIS_REST_TOKEN=$(az keyvault secret show --vault-name syrabit-prod-kv --name UPSTASH-REDIS-REST-TOKEN --query value -o tsv)
          echo "::add-mask::$UPSTASH_REDIS_REST_TOKEN"
          echo "UPSTASH_REDIS_REST_TOKEN=$UPSTASH_REDIS_REST_TOKEN" >> "$GITHUB_ENV"
          GOOGLE_APPLICATION_CREDENTIALS_JSON=$(az keyvault secret show --vault-name syrabit-prod-kv --name GOOGLE-APPLICATION-CREDENTIALS-JSON --query value -o tsv)
          echo "::add-mask::$GOOGLE_APPLICATION_CREDENTIALS_JSON"
          echo "GOOGLE_APPLICATION_CREDENTIALS_JSON=$GOOGLE_APPLICATION_CREDENTIALS_JSON" >> "$GITHUB_ENV"
          SARVAM_API_KEY=$(az keyvault secret show --vault-name syrabit-prod-kv --name SARVAM-API-KEY --query value -o tsv)
          echo "::add-mask::$SARVAM_API_KEY"
          echo "SARVAM_API_KEY=$SARVAM_API_KEY" >> "$GITHUB_ENV"
          RAZORPAY_KEY_ID=$(az keyvault secret show --vault-name syrabit-prod-kv --name RAZORPAY-KEY-ID --query value -o tsv)
          echo "::add-mask::$RAZORPAY_KEY_ID"
          echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" >> "$GITHUB_ENV"
          RAZORPAY_KEY_SECRET=$(az keyvault secret show --vault-name syrabit-prod-kv --name RAZORPAY-KEY-SECRET --query value -o tsv)
          echo "::add-mask::$RAZORPAY_KEY_SECRET"
          echo "RAZORPAY_KEY_SECRET=$RAZORPAY_KEY_SECRET" >> "$GITHUB_ENV"
          RAZORPAY_WEBHOOK_SECRET=$(az keyvault secret show --vault-name syrabit-prod-kv --name RAZORPAY-WEBHOOK-SECRET --query value -o tsv)
          echo "::add-mask::$RAZORPAY_WEBHOOK_SECRET"
          echo "RAZORPAY_WEBHOOK_SECRET=$RAZORPAY_WEBHOOK_SECRET" >> "$GITHUB_ENV"
          POSTHOG_API_KEY=$(az keyvault secret show --vault-name syrabit-prod-kv --name POSTHOG-API-KEY --query value -o tsv)
          echo "::add-mask::$POSTHOG_API_KEY"
          echo "POSTHOG_API_KEY=$POSTHOG_API_KEY" >> "$GITHUB_ENV"
          SENTRY_DSN=$(az keyvault secret show --vault-name syrabit-prod-kv --name SENTRY-DSN --query value -o tsv)
          echo "::add-mask::$SENTRY_DSN"
          echo "SENTRY_DSN=$SENTRY_DSN" >> "$GITHUB_ENV"
          ADMIN_JWT_SECRET=$(az keyvault secret show --vault-name syrabit-prod-kv --name ADMIN-JWT-SECRET --query value -o tsv)
          echo "::add-mask::$ADMIN_JWT_SECRET"
          echo "ADMIN_JWT_SECRET=$ADMIN_JWT_SECRET" >> "$GITHUB_ENV"
          VERTEX_PROJECT_ID=$(az keyvault secret show --vault-name syrabit-prod-kv --name VERTEX-PROJECT-ID --query value -o tsv)
          echo "::add-mask::$VERTEX_PROJECT_ID"
          echo "VERTEX_PROJECT_ID=$VERTEX_PROJECT_ID" >> "$GITHUB_ENV"
          AZURE_SEARCH_ENDPOINT=$(az keyvault secret show --vault-name syrabit-prod-kv --name AZURE-SEARCH-ENDPOINT --query value -o tsv)
          echo "::add-mask::$AZURE_SEARCH_ENDPOINT"
          echo "AZURE_SEARCH_ENDPOINT=$AZURE_SEARCH_ENDPOINT" >> "$GITHUB_ENV"
          AZURE_SEARCH_ADMIN_KEY=$(az keyvault secret show --vault-name syrabit-prod-kv --name AZURE-SEARCH-ADMIN-KEY --query value -o tsv)
          echo "::add-mask::$AZURE_SEARCH_ADMIN_KEY"
          echo "AZURE_SEARCH_ADMIN_KEY=$AZURE_SEARCH_ADMIN_KEY" >> "$GITHUB_ENV"
          AZURE_SEARCH_QUERY_KEY=$(az keyvault secret show --vault-name syrabit-prod-kv --name AZURE-SEARCH-QUERY-KEY --query value -o tsv)
          echo "::add-mask::$AZURE_SEARCH_QUERY_KEY"
          echo "AZURE_SEARCH_QUERY_KEY=$AZURE_SEARCH_QUERY_KEY" >> "$GITHUB_ENV"
          RESEND_API_KEY=$(az keyvault secret show --vault-name syrabit-prod-kv --name RESEND-API-KEY --query value -o tsv)
          echo "::add-mask::$RESEND_API_KEY"
          echo "RESEND_API_KEY=$RESEND_API_KEY" >> "$GITHUB_ENV"
          INDEXNOW_API_KEY=$(az keyvault secret show --vault-name syrabit-prod-kv --name INDEXNOW-API-KEY --query value -o tsv)
          echo "::add-mask::$INDEXNOW_API_KEY"
          echo "INDEXNOW_API_KEY=$INDEXNOW_API_KEY" >> "$GITHUB_ENV"
          INDEXNOW_INTERNAL_SECRET=$(az keyvault secret show --vault-name syrabit-prod-kv --name INDEXNOW-INTERNAL-SECRET --query value -o tsv)
          echo "::add-mask::$INDEXNOW_INTERNAL_SECRET"
          echo "INDEXNOW_INTERNAL_SECRET=$INDEXNOW_INTERNAL_SECRET" >> "$GITHUB_ENV"

      - name: Build & Push to ACR
        run: |
          az acr build \
            --registry syrabitacr \
            --resource-group syrabit-prod \
            --image syrabit/backend:${{ github.sha }} \
            --image syrabit/backend:latest \
            --file apps/backend/Dockerfile \
            apps/backend/

      - name: Trivy vulnerability scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          az acr login --name syrabitacr
          trivy image --severity CRITICAL --exit-code 1 --no-progress syrabitacr.azurecr.io/syrabit/backend:${{ github.sha }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --image syrabitacr.azurecr.io/syrabit/backend:${{ github.sha }} \
            --set-env-vars \
              "JWT_SECRET=${{ env.JWT_SECRET }}" \
              "MONGODB_URI=${{ env.MONGODB_URI }}" \
              "UPSTASH_REDIS_REST_URL=${{ env.UPSTASH_REDIS_REST_URL }}" \
              "UPSTASH_REDIS_REST_TOKEN=${{ env.UPSTASH_REDIS_REST_TOKEN }}" \
              "GOOGLE_APPLICATION_CREDENTIALS_JSON=${{ env.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" \
              "SARVAM_API_KEY=${{ env.SARVAM_API_KEY }}" \
              "RAZORPAY_KEY_ID=${{ env.RAZORPAY_KEY_ID }}" \
              "RAZORPAY_KEY_SECRET=${{ env.RAZORPAY_KEY_SECRET }}" \
              "RAZORPAY_WEBHOOK_SECRET=${{ env.RAZORPAY_WEBHOOK_SECRET }}" \
              "POSTHOG_API_KEY=${{ env.POSTHOG_API_KEY }}" \
              "SENTRY_DSN=${{ env.SENTRY_DSN }}" \
              "ADMIN_JWT_SECRET=${{ env.ADMIN_JWT_SECRET }}" \
              "VERTEX_PROJECT_ID=${{ env.VERTEX_PROJECT_ID }}" \
              "AZURE_SEARCH_ENDPOINT=${{ env.AZURE_SEARCH_ENDPOINT }}" \
              "AZURE_SEARCH_ADMIN_KEY=${{ env.AZURE_SEARCH_ADMIN_KEY }}" \
              "AZURE_SEARCH_QUERY_KEY=${{ env.AZURE_SEARCH_QUERY_KEY }}" \
              "RESEND_API_KEY=${{ env.RESEND_API_KEY }}" \
              "INDEXNOW_API_KEY=${{ env.INDEXNOW_API_KEY }}" \
              "INDEXNOW_INTERNAL_SECRET=${{ env.INDEXNOW_INTERNAL_SECRET }}" \
              "RESET_TOKEN_SECRET=${{ secrets.RESET_TOKEN_SECRET }}" \
              "TRANSLATE_CRON_SECRET=${{ secrets.TRANSLATE_CRON_SECRET }}" \
              "APP_ENV=production"

      - name: Wait for healthy revision
        run: |
          FQDN=$(az containerapp show \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "Polling https://${FQDN}/health for up to 150 seconds..."
          for i in $(seq 1 30); do
            if curl -sf "https://${FQDN}/health" --max-time 5; then
              echo ""
              echo "Backend healthy after $((i * 5)) seconds"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 5s..."
            sleep 5
          done
          echo "Backend failed to become healthy within 150 seconds"
          exit 1

  deploy-edge:
    name: Deploy Edge
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Guard: check for KV sentinel IDs"
        run: |
          if grep -v '^\s*#' apps/edge/wrangler.toml | grep -qi 'REPLACE_ME'; then
            echo "ERROR: wrangler.toml still contains sentinel KV namespace IDs."
            echo "You MUST replace ISR_CACHE_KV REPLACE_ME IDs before deploying."
            echo "Run: npx wrangler kv:namespace create ISR_CACHE_KV"
            exit 1
          fi
          echo "All KV namespace IDs are properly configured."

      - name: Deploy Worker
        run: pnpm --filter syrabit-edge exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-frontend:
    name: Deploy Frontend
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=syrabitfrontend

      - name: Submit URLs to IndexNow
        run: node apps/frontend/scripts/indexnow-submit.mjs
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-edge, deploy-frontend]
    steps:
      - name: Edge Health
        run: |
          for attempt in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.syrabit.ai/health" --max-time 15)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Edge: healthy (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt/3 failed (HTTP $HTTP_STATUS), retrying in 10s..."
            sleep 10
          done
          echo "Edge health failed after 3 attempts"
          exit 1

      - name: Chat endpoint (English)
        run: |
          START_TIME=$(date +%s%N)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.syrabit.ai/api/v1/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"hello","lang":"en"}' \
            --max-time 30)
          END_TIME=$(date +%s%N)
          ELAPSED_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          echo "Chat EN: HTTP $HTTP_STATUS (${ELAPSED_MS}ms)"
          # Accept 401/403 as valid (endpoint alive, auth working via Turnstile)
          # Only fail on 5xx or timeout
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "Chat endpoint server error (HTTP $HTTP_STATUS)"
            exit 1
          fi
          if [ "$ELAPSED_MS" -gt 5000 ]; then
            echo "WARNING: Response took ${ELAPSED_MS}ms (> 5000ms latency threshold)"
          fi

      - name: Chat endpoint (Assamese - Sarvam AI routing)
        run: |
          START_TIME=$(date +%s%N)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.syrabit.ai/api/v1/chat/stream" \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            -d '{"message":"নমস্কাৰ","lang":"as"}' \
            --max-time 30)
          END_TIME=$(date +%s%N)
          ELAPSED_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          echo "Chat AS (Assamese/Sarvam): HTTP $HTTP_STATUS (${ELAPSED_MS}ms)"
          # Accept 401/403 as valid (endpoint alive, auth working via Turnstile)
          # Only fail on 5xx or timeout
          if [ "$HTTP_STATUS" -ge 500 ]; then
            echo "Assamese chat endpoint server error (HTTP $HTTP_STATUS)"
            exit 1
          fi
          if [ "$ELAPSED_MS" -gt 5000 ]; then
            echo "WARNING: Assamese response took ${ELAPSED_MS}ms (> 5000ms latency threshold)"
          fi

      - name: Frontend reachable
        run: |
          for attempt in 1 2 3; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://syrabit.ai" --max-time 15)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Frontend: live (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt/3 failed (HTTP $HTTP_STATUS), retrying in 10s..."
            sleep 10
          done
          echo "Frontend unreachable after 3 attempts"
          exit 1

      - name: Summary
        run: echo "All smoke tests passed - deployment complete!"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-edge, deploy-frontend, smoke-test]
    if: always() && (needs.smoke-test.result == 'failure' || needs.deploy-backend.result == 'failure' || needs.deploy-edge.result == 'failure' || needs.deploy-frontend.result == 'failure')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rollback backend to previous revision
        run: |
          echo "Smoke tests failed - initiating backend rollback..."
          # Get revisions sorted by creation time (newest first)
          CURRENT=$(az containerapp revision list \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query "sort_by([?properties.active], &properties.createdTime) | [-1].name" -o tsv)
          PREVIOUS=$(az containerapp revision list \
            --name syrabit-backend \
            --resource-group syrabit-prod \
            --query "sort_by([?properties.active], &properties.createdTime) | [-2].name" -o tsv)
          
          if [ -n "$PREVIOUS" ] && [ -n "$CURRENT" ] && [ "$PREVIOUS" != "$CURRENT" ]; then
            echo "Rolling back: deactivating $CURRENT, activating $PREVIOUS"
            az containerapp revision deactivate \
              --name syrabit-backend \
              --resource-group syrabit-prod \
              --revision "$CURRENT" || true
            az containerapp ingress traffic set \
              --name syrabit-backend \
              --resource-group syrabit-prod \
              --revision-weight "$PREVIOUS=100"
            echo "Backend rollback complete"
          else
            echo "WARNING: Could not determine previous revision for rollback"
            exit 1
          fi

      # NOTE: Edge (Cloudflare Workers) and Frontend (Cloudflare Pages) use
      # Cloudflare's automatic rollback mechanism. Previous deployments are
      # retained and can be rolled back via the Cloudflare dashboard or API.
      # No automated rollback step is needed here for edge/frontend.
