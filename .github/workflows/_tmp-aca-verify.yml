name: _tmp-aca-verify
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ACR_NAME:       ${{ vars.AZURE_ACR_NAME }}
  ACA_APP:              syrabit-backend
  ACA_ENV:              ${{ vars.AZURE_ACA_ENV }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: "1 — Container App: overall status"
        run: |
          echo "========================================"
          echo "  ACA APP STATUS: $ACA_APP"
          echo "========================================"
          az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '{name:name, location:location, provisioningState:properties.provisioningState, runningStatus:properties.runningStatus, latestRevision:properties.latestRevisionName, latestReady:properties.latestReadyRevisionName, fqdn:properties.configuration.ingress.fqdn}' \
            --output table

      - name: "2 — Active revisions"
        run: |
          echo "========================================"
          echo "  REVISIONS"
          echo "========================================"
          az containerapp revision list \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[].{name:name, active:properties.active, traffic:properties.trafficWeight, replicas:properties.replicas, healthState:properties.healthState, created:properties.createdTime}' \
            --output table

      - name: "3 — Latest image in ACR"
        run: |
          echo "========================================"
          echo "  LATEST IMAGE: syrabit/backend"
          echo "========================================"
          az acr repository show-tags \
            --name "$AZURE_ACR_NAME" \
            --repository "syrabit/backend" \
            --orderby time_desc \
            --top 5 \
            --output table

      - name: "4 — Container App environment health"
        run: |
          echo "========================================"
          echo "  ACA ENVIRONMENT: $ACA_ENV"
          echo "========================================"
          az containerapp env show \
            --name "$ACA_ENV" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '{name:name, provisioningState:properties.provisioningState, location:location}' \
            --output table

      - name: "5 — Ingress + traffic config"
        run: |
          echo "========================================"
          echo "  INGRESS / TRAFFIC"
          echo "========================================"
          az containerapp ingress show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --output json | python3 -c "
import json,sys
d=json.load(sys.stdin)
print('External:', d.get('external'))
print('Target port:', d.get('targetPort'))
print('Transport:', d.get('transport'))
print('FQDN:', d.get('fqdn','N/A'))
for t in d.get('traffic',[]):
    print(f\"  Traffic: weight={t.get('weight')} latestRevision={t.get('latestRevision')}\")
"

      - name: "6 — Env vars present on running container (key names only)"
        run: |
          echo "========================================"
          echo "  ENV VAR KEYS (no values)"
          echo "========================================"
          az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].env[].name' \
            --output tsv | sort

      - name: "7 — Recent container logs (last 80 lines)"
        run: |
          echo "========================================"
          echo "  CONTAINER LOGS (tail 80)"
          echo "========================================"
          az containerapp logs show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --tail 80 \
            --follow false \
            --output table 2>/dev/null || \
          az containerapp logs show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --tail 80 2>/dev/null || echo "(logs not available via CLI — check Log Analytics)"

      - name: "8 — Live HTTP health probes"
        run: |
          echo "========================================"
          echo "  HTTP HEALTH PROBES"
          echo "========================================"
          PROD_FQDN="api.syrabit.ai"

          for ENDPOINT in "/api/health" "/api/readyz"; do
            echo -n "  GET https://${PROD_FQDN}${ENDPOINT} → "
            CODE=$(curl -s -o /tmp/hresp -w "%{http_code}" --max-time 10 "https://${PROD_FQDN}${ENDPOINT}")
            echo "HTTP $CODE"
            cat /tmp/hresp | python3 -m json.tool 2>/dev/null | head -20
            echo ""
          done

      - name: "9 — Live chat smoke test (POST /api/ai/chat)"
        run: |
          echo "========================================"
          echo "  CHAT SMOKE TEST"
          echo "========================================"
          RESP=$(curl -s -X POST "https://api.syrabit.ai/api/ai/chat" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -d '{"message":"What is the law of inertia?","subject_id":"physics","chapter_id":"ch1","session_id":"aca-verify-smoke"}')
          echo "$RESP" | python3 -m json.tool 2>/dev/null
          ANSWER=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('answer','')[:100])" 2>/dev/null)
          PROVIDER=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('meta',{}).get('provider','?'))" 2>/dev/null)
          if echo "$ANSWER" | grep -qi "inertia\|force\|motion\|newton\|object"; then
            echo ""
            echo "✅  CHAT OK — provider=$PROVIDER answer_preview='${ANSWER}'"
          else
            echo ""
            echo "❌  CHAT FAILED — raw_answer='${ANSWER}'"
            exit 1
          fi

      - name: "10 — ACR connectivity from ACA (image pull check)"
        run: |
          echo "========================================"
          echo "  ACR IDENTITY BINDING"
          echo "========================================"
          az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'identity' \
            --output json | python3 -c "
import json,sys
d=json.load(sys.stdin)
print('Identity type:', d.get('type','none'))
ids = d.get('userAssignedIdentities',{})
if ids:
    for k in ids:
        print('  UA identity:', k.split('/')[-1])
else:
    print('  (system-assigned or no managed identity)')
"
          echo ""
          echo "--- ACR admin / service connection ---"
          az acr check-health \
            --name "$AZURE_ACR_NAME" \
            --ignore-errors \
            --yes 2>&1 | tail -20

      - name: "Summary"
        if: always()
        run: |
          echo "========================================"
          echo "  VERIFICATION COMPLETE"
          echo "========================================"
          echo "Resource group : $AZURE_RESOURCE_GROUP"
          echo "ACA app        : $ACA_APP"
          echo "ACA env        : $ACA_ENV"
          echo "ACR            : $AZURE_ACR_NAME"
          echo "Run at         : $(date -u)"
