name: _tmp-aca-verify
"on":
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ACR_NAME:       ${{ vars.AZURE_ACR_NAME }}
  ACA_APP:              syrabit-backend
  ACA_ENV:              ${{ vars.AZURE_ACA_ENV }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: "1 — ACA app status"
        run: |
          az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '{provisioningState:properties.provisioningState,runningStatus:properties.runningStatus,latestRevision:properties.latestRevisionName,latestReady:properties.latestReadyRevisionName,fqdn:properties.configuration.ingress.fqdn}' \
            --output table
      - name: "2 — Active revisions & traffic"
        run: |
          az containerapp revision list \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[].{name:name,active:properties.active,traffic:properties.trafficWeight,replicas:properties.replicas,healthState:properties.healthState,created:properties.createdTime}' \
            --output table
      - name: "3 — Latest ACR image tags"
        run: |
          az acr repository show-tags \
            --name "$AZURE_ACR_NAME" \
            --repository syrabit/backend \
            --orderby time_desc --top 5 --output table
      - name: "4 — ACA env vars present (key names)"
        run: |
          az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].env[].name' \
            --output tsv | sort
      - name: "5 — Container logs (tail 60)"
        run: |
          az containerapp logs show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --tail 60 --follow false 2>/dev/null || echo "(log stream unavailable)"
      - name: "6 — HTTP health probes"
        run: |
          for EP in /api/health /api/readyz; do
            echo -n "GET https://api.syrabit.ai${EP} → "
            curl -s -o /tmp/r -w "HTTP %{http_code}" --max-time 10 "https://api.syrabit.ai${EP}"
            echo ""; cat /tmp/r | python3 -m json.tool 2>/dev/null | head -12; echo ""
          done
      - name: "7 — Chat smoke test"
        run: |
          RESP=$(curl -s -X POST https://api.syrabit.ai/api/ai/chat \
            -H "Content-Type: application/json" --max-time 30 \
            -d '{"message":"What is the law of inertia?","subject_id":"physics","chapter_id":"ch1","session_id":"aca-az-verify"}')
          echo "$RESP" | python3 -m json.tool 2>/dev/null
          ANS=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('answer',''))" 2>/dev/null)
          PRV=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('meta',{}).get('provider','?'))" 2>/dev/null)
          echo "--- provider=$PRV ---"
          if echo "$ANS" | grep -qi "inertia\|force\|motion\|newton"; then
            echo "CHAT_OK"
          else
            echo "CHAT_FAIL: $ANS"; exit 1
          fi
      - name: "8 — Managed identity binding"
        run: |
          az containerapp show \
            --name "$ACA_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'identity' --output json | python3 -c "
import json,sys
d=json.load(sys.stdin)
print('type:', d.get('type'))
for k in d.get('userAssignedIdentities',{}):
    print('  UA:', k.split('/')[-1])
"
      - name: Summary
        if: always()
        run: |
          echo "RG=$AZURE_RESOURCE_GROUP APP=$ACA_APP ACR=$AZURE_ACR_NAME ENV=$ACA_ENV ts=$(date -u)"
