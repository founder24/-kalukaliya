name: Fix — Update CF_API_TOKEN in GCP Secret Manager

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  update-cf-token:
    name: Update CF_API_TOKEN in GCP SM + restart Cloud Run
    runs-on: ubuntu-latest
    env:
      PROJECT: blissful-acumen-495019-t6
      REGION: asia-south1
    steps:
      - name: Authenticate to GCP (SA Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update CF_API_TOKEN in Secret Manager
        run: |
          printf '%s' '${{ secrets.CF_WORKER_AI_TOKEN }}' | \
            gcloud secrets versions add CF_API_TOKEN \
              --data-file=- \
              --project="$PROJECT"
          echo "✅ CF_API_TOKEN updated in Secret Manager"

      - name: Update Cloud Run to use new secret version
        run: |
          gcloud run services update syrabit-backend \
            --region="$REGION" \
            --project="$PROJECT" \
            --update-secrets=CF_API_TOKEN=CF_API_TOKEN:latest,CF_WORKER_AI_TOKEN=CF_API_TOKEN:latest \
            --quiet
          echo "✅ Cloud Run updated with new CF_API_TOKEN"

      - name: Wait for Cloud Run to stabilize
        run: sleep 20

      - name: Verify English chat uses CF Workers AI
        run: |
          echo "Testing English chat endpoint..."
          RESPONSE=$(curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "Origin: https://syrabit.ai" \
            "https://api.syrabit.ai/api/v1/chat/" \
            -d '{"message": "What is Newton second law?", "lang": "en"}' \
            --max-time 15 2>/dev/null || echo '{}')
          
          MODEL=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('model_used','unknown'))" 2>/dev/null || echo "parse_error")
          LATENCY=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('latency_ms',0))" 2>/dev/null || echo "0")
          
          echo "model_used: $MODEL"
          echo "latency_ms: $LATENCY"
          
          if echo "$MODEL" | grep -q "llama\|cf/meta\|@cf"; then
            echo "✅ English chat is using CF Workers AI — PASS"
          else
            echo "⚠ model_used=$MODEL — may still be on fallback"
            echo "Response snippet: $(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(str(d.get('response',''))[:100])" 2>/dev/null)"
          fi
