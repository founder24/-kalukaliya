name: Seed CF-AI-GATEWAY-TOKEN into Key Vault (one-shot)

on:
  workflow_dispatch:
    inputs:
      vault:
        description: "Key Vault name"
        required: true
        default: syrabit-prod-kv
        type: string

concurrency:
  group: seed-kv-cf-ai-gateway-token
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Azure login (OIDC, no client secret)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write CF-AI-GATEWAY-TOKEN to Key Vault
        env:
          VAULT: ${{ inputs.vault }}
          CF_AI_GATEWAY_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          printf '%s' "$CF_AI_GATEWAY_TOKEN" > "$tmp"
          az keyvault secret set \
            --vault-name "$VAULT" \
            --name "CF-AI-GATEWAY-TOKEN" \
            --file "$tmp" \
            --output none
          rm -f "$tmp"
          echo "✓ CF-AI-GATEWAY-TOKEN set in $VAULT"

      - name: Verify secret is present
        env:
          VAULT: ${{ inputs.vault }}
        run: |
          az keyvault secret show \
            --vault-name "$VAULT" \
            --name "CF-AI-GATEWAY-TOKEN" \
            --query id -o tsv
          echo "✓ verified CF-AI-GATEWAY-TOKEN in $VAULT"
