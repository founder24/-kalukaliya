name: Smoke Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke-test:
    name: Full-stack smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BASE_URL: https://api.syrabit.ai
      FRONTEND_URL: https://syrabit.ai
      DIRECT_URL: https://syrabit-backend-bl6wu3psza-el.a.run.app

    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployment to stabilise
        run: sleep 20

      - name: Make test script executable
        run: chmod +x scripts/fullstack-smoke-test.sh

      - name: Run full-stack smoke tests
        run: bash scripts/fullstack-smoke-test.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Full-stack smoke tests FAILED."
          echo "::error::Check $BASE_URL/api/v1/health and $BASE_URL/api/v1/content/library-bundle"
