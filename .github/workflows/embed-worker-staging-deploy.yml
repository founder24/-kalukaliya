name: embed-worker-staging-deploy

#
# Task #437 — Automate the four-shape embed-worker smoke check on every
# staging deploy. The README's manual `pnpm run deploy:staging` + `curl`
# probe was getting skipped under time pressure, defeating the point of
# having a staging canary in front of the Pinecone-1024 production worker.
# Wrapping it in CI makes the canary self-policing: a non-1024 `dims`,
# a missing `-staging` version suffix, or a non-401 unauthorized POST
# fails the workflow with a red check on the PR.
#
# Pipeline (push to Replit-agent/main with embed-worker/** changed):
#
#   deploy-staging ──► smoke-staging
#                              │
#                              ▼
#                       (red check on fail)
#
# 1. deploy-staging
#      `wrangler deploy --env staging` against
#      syrabit-embed-worker-staging (route embed-staging.syrabit.ai/*).
#      Authenticated via CLOUDFLARE_API_TOKEN (Workers Scripts:Edit on
#      the Syrabit account) + CLOUDFLARE_ACCOUNT_ID.
#
# 2. smoke-staging
#      Runs `scripts/smoke.sh staging` which executes the four-shape
#      probe documented in README.md:
#        /health     → 200, dims=1024, version ends in `-staging`
#        /version    → echoes /health's dims + version (with -staging)
#        POST /embed → 401 without X-Embed-Secret
#        POST /embed → 1024-dim vectors with the secret
#      A failed assertion exits non-zero, which fails the job and
#      blocks the staging deploy from being silently considered green.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN          — Workers Scripts:Edit on the Syrabit
#                                   account (same token used by
#                                   edge-proxy-deploy.yml).
#   CLOUDFLARE_ACCOUNT_ID         — the account ID Wrangler should target.
#   EMBED_STAGING_SHARED_SECRET   — value pushed to the staging worker via
#                                   `wrangler secret put EMBED_SHARED_SECRET
#                                   --env staging`. Distinct from the
#                                   production EMBED_SHARED_SECRET so
#                                   leaking the staging value cannot
#                                   authenticate against prod (Task #400
#                                   threat model).
#
# Supply-chain note: every `uses:` is pinned to a 40-char commit SHA,
# matching the policy enforced by .github/workflows/pinned-actions-check.yml.

on:
  push:
    branches: [Replit-agent, main]
    paths:
      - "artifacts/syrabit/workers/embed-worker/**"
      - ".github/workflows/embed-worker-staging-deploy.yml"
  workflow_dispatch:

# Serialize embed-worker staging deploys so two pushes back-to-back don't
# race wrangler against itself (Cloudflare rejects concurrent deploys to
# the same Worker with a 4xx, which would falsely fail the second build).
concurrency:
  group: embed-worker-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging:
    name: wrangler deploy --env staging
    if: github.ref == 'refs/heads/Replit-agent' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: artifacts/syrabit/workers/embed-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Strip the GITHUB_TOKEN from .git/config after checkout — this
          # pipeline drives wrangler with CLOUDFLARE_API_TOKEN; it does
          # not push back to the repo.
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Verify Cloudflare credentials present
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repo secret is not set."
            exit 1
          fi

      - name: Install wrangler (no workspace lockfile in this package)
        run: pnpm install --ignore-workspace

      - name: wrangler deploy --env staging
        run: pnpm run deploy:staging

  smoke-staging:
    name: smoke-test embed-staging.syrabit.ai
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: artifacts/syrabit/workers/embed-worker
    env:
      # scripts/smoke.sh staging reads EMBED_STAGING_SHARED_SECRET — must
      # match the value pushed to the worker via
      # `wrangler secret put EMBED_SHARED_SECRET --env staging`.
      EMBED_STAGING_SHARED_SECRET: ${{ secrets.EMBED_STAGING_SHARED_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python (smoke.sh shells out to python3)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Verify smoke secret present
        run: |
          if [ -z "${EMBED_STAGING_SHARED_SECRET}" ]; then
            echo "::error::EMBED_STAGING_SHARED_SECRET repo secret is not set — smoke would fall back to a 401 even on the authed call. Push it via Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Smoke check (four-shape probe)
        id: smoke
        run: |
          set -o pipefail
          # Stream live output to the build log via tee while persisting
          # the run for the GitHub-UI summary line.
          summary_file="$RUNNER_TEMP/embed-smoke-summary.txt"
          # Merge stderr into the captured stream — smoke.sh writes
          # `FAIL: …` assertion lines to stderr, so without 2>&1 the
          # ::error:: notice would always fall back to the generic
          # message instead of the specific failing assertion.
          ./scripts/smoke.sh staging 2>&1 | tee "$summary_file"
          status=${PIPESTATUS[0]}
          # The script's terminal line is `=== PASS (staging) ===` on
          # success, or a `FAIL: …` line written to stderr on first
          # assertion failure. Pull whichever applies for the GH notice.
          if [ "$status" -eq 0 ]; then
            last_line=$(grep -E '^=== PASS' "$summary_file" | tail -n1 || true)
            [ -n "$last_line" ] || last_line='smoke passed (no summary line captured — see step log)'
            echo "::notice title=embed-worker staging smoke::${last_line}"
          else
            last_line=$(grep -E '^FAIL:' "$summary_file" | tail -n1 || true)
            [ -n "$last_line" ] || last_line='smoke failed (see step log for the failing assertion)'
            echo "::error title=embed-worker staging smoke FAILED::${last_line}"
          fi
          exit "$status"
