name: ACA — probe ORIGIN_SHARED_SECRET (one-shot, find what the container has)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  APP_NAME: syrabit-backend
  VAULT: syrabit-prod-kv
  ACA_BASE: https://syrabit-backend.lemonstone-ce3c87e1.eastus.azurecontainerapps.io

jobs:
  probe:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect ACA container app secret wiring
        run: |
          set -euo pipefail
          echo "=== running revision name ==="
          az containerapp show -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "properties.{latest:properties.latestRevisionName,active:properties.latestReadyRevisionName}" -o json || true
          az containerapp revision list -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "sort_by(@,&properties.createdTime)[-3:].{name:name,health:properties.healthState,active:properties.active,traffic:properties.trafficWeight,created:properties.createdTime}" -o table

          echo ""
          echo "=== ACA secrets ==="
          az containerapp secret list -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "[].{name:name,kvUrl:keyVaultUrl,identity:identity}" -o table

          echo ""
          echo "=== Specifically: origin-shared-secret wiring ==="
          az containerapp secret list -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='origin-shared-secret']" -o json

          echo ""
          echo "=== container env var ORIGIN_SHARED_SECRET (should be a secretRef) ==="
          az containerapp show -n "$APP_NAME" -g "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='ORIGIN_SHARED_SECRET']" -o json

      - name: Try every KV version against the LIVE direct-ACA endpoint
        run: |
          set -euo pipefail
          # If the running container's secret is a literal (drifted), no KV
          # version will match. If it's a keyVaultUrl ref locked to a
          # specific version, only that version matches.
          VERSIONS=$(az keyvault secret list-versions \
            --vault-name "$VAULT" --name "ORIGIN-SHARED-SECRET" \
            --query "sort_by(@,&attributes.created)[*].{id:id,created:attributes.created,enabled:attributes.enabled}" -o json)
          COUNT=$(echo "$VERSIONS" | jq 'length')
          echo "trying $COUNT KV versions against $ACA_BASE/api/ai/chat ..."

          MATCH=""
          # Iterate newest-first
          for i in $(seq $((COUNT-1)) -1 0); do
            ID=$(echo "$VERSIONS" | jq -r ".[$i].id")
            T=$(echo "$VERSIONS" | jq -r ".[$i].created")
            E=$(echo "$VERSIONS" | jq -r ".[$i].enabled")
            VAL=$(az keyvault secret show --id "$ID" --query value -o tsv 2>/dev/null || echo "")
            if [ -z "$VAL" ]; then
              echo "  v[$i] $T enabled=$E — could not fetch (skip)"
              continue
            fi
            echo "::add-mask::$VAL"
            CODE=$(curl -sS -o /tmp/b -w "%{http_code}" \
              -X POST "$ACA_BASE/api/ai/chat" \
              -H "Content-Type: application/json" \
              -H "X-Origin-Auth: $VAL" \
              -d '{"message":"ping"}')
            DEN=$(grep -c "Direct origin access denied" /tmp/b 2>/dev/null || echo 0)
            echo "  v[$i] $T enabled=$E len=${#VAL}  →  HTTP $CODE OriginGate-denied=$DEN"
            if [ "$DEN" = "0" ]; then
              MATCH="$ID"
              echo "  >>> MATCH: KV version $ID at $T is what the running container has."
              break
            fi
          done

          if [ -z "$MATCH" ]; then
            echo ""
            echo "::warning::No KV version matched. The container ORIGIN_SHARED_SECRET is either a LITERAL (drifted away from keyVaultUrl) or wired to a different KV/secret. Output of the secret-wiring step above tells you which."
          fi
