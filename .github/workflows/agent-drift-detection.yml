name: "Agent: Drift Detection"

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily 6AM UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: drift-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  drift-detection:
    name: Configuration Drift Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run four-cloud delegation drift check
        id: cloud-drift
        continue-on-error: true
        run: |
          chmod +x .github/scripts/four_cloud_delegation_drift.sh
          .github/scripts/four_cloud_delegation_drift.sh

      - name: Run environment variable sync check
        id: env-sync
        continue-on-error: true
        run: |
          chmod +x .github/scripts/check-env-sync.sh
          .github/scripts/check-env-sync.sh 2>&1 | tee env-sync-report.txt

      - name: Validate wrangler.toml
        id: wrangler-check
        continue-on-error: true
        run: |
          WRANGLER="apps/edge/wrangler.toml"
          ERRORS=""

          if [ ! -f "$WRANGLER" ]; then
            echo "ERROR: $WRANGLER not found"
            exit 1
          fi

          if ! grep -q '^name\s*=' "$WRANGLER"; then
            ERRORS="${ERRORS}Missing required field: name\n"
          fi

          if ! grep -q '^main\s*=' "$WRANGLER"; then
            ERRORS="${ERRORS}Missing required field: main\n"
          fi

          if ! grep -q '^compatibility_date\s*=' "$WRANGLER"; then
            ERRORS="${ERRORS}Missing required field: compatibility_date\n"
          fi

          if [ -n "$ERRORS" ]; then
            echo -e "wrangler.toml validation failures:\n$ERRORS"
            exit 1
          fi

          echo "OK: wrangler.toml has all required fields"

      - name: Comment findings on PR
        if: github.event_name == 'pull_request' && (steps.cloud-drift.outcome == 'failure' || steps.env-sync.outcome == 'failure' || steps.wrangler-check.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## :mag: Drift Detection Findings\n\n';

            if ('${{ steps.cloud-drift.outcome }}' === 'failure') {
              body += '### :rotating_light: Four-Cloud Delegation Drift\n';
              body += 'The four-cloud delegation matrix has been violated.\n';
              body += 'See `infra/four-cloud-delegation.md` for allowed patterns.\n\n';
            }

            if ('${{ steps.env-sync.outcome }}' === 'failure') {
              body += '### :warning: Environment Variable Sync\n';
              try {
                const report = fs.readFileSync('env-sync-report.txt', 'utf8');
                const lines = report.split('\n').slice(-15).join('\n');
                body += '```\n' + lines + '\n```\n\n';
              } catch (e) {
                body += 'Environment variables are out of sync with `.env.shared`.\n\n';
              }
            }

            if ('${{ steps.wrangler-check.outcome }}' === 'failure') {
              body += '### :warning: Wrangler Configuration\n';
              body += '`apps/edge/wrangler.toml` is missing required fields (name, main, compatibility_date).\n\n';
            }

            body += '---\n*Generated by agent-drift-detection workflow*';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Create issue on scheduled run
        if: github.event_name == 'schedule' && (steps.cloud-drift.outcome == 'failure' || steps.env-sync.outcome == 'failure' || steps.wrangler-check.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            let body = '## Daily Drift Detection Report\n\n';
            body += `**Date:** ${new Date().toISOString()}\n\n`;

            if ('${{ steps.cloud-drift.outcome }}' === 'failure') {
              body += '- :rotating_light: **Four-cloud delegation drift detected**\n';
            }
            if ('${{ steps.env-sync.outcome }}' === 'failure') {
              body += '- :warning: **Environment variables out of sync**\n';
            }
            if ('${{ steps.wrangler-check.outcome }}' === 'failure') {
              body += '- :warning: **Wrangler.toml missing required fields**\n';
            }

            body += '\n---\n*Auto-created by daily drift detection*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift] Configuration drift detected - ${new Date().toISOString().split('T')[0]}`,
              body: body,
              labels: ['drift', 'agent-created']
            });

      - name: Fail if any check failed
        if: steps.cloud-drift.outcome == 'failure' || steps.env-sync.outcome == 'failure' || steps.wrangler-check.outcome == 'failure'
        run: |
          echo "Drift detected. See above for details."
          exit 1
