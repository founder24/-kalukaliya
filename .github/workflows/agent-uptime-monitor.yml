name: "Agent: Uptime Monitor"

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  # repository_dispatch requires contents: write. The dispatch step is still
  # best-effort so a repository policy or token scope cannot hide probe data.
  contents: write
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  uptime-check:
    name: Check Production Endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make uptime script executable
        run: chmod +x scripts/uptime-check.sh

      - name: Run uptime check
        id: uptime
        continue-on-error: true
        run: |
          set +e
          OUTPUT=$(bash scripts/uptime-check.sh 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Handle endpoint failure
        if: steps.uptime.outputs.exit_code != '0'
        id: incident
        continue-on-error: true
        env:
          CHECK_OUTPUT: ${{ steps.uptime.outputs.output }}
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toISOString();
            const output = process.env.CHECK_OUTPUT || 'No probe output captured';

            // Search for existing open incident issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
            });

            if (issues.length === 0) {
              // Create new incident issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Incident: Production endpoints down - ${timestamp}`,
                body: [
                  '## Production Incident',
                  '',
                  `**Detected at:** ${timestamp}`,
                  '',
                  '### Failed Endpoints',
                  '```',
                  output,
                  '```',
                  '',
                  '### Actions',
                  '- [ ] Investigate root cause',
                  '- [ ] Apply fix',
                  '- [ ] Verify recovery',
                  '',
                  '---',
                  '*Auto-created by agent-uptime-monitor workflow*',
                ].join('\n'),
                labels: ['incident', 'P0', 'agent-created'],
              });

              core.info('Created new incident issue');
            } else {
              // Comment on existing incident
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `### Still down at ${timestamp}\n\`\`\`\n${output}\n\`\`\``,
              });

              core.info(`Updated existing incident issue #${issues[0].number}`);
            }

      - name: Dispatch endpoint-down event
        if: steps.uptime.outputs.exit_code != '0'
        id: dispatch
        continue-on-error: true
        env:
          CHECK_OUTPUT: ${{ steps.uptime.outputs.output }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'endpoint-down',
              client_payload: {
                timestamp: new Date().toISOString(),
                exit_code: '${{ steps.uptime.outputs.exit_code }}',
                check_output: process.env.CHECK_OUTPUT || 'No probe output captured',
              },
            });

      - name: Alert via webhook
        if: steps.uptime.outputs.exit_code != '0'
        id: webhook
        continue-on-error: true
        run: |
          curl -sf -X POST "${{ secrets.ALERT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"ALERT: Syrabit production endpoints are DOWN\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"down\"}"

      - name: Handle recovery
        if: steps.uptime.outputs.exit_code == '0'
        id: recovery
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toISOString();

            // Search for existing open incident issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
            });

            if (issues.length > 0) {
              for (const issue of issues) {
                // Comment with resolution
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `:white_check_mark: **Resolved at ${timestamp}**\n\nAll production endpoints are healthy again.`,
                });

                // Close the issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });

                core.info(`Closed incident issue #${issue.number}`);
              }
            }

      - name: Summarize endpoint and notification results
        if: always()
        env:
          ENDPOINT_EXIT_CODE: ${{ steps.uptime.outputs.exit_code }}
          INCIDENT_RESULT: ${{ steps.incident.outcome }}
          DISPATCH_RESULT: ${{ steps.dispatch.outcome }}
          WEBHOOK_RESULT: ${{ steps.webhook.outcome }}
          RECOVERY_RESULT: ${{ steps.recovery.outcome }}
        run: |
          {
            echo "## Production uptime monitor"
            echo ""
            echo "### Endpoint result"
            if [[ "$ENDPOINT_EXIT_CODE" == "0" ]]; then
              echo "- **HEALTHY** — all production endpoints responded successfully."
            else
              echo "- **DOWN** — one or more production endpoints failed (exit code: ${ENDPOINT_EXIT_CODE:-unknown})."
            fi
            echo ""
            echo "### Notification result (non-blocking)"
            echo "- Incident issue: ${INCIDENT_RESULT:-not run}"
            echo "- Repository dispatch: ${DISPATCH_RESULT:-not run}"
            echo "- Webhook: ${WEBHOOK_RESULT:-not run}"
            echo "- Recovery issue update: ${RECOVERY_RESULT:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$ENDPOINT_EXIT_CODE" != "0" ]]; then
            echo "::error title=Endpoint failure::Production uptime probes failed. Notification failures, if any, are reported separately above."
            exit 1
          fi

          for result in "$INCIDENT_RESULT" "$DISPATCH_RESULT" "$WEBHOOK_RESULT" "$RECOVERY_RESULT"; do
            if [[ "$result" == "failure" ]]; then
              echo "::warning title=Notification failure::An escalation or recovery notification was unavailable, but endpoint health passed."
              break
            fi
          done
