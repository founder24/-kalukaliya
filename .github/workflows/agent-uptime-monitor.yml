name: "Agent: Uptime Monitor"

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: true

jobs:
  uptime-check:
    name: Check Production Endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Make uptime script executable
        run: chmod +x scripts/uptime-check.sh

      - name: Run uptime check
        id: uptime
        continue-on-error: true
        run: |
          set +e
          OUTPUT=$(bash scripts/uptime-check.sh 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Handle endpoint failure
        if: steps.uptime.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toISOString();
            const output = `${{ steps.uptime.outputs.output }}`.replace(/`/g, "'");

            // Search for existing open incident issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
            });

            if (issues.length === 0) {
              // Create new incident issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Incident: Production endpoints down - ${timestamp}`,
                body: [
                  '## Production Incident',
                  '',
                  `**Detected at:** ${timestamp}`,
                  '',
                  '### Failed Endpoints',
                  '```',
                  output,
                  '```',
                  '',
                  '### Actions',
                  '- [ ] Investigate root cause',
                  '- [ ] Apply fix',
                  '- [ ] Verify recovery',
                  '',
                  '---',
                  '*Auto-created by agent-uptime-monitor workflow*',
                ].join('\n'),
                labels: ['incident', 'P0', 'agent-created'],
              });

              core.info('Created new incident issue');
            } else {
              // Comment on existing incident
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `### Still down at ${timestamp}\n\`\`\`\n${output}\n\`\`\``,
              });

              core.info(`Updated existing incident issue #${issues[0].number}`);
            }

      - name: Dispatch endpoint-down event
        if: steps.uptime.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'endpoint-down',
              client_payload: {
                timestamp: new Date().toISOString(),
                check_output: '${{ steps.uptime.outputs.exit_code }}',
              },
            });

      - name: Handle recovery
        if: steps.uptime.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toISOString();

            // Search for existing open incident issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident',
              state: 'open',
            });

            if (issues.length > 0) {
              for (const issue of issues) {
                // Comment with resolution
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `:white_check_mark: **Resolved at ${timestamp}**\n\nAll production endpoints are healthy again.`,
                });

                // Close the issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });

                core.info(`Closed incident issue #${issue.number}`);
              }
            }
