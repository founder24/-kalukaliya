name: Railway deploy (DEPRECATED — Task #336)

#
# Task #336 migrated the syrabit-backend FastAPI service and the
# rust-core gRPC+HTTP service off Railway and onto Digital Ocean App
# Platform. The active CI deploy lives at
# `.github/workflows/digitalocean-deploy.yml`.
#
# This workflow is kept ONLY as a deprecation shim so anyone who
# bookmarked / scripted against the old `Railway deploy (manual)`
# trigger gets a loud failure with a pointer to the replacement
# instead of a silent successful no-op deploy.
#
# Remove this file once the Railway project itself is decommissioned
# (see docs/ops/digitalocean-cutover.md §Decommission).
#

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecated:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run — Railway has been replaced by Digital Ocean
        run: |
          cat <<'EOF'
          ❌  This workflow is DEPRECATED.

          Task #336 cut the syrabit-backend and rust-core services
          over from Railway to Digital Ocean App Platform. The
          replacement workflow is:

              .github/workflows/digitalocean-deploy.yml
              (workflow name: "Digital Ocean deploy (manual)")

          Equivalent inputs:
              old: mode=redeploy / deploy-from-source
              new: mode=redeploy / deploy
              old: service=<railway-service-id>
              new: app=syrabit-backend|rust-core|both

          Required repo secrets on the new workflow:
              DIGITALOCEAN_ACCESS_TOKEN
              DO_APP_ID_SYRABIT_BACKEND
              DO_APP_ID_RUST_CORE

          Cutover & rollback runbook: docs/ops/digitalocean-cutover.md
          Day-to-day runbook        : docs/DIGITALOCEAN-DEPLOYMENT.md
          EOF
          exit 1
