name: Azure Container Apps deploy (manual)

#
# Task #347 — re-home companion to .github/workflows/digitalocean-deploy.yml.
# Builds the Syrabit FastAPI backend (and optionally the Rust core) into the
# Azure Container Registry, then triggers a revision swap on the matching
# Azure Container App. Intended for the Task #347 cutover from Digital Ocean
# App Platform onto Azure Container Apps so the backend lives next to the
# Azure OpenAI primary, removing the cross-cloud egress on every chat call.
#
# Trigger is workflow_dispatch only — auto-deploys on push will be enabled
# once the cutover runbook (see infra/azure/aca-cutover.md) is signed off.
#
# Supply-chain hardening: every `uses:` is pinned to a 40-char SHA with a
# trailing `# vX.Y.Z` comment. Float tags are forbidden (mirrors the
# digitalocean-deploy.yml policy).
#

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which Container App to deploy."
        required: true
        default: syrabit-backend
        type: choice
        options:
          - syrabit-backend
          - rust-core
          - both
      mode:
        description: "deploy = build + push ACR + new revision. redeploy = re-roll the latest already-built image."
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - redeploy
      health_url:
        description: "Optional public URL probed for HTTP 200 after the deploy."
        required: false
        default: ""
        type: string

concurrency:
  group: aca-deploy-${{ github.event.inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for the OIDC azure/login federation

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ACR_NAME:       ${{ vars.AZURE_ACR_NAME }}
  AZURE_ACA_ENV:        ${{ vars.AZURE_ACA_ENV }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/Replit-agent' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Azure OIDC config is present
        run: |
          set -euo pipefail
          missing=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Azure OIDC vars: ${missing[*]}"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_ACR_NAME"

      # Per-app build/deploy plumbing.
      #
      # Each Container App owns ONE image repository in ACR and the deploy step
      # MUST send that app its own image — never the other app's. We therefore:
      #   1. Build (or resolve, in redeploy mode) one image per requested app.
      #   2. Persist them in $GITHUB_ENV under app-specific keys
      #      (IMAGE_SYRABIT_BACKEND, IMAGE_RUST_CORE).
      #   3. The update step looks each app up by its own key.
      # This eliminates the previous "$IMAGE" cross-contamination bug where
      # `app=both` would deploy whichever image happened to be built last to
      # both Container Apps.

      - name: Build and push image(s)
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"
          TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%dT%H%M%SZ)"

          build_one() {
            local app_name="$1"
            local ctx dockerfile repo env_key
            case "$app_name" in
              syrabit-backend)
                ctx="artifacts/syrabit-backend"; repo="syrabit/backend"; env_key="IMAGE_SYRABIT_BACKEND" ;;
              rust-core)
                ctx="backend/rust-core";        repo="syrabit/rust-core"; env_key="IMAGE_RUST_CORE" ;;
              *) echo "::error::unknown app: $app_name"; exit 1 ;;
            esac
            dockerfile="$ctx/Dockerfile"
            local image="$AZURE_ACR_NAME.azurecr.io/$repo:$TAG"
            echo "::notice::Building $image from $ctx"
            docker buildx build --push -t "$image" -f "$dockerfile" "$ctx"
            echo "$env_key=$image" >> "$GITHUB_ENV"
          }

          if [ "$APP" = "both" ]; then
            build_one syrabit-backend
            build_one rust-core
          else
            build_one "$APP"
          fi

      - name: Resolve latest image(s) (redeploy mode)
        if: ${{ inputs.mode == 'redeploy' }}
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"

          resolve_one() {
            local app_name="$1"
            local repo env_key
            case "$app_name" in
              syrabit-backend) repo="syrabit/backend";   env_key="IMAGE_SYRABIT_BACKEND" ;;
              rust-core)       repo="syrabit/rust-core"; env_key="IMAGE_RUST_CORE" ;;
              *) echo "::error::unknown app: $app_name"; exit 1 ;;
            esac
            local tag
            tag=$(az acr repository show-tags \
              --name "$AZURE_ACR_NAME" --repository "$repo" \
              --orderby time_desc --top 1 -o tsv | head -n1)
            echo "$env_key=$AZURE_ACR_NAME.azurecr.io/$repo:$tag" >> "$GITHUB_ENV"
          }

          if [ "$APP" = "both" ]; then
            resolve_one syrabit-backend
            resolve_one rust-core
          else
            resolve_one "$APP"
          fi

      - name: Update Container App revision
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"

          deploy_one() {
            local app_name="$1"
            local image
            case "$app_name" in
              syrabit-backend) image="$IMAGE_SYRABIT_BACKEND" ;;
              rust-core)       image="$IMAGE_RUST_CORE" ;;
              *) echo "::error::unknown app: $app_name"; exit 1 ;;
            esac
            if [ -z "${image:-}" ]; then
              echo "::error::no image resolved for $app_name (build/resolve step did not run for this app)"
              exit 1
            fi
            echo "::notice::Deploying $image → $app_name"
            # Ensure the Container App uses its system-assigned managed
            # identity to pull from ACR (idempotent — safe to re-apply).
            az containerapp registry set \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --server "$AZURE_ACR_NAME.azurecr.io" \
              --identity system

            # Sync the KV-backed secret refs declared in
            # infra/azure/aca-syrabit-backend.bicep. Idempotent —
            # `az containerapp secret set` overwrites existing entries.
            # The Container App's system identity already has
            # `Key Vault Secrets User` on syrabit-prod-kv (granted out
            # of band, see runbook section 0a step 7).
            if [ "$app_name" = "syrabit-backend" ]; then
              KV_BASE="https://syrabit-prod-kv.vault.azure.net/secrets"
              az containerapp secret set \
                --name "$app_name" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --secrets \
                  "aws-access-key-id=keyvaultref:${KV_BASE}/AWS-ACCESS-KEY-ID,identityref:system" \
                  "aws-secret-access-key=keyvaultref:${KV_BASE}/AWS-SECRET-ACCESS-KEY,identityref:system" \
                  "azure-openai-api-key=keyvaultref:${KV_BASE}/AZURE-OPENAI-API-KEY,identityref:system" \
                  "mongo-uri=keyvaultref:${KV_BASE}/MONGO-URI,identityref:system" \
                  "jwt-secret=keyvaultref:${KV_BASE}/JWT-SECRET,identityref:system" \
                  "razorpay-key-secret=keyvaultref:${KV_BASE}/RAZORPAY-KEY-SECRET,identityref:system" \
                  "workers-embed-secret=keyvaultref:${KV_BASE}/WORKERS-EMBED-SECRET,identityref:system"
            fi

            # Build the env-var spec. Plain values + secretrefs in a
            # single --set-env-vars call so the new revision sees the
            # complete environment on first boot.
            ENV_ARGS=()
            if [ "$app_name" = "syrabit-backend" ]; then
              ENV_ARGS=(
                # Task #400 — Tier-2 email migrated SendGrid → Amazon SES.
                # EMAIL_PROVIDER=ses selects the boto3 path in
                # email_templates._send_sync / send_admin_email; flip to
                # `sendgrid` to roll back without redeploying code.
                "AWS_ACCESS_KEY_ID=secretref:aws-access-key-id"
                "AWS_SECRET_ACCESS_KEY=secretref:aws-secret-access-key"
                "AWS_SES_REGION=us-east-1"
                "EMAIL_PROVIDER=ses"
                "AZURE_OPENAI_API_KEY=secretref:azure-openai-api-key"
                # config.py reads MONGO_URL (with MONGODB_URI fallback);
                # the bicep mistakenly used MONGO_URI, fixed here.
                "MONGO_URL=secretref:mongo-uri"
                "JWT_SECRET=secretref:jwt-secret"
                "RAZORPAY_KEY_SECRET=secretref:razorpay-key-secret"
                "WORKERS_EMBED_SECRET=secretref:workers-embed-secret"
                "EMAIL_FROM=Syrabit.ai <noreply@syrabit.ai>"
                "ENV=production"
                "PORT=8000"
                "WORKERS_EMBED_URL=https://embed.syrabit.ai"
                "EMBED_PROVIDER_PRIMARY=workers_ai_custom"
              )
            fi

            # Two-call approach (separate `secret set` + `containerapp
            # update`) — proven to work in run #6. The single-PATCH
            # alternative was rejected by ARM with
            # `ContainerAppSecretRefNotFound` because env-secretRef
            # validation ran against the merged-but-not-yet-committed
            # secrets array. Cost: this triggers two revisions in
            # single-revision mode (the second from the probe REST
            # PATCH below). Acceptable — the post-deploy probe waits
            # long enough for the second revision to become active.
            az containerapp update \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$image" \
              --revision-suffix "ci-$(date -u +%Y%m%d-%H%M%S)" \
              ${ENV_ARGS:+--set-env-vars "${ENV_ARGS[@]}"}

            # Patch only the probes (path /health → /api/health). Uses
            # ARM merge-patch on properties.template.containers[0].
            # initialDelay=60s + failureThreshold=10 gives FastAPI
            # ~210s to finish heavy imports before the revision is
            # marked Unhealthy.
            if [ "$app_name" = "syrabit-backend" ]; then
              SUB_ID="$(az account show --query id -o tsv)"
              ACA_URL="https://management.azure.com/subscriptions/${SUB_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.App/containerApps/${app_name}?api-version=2024-03-01"
              az rest --method get --url "$ACA_URL" --query 'properties.template' -o json > /tmp/aca-template.json
              jq '.containers[0].probes = [{"type":"Liveness","httpGet":{"path":"/api/health","port":8000},"initialDelaySeconds":60,"periodSeconds":15,"failureThreshold":10},{"type":"Readiness","httpGet":{"path":"/api/health","port":8000},"initialDelaySeconds":30,"periodSeconds":10,"failureThreshold":6}] | {properties: {template: .}}' /tmp/aca-template.json > /tmp/aca-patch.json
              az rest --method patch --url "$ACA_URL" --body @/tmp/aca-patch.json --headers "Content-Type=application/json" > /dev/null
              echo "::notice::Patched probes to /api/health on $app_name"
            fi

            # Diagnostic: show all revisions so failures are visible.
            az containerapp revision list \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[].{rev:name, healthState:properties.healthState, runningState:properties.runningState, active:properties.active, replicas:properties.replicas, image:properties.template.containers[0].image}" \
              -o table || true
          }

          if [ "$APP" = "both" ]; then
            deploy_one syrabit-backend
            deploy_one rust-core
          else
            deploy_one "$APP"
          fi

      - name: Post-deploy health probe
        if: success()
        run: |
          set -euo pipefail
          URL="${{ inputs.health_url }}"
          if [ -z "$URL" ]; then
            URL="https://api.syrabit.ai/health"
          fi
          echo "Probing $URL (up to 8 min — covers ACA cold start + KV resolve + FastAPI imports)"
          for i in $(seq 1 32); do
            code=$(curl -sS -o /tmp/h -w "%{http_code}" --max-time 8 "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "::notice::$URL returned 200 on attempt $i"
              head -c 400 /tmp/h
              exit 0
            fi
            echo "Attempt $i: HTTP $code — sleeping 15s"
            sleep 15
          done
          echo "::error::$URL never returned 200 after 8 min"
          exit 1

      - name: On-failure diagnostics (revision state + console logs + KV)
        if: failure()
        run: |
          set +e
          APP="${{ inputs.app }}"
          [ "$APP" = "both" ] && APP="syrabit-backend"
          echo "::group::All revisions"
          az containerapp revision list --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[].{rev:name, healthState:properties.healthState, runningState:properties.runningState, active:properties.active, replicas:properties.replicas, created:properties.createdTime, image:properties.template.containers[0].image}" \
            -o table
          echo "::endgroup::"

          # Latest revision = the one we just patched in (highest createdTime).
          LATEST_REV=$(az containerapp revision list --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "sort_by([], &properties.createdTime)[-1].name" -o tsv)
          echo "Latest revision: $LATEST_REV"

          echo "::group::Revision detail (provisioningError if any)"
          az containerapp revision show --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$LATEST_REV" \
            --query "{healthState:properties.healthState, runningState:properties.runningState, provisioningError:properties.provisioningError, replicas:properties.replicas}" \
            -o yaml
          echo "::endgroup::"

          echo "::group::Container console logs (latest revision, 200 lines)"
          az containerapp logs show --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$LATEST_REV" --type console --tail 200 || true
          echo "::endgroup::"

          echo "::group::Container system logs (latest revision, 100 lines)"
          az containerapp logs show --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$LATEST_REV" --type system --tail 100 || true
          echo "::endgroup::"

          echo "::group::Key Vault syrabit-prod-kv — required secret presence"
          for s in AWS-ACCESS-KEY-ID AWS-SECRET-ACCESS-KEY AZURE-OPENAI-API-KEY MONGO-URI JWT-SECRET RAZORPAY-KEY-SECRET WORKERS-EMBED-SECRET; do
            if az keyvault secret show --vault-name syrabit-prod-kv --name "$s" --query id -o tsv 2>/dev/null; then
              echo "  ✓ $s present"
            else
              echo "  ✗ $s MISSING in syrabit-prod-kv (KV ref will fail to resolve)"
            fi
          done
          echo "::endgroup::"

          echo "::group::Container App secrets currently configured"
          az containerapp secret list --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" -o table
          echo "::endgroup::"
          exit 1
