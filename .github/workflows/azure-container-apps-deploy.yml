name: Azure Container Apps deploy (manual)

#
# Task #347 — re-home companion to .github/workflows/digitalocean-deploy.yml.
# Builds the Syrabit FastAPI backend (and optionally the Rust core) into the
# Azure Container Registry, then triggers a revision swap on the matching
# Azure Container App. Intended for the Task #347 cutover from Digital Ocean
# App Platform onto Azure Container Apps so the backend lives next to the
# Azure OpenAI primary, removing the cross-cloud egress on every chat call.
#
# Trigger is workflow_dispatch only — auto-deploys on push will be enabled
# once the cutover runbook (see infra/azure/aca-cutover.md) is signed off.
#
# Supply-chain hardening: every `uses:` is pinned to a 40-char SHA with a
# trailing `# vX.Y.Z` comment. Float tags are forbidden (mirrors the
# digitalocean-deploy.yml policy).
#

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which Container App to deploy."
        required: true
        default: syrabit-backend
        type: choice
        options:
          - syrabit-backend
          - rust-core
          - both
      mode:
        description: "deploy = build + push ACR + new revision. redeploy = re-roll the latest already-built image."
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - redeploy
      health_url:
        description: "Optional public URL probed for HTTP 200 after the deploy."
        required: false
        default: ""
        type: string

concurrency:
  group: aca-deploy-${{ github.event.inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for the OIDC azure/login federation

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ACR_NAME:       ${{ vars.AZURE_ACR_NAME }}
  AZURE_ACA_ENV:        ${{ vars.AZURE_ACA_ENV }}

jobs:
  canonical_delegation_gate:
    # Task #559 — umbrella pre-deploy guard. Refuses to ship a backend
    # image that violates the per-feature canonical specialist-
    # delegation map (infra/four-cloud-delegation.md §A): English chat
    # dynamic 2-chain, Assamese strict [sarvam, workers_ai_indic],
    # Azure-OpenAI bare-token ban, voice paywall on /tts /stt
    # /voice/voice, and the inherited dead-provider bank from Tasks
    # #297 / #347 / #491 / #494 / #554. Runs BEFORE budget_ceiling_gate
    # so a routing-contract drift fails the build before the budget
    # gate even gets a chance to mask it.
    name: Canonical-delegation guard (#559)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run umbrella guard
        working-directory: artifacts/syrabit-backend
        run: python scripts/ci/check_canonical_delegation.py

  budget_ceiling_gate:
    # Task #549 — pre-deploy guard. Refuses to ship a backend image
    # whose monthly cap defaults, chat-head, Assamese-head, degradation
    # ladder, or /voice/* paid gate has drifted off the perpetual
    # $100/mo budget contract.
    name: Budget-ceiling guard (#549)
    needs: canonical_delegation_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run guard
        working-directory: artifacts/syrabit-backend
        run: python scripts/check_budget_ceiling.py

  exam_calendar_gate:
    # Task #575 — pre-deploy guard for `config/exam_calendar.yaml`.
    # Fails the build when the calendar can't be parsed, when two
    # windows overlap (would silently double-count a season change),
    # or when the latest window's `end` is less than 365 days from
    # `today` (we always keep ≥12 months of windows on disk so the
    # edge worker keeps applying exam-mode TTLs through the next
    # AHSEC + SEBA pass without a manual refresh).
    name: Exam-calendar guard (#575)
    needs: canonical_delegation_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: python -m pip install --quiet "pyyaml>=6.0"
      - name: Run guard
        working-directory: artifacts/syrabit-backend
        run: python scripts/ci/check_exam_calendar.py

  og_image_smoke:
    # Task #49 — pre-deploy gate. Verifies that a sample of OG banner images
    # are publicly reachable on the CDN before shipping a new backend revision.
    # If R2 public access has been accidentally revoked, or the CDN config has
    # drifted, this job fails the deploy before it reaches production.
    # No R2 credentials are required — the script issues public HEAD requests
    # against https://cdn.syrabit.ai/og only.
    # Skip by setting the OG_SMOKE_SKIP repository variable to "1".
    name: OG image CDN smoke check (#49)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke-check a sample of OG image CDN URLs
        env:
          OG_SMOKE_SKIP: ${{ vars.OG_SMOKE_SKIP || '0' }}
        run: python scripts/og-images/smoke_check_og.py --sample 5

  deploy:
    needs: [canonical_delegation_gate, budget_ceiling_gate, exam_calendar_gate, og_image_smoke]
    if: github.ref == 'refs/heads/Replit-agent' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Azure OIDC config is present
        run: |
          set -euo pipefail
          missing=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Azure OIDC vars: ${missing[*]}"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_ACR_NAME"

      # Pre-deploy guard: verify every required Key Vault secret exists
      # before spending time on a 1-2 min image build that will fail anyway
      # at provision time. Two of the 12 secrets (sarvam-api-key,
      # workers-embed-secret) may instead be supplied via GitHub Actions
      # secrets (SARVAM_API_KEY / WORKERS_EMBED_SECRET) — when the GH
      # secret is non-empty the KV check for that slot is skipped because
      # the deploy step will inject the value directly and not need the KV ref.
      - name: Pre-deploy — validate Key Vault secrets
        if: ${{ inputs.app == 'syrabit-backend' || inputs.app == 'both' }}
        env:
          GH_SARVAM_API_KEY:       ${{ secrets.SARVAM_API_KEY }}
          GH_WORKERS_EMBED_SECRET: ${{ secrets.WORKERS_EMBED_SECRET }}
        run: |
          set -euo pipefail
          KV="syrabit-prod-kv"
          declare -A SKIP_IF_GH_SECRET=(
            [SARVAM-API-KEY]="GH_SARVAM_API_KEY"
            [WORKERS-EMBED-SECRET]="GH_WORKERS_EMBED_SECRET"
          )
          REQUIRED=(
            AWS-ACCESS-KEY-ID AWS-SECRET-ACCESS-KEY MONGO-URI
            JWT-SECRET ADMIN-JWT-SECRET RAZORPAY-KEY-SECRET
            WORKERS-EMBED-SECRET ORIGIN-SHARED-SECRET D1-SYNC-SECRET
            SENTRY-DSN SARVAM-API-KEY WEB-PUSH-VAPID-PRIVATE-KEY
          )
          MISSING=()
          for s in "${REQUIRED[@]}"; do
            gh_var="${SKIP_IF_GH_SECRET[$s]:-}"
            if [ -n "$gh_var" ] && [ -n "${!gh_var:-}" ]; then
              echo "  ✓ $s — supplied via GitHub Actions secret (KV check skipped)"
              continue
            fi
            if az keyvault secret show --vault-name "$KV" --name "$s" \
                --query id -o tsv 2>/dev/null | grep -q .; then
              echo "  ✓ $s — present in $KV"
            else
              echo "  ✗ $s — MISSING in $KV and no GitHub secret override"
              MISSING+=("$s")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Key Vault missing ${#MISSING[@]} secret(s): ${MISSING[*]}"
            echo "::error::Add them to syrabit-prod-kv, OR set the matching GitHub Actions secret (SARVAM_API_KEY / WORKERS_EMBED_SECRET) to bypass KV for those two slots."
            exit 1
          fi
          echo "::notice::All required Key Vault secrets verified."

      # Per-app build/deploy plumbing.
      #
      # Each Container App owns ONE image repository in ACR and the deploy step
      # MUST send that app its own image — never the other app's. We therefore:
      #   1. Build (or resolve, in redeploy mode) one image per requested app.
      #   2. Persist them in $GITHUB_ENV under app-specific keys
      #      (IMAGE_SYRABIT_BACKEND, IMAGE_RUST_CORE).
      #   3. The update step looks each app up by its own key.
      # This eliminates the previous "$IMAGE" cross-contamination bug where
      # `app=both` would deploy whichever image happened to be built last to
      # both Container Apps.

      - name: Build and push image(s)
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"
          TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%dT%H%M%SZ)"

          build_one() {
            local app_name="$1"
            local ctx dockerfile repo env_key
            case "$app_name" in
              syrabit-backend)
                ctx="artifacts/syrabit-backend"; repo="syrabit/backend"; env_key="IMAGE_SYRABIT_BACKEND" ;;
              rust-core)
                ctx="backend/rust-core";        repo="syrabit/rust-core"; env_key="IMAGE_RUST_CORE" ;;
              *) echo "::error::unknown app: $app_name"; exit 1 ;;
            esac
            dockerfile="$ctx/Dockerfile"
            local image="$AZURE_ACR_NAME.azurecr.io/$repo:$TAG"
            echo "::notice::Building $image from $ctx"
            docker buildx build --push -t "$image" -f "$dockerfile" "$ctx"
            echo "$env_key=$image" >> "$GITHUB_ENV"
          }

          if [ "$APP" = "both" ]; then
            build_one syrabit-backend
            build_one rust-core
          else
            build_one "$APP"
          fi

      - name: Resolve latest image(s) (redeploy mode)
        if: ${{ inputs.mode == 'redeploy' }}
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"

          resolve_one() {
            local app_name="$1"
            local repo env_key
            case "$app_name" in
              syrabit-backend) repo="syrabit/backend";   env_key="IMAGE_SYRABIT_BACKEND" ;;
              rust-core)       repo="syrabit/rust-core"; env_key="IMAGE_RUST_CORE" ;;
              *) echo "::error::unknown app: $app_name"; exit 1 ;;
            esac
            local tag
            tag=$(az acr repository show-tags \
              --name "$AZURE_ACR_NAME" --repository "$repo" \
              --orderby time_desc --top 1 -o tsv | head -n1)
            echo "$env_key=$AZURE_ACR_NAME.azurecr.io/$repo:$tag" >> "$GITHUB_ENV"
          }

          if [ "$APP" = "both" ]; then
            resolve_one syrabit-backend
            resolve_one rust-core
          else
            resolve_one "$APP"
          fi

      - name: Update Container App revision
        env:
          GH_SARVAM_API_KEY:       ${{ secrets.SARVAM_API_KEY }}
          GH_WORKERS_EMBED_SECRET: ${{ secrets.WORKERS_EMBED_SECRET }}
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"

          deploy_one() {
            local app_name="$1"
            local image
            case "$app_name" in
              syrabit-backend) image="$IMAGE_SYRABIT_BACKEND" ;;
              rust-core)       image="$IMAGE_RUST_CORE" ;;
              *) echo "::error::unknown app: $app_name"; exit 1 ;;
            esac
            if [ -z "${image:-}" ]; then
              echo "::error::no image resolved for $app_name (build/resolve step did not run for this app)"
              exit 1
            fi
            echo "::notice::Deploying $image → $app_name"

            # Pre-flight cleanup: deactivate any *unhealthy* active
            # revisions left behind by previous failed runs. They keep
            # piling up replicas and noise but otherwise don't block
            # the single-PATCH approach below. Idempotent.
            echo "::group::Pre-flight: deactivate unhealthy revisions"
            BROKEN_REVS=$(az containerapp revision list \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?properties.healthState=='Unhealthy' && properties.active].name" \
              -o tsv 2>/dev/null || true)
            if [ -n "$BROKEN_REVS" ]; then
              for rev in $BROKEN_REVS; do
                echo "  deactivating $rev"
                az containerapp revision deactivate \
                  --name "$app_name" \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --revision "$rev" \
                  --output none || \
                  echo "  (failed to deactivate $rev — continuing)"
              done
            else
              echo "  (no unhealthy active revisions found)"
            fi
            echo "::endgroup::"

            # rust-core (and any future non-syrabit-backend app) keeps
            # the simple two-call CLI flow — no SES migration, no
            # KV-secret rewrite, no orphan env vars to dodge.
            if [ "$app_name" != "syrabit-backend" ]; then
              az containerapp registry set \
                --name "$app_name" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --server "$AZURE_ACR_NAME.azurecr.io" \
                --identity system
              az containerapp update \
                --name "$app_name" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --image "$image" \
                --revision-suffix "ci-$(date -u +%Y%m%d-%H%M%S)"
              return 0
            fi

            # ----- syrabit-backend: single authoritative `az rest`
            # PATCH that mutates secrets + env + image + probes + ACR
            # registry binding in one ARM transaction. The fragmented
            # `az containerapp registry set` / `secret set` /
            # `update --set-env-vars` / `update --image` sequence kept
            # tripping ARM validation:
            #   - `registry set` validates the LATEST revision template,
            #     which in our environment carries env-vars referencing
            #     secrets that the array no longer holds (orphans from
            #     earlier half-applied runs), so it 400s with
            #     ContainerAppSecretRefNotFound before any of our cleanup
            #     can run.
            #   - `secret set --secrets …` is a REPLACE in some az CLI
            #     versions and an UPSERT in others, so the same script
            #     would behave differently across runners.
            #   - `update --remove-env-vars X --set-env-vars Y` does a
            #     PATCH that ARM merges then validates, again hitting
            #     the orphan-ref check before the merge has settled.
            # The single-PATCH path below is the documented escape hatch:
            # GET → mutate the full spec → PATCH/PUT, so ARM only sees
            # the final state. Task #400.
            KV_BASE="https://syrabit-prod-kv.vault.azure.net/secrets"
            SUB_ID="$(az account show --query id -o tsv)"
            ACA_URL="https://management.azure.com/subscriptions/${SUB_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.App/containerApps/${app_name}?api-version=2024-03-01"

            echo "::group::Fetch current Container App spec"
            az rest --method get --url "$ACA_URL" -o json > /tmp/aca-current.json
            echo "  fetched ($(wc -c < /tmp/aca-current.json) bytes)"
            echo "::endgroup::"

            # Build the new spec with `jq`. We REPLACE the secrets array,
            # the env array, the image, and the probes. We KEEP the rest
            # of the spec (identity, ingress, scale rules, etc.) intact.
            # `--arg image …` and `--arg kv …` are passed in so the JQ
            # program itself never embeds the values literally.
            REV_SUFFIX="ci-$(date -u +%Y%m%d-%H%M%S)"
            # Export so the health probe step knows the exact revision name to
            # wait for (ACA PATCH is async — latestRevisionName lags).
            echo "DEPLOY_REV_SUFFIX=$REV_SUFFIX" >> "$GITHUB_ENV"
            echo "DEPLOY_APP_NAME=$app_name" >> "$GITHUB_ENV"
            # Two secrets may be injected directly from GitHub Actions secrets
            # instead of Key Vault refs. When the GH secret is non-empty the
            # jq arg is set and the conditional produces a direct {"value":…}
            # entry; otherwise it falls back to the {"keyVaultUrl":…} KV ref.
            # This lets the deploy succeed even when these two secrets have not
            # yet been added to syrabit-prod-kv (e.g. first deploy after
            # rotating the Sarvam key or resetting the embed shared secret).
            _SARVAM_KEY="${GH_SARVAM_API_KEY:-}"
            _EMBED_SECRET="${GH_WORKERS_EMBED_SECRET:-}"
            echo "::group::Build target spec"
            jq \
              --arg image        "$image" \
              --arg kv           "$KV_BASE" \
              --arg suffix       "$REV_SUFFIX" \
              --arg acr          "$AZURE_ACR_NAME.azurecr.io" \
              --arg sarvam_key   "$_SARVAM_KEY" \
              --arg embed_secret "$_EMBED_SECRET" \
              '
              .properties.configuration.registries = [{
                "server":   $acr,
                "identity": "system"
              }]
              | .properties.configuration.secrets = [
                  {"name":"aws-access-key-id",          "keyVaultUrl": ($kv + "/AWS-ACCESS-KEY-ID"),          "identity":"system"},
                  {"name":"aws-secret-access-key",      "keyVaultUrl": ($kv + "/AWS-SECRET-ACCESS-KEY"),      "identity":"system"},
                  {"name":"mongo-uri",                  "keyVaultUrl": ($kv + "/MONGO-URI"),                  "identity":"system"},
                  {"name":"jwt-secret",                 "keyVaultUrl": ($kv + "/JWT-SECRET"),                 "identity":"system"},
                  {"name":"admin-jwt-secret",           "keyVaultUrl": ($kv + "/ADMIN-JWT-SECRET"),           "identity":"system"},
                  {"name":"razorpay-key-secret",        "keyVaultUrl": ($kv + "/RAZORPAY-KEY-SECRET"),        "identity":"system"},
                  (if $embed_secret != "" then {"name":"workers-embed-secret","value":$embed_secret} else {"name":"workers-embed-secret","keyVaultUrl":($kv+"/WORKERS-EMBED-SECRET"),"identity":"system"} end),
                  {"name":"origin-shared-secret",       "keyVaultUrl": ($kv + "/ORIGIN-SHARED-SECRET"),       "identity":"system"},
                  {"name":"d1-sync-secret",             "keyVaultUrl": ($kv + "/D1-SYNC-SECRET"),             "identity":"system"},
                  {"name":"sentry-dsn",                 "keyVaultUrl": ($kv + "/SENTRY-DSN"),                 "identity":"system"},
                  (if $sarvam_key != "" then {"name":"sarvam-api-key","value":$sarvam_key} else {"name":"sarvam-api-key","keyVaultUrl":($kv+"/SARVAM-API-KEY"),"identity":"system"} end),
                  {"name":"web-push-vapid-private-key", "keyVaultUrl": ($kv + "/WEB-PUSH-VAPID-PRIVATE-KEY"), "identity":"system"}
                ]
              | .properties.configuration.ingress.traffic = [{"latestRevision": true, "weight": 100}]
              | .properties.configuration.ingress.targetPort = 8000
              | .properties.configuration.ingress.transport = (.properties.configuration.ingress.transport // "auto")
              | .properties.template.revisionSuffix = $suffix
              | .properties.template.containers = [{
                  "name":  "syrabit-backend",
                  "image": $image,
                  "env": [
                    {"name":"AWS_ACCESS_KEY_ID",         "secretRef":"aws-access-key-id"},
                    {"name":"AWS_SECRET_ACCESS_KEY",     "secretRef":"aws-secret-access-key"},
                    {"name":"SES_REGION",                "value":"us-east-1"},
                    {"name":"MONGO_URL",                 "secretRef":"mongo-uri"},
                    {"name":"JWT_SECRET",                "secretRef":"jwt-secret"},
                    {"name":"ADMIN_JWT_SECRET",          "secretRef":"admin-jwt-secret"},
                    {"name":"RAZORPAY_KEY_SECRET",       "secretRef":"razorpay-key-secret"},
                    {"name":"WORKERS_EMBED_SECRET",      "secretRef":"workers-embed-secret"},
                    {"name":"ORIGIN_SHARED_SECRET",      "secretRef":"origin-shared-secret"},
                    {"name":"D1_SYNC_SECRET",            "secretRef":"d1-sync-secret"},
                    {"name":"SENTRY_DSN",                "secretRef":"sentry-dsn"},
                    {"name":"SARVAM_API_KEY",            "secretRef":"sarvam-api-key"},
                    {"name":"WEB_PUSH_VAPID_PRIVATE_KEY","secretRef":"web-push-vapid-private-key"},
                    {"name":"WEB_PUSH_CONTACT",          "value":"mailto:admin@syrabit.ai"},
                    {"name":"OTEL_TRACES_EXPORTER",      "value":"googlecloud"},
                    {"name":"OTEL_EXPORTER_GCP_PROJECT_ID","value":"syrabit-prod"},
                    {"name":"OTEL_SERVICE_NAME",         "value":"syrabit-backend"},
                    {"name":"EMAIL_FROM",                "value":"Syrabit.ai <noreply@syrabit.ai>"},
                    {"name":"ENV",                       "value":"production"},
                    {"name":"PORT",                      "value":"8000"},
                    {"name":"WORKERS_EMBED_URL",         "value":"https://embed.syrabit.ai"},
                    {"name":"EMBED_PROVIDER_PRIMARY",    "value":"workers_ai_custom"},
                    {"name":"GUNICORN_WORKERS",          "value":"1"},
                    {"name":"GUNICORN_THREADS",          "value":"2"}
                  ],
                  "resources": (.properties.template.containers[0].resources // {"cpu":1,"memory":"2Gi"}),
                  "probes": [
                    {"type":"Liveness", "httpGet":{"path":"/api/health","port":8000},"initialDelaySeconds":60,"periodSeconds":15,"failureThreshold":12},
                    {"type":"Readiness","httpGet":{"path":"/api/health","port":8000},"initialDelaySeconds":60,"periodSeconds":10,"failureThreshold":18}
                  ]
                }]
              ' /tmp/aca-current.json > /tmp/aca-target.json
            echo "  built ($(wc -c < /tmp/aca-target.json) bytes)"
            # Echo the (sanitized) env / secret names for debug — values
            # are KV refs not literals so this is safe.
            jq '{ingress: .properties.configuration.ingress,
                 secrets: [.properties.configuration.secrets[].name],
                 env:     [.properties.template.containers[0].env[] | {name, value: (.value // ""), secretRef}]}' \
              /tmp/aca-target.json
            echo "::endgroup::"

            echo "::group::Apply spec via single ARM PATCH"
            az rest --method patch --url "$ACA_URL" \
              --body @/tmp/aca-target.json \
              --headers "Content-Type=application/json" \
              -o json > /tmp/aca-patched.json
            echo "  PATCH returned ($(wc -c < /tmp/aca-patched.json) bytes)"
            echo "::endgroup::"

            # Diagnostic: show all revisions so failures are visible.
            az containerapp revision list \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[].{rev:name, healthState:properties.healthState, runningState:properties.runningState, active:properties.active, replicas:properties.replicas, image:properties.template.containers[0].image}" \
              -o table || true
          }

          if [ "$APP" = "both" ]; then
            deploy_one syrabit-backend
            deploy_one rust-core
          else
            deploy_one "$APP"
          fi

      - name: Post-deploy health probe
        if: success()
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"
          [ "$APP" = "both" ] && APP="syrabit-backend"

          # Poll the revision running-state via Azure API rather than HTTP.
          # HTTP probes against api.syrabit.ai return 403 (Cloudflare OriginGate
          # blocks GitHub Actions runner IPs). HTTP probes against the ACA FQDN
          # time out (ACA environment is firewalled). Azure API polling uses the
          # existing OIDC credential — no network connectivity to the container.
          #
          # Running-state lifecycle:
          #   Processing → Running (healthy)   — success
          #   Processing → Degraded/Failed     — fail fast
          #   (stays Processing for > 10 min)  — timeout error

          # The ACA ARM PATCH is async (returns 202 Accepted). `latestRevisionName`
          # lags by 10-30 s after the PATCH. We know the exact expected revision
          # name because we set `revisionSuffix` in the PATCH body and exported
          # it via $GITHUB_ENV in the previous step.
          #
          # ACA revision name convention: <app-name>--<suffix>
          # e.g. syrabit-backend--ci-20260513-174946
          EXPECTED_REV="${DEPLOY_APP_NAME}--${DEPLOY_REV_SUFFIX}"
          echo "::notice::Expecting revision $EXPECTED_REV (may take 10-30 s to appear)"

          # Phase 1: wait for the revision to appear in the API (up to 3 min)
          LATEST_REV=""
          for i in $(seq 1 18); do
            LATEST_REV=$(az containerapp show \
              --name "$APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "properties.latestRevisionName" -o tsv 2>/dev/null || echo "")
            echo "  [$i] latestRevisionName=$LATEST_REV"
            if [ "$LATEST_REV" = "$EXPECTED_REV" ]; then
              echo "  Revision appeared."
              break
            fi
            sleep 10
          done
          if [ "$LATEST_REV" != "$EXPECTED_REV" ]; then
            echo "::error::Timed out waiting for $EXPECTED_REV to become latestRevisionName (got: $LATEST_REV)"
            exit 1
          fi

          # Phase 2: poll running state until Running/Failed/Stopped
          for i in $(seq 1 32); do
            STATE=$(az containerapp revision show \
              --name "$APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$LATEST_REV" \
              --query "properties.runningState" -o tsv 2>/dev/null || echo "Unknown")
            HEALTH=$(az containerapp revision show \
              --name "$APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$LATEST_REV" \
              --query "properties.healthState" -o tsv 2>/dev/null || echo "Unknown")
            echo "Attempt $i: runningState=$STATE healthState=$HEALTH"
            if [ "$STATE" = "Running" ] || [ "$STATE" = "RunningAtMaxScale" ]; then
              echo "::notice::Revision $LATEST_REV is healthy (runningState=$STATE healthState=$HEALTH)"
              exit 0
            fi
            if [ "$STATE" = "Failed" ] || [ "$STATE" = "Stopped" ]; then
              echo "::error::Revision $LATEST_REV entered terminal state: $STATE"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Revision $LATEST_REV never reached Running/RunningAtMaxScale after 8 min (last state: $STATE)"
          exit 1

      - name: On-failure diagnostics (revision state + console logs + KV)
        if: failure()
        run: |
          set +e
          APP="${{ inputs.app }}"
          [ "$APP" = "both" ] && APP="syrabit-backend"
          echo "::group::All revisions"
          az containerapp revision list --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[].{rev:name, healthState:properties.healthState, runningState:properties.runningState, active:properties.active, replicas:properties.replicas, created:properties.createdTime, image:properties.template.containers[0].image}" \
            -o table
          echo "::endgroup::"

          # Latest revision = the one we just patched in (highest createdTime).
          LATEST_REV=$(az containerapp revision list --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "sort_by([], &properties.createdTime)[-1].name" -o tsv)
          echo "Latest revision: $LATEST_REV"

          echo "::group::Revision detail (provisioningError if any)"
          az containerapp revision show --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$LATEST_REV" \
            --query "{healthState:properties.healthState, runningState:properties.runningState, provisioningError:properties.provisioningError, replicas:properties.replicas}" \
            -o yaml
          echo "::endgroup::"

          echo "::group::Container console logs (latest revision, 200 lines)"
          az containerapp logs show --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$LATEST_REV" --type console --tail 200 || true
          echo "::endgroup::"

          echo "::group::Container system logs (latest revision, 100 lines)"
          az containerapp logs show --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$LATEST_REV" --type system --tail 100 || true
          echo "::endgroup::"

          echo "::group::Key Vault syrabit-prod-kv — required secret presence"
          for s in AWS-ACCESS-KEY-ID AWS-SECRET-ACCESS-KEY MONGO-URI JWT-SECRET ADMIN-JWT-SECRET RAZORPAY-KEY-SECRET WORKERS-EMBED-SECRET ORIGIN-SHARED-SECRET D1-SYNC-SECRET SENTRY-DSN SARVAM-API-KEY WEB-PUSH-VAPID-PRIVATE-KEY; do
            if az keyvault secret show --vault-name syrabit-prod-kv --name "$s" --query id -o tsv 2>/dev/null; then
              echo "  ✓ $s present"
            else
              echo "  ✗ $s MISSING in syrabit-prod-kv (KV ref will fail to resolve)"
            fi
          done
          echo "::endgroup::"

          echo "::group::Container App secrets currently configured"
          az containerapp secret list --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" -o table
          echo "::endgroup::"
          exit 1
