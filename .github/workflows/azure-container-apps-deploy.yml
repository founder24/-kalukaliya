name: Azure Container Apps deploy (manual)

#
# Task #347 — re-home companion to .github/workflows/digitalocean-deploy.yml.
# Builds the Syrabit FastAPI backend (and optionally the Rust core) into the
# Azure Container Registry, then triggers a revision swap on the matching
# Azure Container App. Intended for the Task #347 cutover from Digital Ocean
# App Platform onto Azure Container Apps so the backend lives next to the
# Azure OpenAI primary, removing the cross-cloud egress on every chat call.
#
# Trigger is workflow_dispatch only — auto-deploys on push will be enabled
# once the cutover runbook (see infra/azure/aca-cutover.md) is signed off.
#
# Supply-chain hardening: every `uses:` is pinned to a 40-char SHA with a
# trailing `# vX.Y.Z` comment. Float tags are forbidden (mirrors the
# digitalocean-deploy.yml policy).
#

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which Container App to deploy."
        required: true
        default: syrabit-backend
        type: choice
        options:
          - syrabit-backend
          - rust-core
          - both
      mode:
        description: "deploy = build + push ACR + new revision. redeploy = re-roll the latest already-built image."
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - redeploy
      health_url:
        description: "Optional public URL probed for HTTP 200 after the deploy."
        required: false
        default: ""
        type: string

concurrency:
  group: aca-deploy-${{ github.event.inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for the OIDC azure/login federation

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ACR_NAME:       ${{ vars.AZURE_ACR_NAME }}
  AZURE_ACA_ENV:        ${{ vars.AZURE_ACA_ENV }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/Replit-agent' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify Azure OIDC config is present
        run: |
          set -euo pipefail
          missing=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Azure OIDC vars: ${missing[*]}"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_ACR_NAME"

      # Per-app build/deploy plumbing.
      #
      # Each Container App owns ONE image repository in ACR and the deploy step
      # MUST send that app its own image — never the other app's. We therefore:
      #   1. Build (or resolve, in redeploy mode) one image per requested app.
      #   2. Persist them in $GITHUB_ENV under app-specific keys
      #      (IMAGE_SYRABIT_BACKEND, IMAGE_RUST_CORE).
      #   3. The update step looks each app up by its own key.
      # This eliminates the previous "$IMAGE" cross-contamination bug where
      # `app=both` would deploy whichever image happened to be built last to
      # both Container Apps.

      - name: Build and push image(s)
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"
          TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%dT%H%M%SZ)"

          build_one() {
            local app_name="$1"
            local ctx dockerfile repo env_key
            case "$app_name" in
              syrabit-backend)
                ctx="artifacts/syrabit-backend"; repo="syrabit/backend"; env_key="IMAGE_SYRABIT_BACKEND" ;;
              rust-core)
                ctx="backend/rust-core";        repo="syrabit/rust-core"; env_key="IMAGE_RUST_CORE" ;;
              *) echo "::error::unknown app: $app_name"; exit 1 ;;
            esac
            dockerfile="$ctx/Dockerfile"
            local image="$AZURE_ACR_NAME.azurecr.io/$repo:$TAG"
            echo "::notice::Building $image from $ctx"
            docker buildx build --push -t "$image" -f "$dockerfile" "$ctx"
            echo "$env_key=$image" >> "$GITHUB_ENV"
          }

          if [ "$APP" = "both" ]; then
            build_one syrabit-backend
            build_one rust-core
          else
            build_one "$APP"
          fi

      - name: Resolve latest image(s) (redeploy mode)
        if: ${{ inputs.mode == 'redeploy' }}
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"

          resolve_one() {
            local app_name="$1"
            local repo env_key
            case "$app_name" in
              syrabit-backend) repo="syrabit/backend";   env_key="IMAGE_SYRABIT_BACKEND" ;;
              rust-core)       repo="syrabit/rust-core"; env_key="IMAGE_RUST_CORE" ;;
              *) echo "::error::unknown app: $app_name"; exit 1 ;;
            esac
            local tag
            tag=$(az acr repository show-tags \
              --name "$AZURE_ACR_NAME" --repository "$repo" \
              --orderby time_desc --top 1 -o tsv | head -n1)
            echo "$env_key=$AZURE_ACR_NAME.azurecr.io/$repo:$tag" >> "$GITHUB_ENV"
          }

          if [ "$APP" = "both" ]; then
            resolve_one syrabit-backend
            resolve_one rust-core
          else
            resolve_one "$APP"
          fi

      - name: Update Container App revision
        run: |
          set -euo pipefail
          APP="${{ inputs.app }}"

          deploy_one() {
            local app_name="$1"
            local image
            case "$app_name" in
              syrabit-backend) image="$IMAGE_SYRABIT_BACKEND" ;;
              rust-core)       image="$IMAGE_RUST_CORE" ;;
              *) echo "::error::unknown app: $app_name"; exit 1 ;;
            esac
            if [ -z "${image:-}" ]; then
              echo "::error::no image resolved for $app_name (build/resolve step did not run for this app)"
              exit 1
            fi
            echo "::notice::Deploying $image → $app_name"
            az containerapp update \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$image" \
              --revision-suffix "ci-$(date -u +%Y%m%d-%H%M%S)"
          }

          if [ "$APP" = "both" ]; then
            deploy_one syrabit-backend
            deploy_one rust-core
          else
            deploy_one "$APP"
          fi

      - name: Post-deploy health probe
        if: success()
        run: |
          set -euo pipefail
          URL="${{ inputs.health_url }}"
          if [ -z "$URL" ]; then
            URL="https://api.syrabit.ai/health"
          fi
          echo "Probing $URL"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/h -w "%{http_code}" "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "::notice::$URL returned 200"
              exit 0
            fi
            echo "Attempt $i: HTTP $code — sleeping 15s"
            sleep 15
          done
          echo "::error::$URL never returned 200"
          exit 1
