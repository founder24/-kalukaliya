name: Seed Azure Key Vault (manual)

#
# Task #400 — one-shot helper to seed `syrabit-prod-kv` with the 7 runtime
# secrets the `azure-container-apps-deploy.yml` workflow expects to find
# already in the vault. Idempotent: `az keyvault secret set` creates a new
# secret version on each run, so re-running is safe and rotation-friendly.
#
# Source of truth for the values is GitHub Actions repository secrets
# (KV_SEED_*). Those are populated out-of-band by the operator (or the
# Replit-side push script that uses libsodium-encrypted PUTs against the
# GitHub API). The values never appear in this YAML or in any log line —
# `az` reads them from masked env vars.
#

on:
  workflow_dispatch:
    inputs:
      vault:
        description: "Key Vault name to seed."
        required: true
        default: syrabit-prod-kv
        type: string

concurrency:
  group: seed-kv-${{ github.event.inputs.vault }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    if: github.ref == 'refs/heads/Replit-agent' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Azure OIDC config is present
        run: |
          set -euo pipefail
          missing=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Azure OIDC vars: ${missing[*]}"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify all required KV_SEED_* secrets are present in this repo
        run: |
          set -euo pipefail
          missing=()
          # KV_SEED_AZURE_OPENAI_API_KEY removed — Azure OpenAI retired (Task #554).
          # Core secrets — must be present as GitHub secrets.
          for v in KV_SEED_AWS_ACCESS_KEY_ID KV_SEED_AWS_SECRET_ACCESS_KEY \
                   KV_SEED_MONGO_URI \
                   KV_SEED_JWT_SECRET KV_SEED_ADMIN_JWT_SECRET \
                   KV_SEED_RAZORPAY_KEY_SECRET KV_SEED_WORKERS_EMBED_SECRET \
                   KV_SEED_UPSTASH_REDIS_REST_URL KV_SEED_UPSTASH_REDIS_REST_TOKEN \
                   KV_SEED_SUPABASE_ANON_KEY; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing KV seed secrets in repo: ${missing[*]}"
            exit 1
          fi
          # Optional secrets — warn only if absent; assumed already seeded via
          # Azure Portal or a previous manual az keyvault secret set command.
          for v in KV_SEED_RAZORPAY_KEY_ID KV_SEED_DEEPGRAM_API_KEY \
                   KV_SEED_ELEVENLABS_API_KEY KV_SEED_POSTHOG_API_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::warning::$v not set as GitHub secret — assuming already present in Key Vault from manual seeding."
            fi
          done
        env:
          KV_SEED_AWS_ACCESS_KEY_ID:          ${{ secrets.KV_SEED_AWS_ACCESS_KEY_ID }}
          KV_SEED_AWS_SECRET_ACCESS_KEY:      ${{ secrets.KV_SEED_AWS_SECRET_ACCESS_KEY }}
          KV_SEED_MONGO_URI:                  ${{ secrets.KV_SEED_MONGO_URI }}
          KV_SEED_JWT_SECRET:                 ${{ secrets.KV_SEED_JWT_SECRET }}
          KV_SEED_ADMIN_JWT_SECRET:           ${{ secrets.KV_SEED_ADMIN_JWT_SECRET }}
          KV_SEED_RAZORPAY_KEY_SECRET:        ${{ secrets.KV_SEED_RAZORPAY_KEY_SECRET }}
          KV_SEED_WORKERS_EMBED_SECRET:       ${{ secrets.KV_SEED_WORKERS_EMBED_SECRET }}
          KV_SEED_UPSTASH_REDIS_REST_URL:     ${{ secrets.KV_SEED_UPSTASH_REDIS_REST_URL }}
          KV_SEED_UPSTASH_REDIS_REST_TOKEN:   ${{ secrets.KV_SEED_UPSTASH_REDIS_REST_TOKEN }}
          KV_SEED_SUPABASE_ANON_KEY:          ${{ secrets.KV_SEED_SUPABASE_ANON_KEY }}
          KV_SEED_RAZORPAY_KEY_ID:            ${{ secrets.KV_SEED_RAZORPAY_KEY_ID }}
          KV_SEED_DEEPGRAM_API_KEY:           ${{ secrets.KV_SEED_DEEPGRAM_API_KEY }}
          KV_SEED_ELEVENLABS_API_KEY:         ${{ secrets.KV_SEED_ELEVENLABS_API_KEY }}
          KV_SEED_POSTHOG_API_KEY:            ${{ secrets.KV_SEED_POSTHOG_API_KEY }}

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Seed Key Vault secrets
        env:
          VAULT: ${{ inputs.vault }}
          # GitHub masks these when echoed, and `az keyvault secret set
          # --value "$VAR"` reads from env without the value crossing the
          # command line, so they don't leak into job logs.
          AWS_ACCESS_KEY_ID:          ${{ secrets.KV_SEED_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:      ${{ secrets.KV_SEED_AWS_SECRET_ACCESS_KEY }}
          MONGO_URI:                  ${{ secrets.KV_SEED_MONGO_URI }}
          JWT_SECRET:                 ${{ secrets.KV_SEED_JWT_SECRET }}
          ADMIN_JWT_SECRET:           ${{ secrets.KV_SEED_ADMIN_JWT_SECRET }}
          RAZORPAY_KEY_SECRET:        ${{ secrets.KV_SEED_RAZORPAY_KEY_SECRET }}
          WORKERS_EMBED_SECRET:       ${{ secrets.KV_SEED_WORKERS_EMBED_SECRET }}
          UPSTASH_REDIS_REST_URL:     ${{ secrets.KV_SEED_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN:   ${{ secrets.KV_SEED_UPSTASH_REDIS_REST_TOKEN }}
          SUPABASE_ANON_KEY:          ${{ secrets.KV_SEED_SUPABASE_ANON_KEY }}
          RAZORPAY_KEY_ID:            ${{ secrets.KV_SEED_RAZORPAY_KEY_ID }}
          DEEPGRAM_API_KEY:           ${{ secrets.KV_SEED_DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY:         ${{ secrets.KV_SEED_ELEVENLABS_API_KEY }}
          POSTHOG_API_KEY:            ${{ secrets.KV_SEED_POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          # Use --file with a process substitution / heredoc so the value
          # never appears on the `az` command line at all (defense-in-depth
          # against any future job-log scraping). `printf` of a masked env
          # var is also masked by the runner.
          set_kv() {
            local name="$1"
            local value="$2"
            local tmp
            tmp="$(mktemp)"
            printf '%s' "$value" > "$tmp"
            az keyvault secret set \
              --vault-name "$VAULT" \
              --name "$name" \
              --file "$tmp" \
              --output none
            rm -f "$tmp"
            echo "  ✓ $name set in $VAULT"
          }

          echo "::group::Writing secrets to $VAULT"
          set_kv "AWS-ACCESS-KEY-ID"         "$AWS_ACCESS_KEY_ID"
          set_kv "AWS-SECRET-ACCESS-KEY"     "$AWS_SECRET_ACCESS_KEY"
          set_kv "MONGO-URI"                 "$MONGO_URI"
          set_kv "JWT-SECRET"                "$JWT_SECRET"
          set_kv "ADMIN-JWT-SECRET"          "$ADMIN_JWT_SECRET"
          set_kv "RAZORPAY-KEY-SECRET"       "$RAZORPAY_KEY_SECRET"
          set_kv "WORKERS-EMBED-SECRET"      "$WORKERS_EMBED_SECRET"
          set_kv "UPSTASH-REDIS-REST-URL"    "$UPSTASH_REDIS_REST_URL"
          set_kv "UPSTASH-REDIS-REST-TOKEN"  "$UPSTASH_REDIS_REST_TOKEN"
          set_kv "SUPABASE-ANON-KEY"         "$SUPABASE_ANON_KEY"
          # Optional — only seed if the GitHub secret was supplied; otherwise
          # the value was already seeded manually via Azure Portal.
          [ -n "${RAZORPAY_KEY_ID:-}"   ] && set_kv "RAZORPAY-KEY-ID"    "$RAZORPAY_KEY_ID"   || echo "  ⚠ RAZORPAY-KEY-ID skipped (not in GitHub secrets — assumed already in KV)"
          [ -n "${DEEPGRAM_API_KEY:-}"  ] && set_kv "DEEPGRAM-API-KEY"   "$DEEPGRAM_API_KEY"  || echo "  ⚠ DEEPGRAM-API-KEY skipped (not in GitHub secrets — assumed already in KV)"
          [ -n "${ELEVENLABS_API_KEY:-}"] && set_kv "ELEVENLABS-API-KEY" "$ELEVENLABS_API_KEY"|| echo "  ⚠ ELEVENLABS-API-KEY skipped (not in GitHub secrets — assumed already in KV)"
          [ -n "${POSTHOG_API_KEY:-}"   ] && set_kv "POSTHOG-API-KEY"    "$POSTHOG_API_KEY"   || echo "  ⚠ POSTHOG-API-KEY skipped (not in GitHub secrets — assumed already in KV)"
          echo "::endgroup::"

          echo "::group::Verify all secrets are now present in $VAULT"
          for s in AWS-ACCESS-KEY-ID AWS-SECRET-ACCESS-KEY \
                   MONGO-URI JWT-SECRET ADMIN-JWT-SECRET \
                   RAZORPAY-KEY-SECRET WORKERS-EMBED-SECRET \
                   UPSTASH-REDIS-REST-URL UPSTASH-REDIS-REST-TOKEN \
                   SUPABASE-ANON-KEY RAZORPAY-KEY-ID \
                   DEEPGRAM-API-KEY ELEVENLABS-API-KEY POSTHOG-API-KEY; do
            if az keyvault secret show --vault-name "$VAULT" --name "$s" --query id -o tsv >/dev/null 2>&1; then
              echo "  ✓ $s present"
            else
              echo "::error::$s is missing in $VAULT after seed"
              exit 1
            fi
          done
          echo "::endgroup::"
