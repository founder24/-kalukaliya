name: Lambda Smoke-Invoke — prewarm/seo_baseline/materialize_faqs (Task #5)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, only check function configs (no actual invoke)"
        required: false
        default: "false"

permissions:
  id-token: write
  contents: write

jobs:
  smoke-invoke:
    name: Invoke + verify all 3 Lambda functions
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Seed MONGO_URL into AWS SM if placeholder
        env:
          MONGO_URI: ${{ secrets.KV_SEED_MONGO_URI }}
        run: |
          set -euo pipefail
          SECRET_PATH="syrabit/prod/mongo/url"
          CURRENT=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_PATH" --region ap-south-1 \
            --query 'SecretString' --output text 2>/dev/null || echo "NOT_FOUND")
          echo "Current secret (first 60): ${CURRENT:0:60}"
          if echo "$CURRENT" | grep -qE '^mongodb(\+srv)?://'; then
            echo "Secret already has a real URI — skipping seed."
          else
            echo "Placeholder or missing — seeding from KV_SEED_MONGO_URI..."
            if [ -z "${MONGO_URI:-}" ]; then
              echo "ERROR: KV_SEED_MONGO_URI is empty"; exit 1
            fi
            if ! echo "$MONGO_URI" | grep -qE '^mongodb(\+srv)?://'; then
              echo "ERROR: KV_SEED_MONGO_URI is not a MongoDB URI (first 30: ${MONGO_URI:0:30})"; exit 1
            fi
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_PATH" \
              --secret-string "$MONGO_URI" \
              --region ap-south-1
            MASKED=$(echo "$MONGO_URI" | python3 -c "import sys,re; u=sys.stdin.read().strip(); print(re.sub(r'(://[^:]+:)[^@]+(@)',r'\1***\2',u)[:120])")
            echo "Seeded OK — URI: $MASKED"
          fi

      - name: Inject MONGO_URL directly into Lambda env (belt-and-suspenders, Task #10)
        env:
          MONGO_URI: ${{ secrets.KV_SEED_MONGO_URI }}
        run: |
          set -euo pipefail
          if [ -z "${MONGO_URI:-}" ]; then
            echo "KV_SEED_MONGO_URI not set — skipping direct Lambda env inject"
            exit 0
          fi
          if ! echo "$MONGO_URI" | grep -qE '^mongodb(\+srv)?://'; then
            echo "KV_SEED_MONGO_URI is not a valid MongoDB URI — skipping inject"
            exit 0
          fi
          MASKED=$(echo "$MONGO_URI" | python3 -c \
            "import sys,re; u=sys.stdin.read().strip(); print(re.sub(r'(://[^:]+:)[^@]+(@)',r'\1***\2',u)[:120])")
          echo "Injecting MONGO_URL=$MASKED into Lambda env vars..."
          for FN in syrabit-prewarm-seo-routes syrabit-seo-baseline syrabit-materialize-chapter-faqs; do
            CURRENT_JSON=$(aws lambda get-function-configuration \
              --function-name "$FN" --region ap-south-1 \
              --query 'Environment.Variables' --output json 2>/dev/null || echo '{}')
            # Build updated env JSON via Python one-liner (avoids YAML multiline
            # heredoc issues and shell quoting issues with special chars in URI).
            export CURRENT_JSON
            TMP=$(MONGO_URI="$MONGO_URI" python3 -c 'import json,os,tempfile; ev=json.loads(os.environ["CURRENT_JSON"]); ev["MONGO_URL"]=os.environ["MONGO_URI"]; f=tempfile.NamedTemporaryFile("w",suffix=".json",delete=False); json.dump({"Variables":ev},f); print(f.name)')
            STATUS=$(aws lambda update-function-configuration \
              --function-name "$FN" \
              --environment "file://$TMP" \
              --region ap-south-1 \
              --query 'LastUpdateStatus' \
              --output text 2>&1) && RC=0 || RC=$?
            rm -f "$TMP"
            if [ "$RC" -ne 0 ]; then
              echo "  ERROR updating $FN: $STATUS"; exit 1
            fi
            echo "  ✓ $FN: LastUpdateStatus=$STATUS"
          done
          echo "Waiting 10s for Lambda configuration updates to propagate..."
          sleep 10
          # Verify Active state before invoking.
          for FN in syrabit-prewarm-seo-routes syrabit-seo-baseline syrabit-materialize-chapter-faqs; do
            aws lambda wait function-updated --function-name "$FN" --region ap-south-1 2>/dev/null && \
              echo "  ✓ $FN: configuration Active" || echo "  ⚠ $FN: wait timed out (continuing)"
          done

      - name: Describe function configs
        run: |
          for FN in syrabit-prewarm-seo-routes syrabit-seo-baseline syrabit-materialize-chapter-faqs; do
            echo "=== $FN ==="
            aws lambda get-function-configuration \
              --function-name "$FN" \
              --region ap-south-1 \
              --query '{State: State, LastUpdateStatus: LastUpdateStatus, Runtime: Runtime, Handler: Handler, Timeout: Timeout, MemorySize: MemorySize, LastModified: LastModified}' \
              --output json 2>/dev/null || echo "  ERROR: function not found"
          done

      - name: Check EventBridge schedules
        run: |
          echo "=== EventBridge schedules ==="
          aws scheduler list-schedules \
            --group-name default \
            --region ap-south-1 \
            --query 'Schedules[?contains(Name, `syrabit`)].{Name:Name, State:State, Expression:ScheduleExpression}' \
            --output table 2>/dev/null || echo "  ERROR: could not list schedules (may not have scheduler:ListSchedules permission)"

          aws events list-rules \
            --region ap-south-1 \
            --query 'Rules[?contains(Name, `syrabit`)].{Name:Name, State:State, Schedule:ScheduleExpression}' \
            --output table 2>/dev/null || echo "  (no classic EventBridge rules for syrabit)"

      - name: Self-bootstrap ec2 SG permission via BootstrapSelfUpdate (Task #10)
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Granting ec2:AuthorizeSecurityGroupEgress to github-deploy via BootstrapSelfUpdate..."
          aws iam put-role-policy \
            --role-name github-deploy \
            --policy-name smoke-invoke-sg-hotfix \
            --policy-document '{
              "Version": "2012-10-17",
              "Statement": [{
                "Sid": "SgHotfix27017",
                "Effect": "Allow",
                "Action": [
                  "ec2:AuthorizeSecurityGroupEgress",
                  "ec2:DescribeSecurityGroups",
                  "ec2:RevokeSecurityGroupEgress"
                ],
                "Resource": "*"
              }]
            }'
          echo "IAM inline policy set — waiting 10s for propagation..."
          sleep 10
          echo "EC2 SG permission ready."

      - name: Ensure workers_egress SG allows port 27017 (MongoDB Atlas, Task #10)
        run: |
          set -euo pipefail
          SG_ID=$(aws ec2 describe-security-groups \
            --region ap-south-1 \
            --filters "Name=group-name,Values=syrabit-workers-egress" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
          if [ -z "$SG_ID" ] || [ "$SG_ID" = "None" ]; then
            echo "workers_egress SG not found — skipping (smoke against already-running functions)"
            exit 0
          fi
          echo "workers_egress SG: $SG_ID"
          EXISTS=$(aws ec2 describe-security-groups \
            --region ap-south-1 \
            --group-ids "$SG_ID" \
            --query 'SecurityGroups[0].IpPermissionsEgress[?FromPort==`27017`].FromPort' \
            --output text 2>/dev/null || echo "")
          if [ -n "$EXISTS" ] && [ "$EXISTS" != "None" ]; then
            echo "Port 27017 egress already allowed (FromPort=$EXISTS) — skipping."
          else
            echo "Adding port 27017 (MongoDB Atlas) egress rule..."
            aws ec2 authorize-security-group-egress \
              --region ap-south-1 \
              --group-id "$SG_ID" \
              --ip-permissions '[{"IpProtocol":"tcp","FromPort":27017,"ToPort":27017,"IpRanges":[{"CidrIp":"0.0.0.0/0","Description":"MongoDB Atlas port 27017 — Task #10 smoke-invoke hotfix"}]}]' \
              --output text 2>&1 | head -5
            echo "Rule added — Lambda can now reach Atlas on port 27017 via NAT."
          fi

      - name: Invoke each Lambda synchronously
        if: inputs.dry_run != 'true'
        id: invoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/lambda-results
          PASS=true
          INVOKED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "invoked_at=$INVOKED_AT" >> "$GITHUB_OUTPUT"

          invoke_fn() {
            local FN="$1"
            local OUT="/tmp/lambda-results/${FN}.json"
            echo "=== Invoking ${FN} at ${INVOKED_AT} ==="
            # Synchronous invoke (RequestResponse), capture status code + response
            HTTP_CODE=$(aws lambda invoke \
              --function-name "$FN" \
              --invocation-type RequestResponse \
              --log-type Tail \
              --payload '{"source":"github-actions","task":"smoke-invoke","trigger":"manual-task-5-verification"}' \
              --region ap-south-1 \
              --cli-binary-format raw-in-base64-out \
              --query 'StatusCode' \
              --output text \
              "$OUT" 2>/dev/null || echo "0")

            echo "  HTTP status code: ${HTTP_CODE}"

            if [ -f "$OUT" ]; then
              echo "  Response payload:"
              cat "$OUT" | python3 -m json.tool 2>/dev/null || cat "$OUT"
            fi

            # StatusCode 200 = success for RequestResponse
            if [ "${HTTP_CODE}" = "200" ]; then
              # Check for FunctionError in response
              if grep -q '"errorMessage"\|"errorType"\|"FunctionError"' "$OUT" 2>/dev/null; then
                echo "  ✗ Function returned an error payload"
                PASS=false
              else
                echo "  ✓ ${FN}: invoked successfully (HTTP 200)"
              fi
            else
              echo "  ✗ ${FN}: invoke returned HTTP ${HTTP_CODE}"
              PASS=false
            fi
          }

          invoke_fn "syrabit-prewarm-seo-routes"
          invoke_fn "syrabit-seo-baseline"
          invoke_fn "syrabit-materialize-chapter-faqs"

          if [ "${PASS}" = "true" ]; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CloudWatch logs to appear
        if: inputs.dry_run != 'true' && steps.invoke.outputs.pass == 'true'
        run: |
          echo "Waiting 15s for CloudWatch log propagation..."
          sleep 15

      - name: Check CloudWatch log streams for evidence
        if: inputs.dry_run != 'true'
        id: cwlogs
        run: |
          set -euo pipefail
          SINCE_EPOCH=$(python3 -c "
          import datetime
          t = '${{ steps.invoke.outputs.invoked_at }}'
          dt = datetime.datetime.fromisoformat(t.replace('Z','+00:00'))
          # subtract 60s safety margin
          print(int((dt.timestamp() - 60) * 1000))
          ")
          PASS=true

          check_cw() {
            local FN="$1"
            local LOG_GROUP="/aws/lambda/${FN}"
            STREAMS=$(aws logs describe-log-streams \
              --log-group-name "${LOG_GROUP}" \
              --order-by LastEventTime \
              --descending \
              --max-items 3 \
              --region ap-south-1 \
              --query 'logStreams[?lastEventTimestamp>=`'"${SINCE_EPOCH}"'`].[logStreamName,lastEventTimestamp]' \
              --output text 2>/dev/null || echo "")

            if [ -z "${STREAMS}" ]; then
              echo "  ✗ ${FN}: no CW log stream found after invocation"
              PASS=false
              return
            fi

            STREAM_NAME=$(echo "${STREAMS}" | head -1 | awk '{print $1}')
            echo "  ✓ ${FN}: CW stream ${STREAM_NAME}"

            # Fetch ALL events for this invocation window (up to 100)
            # so we see diagnostic lines (URI_DIAG, host_tail) that appear
            # at the START of the stream before any error traceback.
            ALL_EVENTS=$(aws logs get-log-events \
              --log-group-name "${LOG_GROUP}" \
              --log-stream-name "${STREAM_NAME}" \
              --start-time "${SINCE_EPOCH}" \
              --region ap-south-1 \
              --query 'events[*].message' \
              --output text 2>/dev/null || echo "")
            echo "--- CW log (all events) ---"
            echo "$ALL_EVENTS"
            echo "--- end CW log ---"
          }

          echo "=== CloudWatch evidence ==="
          check_cw "syrabit-prewarm-seo-routes"
          check_cw "syrabit-seo-baseline"
          check_cw "syrabit-materialize-chapter-faqs"

          echo "=== Alarm states ==="
          for ALARM in \
            "syrabit-cache-prewarm-success-rate-low" \
            "seo-baseline-score-regression" \
            "seo-baseline-failures-high"; do
            STATE=$(aws cloudwatch describe-alarms \
              --alarm-names "${ALARM}" \
              --region ap-south-1 \
              --query 'MetricAlarms[0].StateValue' \
              --output text 2>/dev/null || echo "UNKNOWN")
            echo "  ${ALARM}: ${STATE}"
          done

          if [ "${PASS}" = "true" ]; then
            echo "cwpass=true" >> "$GITHUB_OUTPUT"
          else
            echo "cwpass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload invocation results as artifact
        if: inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-smoke-invoke-results
          path: /tmp/lambda-results/
          retention-days: 30

      - name: Stamp manifest with invocation timestamp
        if: inputs.dry_run != 'true' && steps.invoke.outputs.pass == 'true' && steps.cwlogs.outputs.cwpass == 'true'
        run: |
          python3 - <<PYEOF
          import json, os

          invoked_at = "${{ steps.invoke.outputs.invoked_at }}"
          run_url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          with open("infra/aws/lambda/manifest.json") as f:
              m = json.load(f)

          targets = {"prewarm_seo_routes", "seo_baseline", "materialize_chapter_faqs"}
          for job in m.get("migrated_jobs", []):
              mod = job.get("aca_module", "").split(".")[-1]
              if mod in targets:
                  job["cutover_verified_at"] = invoked_at
                  job["cutover_verified_by"] = "invoke-lambda-smoke.yml"
                  job["cutover_verification_run"] = run_url

          with open("infra/aws/lambda/manifest.json", "w") as f:
              json.dump(m, f, indent=2)
              f.write("\n")

          print(f"Stamped cutover_verified_at={invoked_at} for {targets}")
          PYEOF

      - name: Commit verification stamp
        if: inputs.dry_run != 'true' && steps.invoke.outputs.pass == 'true' && steps.cwlogs.outputs.cwpass == 'true'
        run: |
          git config user.email "ci@syrabit.ai"
          git config user.name "Syrabit CI"
          git add infra/aws/lambda/manifest.json
          git diff --cached --quiet || git commit -m "ci(task-5): stamp cutover_verified_at — smoke-invoke confirmed CW logs [Task #5]"
          git push

      - name: Final status
        if: inputs.dry_run != 'true'
        run: |
          if [ "${{ steps.invoke.outputs.pass }}" = "true" ] && [ "${{ steps.cwlogs.outputs.cwpass }}" = "true" ]; then
            echo "ALL CHECKS PASSED — Task #5 cutover verification complete"
          else
            echo "SOME CHECKS FAILED — review step outputs above"
            exit 1
          fi
