name: _tmp-read-cw-diag
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Read latest CW logs for all 3 functions
        run: |
          for FN in syrabit-prewarm-seo-routes syrabit-seo-baseline syrabit-materialize-chapter-faqs; do
            echo "=== $FN ==="
            # get most recent stream
            STREAM=$(aws logs describe-log-streams \
              --log-group-name "/aws/lambda/$FN" \
              --order-by LastEventTime --descending --max-items 1 \
              --region ap-south-1 \
              --query 'logStreams[0].logStreamName' --output text 2>/dev/null)
            echo "  Stream: $STREAM"
            # get last 30 events
            aws logs get-log-events \
              --log-group-name "/aws/lambda/$FN" \
              --log-stream-name "$STREAM" \
              --limit 30 \
              --region ap-south-1 \
              --query 'events[].message' \
              --output text 2>/dev/null | head -40
          done
          echo ""
          echo "=== Direct Lambda env check: MONGO_URL pattern ==="
          for FN in syrabit-prewarm-seo-routes syrabit-seo-baseline syrabit-materialize-chapter-faqs; do
            echo "--- $FN ---"
            aws lambda get-function-configuration \
              --function-name "$FN" --region ap-south-1 \
              --query 'Environment.Variables' --output json 2>/dev/null | \
              python3 -c "
import sys,json
d=json.load(sys.stdin)
for k,v in d.items():
  if 'MONGO' in k.upper() or 'PASS' in k.upper() or 'SECRET' in k.upper() or 'DB' in k.upper():
    if 'ARN' in k.upper() or 'NAME' in k.upper():
      print(f'  {k}: {v}')
    else:
      print(f'  {k}: ***REDACTED*** (len={len(v)})')
  else:
    print(f'  {k}: {v[:60] if len(v) > 60 else v}')
"
          done
