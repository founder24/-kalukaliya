name: cross-cloud-trace-canary

# Task #489 — V4 §7 cross-cloud trace canary.
#
# Fires a single canary HTTP request at the ACA backend with a known
# `traceparent` header, then queries the OTEL backstop (Sentry + GCP
# Cloud Trace) to assert that BOTH the ACA span and the downstream
# AWS Lambda span (reembed_consumer / s3_to_r2_sync) landed under the
# same trace-id. This is the end-to-end check the architect feedback
# called out — it locks in that the Lambda OTEL env vars in
# `infra/aws/sqs-reembed.tf` + `s3-to-r2-sync.tf` actually export.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 h
  workflow_dispatch: {}
  workflow_run:
    workflows: ["azure-container-apps-deploy"]
    types: [completed]

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      ACA_BASE_URL: ${{ vars.PROD_BASE_URL }}
      CANARY_PATH: "/api/admin/observability/trace-canary"
      ADMIN_JWT: ${{ secrets.PROD_ADMIN_JWT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Skip if config missing (no-op)
        if: ${{ env.ACA_BASE_URL == '' || env.ADMIN_JWT == '' || env.SENTRY_AUTH_TOKEN == '' }}
        run: |
          echo "::notice::cross-cloud-trace-canary: PROD_BASE_URL / PROD_ADMIN_JWT / SENTRY_AUTH_TOKEN unset — skipping (no failure)."
          exit 0

      - name: Generate canary traceparent
        id: tp
        if: ${{ env.ACA_BASE_URL != '' && env.ADMIN_JWT != '' && env.SENTRY_AUTH_TOKEN != '' }}
        run: |
          TRACE_ID=$(openssl rand -hex 16)
          SPAN_ID=$(openssl rand -hex 8)
          TP="00-${TRACE_ID}-${SPAN_ID}-01"
          echo "trace_id=${TRACE_ID}" >> "$GITHUB_OUTPUT"
          echo "traceparent=${TP}"   >> "$GITHUB_OUTPUT"

      - name: Fire canary at ACA
        if: ${{ env.ACA_BASE_URL != '' && env.ADMIN_JWT != '' && env.SENTRY_AUTH_TOKEN != '' }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${ADMIN_JWT}" \
            -H "traceparent: ${{ steps.tp.outputs.traceparent }}" \
            -H "Content-Type: application/json" \
            -d '{"fanout":["reembed","s3_to_r2_sync"]}' \
            "${ACA_BASE_URL%/}${CANARY_PATH}"

      - name: Wait for span propagation
        if: ${{ env.ACA_BASE_URL != '' && env.ADMIN_JWT != '' && env.SENTRY_AUTH_TOKEN != '' }}
        run: sleep 90

      - name: Assert ACA + AWS spans share trace-id (Sentry)
        if: ${{ env.ACA_BASE_URL != '' && env.ADMIN_JWT != '' && env.SENTRY_AUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          TRACE_ID="${{ steps.tp.outputs.trace_id }}"
          # Sentry Trace API: GET /api/0/organizations/{org}/events-trace/{trace_id}/
          BODY=$(curl -fsS \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            "https://sentry.io/api/0/organizations/${SENTRY_ORG}/events-trace/${TRACE_ID}/?project=${SENTRY_PROJECT}")
          echo "$BODY" | jq -e '
            (.transactions // []) as $tx
            | (any($tx[]; (.["sdk.name"] // "") | test("python|fastapi"))) as $aca_seen
            | (any($tx[]; (."service.name" // "") | test("reembed-consumer|s3-to-r2-sync"))) as $aws_seen
            | $aca_seen and $aws_seen
          ' > /dev/null
          echo "::notice::cross-cloud trace ${TRACE_ID} confirmed: ACA + AWS Lambda spans both present."
