name: Regenerate Lockfile

on:
  workflow_dispatch:

permissions: {}

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Create PR with regenerated lockfile
        run: |
          BRANCH="chore/regen-lockfile-$(date +%Y%m%d)-${{ github.run_id }}"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate pnpm-lock.yaml"
          git push origin "$BRANCH"
          gh pr create --title "chore: regenerate pnpm-lock.yaml" --body "Automated lockfile regeneration via workflow_dispatch." --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
