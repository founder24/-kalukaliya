name: bot-rules-drift

#
# Task #9 — mechanical enforcement of the canonical bot registry at
# `infra/bot-rules.yaml`. This gate fails the build when any of the
# four runtime regex sources drifts out of sync with the registry:
#
#   * artifacts/syrabit-backend/utils.py   (_SEARCH_BOT_UA_RE, _ABUSIVE_SCRAPER_UA_RE)
#   * artifacts/syrabit/vite.config.js     (BOT_UA)
#   * artifacts/syrabit/public/_worker.js  (SEARCH_BOT_UA)
#   * workers/edge-proxy/src/index.ts      (SEARCH_BOT_UA, AI_BOT_UA)
#
# Add a token to the YAML → this gate fails until every regex source
# above contains the token. Remove a token from the YAML → same.
# Without this gate the four sources can diverge silently and either
# (a) Googlebot stops getting the verified-bot fast path, or (b) a
# training-only crawler stops getting hard-403'd.
#
# This file is itself SHA-pinned per pinned-actions-check.yml.

on:
  pull_request:
    branches: [Replit-agent, master, main]
    paths:
      - "infra/bot-rules.yaml"
      - "infra/bot-regex.generated.json"
      - "scripts/check_bot_rules_drift.py"
      - "scripts/gen_bot_regex.py"
      - "artifacts/syrabit-backend/utils.py"
      - "artifacts/syrabit/vite.config.js"
      - "artifacts/syrabit/public/_worker.js"
      - "workers/edge-proxy/src/index.ts"
      - ".github/workflows/bot-rules-drift.yml"
  push:
    branches: [Replit-agent, master, main]

permissions:
  contents: read

jobs:
  drift:
    name: Verify bot-rules registry sync
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: false
          set-safe-directory: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.11"

      - name: Regenerate canonical regex manifest from YAML
        # Lock-step codegen: every edit to infra/bot-rules.yaml must
        # produce a regenerated infra/bot-regex.generated.json in the
        # same commit. The `git diff --exit-code` below fails CI if
        # the committed manifest is stale.
        run: |
          set -euo pipefail
          python3 scripts/gen_bot_regex.py --apply
      - name: Fail if generated manifest is stale
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- infra/bot-regex.generated.json; then
            echo "::error::infra/bot-regex.generated.json is stale. Run 'python3 scripts/gen_bot_regex.py --apply' and commit the result."
            exit 1
          fi
      - name: Run bot-rules drift guard
        run: |
          set -euo pipefail
          python3 scripts/check_bot_rules_drift.py

      - name: Probe live secret presence
        # Task #53 — Direct `secrets.*` references inside step `if:`
        # expressions cause GitHub Actions startup-failures (jobs_count=0,
        # no logs). The supported pattern is to materialise the secret
        # into a job-level env at the start, then gate downstream steps
        # on the env. We expose only a boolean ("set" / "unset") via
        # GITHUB_OUTPUT so neither the secret value nor a masked
        # placeholder appears in subsequent `if:` evaluation logs.
        id: live_gates
        env:
          BOT_UNBLOCK_PREVIEW_URL: ${{ secrets.BOT_UNBLOCK_PREVIEW_URL }}
          BOT_UNBLOCK_TEST_URL: ${{ secrets.BOT_UNBLOCK_TEST_URL }}
        run: |
          set -euo pipefail
          if [ -n "${BOT_UNBLOCK_PREVIEW_URL:-}" ]; then
            echo "preview_set=true" >> "$GITHUB_OUTPUT"
          else
            echo "preview_set=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${BOT_UNBLOCK_TEST_URL:-}" ]; then
            echo "test_set=true" >> "$GITHUB_OUTPUT"
          else
            echo "test_set=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Live golden bot-unblock probe — Playwright matrix (gated)
        # Canonical golden test for Task #9 lives at
        # `artifacts/syrabit/tests/bot-unblock.spec.ts` (Playwright,
        # exercises real-browser prerender assertions). Runs against
        # `BOT_UNBLOCK_PREVIEW_URL` when configured. The httpx
        # contract probes below are the secondary, header-only fast
        # check.
        if: steps.live_gates.outputs.preview_set == 'true'
        env:
          BOT_UNBLOCK_PREVIEW_URL: ${{ secrets.BOT_UNBLOCK_PREVIEW_URL }}
        working-directory: artifacts/syrabit
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test tests/bot-unblock.spec.ts

      - name: Live golden bot-unblock probe — httpx contract (gated)
        # Runs the live-gated subset of `tests/test_bot_unblock.py`
        # against a deployed preview when `BOT_UNBLOCK_TEST_URL` is
        # set in repo secrets. The live tests assert: perplexitybot
        # gets prerendered HTML (h1 + schema.org JSON-LD), gptbot is
        # hard-403'd, and a Googlebot UA from a non-Google IP is
        # hard-403'd with `X-Bot-Verify: spoofed` (RUNNER_MODE=spoof,
        # the default — matches GitHub-hosted runners). The
        # `verified` mode (Googlebot expected 200 + prerender) is
        # mutually exclusive and requires a CF-trusted egress; route
        # it through a separately-configured job if needed.
        if: steps.live_gates.outputs.test_set == 'true'
        env:
          BOT_UNBLOCK_TEST_URL: ${{ secrets.BOT_UNBLOCK_TEST_URL }}
          BOT_UNBLOCK_RUNNER_MODE: spoof
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest httpx
          python3 -m pytest -q tests/test_bot_unblock.py -k 'live'
