name: Lambda Image Rebuild + Code Update (Task #5)

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Comma-separated function names (default: all 3)"
        required: false
        default: "syrabit-prewarm-seo-routes,syrabit-seo-baseline,syrabit-materialize-chapter-faqs"

permissions:
  id-token: write
  contents: read

env:
  PRIMARY_REGION: ap-south-1
  ACCOUNT_ID: "271740379017"
  ECR_PRI: "271740379017.dkr.ecr.ap-south-1.amazonaws.com"
  ECR_REPO: "271740379017.dkr.ecr.ap-south-1.amazonaws.com/syrabit/queue-fanout"
  DOCKERFILE: "artifacts/syrabit/services/backend/sqs_consumers/Dockerfile"

jobs:
  rebuild-and-update:
    name: Build + push ECR image → update Lambda code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Download arm64 binary wheels (no QEMU compilation needed)
        run: |
          mkdir -p .build/arm64-wheels
          REQS="artifacts/syrabit-backend/requirements-lambda.txt"
          if [ ! -f "$REQS" ]; then
            REQS="artifacts/syrabit-backend/requirements.txt"
          fi
          echo "Downloading arm64 wheels from: $REQS"
          pip3 download \
            --platform manylinux_2_17_aarch64 \
            --platform manylinux_2_28_aarch64 \
            --only-binary=:all: \
            --python-version "3.11" \
            -r "$REQS" \
            -d .build/arm64-wheels \
            --quiet 2>&1 | tail -5 || true
          echo "Wheel count: $(ls .build/arm64-wheels/*.whl 2>/dev/null | wc -l)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to ECR (ap-south-1)
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ env.ACCOUNT_ID }}

      - name: Build + push Lambda batch image
        uses: docker/build-push-action@14487ce63c7e6e32b62fa2ced5a3e1e2d325b19d # v6.16.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REPO }}:sqs-consumers-latest
            ${{ env.ECR_REPO }}:task5-${{ github.sha }}
          cache-from: type=gha,scope=sqs-consumers
          cache-to: type=gha,scope=sqs-consumers,mode=max

      - name: Update Lambda function code for each target
        run: |
          set -euo pipefail
          IMAGE="${{ env.ECR_REPO }}:sqs-consumers-latest"
          IFS=',' read -ra FUNCS <<< "${{ inputs.functions || 'syrabit-prewarm-seo-routes,syrabit-seo-baseline,syrabit-materialize-chapter-faqs' }}"

          for FN in "${FUNCS[@]}"; do
            FN=$(echo "$FN" | xargs)
            echo "=== Updating ${FN} → ${IMAGE} ==="
            aws lambda update-function-code \
              --function-name "$FN" \
              --image-uri "$IMAGE" \
              --region ap-south-1 \
              --query '{FunctionName: FunctionName, LastUpdateStatus: LastUpdateStatus}' \
              --output json

            echo "  Waiting for update to complete..."
            aws lambda wait function-updated \
              --function-name "$FN" \
              --region ap-south-1 && echo "  ✓ ${FN}: active"
          done

      - name: Verify function states after update
        run: |
          IFS=',' read -ra FUNCS <<< "${{ inputs.functions || 'syrabit-prewarm-seo-routes,syrabit-seo-baseline,syrabit-materialize-chapter-faqs' }}"
          for FN in "${FUNCS[@]}"; do
            FN=$(echo "$FN" | xargs)
            echo "=== $FN ==="
            aws lambda get-function-configuration \
              --function-name "$FN" \
              --region ap-south-1 \
              --query '{State: State, LastUpdateStatus: LastUpdateStatus, CodeSha256: CodeSha256}' \
              --output json
          done
