name: "Agent: Performance Regression"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: performance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    env:
      VITE_BACKEND_URL: https://api.syrabit.ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup PNPM
        run: corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/syrabit run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Create Lighthouse CI config
        run: |
          cat > /tmp/lighthouserc.json <<'EOF'
          {
            "ci": {
              "collect": {
                "url": ["http://localhost:8080/"],
                "numberOfRuns": 3,
                "settings": {
                  "preset": "desktop"
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", { "minScore": 0.8 }],
                  "largest-contentful-paint": ["warn", { "maxNumericValue": 2500 }],
                  "total-blocking-time": ["warn", { "maxNumericValue": 200 }],
                  "cumulative-layout-shift": ["warn", { "maxNumericValue": 0.1 }]
                }
              }
            }
          }
          EOF

      - name: Start HTTP server
        run: |
          npx serve apps/frontend/dist -l 8080 &
          sleep 3

      - name: Run Lighthouse CI collect
        id: lhci-collect
        continue-on-error: true
        run: |
          lhci collect --config=/tmp/lighthouserc.json
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI assert
        id: lhci-assert
        continue-on-error: true
        run: |
          lhci assert --config=/tmp/lighthouserc.json 2>&1 | tee /tmp/lhci-assert-output.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Parse Lighthouse results
        id: parse-results
        run: |
          # Find the latest Lighthouse JSON result
          RESULT_FILE=$(find .lighthouseci -name 'lhr-*.json' -type f 2>/dev/null | sort | tail -1)

          if [ -z "$RESULT_FILE" ]; then
            echo "No Lighthouse results found"
            echo "lcp=N/A" >> "$GITHUB_OUTPUT"
            echo "tbt=N/A" >> "$GITHUB_OUTPUT"
            echo "cls=N/A" >> "$GITHUB_OUTPUT"
            echo "perf_score=N/A" >> "$GITHUB_OUTPUT"
            echo "regression=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export RESULT_FILE
          # Extract metrics using python
          python3 << 'PYEOF'
          import json, os

          result_file = os.environ['RESULT_FILE']
          with open(result_file, 'r') as f:
            lhr = json.load(f)

          with open('.github/scripts/performance-baseline.json', 'r') as f:
            baseline = json.load(f)

          # Extract values
          lcp = lhr.get('audits', {}).get('largest-contentful-paint', {}).get('numericValue', 0)
          tbt = lhr.get('audits', {}).get('total-blocking-time', {}).get('numericValue', 0)
          cls = lhr.get('audits', {}).get('cumulative-layout-shift', {}).get('numericValue', 0)
          perf_score = int(lhr.get('categories', {}).get('performance', {}).get('score', 0) * 100)

          # Check thresholds
          lcp_max = baseline['lighthouse']['lcp_max_ms']
          tbt_max = baseline['lighthouse']['tbt_max_ms']
          cls_max = baseline['lighthouse']['cls_max']
          perf_min = baseline['lighthouse']['performance_min_score']
          lcp_regression = baseline['lighthouse']['lcp_regression_threshold_ms']
          tbt_regression = baseline['lighthouse']['tbt_regression_threshold_ms']

          regression = False
          if lcp > lcp_max + lcp_regression:
            regression = True
          if tbt > tbt_max + tbt_regression:
            regression = True

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"lcp={int(lcp)}\n")
            f.write(f"tbt={int(tbt)}\n")
            f.write(f"cls={cls:.3f}\n")
            f.write(f"perf_score={perf_score}\n")
            f.write(f"regression={'true' if regression else 'false'}\n")
          PYEOF

      - name: Comment performance summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const lcp = '${{ steps.parse-results.outputs.lcp }}';
            const tbt = '${{ steps.parse-results.outputs.tbt }}';
            const cls = '${{ steps.parse-results.outputs.cls }}';
            const perfScore = '${{ steps.parse-results.outputs.perf_score }}';
            const regression = '${{ steps.parse-results.outputs.regression }}' === 'true';

            let body = '## Performance Regression Report\n\n';
            body += '| Metric | Value | Threshold |\n';
            body += '|--------|-------|----------|\n';
            body += `| LCP | ${lcp} ms | 2500 ms |\n`;
            body += `| TBT | ${tbt} ms | 200 ms |\n`;
            body += `| CLS | ${cls} | 0.1 |\n`;
            body += `| Performance Score | ${perfScore} | 80 |\n\n`;

            if (regression) {
              body += ':x: **Performance regression detected.** Metrics exceed acceptable thresholds.\n\n';
            } else {
              body += ':white_check_mark: **No performance regressions detected.**\n\n';
            }

            body += '---\n*Generated by agent-performance-regression workflow*';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.body.includes('## Performance Regression Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail on regression
        if: steps.parse-results.outputs.regression == 'true'
        run: |
          echo "Performance regression detected. LCP or TBT exceeds acceptable thresholds."
          exit 1
