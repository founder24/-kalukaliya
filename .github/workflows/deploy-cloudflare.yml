name: Deploy — Cloudflare Native Only

# This path deliberately does not authenticate to GCP or read GCP
# Secret Manager. Worker secrets are provisioned from GitHub Actions secrets
# through Wrangler, and the frontend build uses the optional GitHub secret.
on:
  workflow_dispatch:
    inputs:
      activate_native:
        description: 'Route the public edge Worker to the D1 API Worker after deployment'
        required: false
        default: false
        type: boolean
      validate_authenticated:
        description: 'Require disposable authenticated cutover checks after deployment'
        required: false
        default: false
        type: boolean
      validate_reset_delivery:
        description: 'Require a fresh disposable password-reset email proof after deployment'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  API_WORKER_URL: https://syrabit-api-prod.axomxplain.workers.dev
  PUBLIC_EDGE_URL: https://api.syrabit.ai
  FRONTEND_URL: https://syrabit.ai

concurrency:
  group: cloudflare-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Cloudflare Configuration & Quality Gates
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
      RESET_TOKEN_SECRET: ${{ secrets.RESET_TOKEN_SECRET }}
      EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
      INDEXNOW_INTERNAL_SECRET: ${{ secrets.INDEXNOW_INTERNAL_SECRET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      TRANSLATE_CRON_SECRET: ${{ secrets.TRANSLATE_CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate D1 configuration
        run: |
          bash scripts/validate-d1-config.sh apps/api/wrangler.toml

      - name: Validate required Cloudflare bindings and crawler routes
        run: python3 scripts/validate-cloudflare-release-config.py

      - name: Require authenticated validation for native activation
        if: ${{ github.event.inputs.activate_native == 'true' || github.event.inputs.validate_authenticated == 'true' || github.event.inputs.validate_reset_delivery == 'true' }}
        env:
          ACTIVATE_NATIVE: ${{ github.event.inputs.activate_native }}
          VALIDATE_AUTHENTICATED: ${{ github.event.inputs.validate_authenticated }}
          VALIDATE_RESET_DELIVERY: ${{ github.event.inputs.validate_reset_delivery }}
        run: |
          test "$ACTIVATE_NATIVE" = 'true'
          test "$VALIDATE_AUTHENTICATED" = 'true'
          if [ "$VALIDATE_RESET_DELIVERY" = 'true' ]; then
            test "$ACTIVATE_NATIVE" = 'true'
            test "$VALIDATE_AUTHENTICATED" = 'true'
          fi

      - name: Require API Worker release secrets
        run: |
          set -euo pipefail
          required=(
            JWT_SECRET ADMIN_JWT_SECRET RESET_TOKEN_SECRET EDGE_SHARED_SECRET
            RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET
            RESEND_API_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Required Cloudflare API Worker release secrets are not supplied: ${missing[*]}"
            echo "Refusing to deploy so native routing cannot expose a partially configured API Worker."
            exit 1
          else
            echo "All required Cloudflare API Worker release secrets are supplied."
          fi

      - name: Test and type-check API Worker
        run: |
          pnpm --filter syrabit-api test
          pnpm --filter syrabit-api run type-check

      - name: Test and type-check edge Worker
        run: |
          pnpm --filter syrabit-edge test
          pnpm --filter syrabit-edge exec tsc --noEmit

      - name: Type-check frontend
        run: pnpm --filter @workspace/syrabit exec tsc --noEmit

  deploy-api:
    name: Deploy API Worker + D1
    runs-on: ubuntu-latest
    needs: verify
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision API Worker secrets from GitHub
        working-directory: apps/api
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          RESET_TOKEN_SECRET: ${{ secrets.RESET_TOKEN_SECRET }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          INDEXNOW_INTERNAL_SECRET: ${{ secrets.INDEXNOW_INTERNAL_SECRET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          TRANSLATE_CRON_SECRET: ${{ secrets.TRANSLATE_CRON_SECRET }}
        run: |
          set -euo pipefail
          put_required_secret() {
            local name="$1"
            local value="$2"
            [[ -n "$value" ]] || {
              echo "::error::$name is required for the native API Worker release."
              exit 1
            }
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env production >/dev/null
          }
          put_optional_secret() {
            local name="$1"
            local value="$2"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env production >/dev/null
            else
              echo "$name not supplied; preserving the existing Cloudflare value."
            fi
          }
          put_required_secret JWT_SECRET "$JWT_SECRET"
          put_required_secret ADMIN_JWT_SECRET "$ADMIN_JWT_SECRET"
          put_required_secret RESET_TOKEN_SECRET "$RESET_TOKEN_SECRET"
          put_required_secret EDGE_SHARED_SECRET "$EDGE_SHARED_SECRET"
          put_required_secret RAZORPAY_KEY_ID "$RAZORPAY_KEY_ID"
          put_required_secret RAZORPAY_KEY_SECRET "$RAZORPAY_KEY_SECRET"
          put_required_secret RAZORPAY_WEBHOOK_SECRET "$RAZORPAY_WEBHOOK_SECRET"
          put_required_secret RESEND_API_KEY "$RESEND_API_KEY"
          put_optional_secret INDEXNOW_API_KEY "$INDEXNOW_API_KEY"
          put_optional_secret INDEXNOW_INTERNAL_SECRET "$INDEXNOW_INTERNAL_SECRET"
          put_optional_secret R2_PUBLIC_URL "$R2_PUBLIC_URL"
          put_optional_secret TRANSLATE_CRON_SECRET "$TRANSLATE_CRON_SECRET"

      - name: Verify required API Worker secret names
        run: |
          set -euo pipefail
          secret_list="$(pnpm --filter syrabit-api exec wrangler secret list --env production --format json)"
          printf '%s' "$secret_list" | python3 -c '
          import json
          import sys
          required = {
              "JWT_SECRET", "ADMIN_JWT_SECRET", "RESET_TOKEN_SECRET",
              "EDGE_SHARED_SECRET", "RAZORPAY_KEY_ID", "RAZORPAY_KEY_SECRET",
              "RAZORPAY_WEBHOOK_SECRET", "RESEND_API_KEY",
          }
          configured = {item["name"] for item in json.load(sys.stdin)}
          missing = sorted(required - configured)
          if missing:
              print("Cloudflare API Worker required secrets are absent: " + ", ".join(missing))
              raise SystemExit(1)
          else:
              print("All required API Worker secret names are present; values were not read.")
          '

      - name: Apply D1 migrations
        run: pnpm --filter syrabit-api exec wrangler d1 migrations apply syrabit-db --remote --env production

      - name: Verify required D1 migration is applied
        run: |
          set -euo pipefail
          applied_migrations="$(pnpm --filter syrabit-api exec wrangler d1 execute syrabit-db --remote --env production --json \
            --command "SELECT name FROM d1_migrations WHERE name = '0013_reset_token_cutover_nonce.sql'")"
          if ! printf '%s\n' "$applied_migrations" | python3 -c '
          import json
          import sys
          rows = json.load(sys.stdin)
          found = any(
              row.get("name") == "0013_reset_token_cutover_nonce.sql"
              for result in rows
              for row in result.get("results", [])
          )
          if not found:
              raise SystemExit(
                  "Production D1 is missing 0013_reset_token_cutover_nonce.sql; "
                  "refusing API Worker deployment."
              )
          '
          then
            echo "::error::Production D1 is missing 0013_reset_token_cutover_nonce.sql; refusing API Worker deployment."
            exit 1
          fi
          echo "Production D1 reset-token cutover migration is applied."

      - name: Deploy API Worker
        run: pnpm --filter syrabit-api exec wrangler deploy --env production

  deploy-edge:
    name: Deploy Edge Worker
    runs-on: ubuntu-latest
    needs: deploy-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision shared edge secrets from GitHub
        working-directory: apps/edge
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "$JWT_SECRET" ]]; then
            printf '%s' "$JWT_SECRET" | pnpm exec wrangler secret put JWT_SECRET --env production >/dev/null
          else
            echo "JWT_SECRET not supplied; preserving the existing Cloudflare value."
          fi
          if [[ -n "$EDGE_SHARED_SECRET" ]]; then
            printf '%s' "$EDGE_SHARED_SECRET" | pnpm exec wrangler secret put EDGE_SHARED_SECRET --env production >/dev/null
          else
            echo "EDGE_SHARED_SECRET not supplied; preserving the existing Cloudflare value."
          fi

      - name: Verify edge Worker secret names
        run: |
          set -euo pipefail
          secret_list="$(pnpm --filter syrabit-edge exec wrangler secret list --env production --format json)"
          printf '%s' "$secret_list" | python3 -c '
          import json
          import sys
          required = {"JWT_SECRET", "EDGE_SHARED_SECRET"}
          configured = {item["name"] for item in json.load(sys.stdin)}
          missing = sorted(required - configured)
          if missing:
              print("Cloudflare edge Worker secret provisioning is incomplete: " + ", ".join(missing))
              raise SystemExit(1)
          print("Required edge Worker secret names are present.")
          '

      - name: Guard against sentinel KV IDs
        run: |
          if grep -v '^\s*#' apps/edge/wrangler.toml | grep -qi 'REPLACE_ME'; then
            echo "::error::wrangler.toml contains a sentinel KV namespace ID."
            exit 1
          fi

      - name: Deploy edge Worker
        run: pnpm --filter syrabit-edge exec wrangler deploy --env production

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: verify
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/syrabit run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://api.syrabit.ai' }}
          CLOUDFLARE_RELEASE_BUILD: 'true'

      - name: Deploy to Cloudflare Pages
        run: |
          cd apps/edge
          pnpm exec wrangler pages deploy ../frontend/dist --project-name=syrabitfrontend --commit-dirty=true

      - name: Submit URLs to IndexNow
        if: ${{ env.INDEXNOW_SECRET != '' }}
        run: node apps/frontend/scripts/indexnow-submit.mjs

  smoke:
    name: Cloudflare Native Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-edge, deploy-frontend]
    if: |
      always() &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-edge.result == 'success' &&
      needs.deploy-frontend.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: API Worker is live and Worker-native
        run: |
          set -euo pipefail
          status="$(curl -sS -D /tmp/api.headers -o /tmp/api.json -w '%{http_code}' \
            "${API_WORKER_URL}/health" --max-time 30)"
          test "$status" = "200"
          grep -qi '^x-syrabit-route: worker-native' /tmp/api.headers
          echo "API Worker health passed: HTTP ${status}"

      - name: Critical API Worker bindings pass deep read-only probes
        env:
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          status="$(curl -sS -D /tmp/api-deep.headers -o /tmp/api-deep.json -w '%{http_code}' \
            -H "Authorization: Bearer ${EDGE_SHARED_SECRET}" \
            "${API_WORKER_URL}/health/deep" --max-time 30)"
          test "$status" = "200" || { cat /tmp/api-deep.json; exit 1; }
          grep -qi '^x-syrabit-route: worker-native' /tmp/api-deep.headers
          python3 - /tmp/api-deep.json <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              payload = json.load(f)
          required = {"d1", "workers_ai", "vectorize", "r2", "content_kv", "rate_limit_kv"}
          assert payload["status"] == "healthy", payload
          assert payload["mutation_free"] is True, payload
          assert payload["missing_bindings"] == [], payload
          assert required == set(payload["checks"]), payload
          assert all(item["status"] == "healthy" for item in payload["checks"].values()), payload
          PY
          echo "Deep binding probes passed without production writes."

      - name: Public edge is reachable
        run: |
          set -euo pipefail
          status="$(curl -sS -D /tmp/edge.headers -o /tmp/edge.json -w '%{http_code}' \
            "${PUBLIC_EDGE_URL}/health" --max-time 30)"
          test "$status" = "200"
          echo "Public edge health passed: HTTP ${status}"

      - name: D1 content and anonymous credits work on the deployed API Worker
        run: |
          set -euo pipefail
          curl -sS --max-time 20 "${API_WORKER_URL}/api/v1/content/library-bundle?slim=1" \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); assert all(k in p for k in ("boards","classes","streams","subjects")), p'
          anon_id="anon_$(openssl rand -hex 16)"
          curl -sS --max-time 20 -H "X-Anon-ID: ${anon_id}" \
            "${API_WORKER_URL}/api/v1/users/credits" \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["credits_remaining"] >= 0 and p["anon_id"].startswith("anon_"), p'

      - name: Public edge CORS contract is intact
        run: |
          set -euo pipefail
          status="$(curl -sS -D /tmp/cors.headers -o /dev/null -w '%{http_code}' --max-time 20 -X OPTIONS \
            -H 'Origin: https://syrabit.ai' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization,x-anon-id' \
            "${PUBLIC_EDGE_URL}/api/v1/chat")"
          test "$status" = "200" || test "$status" = "204"
          grep -qi '^access-control-allow-origin: https://syrabit.ai' /tmp/cors.headers
          grep -qi '^access-control-allow-methods:.*POST' /tmp/cors.headers
          grep -qi '^access-control-allow-headers:.*authorization' /tmp/cors.headers
          grep -qi '^access-control-allow-headers:.*x-anon-id' /tmp/cors.headers

      - name: Frontend is reachable
        run: |
          status="$(curl -sS -L -o /dev/null -w '%{http_code}' "${FRONTEND_URL}" --max-time 30)"
          test "$status" = "200"
          echo "Frontend reachability passed: HTTP ${status}"

      - name: Pages custom Worker serves crawler HTML, feeds, and true 404s
        run: |
          set -euo pipefail
          bot_ua='Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'
          curl -sS -D /tmp/crawler.headers -o /tmp/crawler.html --max-time 30 \
            -A "$bot_ua" -H 'Accept: text/html' "${FRONTEND_URL}/library"
          grep -qi '^x-source: \(prerender\|bot-render\)' /tmp/crawler.headers
          grep -qi '<title' /tmp/crawler.html
          for path in sitemap-index.xml feed.xml feed/notes.xml feed.json llms.txt llms-full.txt; do
            headers="/tmp/${path//\//-}.headers"
            output="/tmp/${path//\//-}.body"
            status="$(curl -sS -D "$headers" -o "$output" -w '%{http_code}' --max-time 30 \
              "${FRONTEND_URL}/${path}")"
            test "$status" = "200" || { echo "${path} returned ${status}"; exit 1; }
            ! grep -qi '^x-robots-tag:.*noindex' "$headers"
            case "$path" in
              *.xml) grep -Eqi '^content-type: application/(rss\+)?xml' "$headers"; grep -Eq '<rss|<sitemapindex' "$output" ;;
              *.json) grep -qi '^content-type: application/' "$headers"; python3 -m json.tool "$output" >/dev/null ;;
              *.txt) grep -qi '^content-type: text/plain' "$headers"; test -s "$output" ;;
            esac
          done
          missing="/release-health-missing-$(openssl rand -hex 12)"
          status="$(curl -sS -D /tmp/missing.headers -o /tmp/missing.html -w '%{http_code}' \
            --max-time 30 -A "$bot_ua" -H 'Accept: text/html' "${FRONTEND_URL}${missing}")"
          test "$status" = "404" || { cat /tmp/missing.html; echo "Expected true 404, got ${status}"; exit 1; }
          grep -qi '^x-source: bot-render-not-found' /tmp/missing.headers
          ! grep -q 'id="root"\|id="app"' /tmp/missing.html

  activate-native:
    name: Activate D1 API Worker routing
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ github.event.inputs.activate_native == 'true' && github.event.inputs.validate_authenticated == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Activate only after pre-release smoke passes
        run: printf 'true' | pnpm --filter syrabit-edge exec wrangler secret put API_WORKER_LIVE --env production

  post-activation-smoke:
    name: Confirm native routing after activation
    runs-on: ubuntu-latest
    needs: activate-native
    env:
      API_WORKER_URL: https://syrabit-api-prod.axomxplain.workers.dev
      PUBLIC_EDGE_URL: https://api.syrabit.ai
      FRONTEND_URL: https://syrabit.ai
    steps:
      - uses: actions/checkout@v4
      - name: Service binding, D1 content, and anonymous credits work publicly
        run: |
          set -euo pipefail
          status="$(curl -sS -D /tmp/edge.headers -o /tmp/edge.json -w '%{http_code}' \
            "${PUBLIC_EDGE_URL}/health" --max-time 30)"
          test "$status" = "200"
          grep -qi '^x-syrabit-health-backend: api-worker' /tmp/edge.headers
          curl -sS -D /tmp/content.headers --max-time 20 \
            "${PUBLIC_EDGE_URL}/api/v1/content/library-bundle?slim=1" \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); assert all(k in p for k in ("boards","classes","streams","subjects")), p'
          grep -qi '^x-syrabit-route: worker-native' /tmp/content.headers
          anon_id="anon_$(openssl rand -hex 16)"
          curl -sS -D /tmp/credits.headers --max-time 20 -H "X-Anon-ID: ${anon_id}" \
            "${PUBLIC_EDGE_URL}/api/v1/users/credits" \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["credits_remaining"] >= 0 and p["anon_id"].startswith("anon_"), p'
          grep -qi '^x-syrabit-route: worker-native' /tmp/credits.headers

      - name: Validate authenticated Cloudflare cutover
        env:
          INDEXNOW_INTERNAL_SECRET: ${{ secrets.INDEXNOW_INTERNAL_SECRET }}
          STUDENT_TOKEN: ${{ secrets.CUTOVER_STUDENT_TOKEN }}
          STAFF_TOKEN: ${{ secrets.CUTOVER_STAFF_TOKEN }}
          ADMIN_SESSION_TOKEN: ${{ secrets.CUTOVER_ADMIN_SESSION_TOKEN }}
          CUTOVER_PAYMENT_TOKEN: ${{ secrets.CUTOVER_PAYMENT_TOKEN }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
          TRANSLATE_CRON_SECRET: ${{ secrets.TRANSLATE_CRON_SECRET }}
        run: |
          set -euo pipefail
          bash scripts/validate-cloudflare-api-cutover.sh

  request-reset-email:
    name: Request fresh disposable password-reset email
    runs-on: ubuntu-latest
    needs: [post-activation-smoke]
    if: |
      always() &&
      github.event.inputs.activate_native == 'true' &&
      github.event.inputs.validate_authenticated == 'true' &&
      github.event.inputs.validate_reset_delivery == 'true' &&
      needs.post-activation-smoke.result == 'success'
    outputs:
      nonce: ${{ steps.request.outputs.nonce }}
    env:
      CUTOVER_RESET_EMAIL: ${{ secrets.CUTOVER_RESET_EMAIL }}
    steps:
      - id: request
        name: Request reset through the newly deployed public edge
        run: |
          set -euo pipefail
          : "${CUTOVER_RESET_EMAIL:?Set CUTOVER_RESET_EMAIL to the disposable fixture}"
          [[ "${CUTOVER_RESET_EMAIL,,}" == *cutover* ]] || {
            echo "CUTOVER_RESET_EMAIL must identify a disposable fixture by containing 'cutover'." >&2
            exit 1
          }
          nonce="$(openssl rand -hex 32)"
          payload="$(CUTOVER_RESET_NONCE="$nonce" python3 -c '
          import json, os
          print(json.dumps({
              "email": os.environ["CUTOVER_RESET_EMAIL"],
              "cutover_nonce": os.environ["CUTOVER_RESET_NONCE"],
          }))
          ')"
          headers="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$headers" "$response"' EXIT
          status="$(curl --silent --show-error --max-time 30 \
            --request POST --header 'Content-Type: application/json' --data "$payload" \
            --dump-header "$headers" --output "$response" --write-out '%{http_code}' \
            "${PUBLIC_EDGE_URL}/api/v1/auth/reset-password/request")"
          test "$status" = "200" || { cat "$response"; echo "Fresh reset request failed with ${status}" >&2; exit 1; }
          grep -qi '^x-syrabit-route: worker-native' "$headers" || {
            cat "$headers"; echo "Fresh reset request did not use the native Worker route" >&2; exit 1;
          }
          python3 - "$response" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              payload = json.load(f)
          assert payload == {"message": "If an account exists, a reset email has been sent"}, payload
          PY
          echo "nonce=$nonce" >> "$GITHUB_OUTPUT"
          echo "::notice::Fresh reset email requested. Update the protected CUTOVER_RESET_LINK environment secret with the newly delivered link, then approve the next job."

  validate-reset-email:
    name: Confirm fresh disposable password-reset email
    runs-on: ubuntu-latest
    needs: [request-reset-email]
    if: ${{ needs.request-reset-email.result == 'success' }}
    environment: cutover-reset-delivery
    env:
      CUTOVER_RESET_ONLY: 'true'
      CUTOVER_RESET_EMAIL: ${{ secrets.CUTOVER_RESET_EMAIL }}
      CUTOVER_RESET_LINK: ${{ secrets.CUTOVER_RESET_LINK }}
      CUTOVER_RESET_PASSWORD: ${{ secrets.CUTOVER_RESET_PASSWORD }}
      CUTOVER_RESET_NONCE: ${{ needs.request-reset-email.outputs.nonce }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the newly delivered link exactly once
        run: |
          set -euo pipefail
          bash scripts/validate-cloudflare-api-cutover.sh

  rollback-native-routing:
    name: Restore Cloud Run routing after failed cutover validation
    runs-on: ubuntu-latest
    needs: [post-activation-smoke, validate-reset-email]
    if: |
      always() &&
      github.event.inputs.activate_native == 'true' &&
      github.event.inputs.validate_authenticated == 'true' &&
      (
        needs.post-activation-smoke.result != 'success' ||
        (
          github.event.inputs.validate_reset_delivery == 'true' &&
          needs.validate-reset-email.result != 'success'
        )
      )
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack + PNPM
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable native edge routing
        run: printf 'false' | pnpm --filter syrabit-edge exec wrangler secret put API_WORKER_LIVE --env production