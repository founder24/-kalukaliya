name: cf-edge-cache-smoke

#
# Supply-chain hardening: every `uses:` reference in this file is pinned to a
# full 40-char commit SHA (with a trailing `# vX.Y.Z` tag comment for
# readability). Float tags like `actions/checkout@v4` are forbidden because a
# compromise of the upstream tag — as happened with tj-actions/changed-files in
# 2025 — would let an attacker silently exfiltrate this repo's secrets on the
# next push. See https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
# To upgrade an action: look up the SHA for the new tag (e.g.
# `gh api repos/actions/checkout/git/refs/tags/v4.3.0 --jq .object.sha`) and
# update both the SHA and the trailing tag comment.
#
# Least-privilege scopes (Task #905): every workflow declares an explicit
# top-level `permissions:` block granting only the `GITHUB_TOKEN` scopes its
# jobs actually need — read-only by default. Omitting `permissions:` falls
# back to the repo default (`contents: write`), which would defeat the
# SHA-pinning hardening if a pinned action were ever compromised.
#
# Task #425 — End-to-end smoke for the CF_EDGE_CACHE_ON write-through path.
# Task #456 — Extended to also fire against PRODUCTION on the same
# `workflow_run` trigger so a hot-fix or worker-only config change that
# bypasses staging is still caught within minutes of going live (rather
# than at the 04:11 UTC nightly cron the next day).
#
# What this proves
# ----------------
# The Task #405 done-criteria included "flipping CF_EDGE_CACHE_ON=1 in
# staging makes the admin panel show non-zero kv_writes / kv_reads
# counters under /admin/cf-health". Without this gate that outcome was
# only verifiable by hand and a contract drift between
# `kv_cache.KvCache` (Python client) and `dispatchKvCache` (TypeScript
# worker) would only show up the first time an admin opened the panel
# in staging — already too late.
#
# The smoke calls a dedicated `POST /admin/cf-health/kv-smoke` endpoint
# that triggers a single `set → drop-LRU → get → invalidate` round trip
# through the deployed edge worker, then re-reads `/admin/cf-health` to
# assert that both `kv_writes` AND `kv_reads` advanced. A failure means
# either:
#   - the worker rejected the contract (auth / payload / route shape), OR
#   - the backend client stopped issuing the HTTP hops (e.g. a refactor
#     accidentally short-circuited on the LRU and never round-tripped).
#
# Cadence
# -------
#   - workflow_dispatch: manual smoke from the Actions tab. The
#     `target` input picks staging (default) or production.
#   - workflow_run: fires after the ACA deploy lane of
#     azure-container-apps-deploy.yml so a regression is caught
#     immediately on the freshly-deployed revision (only when the
#     upstream workflow actually succeeded — there is no point smoking
#     a failed deploy). The matrix exercises BOTH staging and
#     production targets on every successful deploy run; matrix
#     entries whose env/secrets are not configured no-op with a clear
#     log line so a fresh fork doesn't fail noisily.
#   - schedule: 04:11 UTC daily as a belt-and-suspenders gate against
#     drift introduced by an unrelated config change (env var rename,
#     KV namespace re-bind, etc.). Runs both targets too.
#
# Required repo secrets / vars
# ----------------------------
#   STAGING_BASE_URL       Repo variable. Backend base URL for the
#                          staging deploy, e.g.
#                          https://syrabit-backend-staging.eastus.azurecontainerapps.io
#                          When unset the staging matrix entry no-ops
#                          with a clear log line.
#   STAGING_ADMIN_JWT      Repo secret. Long-lived admin Bearer token
#                          accepted by `auth_deps.get_admin_user`. Same
#                          token shape used by the admin dashboard. Must
#                          ONLY be a staging credential — never wire the
#                          production admin JWT here.
#   PROD_BASE_URL          Repo variable. Backend base URL for the
#                          production deploy, e.g.
#                          https://api.syrabit.ai. When unset the
#                          production matrix entry no-ops.
#   PROD_ADMIN_JWT         Repo secret. Long-lived admin Bearer token
#                          for production. Distinct from the staging
#                          token — rotation is independent.
#
# Optional repo secrets (Task #496 — environment-aware paging)
# ------------------------------------------------------------
# Task #456 put PRODUCTION on the same matrix as staging. Without
# environment-tagged paging, on-call sees "cf-edge-cache-smoke failed"
# and has to open Actions to find out *which* environment regressed —
# fine for a staging flap during a deploy, painful when the regression
# is in prod and minutes matter.
#
# To keep that distinction crisp, each matrix leg posts to its own
# Slack webhook on failure (in addition to GitHub's failed-workflow
# email which still fires for both):
#
#   CF_EDGE_CACHE_SMOKE_PAGE_WEBHOOK   Production failures route here.
#                                      Wire this to the high-priority
#                                      on-call page channel (PagerDuty
#                                      Slack app, #oncall-prod, etc.).
#                                      Production CF_EDGE_CACHE drift
#                                      is a user-visible incident.
#   CF_EDGE_CACHE_SMOKE_SLACK_WEBHOOK  Staging failures route here.
#                                      Wire this to a lower-priority
#                                      channel (e.g. #alerts-staging).
#                                      Staging flaps are common during
#                                      deploys and should NOT page on-
#                                      call out of hours.
#
# When the appropriate webhook is unset, the alert step is a no-op with
# a `::warning::` annotation and the workflow still fails so the
# GitHub failed-workflow email goes out as a fallback signal.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to smoke (staging | production | both)."
        required: false
        default: both
        type: choice
        options:
          - staging
          - production
          - both
      base_url:
        description: "Override the selected target's BASE_URL (only honoured when a single target is picked)."
        required: false
        default: ""
  workflow_run:
    # Must match the upstream workflow's `name:` (not its filename) —
    # GitHub's `workflow_run` trigger keys off the human-readable name.
    workflows: ["Azure Container Apps deploy (manual)"]
    types: [completed]
    # No branch filter: the deploy lane can be invoked from any
    # branch (Replit-agent, main, master, hot-fix branches), and we want
    # the smoke to gate the freshly-deployed revision regardless of
    # which branch shipped it.
  schedule:
    # 04:11 UTC daily — off the hour to dodge the GitHub cron stampede
    # and offset from the other nightly probes (admin-smoke 02:00,
    # grounded-recall 04:30, synthetic-probe-secrets 05:13).
    - cron: "11 4 * * *"

# Read-only token: this job checks out the repo and probes the deployed
# backend(s) over HTTPS. It does not write back to the repo, touch
# packages, or open PRs.
permissions:
  contents: read

jobs:
  smoke:
    name: CF_EDGE_CACHE write-through round trip (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # When fired by `workflow_run`, only run if the upstream deploy
    # actually succeeded — smoking a failed deploy would just turn the
    # workflow red for a reason already reported elsewhere.
    #
    # On manual dispatch, honour the `target` input so an operator can
    # smoke just one environment without spinning up an idle matrix leg.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'workflow_dispatch'
          || github.event.inputs.target == 'both'
          || github.event.inputs.target == matrix.target)

    strategy:
      # Staging and production are independent — a flap on one must not
      # mask a real regression on the other.
      fail-fast: false
      matrix:
        target: [staging, production]

    defaults:
      run:
        working-directory: artifacts/syrabit-backend

    env:
      STAGING_TIMEOUT_S: "20"
      # All possible source values are exposed to the resolver step so
      # the matrix entry can pick the correct pair without having to
      # encode nested ternaries in YAML expressions (those are fragile
      # and hard to review). Per-target binding happens in
      # "Resolve target env" below.
      STAGING_BASE_URL_VAR: ${{ vars.STAGING_BASE_URL }}
      PROD_BASE_URL_VAR:    ${{ vars.PROD_BASE_URL }}
      STAGING_ADMIN_JWT_SECRET: ${{ secrets.STAGING_ADMIN_JWT }}
      PROD_ADMIN_JWT_SECRET:    ${{ secrets.PROD_ADMIN_JWT }}
      DISPATCH_BASE_URL_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == matrix.target && github.event.inputs.base_url || '' }}
      MATRIX_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Task #906 — strip the GITHUB_TOKEN from .git/config after
          # checkout. This job only runs an HTTP probe; persisting the
          # token would only widen blast radius on an accidental .git/
          # artifact upload.
          persist-credentials: false

      - name: Resolve target env
        # Pick the right BASE_URL / ADMIN_JWT for this matrix leg and
        # publish them to subsequent steps under the names the smoke
        # script expects (STAGING_BASE_URL / STAGING_ADMIN_JWT — these
        # are the script's internal contract; reusing the names for the
        # production leg is NOT a leak of staging credentials, it just
        # avoids a script fork).
        id: resolve
        run: |
          set -euo pipefail
          if [ "$MATRIX_TARGET" = "production" ]; then
            BASE="${DISPATCH_BASE_URL_OVERRIDE:-$PROD_BASE_URL_VAR}"
            JWT="$PROD_ADMIN_JWT_SECRET"
          else
            BASE="${DISPATCH_BASE_URL_OVERRIDE:-$STAGING_BASE_URL_VAR}"
            JWT="$STAGING_ADMIN_JWT_SECRET"
          fi
          # Mask the JWT in any later log output. BASE_URL is not a
          # secret (it's a public hostname) so it is intentionally not
          # masked — masking it would obscure failure diagnostics.
          if [ -n "$JWT" ]; then echo "::add-mask::$JWT"; fi
          {
            echo "STAGING_BASE_URL=$BASE"
            echo "STAGING_ADMIN_JWT=$JWT"
          } >> "$GITHUB_ENV"

      - name: Skip when target not configured
        id: gate
        run: |
          if [ -z "${STAGING_BASE_URL:-}" ] || [ -z "${STAGING_ADMIN_JWT:-}" ]; then
            echo "::notice::${MATRIX_TARGET} BASE_URL or ADMIN_JWT not configured; skipping CF_EDGE_CACHE smoke for this target."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install httpx
        if: steps.gate.outputs.skip != 'true'
        # The smoke script only needs the standard library + httpx, so
        # avoid pulling the full backend requirements.txt for speed.
        run: pip install "httpx>=0.27,<0.29"

      - name: Run CF_EDGE_CACHE end-to-end smoke (${{ matrix.target }})
        id: smoke
        if: steps.gate.outputs.skip != 'true'
        # Tee the smoke output to a file so the alert step below can
        # include the last few lines of failure context in the Slack
        # payload (otherwise on-call has to open the Actions UI to see
        # which assertion tripped). `set +o pipefail; PIPESTATUS[0]`
        # preserves the script's exit code even though tee always
        # succeeds.
        run: |
          set +e
          python -m scripts.cf_edge_cache_smoke 2>&1 | tee /tmp/cf_edge_cache_smoke.out
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Page on-call with environment name on failure
        # Task #496 — Route failures to an environment-specific Slack
        # webhook so on-call sees `staging` vs `production` in the
        # alert payload itself, without having to open the Actions
        # tab. Production failures hit the high-priority page channel;
        # staging stays on the lower-priority alerts channel.
        #
        # Runs only when the smoke step itself failed (skipped no-op
        # legs and earlier setup failures don't page — those surface
        # via the GitHub failed-workflow email instead).
        if: ${{ failure() && steps.gate.outputs.skip != 'true' && steps.smoke.conclusion == 'failure' }}
        env:
          PAGE_WEBHOOK_URL:  ${{ secrets.CF_EDGE_CACHE_SMOKE_PAGE_WEBHOOK }}
          SLACK_WEBHOOK_URL: ${{ secrets.CF_EDGE_CACHE_SMOKE_SLACK_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        working-directory: .
        run: |
          set +e
          # Pick the destination webhook AND the urgency framing based
          # on which matrix leg failed. Production gets a :rotating_light:
          # + "PAGE" prefix so a PagerDuty-Slack app or channel keyword
          # router can escalate; staging gets a :warning: so the same
          # router can leave it as a low-noise FYI.
          if [ "$MATRIX_TARGET" = "production" ]; then
            WEBHOOK="$PAGE_WEBHOOK_URL"
            WEBHOOK_NAME="CF_EDGE_CACHE_SMOKE_PAGE_WEBHOOK"
            SEVERITY="page"
            EMOJI=":rotating_light:"
            HEADER="PAGE — cf-edge-cache-smoke FAILED on PRODUCTION"
          else
            WEBHOOK="$SLACK_WEBHOOK_URL"
            WEBHOOK_NAME="CF_EDGE_CACHE_SMOKE_SLACK_WEBHOOK"
            SEVERITY="warning"
            EMOJI=":warning:"
            HEADER="cf-edge-cache-smoke failed on STAGING"
          fi

          if [ -z "${WEBHOOK:-}" ]; then
            echo "::warning title=Alert skipped::${WEBHOOK_NAME} not configured for target=${MATRIX_TARGET}; on-call will only see the GitHub failed-workflow email. Configure the webhook to route this to the right Slack channel."
            exit 0
          fi

          # Last 1500 chars of the smoke output is plenty for on-call
          # to see which assertion tripped without blowing past Slack's
          # 40k-char block limit.
          smoke_tail=$(tail -c 1500 /tmp/cf_edge_cache_smoke.out 2>/dev/null || echo "(no output captured)")

          payload=$(jq -n \
            --arg target  "$MATRIX_TARGET" \
            --arg sev     "$SEVERITY" \
            --arg emoji   "$EMOJI" \
            --arg header  "$HEADER" \
            --arg run     "$RUN_URL" \
            --arg trigger "$TRIGGER" \
            --arg tail    "$smoke_tail" \
            '{
              text: ($emoji + " " + $header),
              # Keep environment + severity as top-level fields too so a
              # downstream router (PagerDuty Events API, custom Lambda,
              # etc.) can branch on them without parsing the rendered
              # text.
              environment: $target,
              severity: $sev,
              runUrl: $run,
              trigger: $trigger,
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ($emoji + " *" + $header + "*\n"
                      + "*environment:* `" + $target + "`\n"
                      + "*trigger:* `" + $trigger + "`\n"
                      + "<" + $run + "|GitHub Actions run>")
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*smoke output (last 1500 chars)*\n```\n" + $tail + "\n```")
                  }
                }
              ]
            }')

          http_code=$(curl -sS -o /tmp/alert_body -w '%{http_code}' \
            -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            --max-time 15 --retry 2 --retry-delay 5 \
            -d "$payload")
          echo "[alert] target=$MATRIX_TARGET severity=$SEVERITY http=$http_code body=$(cat /tmp/alert_body 2>/dev/null | head -c 200)"
          if [ "$http_code" != "200" ]; then
            echo "::warning title=Alert delivery failed::${WEBHOOK_NAME} returned HTTP $http_code (job will still fail so the GitHub failed-workflow email goes out)"
          fi
          exit 0
