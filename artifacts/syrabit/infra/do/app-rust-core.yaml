# infra/do/app-rust-core.yaml
#
# Task #331 — DO App Platform spec for the Rust core (ported off
# Railway). Supersedes the Phase 1d shell from Task #330.
#
# DO App Platform supports HTTP/2 + gRPC end-to-end since 2024, so the
# gRPC port is declared as a second `internal_ports` entry rather than
# requiring a separate Droplet + load balancer. Other DO apps in the
# same project dial it on the private VPC via `rust-core-core.private`.
#
# Image is published by `.github/workflows/do-deploy-rust-core.yml`,
# which rewrites `image.tag` to `sha-<short-sha>` on every deploy.

name: rust-core
region: blr1

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: CPU_UTILIZATION
    value: 80
    operator: GREATER_THAN
    window: FIVE_MINUTES
  - rule: MEM_UTILIZATION
    value: 80
    operator: GREATER_THAN
    window: FIVE_MINUTES
  - rule: RESTART_COUNT
    value: 3
    operator: GREATER_THAN
    window: TEN_MINUTES

services:
  - name: core
    instance_size_slug: basic-xs
    instance_count: 1
    autoscaling:
      min_instance_count: 1
      max_instance_count: 3
      metrics:
        cpu:
          percent: 75
    # Public HTTP port (REST + /health). gRPC is exposed on a second
    # internal port so the Python backend can dial it on the VPC
    # network without leaving the data center.
    http_port: 3000
    internal_ports:
      - 50051
    image:
      registry_type: DOCR
      repository: rust-core
      tag: bootstrap
      deploy_on_push:
        enabled: false
    health_check:
      http_path: /health
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 3
    deployment_strategy:
      type: ROLLING
      max_surge: 1
      max_unavailable: 0
    envs:
      # ── Runtime knobs ───────────────────────────────────────────
      - key: HTTP_PORT
        value: "3000"
        scope: RUN_AND_BUILD_TIME
      - key: GRPC_PORT
        value: "50051"
        scope: RUN_AND_BUILD_TIME
      - key: ENVIRONMENT
        value: "non-prod"
        scope: RUN_TIME
      - key: RUST_LOG
        value: "info"
        scope: RUN_TIME

      # ── Postgres (Supabase pooler) ──────────────────────────────
      - key: DATABASE_URL
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── JWT (shared with Python backend) ────────────────────────
      - key: JWT_SECRET
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── Upstash Redis (shared cache + rate-limits) ──────────────
      - key: UPSTASH_REDIS_REST_URL
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: UPSTASH_REDIS_REST_TOKEN
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── Observability ───────────────────────────────────────────
      - key: SENTRY_DSN
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      # Task #333 — observability rewire. The Rust core uses the
      # collector pattern: a single OTLP/HTTP exporter ships spans
      # to the in-cluster Azure Monitor OTel Collector sidecar (see
      # `infra/do/app-otel-collector.yaml`), which then fans out to
      # Application Insights + Axiom in parallel. The collector
      # reads `APPLICATIONINSIGHTS_CONNECTION_STRING` + `AXIOM_*`
      # from its own component spec; the Rust binary itself only
      # needs the collector endpoint URL.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector:4318"
        scope: RUN_TIME
      - key: AXIOM_TOKEN
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: AXIOM_DATASET
        value: "rust-core-do"
        scope: RUN_TIME

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: core
