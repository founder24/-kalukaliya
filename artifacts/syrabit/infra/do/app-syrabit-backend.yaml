# infra/do/app-syrabit-backend.yaml
#
# Task #331 — DO App Platform spec for the Python FastAPI backend
# (ported off Railway). Supersedes the Phase 1d shell from Task #330.
#
# Image is published by `.github/workflows/do-deploy-backend.yml`,
# which rewrites `image.tag` to `sha-<short-sha>` on every deploy via
# `doctl apps update --spec`. The `bootstrap` placeholder below is the
# tag pushed by the very first `doctl apps create` only.
#
# Region: blr1 (Bangalore) — closest DO region to the primary user
# base in IN, matching asia-south1 / ap-south-1 selections in GCP & AWS.
#
# Secrets: every `type: SECRET` entry below is set out-of-band via
#   scripts/do.sh import-env syrabit-backend do-backend-vars.env
# never via this committed YAML. The `value` is intentionally a
# `PLACEHOLDER` string so a fresh `doctl apps create` against this
# spec fails fast if the import step was skipped, instead of starting
# the container with empty credentials.

name: syrabit-backend
region: blr1

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: CPU_UTILIZATION
    value: 80
    operator: GREATER_THAN
    window: FIVE_MINUTES
  - rule: MEM_UTILIZATION
    value: 80
    operator: GREATER_THAN
    window: FIVE_MINUTES
  - rule: RESTART_COUNT
    value: 3
    operator: GREATER_THAN
    window: TEN_MINUTES

services:
  - name: api
    instance_size_slug: basic-s
    instance_count: 1
    autoscaling:
      min_instance_count: 1
      max_instance_count: 4
      metrics:
        cpu:
          percent: 70
    http_port: 8080
    image:
      registry_type: DOCR
      repository: syrabit-backend
      tag: bootstrap
      deploy_on_push:
        enabled: false
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    # Rolling deploys: App Platform default; explicit here so future
    # contributors don't accidentally flip to recreate.
    deployment_strategy:
      type: ROLLING
      max_surge: 1
      max_unavailable: 0
    envs:
      # ── Runtime knobs (non-secret) ──────────────────────────────
      - key: PORT
        value: "8080"
        scope: RUN_AND_BUILD_TIME
      - key: ENV
        value: "non-prod"
        scope: RUN_TIME
      - key: PYTHONUNBUFFERED
        value: "1"
        scope: RUN_TIME
      - key: GUNICORN_WORKERS
        value: "4"
        scope: RUN_TIME
      - key: GUNICORN_TIMEOUT
        value: "120"
        scope: RUN_TIME
      - key: RUST_CORE_GRPC_HOST
        # In-VPC dial via the App Platform internal name. App Platform
        # resolves `<app-name>.<service-name>` on the private network
        # without leaving the data center.
        value: "rust-core-core.private"
        scope: RUN_TIME
      - key: RUST_CORE_GRPC_PORT
        value: "50051"
        scope: RUN_TIME

      # ── Upstash Redis (cache + rate-limits + 429 burst counter) ──
      - key: UPSTASH_REDIS_REST_URL
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: UPSTASH_REDIS_REST_TOKEN
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── Supabase ────────────────────────────────────────────────
      - key: SUPABASE_URL
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: SUPABASE_ANON_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── MongoDB Atlas ───────────────────────────────────────────
      - key: MONGO_URL
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: DB_NAME
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── Pinecone ────────────────────────────────────────────────
      - key: PINECONE_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: PINECONE_INDEX
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── Cloudflare (R2 + D1 + AI Gateway) ───────────────────────
      - key: CF_ACCOUNT_ID
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: CF_API_TOKEN
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: CF_R2_ACCESS_KEY_ID
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: CF_R2_SECRET_ACCESS_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: CF_R2_BUCKET
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: CF_AI_GATEWAY_URL
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── Vertex / Vision / STT / TTS / Discovery Engine ──────────
      - key: GCP_PROJECT_ID
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: GCP_SERVICE_ACCOUNT_JSON
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: VERTEX_LOCATION
        value: "asia-south1"
        scope: RUN_TIME
      - key: DISCOVERY_ENGINE_LOCATION
        value: "global"
        scope: RUN_TIME

      # ── Payments ────────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: STRIPE_WEBHOOK_SECRET
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: RAZORPAY_KEY_ID
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: RAZORPAY_KEY_SECRET
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── Email + AI providers ────────────────────────────────────
      - key: RESEND_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: SARVAM_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: COHERE_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: VOYAGE_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: EXA_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: TAVILY_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: ELEVENLABS_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: DEEPGRAM_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: ASSEMBLYAI_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME

      # ── Observability ───────────────────────────────────────────
      - key: SENTRY_DSN
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: POSTHOG_API_KEY
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      # Task #333 — observability rewire. The DO backend ships spans
      # to Application Insights (primary unified APM/trace sink) and
      # Axiom (parallel log/trace sink) in parallel via tracing.py.
      # `AXIOM_API_TOKEN` is the new canonical name read by
      # `tracing.py` + `healthz.py`; the legacy `AXIOM_TOKEN` alias
      # is kept on the same secret for any out-of-tree consumers.
      - key: APPLICATIONINSIGHTS_CONNECTION_STRING
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: AXIOM_API_TOKEN
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: AXIOM_TOKEN
        value: "PLACEHOLDER_SET_VIA_doctl"
        type: SECRET
        scope: RUN_TIME
      - key: AXIOM_DATASET
        value: "syrabit-backend-do"
        scope: RUN_TIME

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: api
