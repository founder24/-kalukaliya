name = "syrabit-edge-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Thin shim only — heavy dispatch lives at the origin.
# Free tier (100 k req/day) is sufficient; Workers Paid cancelled.

[vars]
# Non-secret vars; secrets set via: wrangler secret put <NAME> --env <env>
NODE_ENV = "production"
# Origin selector — "do" only after Task #335 decommissioned the
# legacy Railway and GCP Cloud Run origins. The variable is retained
# so a future provider can be added without changing the worker
# source, but currently only "do" is wired.
ORIGIN_TARGET = "do"

[env.production]
name = "syrabit-edge-proxy"
routes = [
  { pattern = "dispatch.syrabit.ai/*", zone_name = "syrabit.ai" },
]

[env.production.vars]
ORIGIN_TARGET = "do"

[env.staging]
name = "syrabit-edge-proxy-staging"
routes = [
  { pattern = "dispatch-staging.syrabit.ai/*", zone_name = "syrabit.ai" },
]

[env.staging.vars]
ORIGIN_TARGET = "do"

# Actual secrets — set with `wrangler secret put <NAME> --env <env>`:
#   DO_APP_BACKEND_URL       — https://syrabit-backend-<hash>.ondigitalocean.app
#   DISPATCH_SHARED_SECRET   — 256-bit hex shared secret
#
# Removed in Task #335 (legacy origins decommissioned):
#   DISPATCH_CLOUD_RUN_URL, BACKEND_RAILWAY_URL — delete these
#   secrets via `wrangler secret delete <NAME> --env <env>` once the
#   worker has been redeployed without the rollback paths.
