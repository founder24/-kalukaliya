name = "syrabitworker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── Task #386 — Durable Objects: ChatSession + RateLimiter ───────────────────
# When the backend's DO_CHAT_ON flag is true, these bindings serve
# `/do/chat-session/<id>` and `/do/rate-limiter/check` from the edge
# (see src/chat_session.ts, src/rate_limiter.ts, and src/index.ts'
# `dispatchDurableObject` helper). The bindings stay defined even
# when DO_CHAT_ON is off so a flag flip needs no wrangler redeploy.
[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# Migrations are mandatory the first time a DO class is deployed.
# Bumping `tag` is how we add or rename classes in subsequent
# deployments.
[[migrations]]
tag = "v1-task-386"
new_classes = ["ChatSession", "RateLimiter"]

# Thin shim only — heavy dispatch lives at the origin.
# Free tier (100 k req/day) is sufficient; Workers Paid cancelled.

[vars]
# Non-secret vars; secrets set via: wrangler secret put <NAME> --env <env>
NODE_ENV = "production"
# Origin selector — "azure" routes to the Azure Container Apps
# syrabit-backend service (the only live origin as of the V4 cutover).
# The variable is retained so a future provider can be added without
# changing the worker source.
ORIGIN_TARGET = "azure"

[env.production]
name = "syrabitworker"
routes = [
  { pattern = "dispatch.syrabit.ai/*", zone_name = "syrabit.ai" },
]

[env.production.vars]
ORIGIN_TARGET = "azure"

# ── Task #405 — Cloudflare KV namespace for the hot-read cache ──────────────
# Backs the GET/PUT/DELETE /api/edge/kv-cache/<key> routes in src/index.ts
# which `kv_cache.KvCache` mirrors hot reads (chapter index, syllabus,
# feature flags, edu allowlist) into when the backend's CF_EDGE_CACHE_ON
# flag is true. The namespaces below were provisioned via the Cloudflare
# REST API in account d66e40eac539fff1db270fddf384a5ec — equivalent to:
#   wrangler kv:namespace create CF_EDGE_CACHE --env production
#   wrangler kv:namespace create CF_EDGE_CACHE --env staging
# The binding name is asserted by the worker (returns 503 if missing) so
# any future id swap surfaces clearly instead of silently corrupting traffic.
#
# Canonical registry for these IDs (Task #426): see
#   artifacts/syrabit-backend/RUNBOOK.md → "Cloudflare Worker secret +
#   KV namespace registry (Task #426)"
# If a namespace is recreated and the ID below changes, update both
# this file AND the runbook table in the same PR.
[[env.production.kv_namespaces]]
binding = "CF_EDGE_CACHE"
# title: syrabit-edge-CF_EDGE_CACHE
id = "a672a5c8f6604db3ae07526bb30da72a"

[env.staging]
name = "syrabit-edge-proxy-staging"
routes = [
  { pattern = "dispatch-staging.syrabit.ai/*", zone_name = "syrabit.ai" },
]

[env.staging.vars]
ORIGIN_TARGET = "azure"

[[env.staging.kv_namespaces]]
binding = "CF_EDGE_CACHE"
# title: syrabit-edge-CF_EDGE_CACHE_preview
id = "c8cdd4710c23460caf4d6fa526d76d2e"

# Actual secrets — set with `wrangler secret put <NAME> --env <env>`.
# Live values are stored in Azure Key Vault (`syrabit-prod-kv`) — see
#   artifacts/syrabit-backend/RUNBOOK.md → "Cloudflare Worker secret +
#   KV namespace registry (Task #426)"
# for the KV secret name mapped to each Wrangler secret and the
# rotation procedure (Task #426).
#   AZURE_BACKEND_URL        — https://syrabit-backend.lemonstone-ce3c87e1.eastus.azurecontainerapps.io
#   DISPATCH_SHARED_SECRET   — 256-bit hex shared secret
#   D1_SYNC_SECRET           — 256-bit hex shared secret matching the
#                              backend env var of the same name. Used as
#                              the X-Edge-Admin-Secret bearer for the
#                              /api/edge/kv-cache/* routes (Task #405)
#                              and the existing /api/edge/kv-usage probe.
#
# Removed in Task #335 (legacy origins decommissioned):
#   DISPATCH_CLOUD_RUN_URL, BACKEND_RAILWAY_URL — delete these
#   secrets via `wrangler secret delete <NAME> --env <env>` once the
#   worker has been redeployed without the rollback paths.
