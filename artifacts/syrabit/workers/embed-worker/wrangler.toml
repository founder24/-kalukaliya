name = "syrabit-embed-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom Workers-AI embedding endpoint (Task #382).
#
# Runs Gemma-300M and Qwen3-0.6B on the Workers AI binding, mean-pools
# the hidden states of each model into a fixed-width vector and
# concatenates / sums them down to a 1024-dim embedding so the result
# is drop-in compatible with the existing Pinecone index
# (1024-dim, cosine).
#
# The worker is intentionally a sibling of `edge-proxy` so a single
# wrangler workspace deploys both routing and embedding workers.

[ai]
binding = "AI"

[vars]
NODE_ENV = "production"
# Output dim — pinned to 1024 to match the Pinecone serverless index.
EMBED_DIMS = "1024"
# Max texts allowed in a single /embed batch request.
EMBED_MAX_BATCH = "32"
# Max characters per single input text — clipped before tokenisation.
EMBED_MAX_CHARS = "4096"
# Fan-out: which Workers-AI text-embedding endpoints contribute to the
# final vector. These MUST be dedicated embedding endpoints — chat /
# instruct slugs (e.g. @cf/google/gemma-3-1b-it,
# @cf/qwen/qwen2.5-0.5b-instruct) do NOT return embeddings via
# env.AI.run({text: [...]}) and would silently break the contract,
# leaving the backend with empty vectors. The defaults below are
# Gemma-300M and Qwen3-0.6B's dedicated embedding variants:
#   @cf/google/embeddinggemma-300m   →  768-dim  (resized to EMBED_DIMS)
#   @cf/qwen/qwen3-embedding-0.6b    → 1024-dim
EMBED_MODELS = "@cf/google/embeddinggemma-300m,@cf/qwen/qwen3-embedding-0.6b"
# Per-IP requests-per-minute cap enforced inside the worker (KV-less
# in-memory token bucket that resets on isolate cold-start; deliberate
# cheap guard, NOT a security boundary).
EMBED_RATE_RPM = "600"
# Worker version string surfaced via /version. Bump when changing the
# pooling formula so the backend can detect a vector-shape change.
EMBED_WORKER_VERSION = "1.1.0"

[env.production]
name = "syrabit-embed-worker"
routes = [
  { pattern = "embed.syrabit.ai/*", zone_name = "syrabit.ai" },
]

# Workers AI binding must be re-declared per-env — wrangler does NOT
# inherit top-level [ai] into named envs (Task #400 deploy fix).
[env.production.ai]
binding = "AI"

[env.production.vars]
NODE_ENV = "production"
EMBED_DIMS = "1024"
EMBED_MAX_BATCH = "32"
EMBED_MAX_CHARS = "4096"
EMBED_MODELS = "@cf/google/embeddinggemma-300m,@cf/qwen/qwen3-embedding-0.6b"
EMBED_RATE_RPM = "600"
EMBED_WORKER_VERSION = "1.1.0"

[env.staging]
name = "syrabit-embed-worker-staging"
routes = [
  { pattern = "embed-staging.syrabit.ai/*", zone_name = "syrabit.ai" },
]

# Workers AI binding must be re-declared per-env — wrangler does NOT
# inherit top-level [ai] into named envs (Task #400 deploy fix).
[env.staging.ai]
binding = "AI"

[env.staging.vars]
NODE_ENV = "production"
EMBED_DIMS = "1024"
EMBED_MAX_BATCH = "32"
EMBED_MAX_CHARS = "4096"
EMBED_MODELS = "@cf/google/embeddinggemma-300m,@cf/qwen/qwen3-embedding-0.6b"
EMBED_RATE_RPM = "600"
EMBED_WORKER_VERSION = "1.1.0-staging"

# Required wrangler secret (set with `wrangler secret put EMBED_SHARED_SECRET --env <env>`):
#   EMBED_SHARED_SECRET — 256-bit hex shared secret matched server-side
#                         by providers/workers_embed.py (X-Embed-Secret header).
