name = "syrabit-bedrock-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Thin shim only — Bedrock inference moved to AWS Lambda (lambda-bedrock-proxy.tf).
# This worker adds CF WAF / Zero Trust auth before forwarding to Lambda Function URL.
# Free tier (100 k req/day) is sufficient; Workers Paid subscription cancelled.

[env.production]
name = "syrabit-bedrock-proxy"
routes = [
  { pattern = "api.syrabit.ai/api/ai/bedrock/*", zone_name = "syrabit.ai" },
]

[env.staging]
name = "syrabit-bedrock-proxy-staging"

# Secrets (set with `wrangler secret put`):
#   BEDROCK_LAMBDA_URL     — https://<id>.lambda-url.us-east-1.on.aws/
#   LAMBDA_SHARED_SECRET   — 256-bit hex matched by Lambda authorizer
#   ALLOWED_USER_HEADER    — cf-access-authenticated-user-email
