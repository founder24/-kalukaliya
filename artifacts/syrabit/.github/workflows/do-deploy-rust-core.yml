# .github/workflows/do-deploy-rust-core.yml
#
# Phase 1d (Task #330) — DO App Platform deploy for the Rust core.
#
# Same pattern as do-deploy-backend.yml. The Rust image exposes both
# HTTP (3000) and gRPC (50051) on a single container; App Platform
# terminates HTTP/2 at the platform LB so gRPC works without a Droplet.

name: do-deploy-rust-core

on:
  push:
    branches: [master]
    paths:
      - "services/rust-core/**"
      - "infra/do/app-rust-core.yaml"
      - ".github/workflows/do-deploy-rust-core.yml"
  pull_request:
    paths:
      - "services/rust-core/**"
      - "infra/do/app-rust-core.yaml"
      - ".github/workflows/do-deploy-rust-core.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: non-prod
        type: choice
        options: [non-prod, prod]

concurrency:
  group: do-rust-core-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag (commit SHA)
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1800

      - uses: docker/setup-buildx-action@v3

      - name: Build & push rust-core image
        uses: docker/build-push-action@v5
        with:
          context: services/rust-core
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME || 'syrabit' }}/rust-core:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to App Platform (${{ github.event.inputs.environment || 'non-prod' }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'non-prod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Pin image tag in app spec
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.image_tag }}"
          sed -i "s/tag: bootstrap/tag: ${tag}/g" infra/do/app-rust-core.yaml
          grep -n "tag: ${tag}" infra/do/app-rust-core.yaml

      - name: doctl apps update --wait
        run: |
          set -euo pipefail
          app_id="${{ vars.DO_APP_ID_RUST_CORE }}"
          if [ -z "$app_id" ]; then
            echo "::error::DO_APP_ID_RUST_CORE repo variable is not set."
            exit 1
          fi
          doctl apps update "$app_id" \
            --spec infra/do/app-rust-core.yaml \
            --wait

      - name: Verify health
        run: |
          url="$(doctl apps get ${{ vars.DO_APP_ID_RUST_CORE }} --format LiveURL --no-header)"
          echo "Live URL: $url"
          for i in 1 2 3 4 5; do
            if curl -fsSL "${url}/healthz"; then
              echo "ok"
              exit 0
            fi
            sleep 5
          done
          echo "::error::healthz did not respond" && exit 1
