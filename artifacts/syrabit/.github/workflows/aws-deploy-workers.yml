# .github/workflows/aws-deploy-workers.yml
#
# Phase 1d (Task #330) — AWS deploy for the async worker tier.
#
# Authenticates via GitHub OIDC against the deploy role created in
# `infra/aws/iam-github-oidc.tf` (Task #328) — no static AWS keys live
# in GitHub. Builds each worker image, pushes to ECR (SHA-tagged), and
# rolls the corresponding Lambda function (or SQS event-source mapping
# attached to it) to the new image.

name: aws-deploy-workers

on:
  push:
    branches: [master]
    paths:
      - "services/workers/**"
      - "infra/aws/**"
      - ".github/workflows/aws-deploy-workers.yml"
  pull_request:
    paths:
      - "services/workers/**"
      - "infra/aws/**"
      - ".github/workflows/aws-deploy-workers.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: non-prod
        type: choice
        options: [non-prod, prod]

concurrency:
  group: aws-workers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ap-south-1
  ECR_NAMESPACE: syrabit

jobs:
  build-and-deploy:
    name: Build & deploy workers (${{ github.event.inputs.environment || 'non-prod' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'non-prod' }}
    strategy:
      fail-fast: false
      matrix:
        worker:
          - email-worker
          - bedrock-proxy
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag (commit SHA)
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push worker image
        uses: docker/build-push-action@v5
        with:
          context: services/workers/${{ matrix.worker }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.worker }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.worker }}:latest
          cache-from: type=gha,scope=${{ matrix.worker }}
          cache-to: type=gha,mode=max,scope=${{ matrix.worker }}

      - name: Update Lambda image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          image="${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.worker }}:${{ steps.meta.outputs.tag }}"
          fn="syrabit-${{ matrix.worker }}"
          aws lambda update-function-code \
            --function-name "$fn" \
            --image-uri "$image" \
            --publish \
            --no-cli-pager > /tmp/update.json
          new_version="$(jq -r .Version /tmp/update.json)"
          echo "Published $fn version $new_version"
          aws lambda update-alias \
            --function-name "$fn" \
            --name live \
            --function-version "$new_version" \
            --no-cli-pager

      - name: Wait for Lambda to settle
        if: github.event_name != 'pull_request'
        run: |
          fn="syrabit-${{ matrix.worker }}"
          aws lambda wait function-updated-v2 --function-name "$fn"
          aws lambda get-function --function-name "$fn" \
            --query 'Configuration.[State,LastUpdateStatus]' --output text
