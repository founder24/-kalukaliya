# .github/workflows/pr-build-required.yml
#
# Phase 1d (Task #330) — branch-protection helper.
#
# Aggregates the four deploy workflows into a single status check name
# (`build-required`) so GitHub branch protection can require one rule
# rather than four. Each per-surface workflow runs independently on
# pull_request and reports its own status; this job simply waits for
# them and surfaces a unified PASS/FAIL on the PR.
#
# Configure branch protection on `master`:
#   • Require status check: build-required
#   • Require linear history
#   • Require code review before merge

name: pr-build-required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  build-required:
    name: build-required
    runs-on: ubuntu-latest
    steps:
      - name: Wait for surface workflows
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: build-required
          allowed-conclusions: success
          wait-interval: 20
          check-regexp: "^(do-deploy-backend|do-deploy-rust-core|aws-deploy-workers|azure-deploy-jobs)$"
