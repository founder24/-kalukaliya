# .github/workflows/do-deploy-backend.yml
#
# Phase 1d (Task #330) — DO App Platform deploy for the Python backend.
#
# Builds the FastAPI image, pushes it to DOCR (SHA-tagged), and updates
# the `syrabit-backend` App Platform app with the new spec. The DO API
# token is stored as a GitHub environment secret so that the `prod`
# environment requires reviewer approval before the token is exposed.
#
# OIDC note: DigitalOcean does not yet support GitHub OIDC for the API,
# so the DO_API_TOKEN secret is the only long-lived credential in this
# workflow. AWS and Azure workflows use OIDC and have no static keys.

name: do-deploy-backend

on:
  push:
    branches: [master]
    paths:
      - "services/backend/**"
      - "infra/do/app-syrabit-backend.yaml"
      - ".github/workflows/do-deploy-backend.yml"
  pull_request:
    paths:
      - "services/backend/**"
      - "infra/do/app-syrabit-backend.yaml"
      - ".github/workflows/do-deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: non-prod
        type: choice
        options: [non-prod, prod]

concurrency:
  group: do-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag (commit SHA)
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1800

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: services/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            registry.digitalocean.com/${{ vars.DO_REGISTRY_NAME || 'syrabit' }}/syrabit-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to App Platform (${{ github.event.inputs.environment || 'non-prod' }})
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'non-prod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Pin image tag in app spec
        run: |
          set -euo pipefail
          tag="${{ needs.build.outputs.image_tag }}"
          # Rewrite the placeholder tag with the commit-pinned one.
          sed -i "s/tag: bootstrap/tag: ${tag}/g" infra/do/app-syrabit-backend.yaml
          grep -n "tag: ${tag}" infra/do/app-syrabit-backend.yaml

      - name: doctl apps update --wait
        run: |
          set -euo pipefail
          app_id="${{ vars.DO_APP_ID_SYRABIT_BACKEND }}"
          if [ -z "$app_id" ]; then
            echo "::error::DO_APP_ID_SYRABIT_BACKEND repo variable is not set."
            exit 1
          fi
          doctl apps update "$app_id" \
            --spec infra/do/app-syrabit-backend.yaml \
            --wait

      - name: Verify health
        run: |
          url="$(doctl apps get ${{ vars.DO_APP_ID_SYRABIT_BACKEND }} --format LiveURL --no-header)"
          echo "Live URL: $url"
          for i in 1 2 3 4 5; do
            if curl -fsSL "${url}/healthz"; then
              echo "ok"
              exit 0
            fi
            sleep 5
          done
          echo "::error::healthz did not respond" && exit 1
