[package]
name    = "rust-core"
version = "0.1.0"
edition = "2021"

# Phase 5 — Observability rewire (Task #333).
#
# Minimal manifest pinning the OTel + tonic-health deps the binary
# needs to fan traces out to Application Insights + Axiom in parallel
# and serve both an HTTP `/health` (port 3000) and a gRPC
# `grpc.health.v1.Health/Check` (port 50051) endpoint. The full
# service implementation lives in `backend/rust-core/`; this scaffold
# is what the Azure Container Apps container image actually builds.

[[bin]]
name = "rust-core"
path = "src/main.rs"

[dependencies]
anyhow                 = "1"
axum                   = "0.7"
tokio                  = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic                  = "0.12"
tonic-health           = "0.12"
tower                  = "0.5"
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
once_cell              = "1"

# OTel SDK + OTLP/HTTP exporter. Application Insights does not ship
# a native Rust exporter — we POST OTLP/HTTP to App Insights' OTLP
# ingest endpoint, parsed out of the connection string at boot.
opentelemetry          = { version = "0.24", features = ["trace"] }
opentelemetry_sdk      = { version = "0.24", features = ["rt-tokio", "trace"] }
opentelemetry-otlp     = { version = "0.17", features = ["http-proto", "reqwest-client", "trace"] }
opentelemetry-stdout   = "0.5"
tracing                = "0.1"
tracing-opentelemetry  = "0.25"
tracing-subscriber     = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
