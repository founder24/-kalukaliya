kind = "web"
  previewPath = "/"
  title = "Syrabit.ai"
  version = "1.0.0"
  id = "artifacts/syrabit"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 25144

  [services.development]
  run = "pnpm --filter @workspace/syrabit run dev"

  [services.production]
  build = [ "sh", "-c", "npm i -g pnpm@10.26.1 && pnpm --filter @workspace/syrabit run build" ]
  publicDir = "artifacts/syrabit/dist"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "25144"
  BASE_PATH = "/"
