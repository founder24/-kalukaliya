[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syrabit-backend"
version = "1.0.0"
description = "Syrabit FastAPI backend service"
requires-python = ">=3.11"
# Note: runtime dependencies are specified in requirements.txt
# This follows the common pattern of separate dependency management
dependencies = []  # See requirements.txt for actual dependencies

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
# Task #284 — `pytest-asyncio` is now a hard test dep (see
# requirements-test.txt). `auto` mode means `async def test_*` functions
# are collected automatically without per-function `@pytest.mark.asyncio`,
# which both unblocks tests that the original authors forgot to mark and
# keeps the existing sync-wrapper-around-`_run(coro)` pattern working.
asyncio_mode = "auto"
markers = [
    "live: marks tests that make real HTTP calls to external services (skip when credentials absent)",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
