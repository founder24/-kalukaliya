name = "syrabitworker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Build configuration for Cloudflare Git integration (Workers Builds)
# Dashboard deploy command should be: wrangler deploy --env production
[build]
command = "npx tsc --noEmit"

[vars]
# Local dev only. In production, set as a Wrangler secret:
#   npx wrangler secret put BACKEND_URL --env production
BACKEND_URL = "http://localhost:8000"
ALLOWED_ORIGIN = "https://syrabit.ai"

# Top-level bindings (used by default env / Cloudflare Git integration)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2983094e249d4094b66e4b9dacc38719"
preview_id = "fd70db2acf7045d6a8d6ba4334316297"

[[kv_namespaces]]
binding = "ISR_CACHE_KV"
id = "093eae4cf7e949ddb9f856cf1ef79a29"
preview_id = "26b91993d09b4ceeafb06bd9ad6e594c"

# Content HTML store — pre-seeded by the backend content pipeline.
# Keys: {board}/{class_level}/{subject}/{chapter}/{page_type}
# e.g. ahsec/hs-1st-year/physics/units-and-measurements/notes
[[kv_namespaces]]
binding = "CONTENT_KV"
id = "981e939bcca445c481d4be818ebefee7"
preview_id = "981e939bcca445c481d4be818ebefee7"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

[triggers]
crons = []

# Production environment (used with: wrangler deploy --env production)
[env.production]
name = "syrabitworker-prod"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2983094e249d4094b66e4b9dacc38719"
preview_id = "fd70db2acf7045d6a8d6ba4334316297"

[[env.production.kv_namespaces]]
binding = "ISR_CACHE_KV"
id = "093eae4cf7e949ddb9f856cf1ef79a29"
preview_id = "26b91993d09b4ceeafb06bd9ad6e594c"

[[env.production.kv_namespaces]]
binding = "CONTENT_KV"
id = "981e939bcca445c481d4be818ebefee7"
preview_id = "981e939bcca445c481d4be818ebefee7"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

# ── Required Secrets (set via Wrangler CLI or CF Dashboard) ──────────────────
# npx wrangler secret put <NAME> --env production
#
# REQUIRED:
#   BACKEND_URL         — Cloud Run service URL (never a [vars] binding!)
#                         Set: npx wrangler secret put BACKEND_URL --env production
#   JWT_SECRET          — must exactly match backend JWT_SECRET (>=32 chars)
#   EDGE_SHARED_SECRET  — HMAC signing key; must match backend EDGE_SHARED_SECRET
#
# OPTIONAL:
#   GOOGLE_SA_KEY       — SA JSON for Cloud Run OIDC auth (private Cloud Run only)
#   JWT_PUBLIC_KEY      — RSA public key (PEM) for RS256 (not needed for HS256)
# ──────────────────────────────────────────────────────────────────────────────

[env.production.vars]
ALLOWED_ORIGIN = "https://syrabit.ai"
# NOTE: BACKEND_URL is intentionally absent here.
# It must be set as a Wrangler secret to avoid CF API error 10053
# (binding name already in use when trying to set it as a secret).