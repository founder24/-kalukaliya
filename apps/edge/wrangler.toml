name = "syrabitworker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Build configuration for Cloudflare Git integration (Workers Builds)
# Dashboard deploy command should be: wrangler deploy --env production
[build]
command = "npx tsc --noEmit"

[vars]
ALLOWED_ORIGIN = "https://syrabit.ai"

# Top-level bindings (used by default env / Cloudflare Git integration)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2983094e249d4094b66e4b9dacc38719"
preview_id = "fd70db2acf7045d6a8d6ba4334316297"

[[kv_namespaces]]
binding = "ISR_CACHE_KV"
id = "093eae4cf7e949ddb9f856cf1ef79a29"
preview_id = "26b91993d09b4ceeafb06bd9ad6e594c"

# Content HTML store — pre-seeded by the backend content pipeline.
# Keys: {board}/{class_level}/{subject}/{chapter}/{page_type}
# e.g. ahsec/hs-1st-year/physics/units-and-measurements/notes
[[kv_namespaces]]
binding = "CONTENT_KV"
id = "981e939bcca445c481d4be818ebefee7"
preview_id = "981e939bcca445c481d4be818ebefee7"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RateLimitDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDurableObject"]

[triggers]
crons = []

# Production environment (used with: wrangler deploy --env production)
[env.production]
name = "syrabitworker-prod"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2983094e249d4094b66e4b9dacc38719"
preview_id = "fd70db2acf7045d6a8d6ba4334316297"

[[env.production.kv_namespaces]]
binding = "ISR_CACHE_KV"
id = "093eae4cf7e949ddb9f856cf1ef79a29"
preview_id = "26b91993d09b4ceeafb06bd9ad6e594c"

[[env.production.kv_namespaces]]
binding = "CONTENT_KV"
id = "981e939bcca445c481d4be818ebefee7"
preview_id = "981e939bcca445c481d4be818ebefee7"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

[env.production.ai]
binding = "AI"

[[env.production.durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RateLimitDurableObject"

# ── Service Binding: syrabit-api-prod (D1-backed API Worker) ─────────────────
# Requests to /api/ and /health/ are forwarded to the API Worker through a
# direct Cloudflare-internal connection.
[[env.production.services]]
binding = "API_WORKER"
service = "syrabit-api-prod"

# ── Required Secrets (set via Wrangler CLI or CF Dashboard) ──────────────────
# npx wrangler secret put <NAME> --env production
#
# REQUIRED:
#   JWT_SECRET          — must exactly match the API Worker JWT_SECRET (>=32 chars)
#   EDGE_SHARED_SECRET  — HMAC signing key; must match the API Worker secret
#
# OPTIONAL:
#   JWT_PUBLIC_KEY      — RSA public key (PEM) for RS256 (not needed for HS256)
# ──────────────────────────────────────────────────────────────────────────────

[env.production.vars]
ALLOWED_ORIGIN = "https://syrabit.ai"