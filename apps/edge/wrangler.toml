name = "syrabitworker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AZURE_BACKEND_URL = "http://localhost:8000"
ALLOWED_ORIGIN = "https://syrabit.ai"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

# KV bindings are scoped to the production env so that local builds and
# `wrangler deploy --dry-run` don't require a real namespace ID. Before the
# first real production deploy you MUST:
#   1. npx wrangler kv:namespace create RATE_LIMIT_KV
#   2. npx wrangler kv:namespace create RATE_LIMIT_KV --preview
#   3. Replace the placeholder ids in [env.production] below with the values
#      that the two commands above print.

[triggers]
crons = []

[env.production]
name = "syrabitworker-prod"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2983094e249d4094b66e4b9dacc38719"
preview_id = "fd70db2acf7045d6a8d6ba4334316297"

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ WARNING: ISR_CACHE_KV uses PLACEHOLDER IDs that WILL FAIL in production.   │
# │ Before deploying to production, you MUST:                                  │
# │   1. Run: npx wrangler kv:namespace create ISR_CACHE_KV                    │
# │   2. Run: npx wrangler kv:namespace create ISR_CACHE_KV --preview          │
# │   3. Replace the placeholder values below with the real IDs from step 1-2  │
# │ Failure to do so will cause deploy failures or runtime errors.             │
# └─────────────────────────────────────────────────────────────────────────────┘
[[env.production.kv_namespaces]]
binding = "ISR_CACHE_KV"
id = "placeholder-isr-cache-kv-id"
preview_id = "placeholder-isr-cache-kv-preview-id"

# Secrets (set via: npx wrangler secret put <NAME>):
# - JWT_SECRET
# - CF_TURNSTILE_SECRET

[env.production.vars]
# AZURE_BACKEND_URL set as Wrangler secret: npx wrangler secret put AZURE_BACKEND_URL --env production
ALLOWED_ORIGIN = "https://syrabit.ai"
