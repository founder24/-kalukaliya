name = "syrabitworker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Build configuration for Cloudflare Git integration (Workers Builds)
# Dashboard deploy command should be: wrangler deploy --env production
[build]
command = "npx tsc --noEmit"

[vars]
# Local dev only. In production, set as a Wrangler secret:
#   npx wrangler secret put BACKEND_URL --env production
BACKEND_URL = "http://localhost:8000"
ALLOWED_ORIGIN = "https://syrabit.ai"

# Top-level bindings (used by default env / Cloudflare Git integration)
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2983094e249d4094b66e4b9dacc38719"
preview_id = "fd70db2acf7045d6a8d6ba4334316297"

[[kv_namespaces]]
binding = "ISR_CACHE_KV"
id = "093eae4cf7e949ddb9f856cf1ef79a29"
preview_id = "26b91993d09b4ceeafb06bd9ad6e594c"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

[triggers]
crons = []

# Production environment (used with: wrangler deploy --env production)
[env.production]
name = "syrabitworker-prod"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2983094e249d4094b66e4b9dacc38719"
preview_id = "fd70db2acf7045d6a8d6ba4334316297"

[[env.production.kv_namespaces]]
binding = "ISR_CACHE_KV"
id = "093eae4cf7e949ddb9f856cf1ef79a29"
preview_id = "26b91993d09b4ceeafb06bd9ad6e594c"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

# ── Required Secrets ──────────────────────────────────────────────────────────
# Set ALL of the following via Cloudflare Dashboard or Wrangler CLI:
#   npx wrangler secret put <NAME> --env production
#
# REQUIRED:
#   JWT_SECRET          — must exactly match backend JWT_SECRET (≥32 chars)
#   EDGE_SHARED_SECRET  — must exactly match backend EDGE_SHARED_SECRET
#                         Used for HMAC signing of X-Edge-Signature.
#                         Backend TRUST_EDGE_AUTH=True requires this to be set.
#                         Without it, per-user auth for chat/conversations fails.
#
# OPTIONAL:
#   GOOGLE_SA_KEY       — Service account JSON for Cloud Run OIDC auth.
#                         Only needed when the Cloud Run service is private
#                         (requires IAM auth). If unset, Cloud Run must allow
#                         unauthenticated invocations.
#   JWT_PUBLIC_KEY      — RSA public key (PEM) if using RS256 algorithm.
#                         Not needed for the default HS256 setup.
# ──────────────────────────────────────────────────────────────────────────────

[env.production.vars]
ALLOWED_ORIGIN = "https://syrabit.ai"
# REQUIRED: Set this to your Cloud Run service URL.
# This MUST be overridden by a Wrangler secret in production.
# If not set, the worker will reject all API requests with 503.
BACKEND_URL = "https://syrabit-backend-851687450401.asia-south1.run.app"
