name = "syrabitworker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Build configuration for Cloudflare Git integration (Workers Builds)
# Dashboard should be configured with:
#   Deploy command: wrangler deploy --env production
#   Build directory: apps/edge
[build]
command = "npx tsc --noEmit"

[vars]
# Local dev only. In production, set as a Wrangler secret:
#   npx wrangler secret put AZURE_BACKEND_URL --env production
AZURE_BACKEND_URL = "http://localhost:8000"
ALLOWED_ORIGIN = "https://syrabit.ai"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2983094e249d4094b66e4b9dacc38719"
preview_id = "fd70db2acf7045d6a8d6ba4334316297"

[[kv_namespaces]]
binding = "ISR_CACHE_KV"
id = "093eae4cf7e949ddb9f856cf1ef79a29"
preview_id = "26b91993d09b4ceeafb06bd9ad6e594c"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

# Production environment (used with: wrangler deploy --env production)
# Secrets (set via: npx wrangler secret put <NAME> --env production):
# - JWT_SECRET
# - CF_TURNSTILE_SECRET
# - AZURE_BACKEND_URL

[triggers]
crons = []

[env.production]
name = "syrabitworker-prod"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "2983094e249d4094b66e4b9dacc38719"
preview_id = "fd70db2acf7045d6a8d6ba4334316297"

[[env.production.kv_namespaces]]
binding = "ISR_CACHE_KV"
id = "093eae4cf7e949ddb9f856cf1ef79a29"
preview_id = "26b91993d09b4ceeafb06bd9ad6e594c"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

[env.production.vars]
# AZURE_BACKEND_URL set as Wrangler secret: npx wrangler secret put AZURE_BACKEND_URL --env production
ALLOWED_ORIGIN = "https://syrabit.ai"
