name = "syrabitworker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AZURE_BACKEND_URL = "https://ca-syrabit-api.azurecontainerapps.io"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "syrabit-assets"

[triggers]
crons = []

[env.production]
name = "syrabitworker-prod"
